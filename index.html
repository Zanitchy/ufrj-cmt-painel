<div class="lsec">
  <h3><span class="lnum">1</span>O que é astronomia</h3>
  <p>Astronomia é <b>ciência básica</b> — busca entender os corpos celestes e o Universo como um todo, sem alvo prático imediato — e é <b>milenar</b>: nasceu antes da escrita, da observação sistemática do céu por povos que precisavam marcar estações e ciclos.</p>
  <p>O professor abre com Platão: <i>"A Astronomia compele a alma a olhar para o alto e leva-nos deste mundo para outro."</i> E lembra que ela era personificada por <b>Urânia</b>, uma das nove musas gregas. Não é ornamento: mostra que, desde a Antiguidade, olhar o céu foi tratado como forma de conhecimento no mesmo patamar da literatura e das artes.</p>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Ciência básica e milenar.</li>
    <li>Estuda os corpos celestes e o Universo como um todo.</li>
    <li>Personificada por uma das nove musas: Urânia.</li>
    <li>Dividida em várias áreas de estudo.</li>
  </ul></div>
  <div class="why"><span class="t">Por que isso importa</span>"Ciência básica" é a chave para entender o resto do curso. Ela justifica por que um astrônomo passa anos medindo o brilho de uma estrela sem que ninguém pergunte "para que serve" — e por que essa liberdade acaba produzindo tecnologia que ninguém encomendou.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir <b>ciência básica</b> com <b>ciência sem aplicação</b>. Básica significa que a pergunta não nasce de um problema prático; não significa que dela não saia nada útil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">H</span>Da Babilônia a Newton: como a astronomia virou ciência</h3>
  <p><b>Milenar não é força de expressão.</b> A astronomia é candidata a ciência mais antiga, e por um motivo prático: o céu era o único relógio e o único calendário disponíveis. Os <b>babilônios</b>, por volta de 1000 a.C., já mantinham registros sistemáticos de posições planetárias em tábuas de argila e sabiam prever eclipses por repetição de ciclos, sem qualquer modelo físico. Os <b>egípcios</b> associavam a cheia do Nilo ao nascer helíaco de Sirius. Os <b>gregos</b> deram o passo decisivo ao tentar explicar, e não só prever: Eratóstenes mediu o raio da Terra com sombras e geometria no século III a.C., errando por poucos por cento; Hiparco catalogou estrelas e criou a escala de magnitudes que, adaptada, ainda se usa; Ptolomeu consolidou o modelo geocêntrico que atravessou catorze séculos.</p>
  <p>A virada moderna tem quatro nomes que valem guardar em sequência. <b>Copérnico</b> (1543) tira a Terra do centro. <b>Kepler</b> (1609–1619), usando as observações de precisão de Tycho Brahe, descobre que as órbitas são elipses e formula as três leis do movimento planetário. <b>Galileu</b> (1610) aponta a luneta para o céu e encontra as luas de Júpiter, as fases de Vênus e as crateras da Lua — evidência observacional contra o geocentrismo. <b>Newton</b> (1687) unifica tudo: a mesma gravidade que faz a maçã cair mantém a Lua em órbita. A partir daí a astronomia deixa de ser catálogo de posições e vira física aplicada ao céu.</p>

  <p><b>O segundo salto foi a espectroscopia</b>, no século XIX. Ao decompor a luz de uma estrela e ler suas linhas escuras, descobriu-se que dá para saber de que ela é feita, a que temperatura está e a que velocidade se move — tudo sem sair daqui. Foi o nascimento da <b>astrofísica</b> propriamente dita. Antes disso, o filósofo Auguste Comte havia declarado, em 1835, que a composição química das estrelas seria para sempre inacessível ao conhecimento humano. Poucas décadas depois já se lia hélio no espectro do Sol — inclusive antes de o elemento ser encontrado na Terra.</p>

      <tr><td>Astronomia</td><td>Termo guarda-chuva: estudo dos corpos celestes e do Universo, incluindo posições, movimentos e catalogação</td><td>Onde este objeto está e como ele se move?</td></tr>
      <tr><td>Astrofísica</td><td>A física aplicada aos corpos celestes: composição, energia, estrutura interna, evolução</td><td>Como esta estrela produz energia e como ela vai morrer?</td></tr>
      <tr><td>Cosmologia</td><td>O Universo como um todo: origem, geometria, expansão e destino</td><td>Como o Universo começou e para onde ele vai?</td></tr>
      <tr><td>Astronáutica</td><td>Engenharia de voo espacial — área vizinha, não é astronomia</td><td>Como colocar esta sonda naquela órbita?</td></tr>
    </tbody></table></div>
  <p>Na prática o uso é fluido, e boa parte dos profissionais se apresenta simplesmente como astrônomo. Mas em prova a distinção pode ser cobrada, e a lógica é simples: astronomia descreve, astrofísica explica com física, cosmologia trata do conjunto.</p>
  <div class="callout plus"><b>Astronomia não é astrologia.</b> Vale fixar porque a confusão é comum e o professor de CMT111 provavelmente vai voltar ao tema. A astronomia é ciência: faz previsões testáveis, publica método, aceita refutação e revisa suas conclusões quando os dados mudam. A astrologia é um sistema de crenças que atribui influência causal dos astros sobre a personalidade e o destino, sem mecanismo físico plausível e sem sobreviver a testes controlados — quando testada em condições cegas, não supera o acaso. As duas compartilham uma origem histórica comum, na Babilônia, onde observar o céu e interpretar presságios eram a mesma atividade. A separação se consolidou justamente quando a astronomia adotou o método científico. Um detalhe que costuma render discussão: por causa da <b>precessão dos equinócios</b>, o Sol hoje não está mais na constelação que o signo tradicional indica — há cerca de um mês de defasagem acumulada em dois mil anos.</div>
  <div class="why"><span class="t">Por que isso importa</span>"Ciência básica" é a chave para entender o resto do curso. Ela justifica por que um astrônomo passa anos medindo o brilho de uma estrela sem que ninguém pergunte "para que serve" — e por que essa liberdade acaba produzindo tecnologia que ninguém encomendou.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir <b>ciência básica</b> com <b>ciência sem aplicação</b>. Básica significa que a pergunta não nasce de um problema prático; não significa que dela não saia nada útil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">2</span>Para que serve a astronomia</h3>
  <p>Os usos práticos clássicos que apareceram no slide:</p>
  <ul>
    <li><b>Medição do tempo</b> — dia, mês, ano e os calendários vêm todos de ciclos astronômicos.</li>
    <li><b>Orientação e navegação</b> — do astrolábio às Grandes Navegações; posição obtida a partir de estrelas de referência.</li>
    <li><b>Cálculo de órbitas</b> de satélites e naves espaciais.</li>
  </ul>
  <p>E o slide deixa um <b>"e... ?"</b> em aberto, respondido logo em seguida: a astronomia cumpre um <b>papel civilizatório</b>. Ela alimenta a curiosidade sobre nossa origem e nosso destino, e é a ciência que leva o ser humano a se ver perante o resto do Cosmo.</p>
  <div class="why"><span class="t">Por que isso importa</span>A resposta ao "e... ?" do slide é o que sustenta o financiamento da área. Astronomia não se justifica só por utilidade — mas, historicamente, ela entregou utilidade demais para ser tratada como luxo.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">T</span>Calendários, longitude e órbitas: a astronomia aplicada</h3>
  <p class="lead">Os três usos práticos que o slide lista em uma linha cada carregam, cada um, séculos de história e problemas matemáticos difíceis. Vale abrir os três.</p>
  <p><b>Medir o tempo.</b> As três unidades naturais de tempo são todas astronômicas: o <b>dia</b> é a rotação da Terra, o <b>mês</b> vem do ciclo de fases da Lua, e o <b>ano</b> é a translação em torno do Sol. O problema é que elas não são múltiplas umas das outras — o ano tem 365,2422 dias, e é essa fração teimosa que gera todo o trabalho dos calendários. O calendário <b>juliano</b> resolveu com um ano bissexto a cada quatro anos, o que sobrestima o ano em 11 minutos; ao longo de séculos o erro acumulou dez dias. A reforma <b>gregoriana</b>, de 1582, corrigiu suprimindo esses dias e refinando a regra: é bissexto o ano divisível por 4, exceto os divisíveis por 100, salvo os divisíveis por 400. Por isso 1900 não foi bissexto e 2000 foi. Calendários <b>lunares</b>, como o islâmico, seguem só as fases e por isso deslizam ao longo das estações; os <b>luni-solares</b>, como o hebraico e o chinês, inserem meses extras para reconciliar os dois ciclos.</p>

    <div class="figcap">O calendário lunar puro desliza onze dias por ano e por isso atravessa as estações — é o caso do islâmico. O juliano errava onze minutos, que viraram dez dias em catorze séculos e forçaram a reforma de 1582. O gregoriano erra 26 segundos por ano: leva mais de três mil anos para acumular um dia.</div>
  </div>
  <p><b>Orientar-se e navegar.</b> Determinar a <b>latitude</b> em alto-mar sempre foi relativamente simples: no hemisfério norte, basta medir a altura da Polar acima do horizonte — o ângulo é a sua latitude. No sul, usa-se o Cruzeiro do Sul para achar o polo celeste. A <b>longitude</b>, essa foi o pesadelo de três séculos de navegação, porque exige comparar a hora local (obtida do Sol) com a hora de um meridiano de referência no mesmo instante. Sem relógio confiável a bordo, não havia como. O problema só foi resolvido no século XVIII, com os cronômetros marítimos de John Harrison — e, enquanto isso, uma das alternativas propostas era usar as luas de Júpiter como relógio celeste, ideia do próprio Galileu. O GPS de hoje é o mesmo problema resolvido por outro caminho: comparar tempos de chegada de sinais, com relógios atômicos e correções relativísticas.</p>
  <p><b>Calcular órbitas.</b> Toda missão espacial é mecânica celeste aplicada. Lançar um satélite exige saber a <b>velocidade orbital</b> na altitude desejada; escapar da Terra exige atingir a velocidade de escape, cerca de 11,2 km/s. Sondas que vão longe usam <b>assistência gravitacional</b>, roubando um pouco da energia orbital de um planeta para ganhar velocidade sem gastar combustível — foi assim que as Voyager percorreram o Sistema Solar externo. E há a questão prática do <b>lixo espacial</b> e do rastreio de asteroides próximos, que depende exatamente da mesma matemática.</p>
  <div class="callout plus"><b>Complemento — o que costuma entrar nessa lacuna.</b> GPS (que depende de referenciais celestes e de correções relativísticas), defesa planetária (rastreio de asteroides), clima espacial (tempestades solares afetando satélites e redes elétricas) e as tecnologias derivadas: detectores CCD, óptica adaptativa e algoritmos de tratamento de imagem que hoje estão em câmeras e em equipamentos médicos.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">3</span>O que se estuda: uma escada de escalas</h3>
  <p>A lista do slide não é aleatória — é uma escada, do menor e mais próximo ao maior e mais distante. Vale memorizá-la nessa ordem, porque cada degrau é uma subárea com seus métodos e sua comunidade.</p>

    <div class="figcap">A escada organiza a astronomia inteira. Quando alguém se apresenta como "trabalho com meio interestelar" ou "trabalho com aglomerados", está dizendo em que degrau atua.</div>
  </div>
  <p>Vale destrinchar cada degrau, porque a lista do slide é enxuta e cada item esconde uma área inteira:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Degrau</th><th>O que se estuda ali</th><th>Escala típica</th></tr></thead>
    <tbody>
      <tr><td>Planetas</td><td>Superfícies, atmosferas, interiores, luas e anéis. Inclui os exoplanetas — mais de 5 mil já confirmados — e a busca por condições de habitabilidade</td><td>Milhares a dezenas de milhares de km</td></tr>
      <tr><td>Sistema Solar</td><td>O conjunto e sua história: como Sol, planetas, asteroides e cometas se formaram juntos há 4,6 bilhões de anos a partir da mesma nuvem</td><td>Dezenas a milhares de UA</td></tr>
      <tr><td>Estrelas</td><td>Estrutura interna, produção de energia, classificação espectral, nascimento em nuvens moleculares, evolução e morte — anã branca, estrela de nêutrons ou buraco negro</td><td>10⁵ a 10⁹ km de raio</td></tr>
      <tr><td>Meio interestelar</td><td>Gás e poeira entre as estrelas: nuvens moleculares frias, regiões HII brilhantes, remanescentes de supernova. É berço e cemitério estelar ao mesmo tempo</td><td>Anos-luz a centenas de anos-luz</td></tr>
      <tr><td>Galáxias</td><td>Estrutura, dinâmica, conteúdo estelar e evolução: como se formaram, como colidem e se fundem, quanta matéria escura contêm</td><td>Dezenas de milhares de anos-luz</td></tr>
      <tr><td>AGNs e quasares</td><td>Núcleos onde um buraco negro supermassivo devora matéria e libera mais energia que todas as estrelas da galáxia somadas. Os quasares são os mais luminosos e distantes</td><td>Região central do tamanho do Sistema Solar, visível a bilhões de anos-luz</td></tr>
      <tr><td>Aglomerados e estrutura em grande escala</td><td>Como as galáxias se agrupam em grupos, aglomerados e superaglomerados, formando filamentos e vazios — a teia cósmica</td><td>Milhões a centenas de milhões de anos-luz</td></tr>
    </tbody></table></div>
  <p><b>A astronomia entre as ciências.</b> O slide traz um diagrama posicionando a astronomia no meio das demais, e a razão é concreta. Ela usa <b>matemática</b> como linguagem e <b>física</b> como motor explicativo — mecânica, termodinâmica, eletromagnetismo, física nuclear, relatividade e mecânica quântica, todas aparecem em algum momento. Recorre à <b>química</b> para interpretar espectros e entender a química do meio interestelar, onde já se detectaram moléculas orgânicas complexas. Conversa com a <b>geologia</b> ao tratar de superfícies planetárias, meteoritos e datação radiométrica — é literalmente o mesmo ferramental das Ciências da Terra. E hoje depende de forma crítica da <b>computação</b>: levantamentos modernos produzem petabytes, e boa parte da descoberta acontece no processamento dos dados, não no olho na ocular.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este mapa é o mapa do seu curso. O BCMT existe justamente na interseção que a astronomia ocupa, e é por isso que a mesma disciplina apresenta Valongo, Física, Matemática e Geociências. Quando chegar a hora de escolher ênfase, você estará escolhendo um degrau desta escada.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que os degraus são independentes. Eles se encadeiam: o meio interestelar forma estrelas, as estrelas fabricam elementos pesados e os devolvem ao meio ao morrer, e é desse material enriquecido que se formam planetas — e você. A escada é também uma cadeia causal.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">C</span>A esfera celeste: o céu que se vê da Terra</h3>
  <p class="lead">Antes de falar de distâncias e de física, é preciso saber descrever o que se vê. Este módulo não estava nos slides, mas é o vocabulário mínimo para acompanhar qualquer aula prática — e o Valongo é, desde 1881, uma instituição de aulas práticas de astronomia.</p>
  <p>A olho nu não temos noção de profundidade no céu: tudo parece grudado numa cúpula. A astronomia aproveitou essa ilusão e transformou-a em ferramenta. A <b>esfera celeste</b> é uma esfera imaginária de raio arbitrário, centrada no observador, onde se projetam todos os astros. Não é real, mas resolve o problema prático de indicar posições sem precisar saber distâncias.</p>
  <p>Nessa esfera, alguns pontos e círculos são referências fixas. O <b>zênite</b> é o ponto diretamente acima da sua cabeça; o <b>nadir</b>, o oposto. O <b>horizonte</b> separa o que está visível do que não está. Os <b>polos celestes</b> são o prolongamento do eixo de rotação da Terra, e o <b>equador celeste</b> é o prolongamento do equador terrestre. Por fim, a <b>eclíptica</b> é o caminho aparente do Sol ao longo do ano, inclinado 23,4° em relação ao equador celeste — a mesma inclinação do eixo, vista de outro jeito.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Sistema de coordenadas</th><th>Como funciona</th><th>Vantagem e limitação</th></tr></thead>
    <tbody>
      <tr><td>Horizontais<br><span style="font-weight:400;color:var(--muted)">azimute e altura</span></td><td>Azimute é o ângulo medido ao longo do horizonte a partir do norte; altura é o ângulo acima do horizonte</td><td>Intuitivo e imediato para apontar um instrumento — mas muda a cada instante e depende do lugar onde você está</td></tr>
      <tr><td>Equatoriais<br><span style="font-weight:400;color:var(--muted)">ascensão reta e declinação</span></td><td>Análogos celestes da longitude e da latitude, ancorados no equador celeste e no ponto vernal</td><td>Fixas para cada estrela, independentes de hora e lugar — por isso são as usadas em catálogos</td></tr>
      <tr><td>Eclípticas</td><td>Referenciadas ao plano da órbita da Terra</td><td>Convenientes para objetos do Sistema Solar, que se movem perto da eclíptica</td></tr>
      <tr><td>Galácticas</td><td>Referenciadas ao plano da Via Láctea</td><td>Usadas em estudos da estrutura da Galáxia</td></tr>
    </tbody></table></div>

  </div>
  <p><b>O movimento aparente.</b> A rotação da Terra faz todo o céu girar em torno dos polos celestes uma vez por dia — é o <b>movimento diurno</b>, que nasce a leste e se põe a oeste. A translação acrescenta um efeito mais lento: as constelações visíveis mudam ao longo do ano, porque de noite olhamos para o lado oposto ao Sol, e esse lado vai mudando. Por isso Órion é uma constelação de verão no hemisfério sul e Escorpião, de inverno. Astros perto do polo celeste nunca se põem, e são chamados <b>circumpolares</b> — no Rio, com latitude de ~23° sul, apenas uma faixa estreita ao redor do polo sul celeste tem essa propriedade.</p>
  <p><b>Constelações não são objetos.</b> São regiões do céu, delimitadas por convenção. A <b>União Astronômica Internacional</b> fixou 88 constelações com fronteiras precisas em 1928 — antes disso, cada cultura e cada atlas desenhava as suas. As estrelas de uma mesma constelação em geral não têm relação física alguma entre si: estão a distâncias completamente diferentes e só aparecem juntas por projeção.</p>
  <p><b>Magnitude: a escala herdada de Hiparco.</b> O brilho aparente das estrelas é medido em magnitudes, e a escala é contraintuitiva por motivo histórico: <b>quanto menor o número, mais brilhante o astro</b>. Hiparco chamou de primeira grandeza as mais brilhantes e de sexta as no limite do olho nu. Quando se mediu com instrumentos, descobriu-se que a escala é logarítmica: uma diferença de 5 magnitudes corresponde a um fator 100 no brilho. Sirius tem magnitude −1,5; a Lua cheia, −12,7; o Sol, −26,7. Em céu urbano mal se enxerga até magnitude 3 ou 4 — daí a importância de sítios escuros.</p>
  <div class="why"><span class="t">Por que isso importa</span>Sem esse vocabulário não dá para ler uma efeméride, planejar uma observação nem entender por que um objeto "não está visível nesta época do ano". É a parte da astronomia que se aprende olhando, e o Observatório do Valongo existe justamente para isso.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que magnitude maior significa estrela mais brilhante — é o contrário. E confundir <b>magnitude aparente</b> (o quanto parece brilhante daqui) com <b>magnitude absoluta</b> (o quanto seria a 10 parsecs de distância), que é a que mede luminosidade real.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">λ</span>A luz como mensageira: espectro e o que ele conta</h3>
  <p class="lead">Quase tudo que se sabe sobre o Universo chegou aqui como luz. Este módulo explica como se extrai informação dela — é o que transforma a astronomia descritiva em astrofísica, e o que dá sentido ao espectrógrafo mencionado nos observatórios.</p>
  <p>A luz visível é uma faixa estreita do <b>espectro eletromagnético</b>. Da onda mais longa para a mais curta: rádio, micro-ondas, infravermelho, visível, ultravioleta, raios X e raios gama. Todas são a mesma coisa física, diferindo só em comprimento de onda e, portanto, em energia. Cada faixa revela fenômenos distintos: o rádio mostra gás frio e jatos de núcleos ativos; o infravermelho atravessa poeira e revela regiões de formação estelar; o ultravioleta e os raios X denunciam gás muito quente e matéria caindo em buracos negros.</p>

    <div class="figttl">Figura · O espectro eletromagnético e o que cada faixa revela</div>

    <div class="figcap">O olho humano enxerga menos de um milésimo do espectro. Cada janela nova aberta na história — rádio nos anos 1930, raios X nos anos 1960 — revelou classes inteiras de objetos que ninguém suspeitava existir.</div>
  </div>
  <p><b>Cor é temperatura.</b> Todo corpo aquecido emite radiação com um perfil característico, o <b>corpo negro</b>. Quanto mais quente, mais a emissão se desloca para comprimentos de onda curtos — a <b>lei de Wien</b>. Na prática: estrelas avermelhadas são frias, com uns 3.000 K; amareladas como o Sol ficam perto de 5.800 K; azuladas passam de 20.000 K. Isso significa que, só de olhar a cor de uma estrela, você já estima a temperatura da superfície dela. E a energia total emitida cresce com a quarta potência da temperatura, pela lei de Stefan-Boltzmann — dobrar a temperatura multiplica a emissão por dezesseis.</p>
  <p><b>As linhas espectrais são digitais.</b> Ao decompor a luz num espectro, aparecem linhas escuras ou brilhantes em posições exatas. Cada elemento químico absorve e emite em comprimentos de onda próprios, como uma impressão digital. As <b>leis de Kirchhoff</b> organizam os três casos: um sólido ou gás denso e quente produz espectro <b>contínuo</b>; um gás rarefeito quente produz linhas de <b>emissão</b>; e um gás mais frio na frente de uma fonte contínua produz linhas de <b>absorção</b> — que é o caso do Sol e das estrelas, cuja atmosfera absorve parte da luz vinda de baixo.</p>
  <p><b>E o movimento também deixa marca.</b> Se a fonte se afasta, as linhas se deslocam para comprimentos de onda maiores — o <b>desvio para o vermelho</b>; se aproxima, para o azul. É o <b>efeito Doppler</b>, o mesmo da sirene de ambulância, aplicado à luz. Com ele se mede velocidade radial de estrelas, se descobrem exoplanetas pelo bamboleio da estrela hospedeira, se mapeia a rotação de galáxias — e foi assim que Hubble percebeu a expansão do Universo.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este é o módulo que responde à pergunta óbvia de quem começa: "como alguém pode saber do que uma estrela é feita, se ninguém foi lá?". A resposta é o espectro. Sem ele, a astronomia teria parado na descrição de posições.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que desvio para o vermelho significa que o objeto é vermelho. Não: significa que as linhas conhecidas aparecem deslocadas para comprimentos de onda maiores. E cuidado com "corpo negro" — não é um corpo preto, é um emissor térmico ideal; o Sol é uma boa aproximação de corpo negro.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">D</span>As réguas: UA, ano-luz e parsec</h3>
  <p class="lead">A escada de escalas só faz sentido se você souber medir cada degrau. A astronomia usa três réguas, cada uma no seu território, e trocar uma pela outra é o erro numérico mais comum de quem está começando.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Régua</th><th>Quanto vale</th><th>Onde se usa</th></tr></thead>
    <tbody>
      <tr><td>Unidade Astronômica (UA)</td><td>149.597.870.700 m exatos — cerca de 150 milhões de km<sup class="ref">7</sup></td><td>Dentro do Sistema Solar. Netuno fica a ~30 UA; o cinturão de Kuiper começa aí</td></tr>
      <tr><td>Ano-luz (al)</td><td>Distância que a luz percorre em um ano: ~9,46 × 10¹² km, ou ~63.240 UA</td><td>Estrelas e galáxias. É a régua da divulgação, porque já vem com a ideia de tempo embutida</td></tr>
      <tr><td>Parsec (pc)</td><td>~3,26 anos-luz, ou ~206.265 UA</td><td>A régua profissional. Vem da paralaxe: é a distância em que 1 UA subtende 1 segundo de arco</td></tr>
    </tbody></table></div>
  <p><b>De onde vem o parsec.</b> Ao longo do ano a Terra muda de posição na órbita, e uma estrela próxima parece se deslocar contra o fundo de estrelas distantes. Metade desse deslocamento aparente é a <b>paralaxe</b>. Se a paralaxe de uma estrela é de 1 segundo de arco, ela está a 1 parsec. A conta é direta: distância em parsecs = 1 dividido pela paralaxe em segundos de arco. Nenhuma estrela tem paralaxe de 1", nem a mais próxima — o que já diz muito sobre o tamanho do vazio entre as estrelas.</p>

  </div>
  <div class="numgrid">
    <div><b>0,00002 al</b><span>da Terra à Lua</span></div>
    <div><b>8 min-luz</b><span>do Sol até nós — 1 UA</span></div>
    <div><b>4,2 al</b><span>até Proxima Centauri, a estrela mais próxima</span></div>
    <div><b>~8 kpc</b><span>do Sol ao centro da Galáxia</span></div>
  </div>
  <div class="why"><span class="t">Por que isso importa</span>Ano-luz e parsec carregam uma ideia poderosa: olhar longe é olhar para o passado. A luz de um objeto a 4,2 anos-luz saiu de lá há 4,2 anos. Quando o curso chegar em galáxias distantes, você estará literalmente estudando o Universo jovem.</div>
  <div class="trap"><span class="t">Erro comum</span>Tratar ano-luz como unidade de tempo. É distância. E não misture réguas na mesma conta sem converter: 1 pc = 3,26 al = 206.265 UA.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">4</span>Terra, Lua e planetas</h3>
  <p>Os números do slide, conferidos nas fichas técnicas da NASA. Repare que quase todos são <b>razões</b> em relação à Terra, o que facilita guardar.</p>
  <div class="numgrid">
    <div><b>6.371 km</b><span>raio médio da Terra<sup class="ref">1</sup></span></div>
    <div><b>5,97 × 10²⁴ kg</b><span>massa da Terra — os 6,0 × 10²⁷ g do slide<sup class="ref">1</sup></span></div>
    <div><b>384.400 km</b><span>distância média até a Lua<sup class="ref">2</sup></span></div>
    <div><b>0,0123</b><span>massa da Lua em massas terrestres (~1/81)<sup class="ref">2</sup></span></div>
    <div><b>109×</b><span>diâmetros terrestres cabem no Sol<sup class="ref">3</sup></span></div>
    <div><b>149.597.870.700 m</b><span>uma UA, valor exato fixado pela UAI em 2012<sup class="ref">7</sup></span></div>
  </div>
  <div class="fig">
    <div class="figttl">Figura 2 · Terra e Lua em escala real, tamanho e distância</div>
    <svg viewBox="0 0 700 110" xmlns="http://www.w3.org/2000/svg">

      <circle cx="655" cy="55" r="2.7" fill="#94a3b8"/>
      <text x="42" y="82" font-size="10" font-weight="700" fill="var(--text)" text-anchor="middle">Terra</text>

      <text x="350" y="42" font-size="10" fill="var(--muted)" text-anchor="middle">384.400 km ≈ 30 diâmetros terrestres</text>
    </svg>
    <div class="figcap">Tamanhos e distância na mesma escala. Quase todo desenho de livro didático encolhe essa distância — o sistema Terra-Lua é muito mais vazio do que parece.</div>
  </div>
  <p><b>A Lua:</b> tem cerca de 1/4 do diâmetro terrestre (0,27, para ser exato) e 1/80 da massa (0,0123 ≈ 1/81)<sup class="ref">2</sup>. Sua atmosfera é desprezível, o que a torna geologicamente estável e preserva as crateras por bilhões de anos. E mostra <b>sempre a mesma face</b> para nós porque gira em torno do próprio eixo no mesmo período em que nos orbita, ~27 dias — a chamada rotação síncrona<sup class="ref">4</sup>.</p>
  <div class="fig">

  </div>
  <p><b>Os oito planetas:</b> Mercúrio, Vênus, Terra, Marte | Júpiter, Saturno, Urano, Netuno. Os quatro primeiros são os <b>internos ou terrestres</b> (rochosos, pequenos, densos); os quatro últimos, os <b>externos ou jovianos</b> (gigantes, gasosos ou de gelo). A olho nu eles aparecem como pontos luminosos que <b>se deslocam</b> entre as estrelas de uma noite para outra — foi exatamente isso que lhes deu o nome: <i>planētēs</i>, "errante".</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Grandeza</th><th>Terra</th><th>Lua</th><th>Comentário</th></tr></thead>

      <tr><td>Massa</td><td>5,97 × 10²⁴ kg</td><td>7,35 × 10²² kg</td><td>Razão 0,0123 ≈ 1/81<sup class="ref">2</sup></td></tr>
      <tr><td>Densidade média</td><td>5,51 g/cm³</td><td>3,34 g/cm³</td><td>A Terra é mais densa porque tem núcleo metálico; a Lua quase não tem</td></tr>
      <tr><td>Gravidade na superfície</td><td>9,8 m/s²</td><td>1,62 m/s²</td><td>Cerca de 1/6 — daí os saltos dos astronautas da Apollo</td></tr>

      <tr><td>Atmosfera</td><td>Densa, N₂ e O₂</td><td>Desprezível</td><td>Sem atmosfera não há erosão eólica nem intemperismo químico: as crateras ficam</td></tr>
    </tbody></table></div>
  <p><b>As fases da Lua</b> não têm nada a ver com a sombra da Terra. Elas resultam da geometria entre Sol, Terra e Lua: vemos sempre metade da Lua iluminada, mas de ângulos diferentes ao longo do mês. O ciclo completo — o <b>mês sinódico</b> — dura 29,5 dias, mais que os 27,3 dias da órbita, porque enquanto a Lua dá a volta a Terra também andou na sua própria órbita e o alinhamento com o Sol precisa ser recuperado.</p>

  <div class="why"><span class="t">Por que isso importa</span>Este é o bloco de números que você vai reutilizar o semestre inteiro, inclusive em Física. Guarde as razões, não os dígitos: a Lua tem 1/4 do diâmetro e 1/80 da massa; o Sol, 100 diâmetros e 300 mil massas.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">L</span>Interior da Terra, origem da Lua e os movimentos que se veem</h3>
  <p class="lead">Os números da ficha anterior levantam perguntas que o slide não responde: por que a Terra é tão densa, por que temos uma Lua desproporcional, e o que de fato causa estações, fases, eclipses e marés.</p>
  <p><b>Por que a Terra é diferente por dentro.</b> A densidade média de 5,51 g/cm³ é bem maior que a das rochas de superfície, que ficam entre 2,7 e 3,0. Isso já denuncia que existe material muito mais denso lá embaixo. O motivo é a <b>diferenciação</b>: quando a Terra jovem estava fundida, por calor de acreção e decaimento radioativo, o ferro e o níquel afundaram para formar o núcleo e os silicatos leves subiram para formar o manto e a crosta. É exatamente por isso que os percentuais de elementos da crosta não valem para o planeta inteiro — a separação aconteceu de propósito, por gravidade. Essa é também a origem do campo magnético terrestre, gerado pelo movimento do ferro líquido no núcleo externo, que nos protege do vento solar.</p>
  <div class="fig">
    <div class="figttl">Figura · O interior da Terra, em corte</div>

        <circle r="102" fill="none" stroke="#C2751B" stroke-width="2"/>
        <circle r="60" fill="#B23A2B" opacity=".35"/>
        <circle r="30" fill="#fbbf24"/>
        <path d="M0 -105 A105 105 0 0 1 0 105 Z" fill="var(--surface3)" opacity=".35"/>

      </g>
      <g stroke="var(--muted)" stroke-width="1">
        <line x1="265" y1="46" x2="330" y2="46"/><line x1="248" y1="86" x2="330" y2="86"/>

        <text x="338" y="42">Crosta</text><text x="338" y="82">Manto</text><text x="338" y="124">Núcleo externo</text><text x="338" y="164">Núcleo interno</text></g>
      <g font-size="9.5" fill="var(--muted)">
        <text x="338" y="56">5 a 70 km · silicatos leves · 2,7 a 3,0 g/cm³</text>
        <text x="338" y="96">até 2.900 km · silicatos de Fe e Mg · rocha em fluxo lento</text>
        <text x="338" y="138">líquido · ferro e níquel · gera o campo magnético</text>
        <text x="338" y="178">sólido · ferro · pressão altíssima o mantém rígido</text></g>

    </svg>
    <div class="figcap">A diferenciação separou o planeta por densidade. É por isso que os percentuais de elementos da crosta — oxigênio, silício, alumínio — não representam a Terra inteira, onde o ferro lidera. As ondas sísmicas foram o que permitiu mapear essas camadas sem escavar.</div>
  </div>
  <p><b>De onde veio a Lua.</b> Um satélite com 1/4 do diâmetro do planeta é desproporcional — nenhum outro planeta rochoso tem algo parecido. A explicação aceita é o <b>impacto gigante</b>: há cerca de 4,5 bilhões de anos, um corpo do tamanho de Marte, apelidado de Theia, colidiu de raspão com a Terra jovem. O material ejetado do manto entrou em órbita e se aglomerou. Isso explica três fatos de uma vez: a Lua ter pouquíssimo ferro (a colisão arrancou manto, não núcleo), sua densidade ser baixa (3,34), e a composição isotópica das rochas lunares ser quase idêntica à terrestre.</p>
  <p><b>As estações do ano não vêm da distância.</b> Erro clássico, e vale entender bem. A órbita da Terra é quase circular; estamos até <b>mais perto</b> do Sol em janeiro, em pleno verão do hemisfério sul. O que causa as estações é a <b>inclinação de 23,4°</b> do eixo de rotação: quando um hemisfério está inclinado na direção do Sol, recebe luz mais concentrada por unidade de área e com dias mais longos. É por isso que as estações são opostas nos dois hemisférios. Essa inclinação, aliás, é mantida relativamente estável pela presença da Lua — sem ela, o eixo terrestre oscilaria muito mais, com consequências climáticas dramáticas.</p>

    <div class="figcap">O eixo aponta sempre para a mesma direção no espaço. Em dezembro o hemisfério sul está inclinado <b>na direção</b> do Sol e recebe luz mais concentrada — é verão aqui, mesmo estando a Terra no ponto mais próximo da órbita. Isso encerra a discussão: o que decide é a inclinação, não a distância.</div>
  </div>
  <p><b>Eclipses e marés</b>, dois efeitos que caem junto com esse assunto. Eclipse <b>solar</b> ocorre na Lua nova, quando ela passa entre nós e o Sol; eclipse <b>lunar</b> ocorre na Lua cheia, quando a Lua entra na sombra da Terra. Não acontecem todo mês porque a órbita lunar é inclinada cerca de 5° — o alinhamento perfeito só ocorre algumas vezes por ano. Já as <b>marés</b> vêm da diferença de atração gravitacional entre o lado da Terra voltado para a Lua e o lado oposto: por isso há duas marés altas por dia, e não uma.</p>
  <div class="why"><span class="t">Por que isso importa</span>Esses números são a régua com que você vai estimar tudo depois: densidade da Terra, gravidade na superfície, tempo de viagem até a Lua. Em prova de introdução, quase toda conta começa com um deles.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que a Lua "não gira". Ela gira — só que no mesmo compasso da órbita. E cuidado com a unidade da massa da Terra: 6,0 × 10²⁷ <b>g</b> = 6,0 × 10²⁴ <b>kg</b>. Trocar isso numa conta erra o resultado por mil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">5</span>O Sol e o Sistema Solar</h3>
  <div class="fig">
    <div class="figttl">Figura 4 · O Sol e a Terra na mesma escala</div>
    <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
      <defs><radialGradient id="sunG"><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></radialGradient></defs>
      <circle cx="-60" cy="100" r="218" fill="url(#sunG)"/>
      <circle cx="520" cy="100" r="2" fill="#0891b2"/>
      <line x1="520" y1="94" x2="520" y2="62" stroke="var(--muted)" stroke-width="1"/>
      <text x="520" y="54" font-size="10.5" font-weight="700" fill="var(--text)" text-anchor="middle">Terra</text>
      <text x="90" y="100" font-size="15" font-weight="800" fill="#7c2d12">Sol</text>
      <text x="520" y="126" font-size="9.5" fill="var(--muted)" text-anchor="middle">1 pixel ≈ 3.200 km</text>
    </svg>
    <div class="figcap">O Sol tem ~109 diâmetros terrestres e ~333.000 massas da Terra<sup class="ref">3</sup> — os "100 vezes" e "300 mil vezes" do slide, arredondados. Mesmo assim é classificado como <b>estrela anã</b>: uma estrela comum.</div>
  </div>
  <p><b>Como o Sol gera energia:</b> por <b>fusão nuclear</b> no núcleo, convertendo hidrogênio em hélio. Essa energia migra do centro até a superfície e escapa, iluminando e aquecendo os planetas. Guarde a distinção: o Sol <b>não queima</b> combustível no sentido químico — fusão libera milhões de vezes mais energia por partícula do que qualquer combustão.</p>
  <div class="fig">
    <div class="figttl">Figura 5 · Anatomia do Sistema Solar</div>
    <svg viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="60" r="24" fill="url(#sunG)"/>

  <p><b>O Sol não é uma bola parada.</b> Ele tem <b>manchas solares</b> — regiões mais frias e escuras onde o campo magnético é intenso — cujo número sobe e desce num <b>ciclo de aproximadamente 11 anos</b>. Nos períodos de máximo, ficam mais frequentes as <b>explosões solares</b> e as ejeções de massa coronal, que lançam partículas carregadas pelo Sistema Solar. Quando essas partículas atingem o campo magnético terrestre, produzem <b>auroras</b> nos polos e podem afetar satélites, comunicações e até redes elétricas. Esse fluxo contínuo de partículas é o <b>vento solar</b>, e é ele que faz a cauda dos cometas apontar sempre para o lado oposto ao Sol — não para trás do movimento, como a intuição sugere.</p>
  <div class="why"><span class="t">Por que isso importa</span>Quase tudo que a astrofísica estudará depois usa o Sol como caso-padrão: massa solar, luminosidade solar e raio solar viraram as próprias unidades da área. Entender esta estrela é entender o gabarito de todas as outras.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">N</span>Como o Sistema Solar se formou, e o que sobrou dele</h3>
  <p class="lead">O slide lista os corpos do Sistema Solar. A pergunta que fica é por que eles são assim — por que os rochosos ficam perto e os gigantes longe, por que todos giram no mesmo sentido, e por que existem dois cinturões de entulho.</p>
  <p><b>Como tudo isso se formou junto.</b> A explicação padrão é a <b>hipótese nebular</b>: há 4,6 bilhões de anos, uma nuvem de gás e poeira colapsou por gravidade. Ao contrair, começou a girar mais rápido, por conservação de momento angular, e se achatou num disco. No centro, a densidade e a temperatura subiram até ligar a fusão nuclear — nasceu o Sol. No disco ao redor, grãos se colaram em corpos maiores até formar os planetas. A região interna, quente demais para reter gelo e gases leves, produziu planetas <b>rochosos e pequenos</b>; além da chamada linha de gelo, o material disponível era muito maior e nasceram os <b>gigantes</b>. Isso explica de uma vez a divisão entre internos e externos, o fato de todos orbitarem no mesmo plano e no mesmo sentido, e a existência dos cinturões: no de asteroides, a influência gravitacional de Júpiter impediu que os fragmentos se juntassem num planeta.</p>
  <p><b>Anatomia de um cometa.</b> Vale saber porque cai em prova: o <b>núcleo</b> é um bloco de gelo e poeira de poucos quilômetros — a famosa "bola de neve suja". Ao se aproximar do Sol, o gelo sublima e forma a <b>coma</b>, um envelope difuso ao redor do núcleo, e daí saem <b>duas caudas</b>: uma de poeira, curva e amarelada, e uma de íons, reta e azulada, empurrada pelo vento solar. Ambas apontam para longe do Sol. Já os <b>asteroides</b> são rochosos ou metálicos, sem gelo volátil suficiente para formar cauda — e os fragmentos que caem na Terra, os <b>meteoritos</b>, são amostras grátis do Sistema Solar primitivo, usadas inclusive para datar sua idade.</p>
  <div class="callout"><b>Precisão importante sobre cometas.</b> O slide diz que muitos cometas vêm do cinturão de Kuiper. Isso vale para os de <b>período curto</b>, que dão a volta em menos de 200 anos e orbitam quase no plano dos planetas<sup class="ref">5</sup>. Os de <b>período longo</b> vêm da <b>nuvem de Oort</b>, a cerca de 100.000 UA, com órbitas em qualquer inclinação e períodos que chegam a 30 milhões de anos<sup class="ref">6</sup>.</div>
  <div class="numgrid">
    <div><b>15 milhões K</b><span>temperatura no núcleo, onde a fusão acontece</span></div>
    <div><b>5.778 K</b><span>na fotosfera, a superfície visível<sup class="ref">3</sup></span></div>
    <div><b>3,8 × 10²⁶ W</b><span>luminosidade — energia liberada por segundo<sup class="ref">3</sup></span></div>
    <div><b>74% H · 24% He</b><span>composição em massa</span></div>
    <div><b>4,6 bilhões</b><span>de anos de idade, na metade da vida</span></div>
    <div><b>8 min 20 s</b><span>o que a luz leva do Sol até aqui</span></div>
  </div>
  <p>Um detalhe que costuma impressionar: a energia gerada no núcleo <b>não escapa direto</b>. Ela é absorvida e reemitida incontáveis vezes na zona radiativa, e leva dezenas de milhares de anos para chegar à superfície. Os 8 minutos são só o trecho final, já como luz no vácuo. Ou seja, a luz que aquece você hoje foi gerada muito antes de existir escrita.</p>

  <p>Leia a tabela em colunas, não em linhas. Da esquerda para a direita, a distância cresce e o período orbital cresce <b>muito mais rápido</b> — Netuno está a 30 vezes a distância da Terra, mas leva 165 anos, não 30. Essa desproporção é a terceira lei de Kepler, que você vai formalizar depois. E repare no salto de massa entre Marte e Júpiter: só Júpiter tem 318 massas terrestres, mais que o dobro de todo o resto do Sistema Solar somado, tirando o Sol.</p>
  <div class="why"><span class="t">Por que isso importa</span>O Sol concentra praticamente toda a massa do Sistema Solar. É por isso que, em primeira aproximação, você pode tratar o movimento de qualquer planeta como um problema de dois corpos — simplificação que sustenta metade da mecânica celeste que você verá adiante.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que o Sol "queima" hidrogênio. Combustão é reação química; o Sol faz <b>fusão nuclear</b>, que libera milhões de vezes mais energia por partícula. Um Sol movido a combustão duraria alguns milhares de anos, não bilhões.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">★</span>Estrelas: o que são, como vivem e como morrem</h3>
  <p class="lead">"Estrelas" aparecem como um item na lista do slide, mas são o objeto central da astrofísica — e o degrau da escada que conecta todos os outros. Este módulo dá o panorama que o resto do módulo de astronomia vai desenvolver.</p>
  <p>Uma estrela é uma esfera de gás mantida coesa pela própria gravidade e sustentada contra o colapso pela pressão gerada no interior. Esse é o <b>equilíbrio hidrostático</b>: a gravidade puxa para dentro, a pressão empurra para fora, e a estrela vive na trégua entre as duas. Quando o combustível nuclear acaba e a pressão cede, o equilíbrio quebra — e é aí que a estrela morre.</p>
  <p><b>Nascem em nuvens moleculares.</b> Uma região densa e fria do meio interestelar colapsa por gravidade, fragmenta-se e forma vários núcleos que aquecem ao contrair. Quando o centro atinge cerca de <b>10 milhões de kelvin</b>, a fusão de hidrogênio liga e a estrela nasce. Abaixo de aproximadamente 0,08 massa solar isso nunca acontece: o objeto vira uma <b>anã marrom</b>, algo entre planeta gigante e estrela fracassada.</p>
  <p><b>A classificação espectral</b> ordena as estrelas por temperatura, e a sequência de letras é herança histórica que sobreviveu: <b>O, B, A, F, G, K, M</b> — da mais quente e azulada à mais fria e avermelhada. O Sol é do tipo G. Cada classe se subdivide em números de 0 a 9, e o Sol é G2. Cruzando temperatura com luminosidade obtém-se o <b>diagrama HR</b>, provavelmente o gráfico mais importante da astronomia: nele, cerca de 90% das estrelas se alinham numa faixa diagonal, a <b>sequência principal</b>, onde estão as que queimam hidrogênio no núcleo. Fora dela ficam gigantes, supergigantes e anãs brancas.</p>

  </div>
  <p><b>A massa decide tudo.</b> Estrelas de baixa massa queimam devagar e vivem muito: uma anã vermelha pode durar centenas de bilhões de anos, mais que a idade atual do Universo. O Sol, com sua massa modesta, tem cerca de 10 bilhões de anos de sequência principal — já viveu metade. Estrelas muito massivas queimam de forma extravagante e duram poucos milhões de anos. O destino final também depende da massa:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Massa inicial</th><th>Fim da vida</th><th>O que sobra</th></tr></thead>
    <tbody>
      <tr><td>Até ~8 massas solares</td><td>Expande como gigante vermelha e ejeta as camadas externas, formando uma nebulosa planetária</td><td><b>Anã branca</b>: caroço de carbono e oxigênio, do tamanho da Terra, que esfria lentamente</td></tr>
      <tr><td>De ~8 a ~25 massas solares</td><td>Explode como <b>supernova</b> ao colapsar o núcleo de ferro</td><td><b>Estrela de nêutrons</b>: ~1,4 massa solar comprimida em ~20 km de diâmetro. Se emitir feixes e girar, é um pulsar</td></tr>
      <tr><td>Acima de ~25 massas solares</td><td>Supernova ou colapso direto</td><td><b>Buraco negro</b> estelar, com gravidade da qual nem a luz escapa</td></tr>
    </tbody></table></div>
  <p><b>E é assim que você existe.</b> O Big Bang produziu praticamente só hidrogênio e hélio. Todo o resto — o carbono das suas células, o oxigênio que você respira, o cálcio dos seus ossos, o ferro do seu sangue — foi fabricado dentro de estrelas por <b>nucleossíntese</b> e devolvido ao meio interestelar quando elas morreram. Elementos mais pesados que o ferro exigem os eventos mais violentos, como supernovas e colisões de estrelas de nêutrons. O Sistema Solar se formou a partir de material já enriquecido por gerações anteriores de estrelas — e é por isso que a frase "somos poeira de estrelas" é literal, não poética.</p>
  <div class="why"><span class="t">Por que isso importa</span>Aqui a escada de escalas fecha o ciclo: o meio interestelar forma estrelas, as estrelas fabricam elementos, e ao morrer devolvem esses elementos ao meio, que forma novas estrelas e planetas. É a cadeia que liga a composição química da Terra à evolução estelar — e um dos pontos onde astronomia e Ciências da Terra literalmente se encontram.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que o Sol vai virar supernova. Não vai: com sua massa, o destino é gigante vermelha e depois anã branca. E não confunda <b>nebulosa planetária</b> — que não tem nada a ver com planetas, é o gás ejetado por uma estrela moribunda — com <b>nebulosa</b> de formação estelar.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">6</span>Via Láctea e estrutura em grande escala</h3>
  <p>A <b>Via Láctea</b> é nossa galáxia: uma grande nuvem de gás e estrelas — centenas de bilhões delas — com forma <b>achatada</b>, assim como o Sistema Solar. O Sol é uma dessas estrelas e orbita o centro galáctico. Ela é do tipo <b>espiral</b>, e, por estarmos <b>dentro</b> do disco, nossa visão da própria Galáxia é limitada: enxergamos a faixa leitosa no céu, não a espiral vista de cima.</p>
  <p>Existem <b>bilhões</b> de outras galáxias, de vários tipos. E a distribuição delas <b>não é aleatória</b>: algumas estão isoladas, outras em grupos e aglomerados. Esse arranjo — com filamentos e vazios — é o que se chama de <b>Estrutura em Grande Escala</b> do Universo, o degrau mais alto da escada da Figura 1.</p>

  </div>
  <p><b>As partes da Galáxia.</b> O <b>disco</b> concentra o gás, a poeira e as estrelas jovens, e é onde ficam os braços espirais — e nós. O <b>bojo</b> central é mais denso e povoado por estrelas velhas, com um buraco negro supermassivo no meio. Envolvendo tudo está o <b>halo</b>, esférico e esparso, com aglomerados globulares antigos. Se você achatasse a Galáxia à espessura de uma folha de papel, ela teria uns 100 metros de diâmetro — é assim de fina.</p>
  <p><b>Tipos de galáxia.</b> A classificação clássica de Hubble separa em <b>elípticas</b> (E0 a E7, esferoidais, pouco gás, estrelas velhas), <b>espirais</b> (Sa, Sb, Sc, com braços, e as barradas SBa, SBb, SBc), <b>lenticulares</b> (S0, um meio-termo com disco mas sem braços) e <b>irregulares</b>. A Via Láctea é uma espiral barrada. Nossa vizinha grande, Andrômeda, é espiral e está a ~2,5 milhões de anos-luz — o objeto mais distante visível a olho nu em céu escuro.</p>
  <div class="why"><span class="t">Por que isso importa</span>Toda observação que você fizer daqui é feita de dentro do disco, atravessando poeira. Saber onde estamos dentro da Galáxia é condição para interpretar qualquer coisa que se veja no céu.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">U</span>Galáxias, aglomerados e o Universo em expansão</h3>
  <p class="lead">O último degrau da escada. Aqui a aula sai da nossa galáxia e chega ao Universo como um todo — território da cosmologia, e o ponto em que o panorama esbarra no que ainda não se sabe.</p>
  <p><b>Nosso endereço completo.</b> A Via Láctea não está sozinha: ela e Andrômeda dominam o <b>Grupo Local</b>, um conjunto de mais de setenta galáxias, a maioria anãs — incluindo as Nuvens de Magalhães, visíveis a olho nu do hemisfério sul. O Grupo Local faz parte do <b>Superaglomerado de Virgem</b>, que por sua vez é um apêndice de uma estrutura ainda maior, batizada de Laniakea. Escrito de trás para frente, o endereço fica: Terra → Sistema Solar → Braço de Órion → Via Láctea → Grupo Local → Superaglomerado de Virgem → teia cósmica. E há um detalhe curioso: Andrômeda está se aproximando de nós, e as duas galáxias devem colidir daqui a uns 4 bilhões de anos.</p>
  <p><b>O Universo está em expansão.</b> Em 1929, Edwin Hubble observou que quase todas as galáxias se afastam de nós, e que quanto mais distantes, mais rápido se afastam. Não é que estejamos no centro de nada — o espaço em si está se expandindo, e a analogia útil é a de pontos numa superfície de balão sendo inflado: cada ponto vê todos os outros se afastando. Extrapolando a expansão para trás no tempo chega-se ao <b>Big Bang</b>, há cerca de 13,8 bilhões de anos. Isso também impõe um limite ao que podemos ver: só nos alcançou a luz que teve tempo de viajar até aqui, o chamado <b>Universo observável</b>.</p>
  <div class="fig">

    <div class="figcap">Cada ponto na superfície do balão vê todos os outros se afastando, e os mais distantes se afastam mais rápido — sem que exista um centro. É por isso que a fuga das galáxias não nos coloca no meio do Universo. A constante de proporcionalidade é a constante de Hubble.</div>
  </div>
  <p><b>E a maior parte não é o que vemos.</b> Ao medir a velocidade de rotação das galáxias, percebe-se que as bordas giram rápido demais para a quantidade de matéria visível — deveriam se desfazer. A explicação corrente é a <b>matéria escura</b>, que não emite luz mas exerce gravidade, e responde por cerca de cinco vezes mais massa que toda a matéria comum. Somando ainda a <b>energia escura</b>, associada à aceleração da expansão, a matéria de que estrelas, planetas e você são feitos fica em torno de 5% do conteúdo do Universo. É um dos maiores problemas em aberto da física — e um bom lembrete de que o panorama desta aula é o mapa do que se sabe, não do que está resolvido.</p>
  <div class="why"><span class="t">Por que isso importa</span>Nossa posição dentro do disco explica praticamente todas as dificuldades da astronomia galáctica: olhamos o centro da Galáxia através de poeira, o que bloqueia a luz visível. É por isso que boa parte do que sabemos do centro veio do infravermelho e do rádio — assunto que volta quando o módulo falar de janelas atmosféricas e instrumentos.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir <b>Via Láctea</b> (a galáxia inteira) com a <b>faixa leitosa</b> que se vê no céu — que é apenas o disco visto de dentro, de perfil. E não confunda aglomerado <b>estelar</b> (estrelas dentro de uma galáxia) com aglomerado <b>de galáxias</b>.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">7</span>Onde a astronomia é feita</h3>

      <tr><td>Pico dos Dias (OPD)</td><td>Maior observatório óptico do país, em Brazópolis (MG), a 1.864 m. Criado em 1980 como OAB, ligado ao ON; desde 1989 sob o LNA. Telescópio de 1,60 m Perkin-Elmer operando desde 1981, dois de 60 cm e a buscadora de cometas<sup class="ref">11</sup><sup class="ref">12</sup></td><td>Nacional e público: qualquer pessoa submete projeto, analisado e ranqueado por impacto esperado</td></tr>

  <p>Duas ideias importantes escondidas nessa tabela. Primeira: <b>tempo de telescópio é recurso escasso</b>, distribuído por mérito via proposta escrita — saber redigir projeto é parte do ofício. Segunda: astronomia moderna de ponta é <b>cara e internacional</b>; o acesso de um país a grandes telescópios depende de decisões políticas e orçamentárias, não só de talento científico.</p>
  <div class="why"><span class="t">Por que isso importa</span>Estes nomes vão reaparecer em toda a sua vida acadêmica, e a lógica por trás deles — mérito, consórcio internacional, cota proporcional — é a mesma que rege o acesso a qualquer grande instalação científica.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">K</span>Como um telescópio funciona, e o que se acopla nele</h3>
  <p class="lead">A tabela anterior lista instituições e diâmetros. Falta entender por que o diâmetro é o número que importa, por que os observatórios ficam no alto de montanhas, e o que de fato produz ciência depois que a luz entra no tubo.</p>
  <p><b>Dois tipos de telescópio.</b> O <b>refrator</b> usa lente para desviar a luz — foi o de Galileu e é o caso do Cooke do Valongo. Sofre de aberração cromática e não escala: uma lente grande deforma sob o próprio peso, porque só pode ser apoiada pelas bordas. O <b>refletor</b> usa espelho côncavo, não tem aberração cromática e pode ser apoiado por trás em toda a superfície. Todo telescópio grande moderno é refletor — o de 1,6 m do Pico dos Dias é do tipo <b>Ritchey-Chrétien</b>, desenho que corrige aberrações fora do eixo e por isso virou padrão em telescópios profissionais.</p>
  <div class="fig">
    <div class="figttl">Figura · Os dois caminhos da luz dentro de um telescópio</div>

    <div class="figcap">No refrator a luz atravessa vidro e se separa por cor, gerando franjas coloridas. No refletor ela apenas se reflete, e todas as cores se comportam igual. Some-se o problema estrutural — vidro grande entorta sob o próprio peso — e a escolha deixa de ser preferência.</div>
  </div>
  <p><b>Por que a abertura importa tanto.</b> Ela decide duas coisas ao mesmo tempo. A <b>quantidade de luz</b> captada cresce com o quadrado do diâmetro: dobrar a abertura quadruplica a luz, o que significa enxergar objetos mais fracos e mais distantes. E o <b>poder de resolução</b> — a capacidade de separar dois pontos próximos — melhora proporcionalmente ao diâmetro. Não é à toa que a corrida é sempre por espelhos maiores.</p>
  <p><b>Por que os observatórios ficam em montanhas altas e secas.</b> A atmosfera atrapalha de três jeitos: absorve boa parte do espectro, espalha luz e, principalmente, <b>borra a imagem</b> por causa da turbulência do ar — o que os astrônomos chamam de <b>seeing</b>. Um sítio bom tem seeing de menos de 1 segundo de arco em boa parte das noites. Cerro Pachón, onde ficam SOAR e Gemini Sul, e o Pico dos Dias a 1.864 m foram escolhidos por isso: altitude, ar estável, poucas nuvens e pouca luz artificial ao redor.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Faixa do espectro</th><th>Chega ao solo?</th><th>Onde se observa</th></tr></thead>
    <tbody>
      <tr><td>Rádio</td><td>Sim — janela larga</td><td>Solo: Itapetinga, ALMA</td></tr>
      <tr><td>Infravermelho</td><td>Parcialmente, em janelas estreitas</td><td>Montanhas altas e secas, ou espaço</td></tr>
      <tr><td>Visível</td><td>Sim — a janela óptica</td><td>Solo: OPD, SOAR, Gemini, ELT</td></tr>
      <tr><td>Ultravioleta, raios X e gama</td><td>Não — bloqueado pela atmosfera</td><td>Só do espaço: telescópios em órbita</td></tr>
    </tbody></table></div>
  <p><b>O telescópio é só a metade.</b> O que se acopla a ele é o que define a ciência possível. Uma <b>câmera CCD</b> registra imagens e permite medir brilho com precisão — é a <b>fotometria</b>, que responde perguntas de variação temporal, como o trânsito de um exoplaneta. Um <b>espectrógrafo</b> decompõe a luz e entrega composição química, temperatura, velocidade radial e até campo magnético — é a ferramenta mais poderosa da astrofísica, e boa parte do tempo dos grandes telescópios é gasta nela. Há ainda <b>polarímetros</b> e instrumentos de imageamento em infravermelho. É por isso que a tabela do professor destaca que o consórcio Gemini testa "novas tecnologias em instrumentação": um instrumento novo pode valer tanto quanto um telescópio novo.</p>
  <p><b>Duas técnicas que mudaram o jogo.</b> A <b>óptica adaptativa</b> corrige a turbulência atmosférica em tempo real: um sensor mede a deformação da frente de onda centenas de vezes por segundo e um espelho deformável a compensa, às vezes com uma estrela-guia artificial criada por laser. O ganho é enorme — um telescópio de solo passa a chegar perto da nitidez de um telescópio espacial. Já a <b>interferometria</b> combina a luz de vários telescópios separados, obtendo resolução equivalente à de um instrumento do tamanho da distância entre eles. No rádio, é o princípio do ALMA e das redes intercontinentais que produziram a primeira imagem de um buraco negro.</p>
  <p>Esse é o motivo de existirem telescópios espaciais: não é só fugir do seeing, é que faixas inteiras do espectro simplesmente não atravessam a atmosfera. A astronomia moderna é <b>multiespectral</b> — o mesmo objeto observado em rádio, visível e raios X conta histórias diferentes.</p>
  <div class="why"><span class="t">Por que isso importa</span>Se você seguir para a astronomia observacional, sua vida profissional vai girar em torno destes nomes. Saber qual instrumento serve a qual pergunta — e a qual prazo de proposta — é competência de ofício, não trivia.</div>
  <div class="trap"><span class="t">Erro comum</span>Tratar todo telescópio grande como equivalente. O que importa é o conjunto: abertura, sítio (céu escuro e ar estável), faixa do espectro e instrumentos acoplados. Um 4,1 m em Cerro Pachón pode render mais que um 8 m num sítio ruim.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">8</span>Astronomia no Brasil: linha do tempo</h3>
  <ul class="tl">
    <li><b>1827</b> Criação do Observatório Nacional</li>
    <li><b>1881</b> Criação do Observatório Astronômico da Escola Polythécnica, futuro OV, por Manuel Pereira Reis<sup class="ref">10</sup></li>
    <li><b>1908</b> Criação do Observatório Astronômico do RS</li>
    <li><b>1910</b> Chega o refrator Cooke &amp; Sons, então o maior instrumento em operação no país<sup class="ref">10</sup></li>
    <li><b>1931</b> Criação do Instituto Astronômico e Geofísico (IAG/USP)</li>
    <li><b>1958</b> Criação do curso de graduação em Astronomia da FNFi, sediado no OV</li>
    <li><b>1964</b> Formatura do primeiro aluno graduado em Astronomia<sup class="ref">10</sup></li>
    <li><b>c.1970</b> Retornam ao Brasil os primeiros doutores formados na França</li>
    <li><b>1974</b> Criação da pós-graduação do ON</li>
    <li><b>1980</b> Criação do OAB, atual Observatório Pico dos Dias</li>
    <li><b>1993</b> Ingresso do Brasil no consórcio Gemini</li>
    <li><b>2009</b> Assembleia Geral da UAI no Rio de Janeiro</li>
  </ul>
  <p style="margin-top:14px"><b>O que a linha do tempo conta, além das datas.</b> Ela tem três fases nítidas. A primeira, de <b>1827 a 1931</b>, é de fundação de observatórios ligados a necessidades do Estado — o Observatório Nacional nasce no Império para dar hora oficial, cartografia e apoio à navegação, e o da Escola Polythécnica nasce para <b>ensinar</b>. Ciência, aqui, é subproduto do serviço público.</p>
  <p>A segunda fase, dos anos <b>1950 aos 1970</b>, é a da profissionalização. Criam-se cursos de graduação e pós-graduação, e uma geração vai se doutorar no exterior — a menção a "c.1970: retornam ao Brasil os primeiros doutores formados na França" marca exatamente o momento em que o país passa a ter astrônomos formados como pesquisadores, e não só como professores ou funcionários de observatório.</p>
  <p>A terceira, de <b>1980 em diante</b>, é a da infraestrutura própria e da internacionalização: o Pico dos Dias em 1980 dá ao país um telescópio de porte razoável em solo nacional; o ingresso no Gemini em 1993 compra acesso a telescópios de classe 8 metros; o SOAR vem em seguida; e a Assembleia Geral da UAI no Rio, em 2009, é o reconhecimento simbólico dessa trajetória. A tentativa de entrar no ESO, que ficou pelo caminho, teria sido o passo seguinte.</p>
  <div class="why"><span class="t">O padrão que se repete</span>Note como cada salto depende de decisão política e orçamento, não de talento científico. Essa é a moral que atravessa toda a seção de observatórios: a comunidade brasileira é pequena, competente e crônicamente limitada pelo acesso a instrumentos. Entender isso ajuda a interpretar as escolhas de carreira que aparecem no próximo módulo.</div>
  <p style="margin-top:14px">Hoje são cerca de <b>600 brasileiros</b> com atuação direta em astronomia e/ou cosmologia, a grande maioria ligada à <b>Sociedade Astronômica Brasileira (SAB)</b>. É uma comunidade pequena — o que tem um lado bom: você encontra os nomes da área nos congressos e nos corredores.</p>
</div>

<div class="lsec">
  <h3><span class="lnum">9</span>Profissão e o curso do OV/UFRJ</h3>
  <p><b>Onde se trabalha:</b> academia (universidades e institutos de pesquisa); suporte à pesquisa (laboratórios e observatórios); divulgação e extensão (planetários e museus); e setor privado. O slide "Paixão vs. Profissão" põe o dedo na ferida — o gosto pelo céu é o ponto de partida, mas a carreira exige base técnica dura e disputa por posições escassas.</p>
  <p><b>O curso:</b> oferecido pelo <b>Observatório do Valongo</b>, criado em 1958, com <b>30 vagas por ano</b>, <b>4 anos</b> de duração e perto de ultrapassar 300 formados. Desde 2003 o OV também oferece pós-graduação. O professor sublinha dois pilares da formação: a <b>vivência observacional</b> — treino, análise e síntese com enfoque na observação — e uma <b>base sólida em física e matemática</b>.</p>
  <p><b>A história do OV:</b> fundado em <b>5 de julho de 1881</b> por Manuel Pereira Reis como Observatório Astronômico da Escola Polythécnica, no Morro de Santo Antônio, para dar aulas práticas de astronomia e geodésia aos alunos da Politécnica e aos aspirantes da Escola da Marinha<sup class="ref">10</sup>. Com a decisão urbanística de derrubar o morro, foi transferido para o Morro da Conceição, onde ficava a <b>Chácara do Valongo</b> — terreno que, antes da Abolição, era onde pessoas escravizadas eram deixadas para serem vendidas. Após a morte do diretor Amoroso Costa em 1928, entrou em longa estagnação. Em <b>1957</b>, Mário Ferreira Dias e Alércio Moreira Gomes se transferiram do Observatório Nacional para o OV; em 1958 juntou-se a eles Luís Eduardo da Silva Machado, e os três criaram o curso de graduação<sup class="ref">10</sup>.</p>
  <p>Endereço: Ladeira do Pedro Antônio, 43, Saúde, Rio de Janeiro. No acervo está o histórico <b>telescópio Cooke</b>, comprado da Inglaterra e instalado em 1910 — na época, o maior instrumento em funcionamento no país<sup class="ref">10</sup>.</p>
  <p><b>Como é o dia de um astrônomo profissional.</b> Bem menos noites de ocular do que o imaginário sugere. A maior parte do tempo é escrever propostas de observação, reduzir e analisar dados em computador, programar, escrever artigos, revisar os artigos dos outros, dar aula, orientar alunos e ir a congressos. Observação remota é hoje a norma: você pede o tempo, alguém executa ou o telescópio opera em fila, e os dados chegam pela rede. Programar deixou de ser diferencial e virou requisito — Python é a língua franca da área.</p>

  <p><b>Como se entra nessa vida, na prática.</b> A graduação é só o começo: a carreira acadêmica passa por mestrado, doutorado e, em geral, um ou mais pós-doutorados antes de uma posição fixa. O que conta desde o primeiro período é a <b>iniciação científica</b> — procurar um professor cuja linha te interesse, ler os artigos dele, bater na porta. Bolsas de IC do CNPq, FAPERJ e da própria UFRJ existem justamente para isso. Somam também a monitoria de disciplinas, participação em projetos de extensão e divulgação, e ir às reuniões anuais da SAB, onde a comunidade inteira aparece. Como são cerca de 600 astrônomos no país, você conhece boa parte dos nomes da área antes mesmo de se formar — o que é uma vantagem que cursos maiores não oferecem.</p>
  <div class="why"><span class="t">Por que isso importa</span>O slide "Paixão vs. Profissão" existe para te fazer encarar isso agora, não no quarto período. As duas coisas não se excluem — mas a segunda exige, além do gosto pelo céu, gostar de matemática, de física e de programar. Se qualquer uma dessas três te dá alergia, é melhor descobrir cedo, e as outras ênfases do BCMT continuam abertas.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que astronomia é sobre memorizar nomes de estrelas e constelações. É sobre física, e boa parte do trabalho é análise de dados. Astronomia observacional descritiva é a menor fatia da profissão hoje.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">!</span>Precisões e complementos</h3>
  <div class="callout"><b>Crosta ≠ Terra inteira.</b> Os percentuais de elementos do slide são os da crosta<sup class="ref">8</sup>. Se a pergunta for sobre o planeta como um todo, a resposta muda: o ferro lidera com ~32%<sup class="ref">9</sup>. Veja a Figura 3.</div>
  <div class="callout"><b>Cometas: Kuiper e também Oort.</b> Período curto vem de Kuiper<sup class="ref">5</sup>; período longo, da nuvem de Oort<sup class="ref">6</sup>.</div>
  <div class="callout"><b>E-ELT hoje é só "ELT".</b> O ESO abandonou o "E-" (European) em 2017. Terá espelho de ~39 m. Confirmando a data do slide: primeira luz do telescópio prevista para <b>março de 2029</b>, e primeira luz científica, com instrumentos comissionados, para <b>dezembro de 2030</b><sup class="ref">17</sup>.</div>
  <div class="callout"><b>Brasil e ESO — o detalhe da tramitação.</b> A adesão foi aprovada pelo Conselho do ESO em dezembro de 2010 e o Acordo chegou a ser aprovado pelo Congresso Nacional em maio de 2015, mas o processo <b>nunca foi concluído</b> e a participação segue suspensa<sup class="ref">18</sup>. Não é que o Congresso tenha rejeitado — o processo travou antes do fim.</div>
  <div class="callout"><b>Foram três astrônomos, não dois.</b> O slide cita Alércio Moreira Gomes e Mário Ferreira Dias, que chegaram em 1957. O site oficial do OV acrescenta Luís Eduardo da Silva Machado, que chegou em 1958 — e credita a criação do curso aos três<sup class="ref">10</sup>. Da mesma forma, o OV virou unidade da UFRJ em <b>2002</b> pelo site oficial (o slide diz 2001).</div>
  <div class="callout"><b>Pequenos erros de digitação nos slides.</b> "A Astronomia <i>complee</i>" é "compele"; "<i>plantetas</i>" é "planetas".</div>
  <div class="callout plus"><b>"Cerca de 300 alunos formados" — o número é maior hoje.</b> O slide diz que o curso está próximo de ultrapassar 300 formados. O site oficial registra o ducentésimo formando em 2014<sup class="ref">10</sup>; com a média histórica, a marca dos 300 já deve ter sido alcançada. Se a pergunta aparecer, o seguro é responder pela ordem de grandeza — algumas centenas desde 1964, ano do primeiro formando.</div>
  <div class="callout plus"><b>"Cerca de 600 astrônomos brasileiros" é estimativa arredondada.</b> O número circula na comunidade e vem do porte da SAB, que oscila com filiações e aposentadorias. Guarde a ordem de grandeza: é uma comunidade de centenas, não de milhares — o que muda tudo em termos de proximidade profissional.</div>
  <div class="callout"><b>Número de luas dos planetas muda todo ano.</b> A tabela dos oito planetas traz "90+" para Júpiter e "140+" para Saturno de propósito. Novas luas pequenas são confirmadas com frequência, e qualquer número exato envelhece rápido. Em prova, a comparação que importa é qualitativa: gigantes têm muitas, rochosos têm zero, uma ou duas.</div>
  <div class="callout"><b>"O Sol é uma estrela anã" pode confundir.</b> Anã, aqui, é classe de luminosidade — significa que está na sequência principal, não que seja pequena. O Sol é maior e mais brilhante que a maioria absoluta das estrelas da Galáxia, que são anãs vermelhas. Dizer que ele é "mediano" é mais justo que dizer que é "pequeno".</div>
  <div class="callout"><b>Cuidado com "a Lua não tem atmosfera".</b> O correto é atmosfera desprezível, não inexistente: há uma exosfera extremamente rarefeita. Para os efeitos da aula — sem erosão, sem intemperismo, crateras preservadas — a simplificação do slide funciona.</div>
  <div class="callout plus"><b>Como usar esta seção.</b> Nenhum desses pontos desautoriza o professor: slides de aula panorâmica arredondam de propósito, para caber. A lista serve para você não travar se encontrar outro número num livro da bibliografia, e para ter o que dizer numa discursiva que peça precisão.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">G</span>Glossário da aula</h3>
  <div class="gloss">
    <div><b>Urânia</b>Musa grega da astronomia, uma das nove que inspiravam conhecimento e artes.</div>
    <div><b>Meio interestelar</b>Gás e poeira que preenchem o espaço entre as estrelas; matéria-prima para novas estrelas.</div>
    <div><b>AGN / Quasar</b>Núcleo ativo de galáxia: região central extremamente luminosa alimentada por um buraco negro supermassivo.</div>
    <div><b>Estrutura em Grande Escala</b>Padrão de distribuição das galáxias no Universo, em grupos, aglomerados, filamentos e vazios.</div>
    <div><b>UA</b>Unidade Astronômica: 149.597.870.700 m exatos desde a Resolução B2 da UAI, em 2012.</div>
    <div><b>Rotação síncrona</b>Quando o período de rotação de um corpo iguala o de translação, mantendo sempre a mesma face voltada para o outro.</div>
    <div><b>Nuvem de Oort</b>Envoltório esférico de corpos gelados a ~100.000 UA, origem dos cometas de período longo.</div>
    <div><b>Planetas jovianos</b>Os gigantes externos — Júpiter, Saturno, Urano e Netuno.</div>
    <div><b>LNA</b>Laboratório Nacional de Astrofísica, em Itajubá (MG), que administra o Pico dos Dias.</div>
    <div><b>SAB</b>Sociedade Astronômica Brasileira, entidade que reúne a maioria dos astrônomos do país.</div>
    <div><b>UAI</b>União Astronômica Internacional; sua Assembleia Geral de 2009 aconteceu no Rio.</div>
    <div><b>Radome</b>Cúpula que protege uma antena de rádio das intempéries sem bloquear o sinal.</div>
  </div>
</div>

  <div class="why"><span class="t">Como usar</span>Estas perguntas não têm resposta única no material — várias exigem juntar dois módulos diferentes. É exatamente o tipo de raciocínio que uma questão discursiva cobra. Escolha duas ou três, escreva a resposta em um parágrafo, e leve ao professor as que ficarem em aberto.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">✓</span>O que provavelmente cai da Aula 01</h3>
  <p class="lead">O módulo tem uma prova só, na última aula, com questões objetivas e discursivas. Como esta primeira aula é panorâmica, ela tende a aparecer em questões de definição, de associação e de ordem de grandeza — não em conta pesada. Este é o mínimo que precisa estar automático.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Tipo de questão</th><th>O que estudar desta aula</th></tr></thead>
    <tbody>
      <tr><td>Definição objetiva</td><td>Ciência básica; meio interestelar; AGN/quasar; estrutura em grande escala; rotação síncrona; UA, ano-luz e parsec</td></tr>
      <tr><td>Ordem de grandeza</td><td>Raio e massa da Terra; distância Terra–Lua; 1 UA; diâmetro e massa do Sol em relação à Terra; diâmetro da Via Láctea</td></tr>
      <tr><td>Associação</td><td>Planeta ↔ interno ou joviano; cinturão ↔ localização; cometa ↔ Kuiper ou Oort; telescópio ↔ abertura e país</td></tr>
      <tr><td>Sequência / hierarquia</td><td>A escada de escalas na ordem certa, do planeta à estrutura em grande escala</td></tr>
      <tr><td>Discursiva curta</td><td>Papel civilizatório da astronomia; por que a Lua mostra sempre a mesma face; por que fusão não é combustão; por que grandes telescópios ficam em montanhas</td></tr>
      <tr><td>Histórico</td><td>1881, 1924, 1958 e 1993; o que é SAB, LNA, OPD, Gemini, SOAR e ESO</td></tr>
    </tbody></table></div>
  <div class="trap"><span class="t">As quatro pegadinhas desta aula</span>
    <b>1.</b> Percentuais de elementos: os do slide são da <b>crosta</b>; na Terra inteira o ferro lidera. &nbsp;
    <b>2.</b> Cometas: período curto vem de Kuiper, período longo vem de Oort. &nbsp;
    <b>3.</b> A Lua gira, sim — em sincronia com a órbita. &nbsp;
    <b>4.</b> Massa da Terra: 10²⁷ em gramas, 10²⁴ em quilogramas.</div>
  <div class="why"><span class="t">Como revisar</span>Uma passada pelos módulos marcando cada um como estudado, e depois só os flashcards que ainda estiverem em nível 1 e 2. O baralho completo desta aula passa de 45 cartas e o teste tem mais de 20 questões, distribuídas por módulo — dá para fechar em três ou quatro sessões de foco de 25 minutos.</div>
  <p><b>Como esta aula provavelmente vai aparecer na prova.</b> A ementa diz três coisas que, juntas, permitem prever bastante: o objetivo do módulo é dar uma <b>visão qualitativa global</b>, a prova vem só <b>na última aula</b> e cobre as ~15 aulas, e ela mistura <b>objetivas e discursivas</b>. Isso tem consequências práticas.</p>
  <p>Primeiro: sendo qualitativa e cobrindo quinze aulas, uma prova assim raramente exige conta pesada. O peso cai sobre <b>definições precisas</b>, <b>associações corretas</b> e <b>ordens de grandeza</b>. Contas, quando aparecem, tendem a ser de uma linha — converter parsec em anos-luz, aplicar a razão de magnitudes, estimar quantos raios terrestres cabem numa distância.</p>
  <p>Segundo: a Aula 01 é a <b>aula-panorama</b>. Aulas panorâmicas costumam render dois tipos de questão. As <b>objetivas de vocabulário</b>, que checam se você fixou o que cada termo significa — e é por isso que o glossário deste painel tem tantos verbetes. E as <b>discursivas de síntese</b>, que pedem para relacionar assuntos de aulas diferentes: aqui é onde a escada de escalas rende, porque ela é a espinha que amarra o módulo inteiro.</p>
  <p>Terceiro: como esta aula introduz nomes de instituições, datas e instrumentos, ela é a fonte natural de questões de <b>associação</b> — ligar telescópio a diâmetro, país e sítio; ligar cinturão a localização; ligar data a evento. Esse é o tipo que mais se ganha com revisão de flashcards, porque é memória pura.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Formato provável</th><th>Como costuma ser enunciado</th><th>Exemplo colado nesta aula</th></tr></thead>
    <tbody>
      <tr><td>Objetiva de definição</td><td>"Assinale a alternativa que define corretamente..."</td><td>O que é o meio interestelar; o que é magnitude aparente; o que caracteriza ciência básica</td></tr>
      <tr><td>Objetiva de associação</td><td>"Relacione as colunas" ou "assinale a correspondência correta"</td><td>Gemini ↔ 8,1 m ↔ Havaí e Chile; Kuiper ↔ período curto; Oort ↔ período longo</td></tr>
      <tr><td>Objetiva de ordem de grandeza</td><td>"A distância / massa / idade aproximada é da ordem de..."</td><td>1 UA; raio da Terra; idade do Universo; diâmetro da Via Láctea</td></tr>
      <tr><td>Objetiva com pegadinha conceitual</td><td>Alternativa plausível mas errada, do tipo que "todo mundo acha"</td><td>Estações causadas pela distância ao Sol; a Lua não gira; o Sol queima combustível; magnitude maior = mais brilhante</td></tr>
      <tr><td>Discursiva curta</td><td>"Explique por que..." ou "Justifique..."</td><td>Por que a Lua mostra sempre a mesma face; por que grandes telescópios ficam em montanhas altas; por que fusão não é combustão</td></tr>
      <tr><td>Discursiva de síntese</td><td>"Descreva a hierarquia..." ou "Relacione X com Y"</td><td>A escada de escalas na ordem; como a nucleossíntese liga estrelas à composição da Terra</td></tr>
      <tr><td>Discursiva de opinião fundamentada</td><td>"Comente" ou "Discuta a afirmação..."</td><td>O papel civilizatório da astronomia; por que financiar ciência básica</td></tr>

  <p><b>Um detalhe do enunciado que vale antecipar.</b> Numa discursiva de aula panorâmica, o professor costuma valorizar a <b>estrutura da resposta</b> mais do que o volume: definir o termo, dar o mecanismo e fechar com um exemplo. Três frases bem ordenadas rendem mais que meia página de rodeio — e ainda sobra tempo para as outras questões.</p>
