<div class="lsec">
  <h3><span class="lnum">0</span>Onde esta aula se encaixa</h3>
  <p class="lead">Se a Aula 01 foi o mapa da astronomia como área, a Aula 02 trata das duas coisas que tornam esse mapa utilizável: escala e tempo. Ela responde o que fica pendente depois de qualquer panorama — como alguém consegue medir tudo isso, e como saber se a medida merece confiança.</p>
  <p>O roteiro tem cinco blocos que formam uma progressão. Primeiro o professor mostra a <b>vastidão</b>, em espaço e em tempo. Depois, como a humanidade aprendeu a <b>marcar o tempo</b>, do dia ao ano, e os calendários que tentam reconciliar ciclos que não fecham. Em seguida, como os gregos conseguiram <b>medir o céu</b> com geometria e paciência, séculos antes de qualquer instrumento óptico. E fecha com o <b>método</b>: o que separa uma medida científica de uma crença.</p>
  <p>Repare que a aula termina onde a Aula 01 tinha apenas encostado — no critério que distingue ciência de pseudociência. O professor deixa isso para o fim de propósito, depois de você ter visto exemplos concretos de gente medindo o Universo com sombra, ângulo e régua.</p>
</div>

<div class="lsec">
  <h3><span class="lnum">1</span>Noções de escala: o problema não é o número, é a imaginação</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>A Astronomia trabalha com escalas espaço-temporais que desafiam a imaginação, por serem muito distantes da experiência cotidiana.</li>
    <li>As escalas no Universo são bastante diversas.</li>
  </ul></div>
  <p>Esta é a frase mais importante da aula, e vale levá-la a sério. O problema das escalas astronômicas não é matemático — escrever 10²² não custa nada. O problema é <b>cognitivo</b>: o cérebro humano foi calibrado para distâncias de metros a quilômetros e para durações de segundos a décadas. Fora dessa faixa, ele deixa de distinguir grandezas. Para a intuição, um milhão e um bilhão parecem igualmente "muito", quando um é mil vezes o outro.</p>
  <p>Um exercício que ajuda a sentir a diferença: um milhão de segundos são cerca de <b>onze dias e meio</b>. Um bilhão de segundos são quase <b>32 anos</b>. A mesma palavra na fala corriqueira, três ordens de grandeza de distância. Quando a aula falar em 10²² estrelas, é esse tipo de abismo que está em jogo, repetido várias vezes seguidas.</p>
  <p>Por isso a astronomia adota duas estratégias que atravessam o curso inteiro. A primeira é a <b>notação de potências de dez</b>, que transforma quantidades impensáveis em expoentes comparáveis: em vez de comparar 10.000.000.000.000.000.000.000 com 100.000.000.000, você compara 22 com 11. A segunda é usar <b>razão em vez de valor absoluto</b> — dizer que a Via Láctea tem cerca de 10⁸ vezes o raio do Sistema Solar informa mais do que dar os dois números soltos, porque ancora o desconhecido em algo já construído.</p>
  <div class="fig">
    <div class="figttl">Figura · Um milhão e um bilhão não são parecidos</div>
    <svg viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg">
      <g font-size="11" font-weight="700" fill="var(--text)">
        <text x="0" y="34">mil segundos</text><text x="0" y="76">1 milhão</text><text x="0" y="118">1 bilhão</text><text x="0" y="160">1 trilhão</text></g>
      <g>
        <rect x="150" y="22" width="3" height="18" rx="1.5" fill="#0E8C93"/>
        <rect x="150" y="64" width="18" height="18" rx="3" fill="#0E8C93"/>
        <rect x="150" y="106" width="180" height="18" rx="4" fill="#C2751B"/>
        <rect x="150" y="148" width="540" height="18" rx="4" fill="#B23A2B"/>
      </g>
      <g font-size="10" fill="var(--muted)">
        <text x="162" y="36">17 minutos</text><text x="178" y="78">11 dias e meio</text>
        <text x="340" y="120" font-weight="700" fill="var(--text)">32 anos</text>
        <text x="150" y="140" font-size="9" fill="var(--muted2)">a barra abaixo está comprimida 60 vezes para caber</text></g>
      <text x="690" y="162" font-size="10" font-weight="700" fill="#B23A2B" text-anchor="end">32 mil anos</text>
    </svg>
    <div class="figcap">As três primeiras barras estão na mesma escala. A quarta teve de ser comprimida sessenta vezes — e é exatamente essa impossibilidade de desenhar tudo junto que explica por que a intuição falha.</div>
  </div>
  <div class="why"><span class="t">Por que isso importa</span>A aula inteira é construída sobre essa dificuldade. Os slides seguintes — a escalada de imagens, o cálculo do número de estrelas, o ano cósmico — são todos <b>ferramentas de intuição</b>, tentativas de traduzir número em experiência. Reconhecer isso muda a forma de estudar: não adianta decorar valores sem construir a sensação de proporção.</div>
  <div class="trap"><span class="t">Erro comum</span>Tratar "muito grande" como categoria única. Em questão de ordem de grandeza, a alternativa errada costuma estar só um ou dois expoentes fora — e quem não construiu intuição de escala não percebe a diferença.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">2</span>A escalada: do Sistema Solar ao Universo observável</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Distâncias dentro do Sistema Solar: dezenas de UA, cerca de 8600 vezes o raio do Sol.</li>
    <li>Via Láctea: 50.000 anos-luz, cerca de 10⁸ vezes o raio do Sistema Solar.</li>
    <li>Grupo Local: 1,5 milhão de anos-luz, cerca de 30 vezes o raio da Galáxia.</li>
    <li>Universo visível: 15 bilhões de anos-luz.</li>
  </ul></div>
  <p>Repare na construção: o professor nunca dá um número solto. Cada escala aparece <b>ancorada na anterior</b> — o Sistema Solar em raios solares, a Galáxia em raios do Sistema Solar, o Grupo Local em raios da Galáxia. É exatamente a estratégia da razão descrita no módulo anterior, e é assim que a sequência de imagens dos slides funciona: cada quadro é um recuo de câmera, e o quadro anterior inteiro vira um ponto no novo.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Degrau</th><th>Tamanho típico</th><th>Em relação ao degrau anterior</th></tr></thead>
    <tbody>
      <tr><td>Terra</td><td>Raio de 6.371 km</td><td>—</td></tr>
      <tr><td>Sistema Solar</td><td>Dezenas de UA — Netuno a 30 UA<sup class="ref">16</sup></td><td>~8.600 raios solares</td></tr>
      <tr><td>Vizinhança interestelar</td><td>Dezenas de anos-luz; Proxima Centauri a 4,2 al</td><td>Milhares de vezes o Sistema Solar</td></tr>
      <tr><td>Via Láctea</td><td>~50.000 anos-luz de raio<sup class="ref">2</sup></td><td>~10⁸ vezes o raio do Sistema Solar</td></tr>
      <tr><td>Grupo Local</td><td>Alguns milhões de anos-luz</td><td>Dezenas de vezes a Galáxia</td></tr>
      <tr><td>Superaglomerado de Virgem</td><td>~110 milhões de anos-luz</td><td>Dezenas de vezes o Grupo Local</td></tr>
      <tr><td>Universo observável</td><td>Raio comóvel de ~46,5 bilhões de anos-luz<sup class="ref">3</sup></td><td>Centenas de vezes o superaglomerado</td></tr>
    </tbody></table></div>
  <p><b>Uma sutileza sobre "Universo visível".</b> O slide traz 15 bilhões de anos-luz, número que circula há décadas e vem de um raciocínio direto: se o Universo tem cerca de 14 bilhões de anos, a luz não pode ter viajado mais do que isso. O raciocínio seria perfeito num espaço estático — mas o espaço <b>esticou</b> enquanto a luz vinha. Levando a expansão em conta, o objeto cuja luz partiu há 13,8 bilhões de anos está <b>hoje</b> a cerca de 46,5 bilhões de anos-luz<sup class="ref">3</sup>. Os dois números respondem perguntas diferentes: 13,8 é tempo de viagem da luz; 46,5 é distância atual. Vale saber os dois e perceber qual está sendo pedido.</p>
  <div class="fig">

  </div>
  <p><b>Uma pergunta que o slide não faz, mas que é inevitável: como se mede cada degrau?</b> Não existe uma régua única que sirva do Sistema Solar ao Universo observável. O que existe é uma sequência de métodos, cada um calibrado pelo anterior — a chamada <b>escada de distâncias cósmicas</b>. É um dos conceitos mais importantes da astronomia observacional, e vale conhecer desde já.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Degrau</th><th>Método</th><th>Alcance</th><th>Como é calibrado</th></tr></thead>
    <tbody>
      <tr><td>Sistema Solar</td><td><b>Radar</b>: envia-se um pulso a Vênus e cronometra-se o eco</td><td>Até alguns bilhões de km</td><td>Pela velocidade da luz, que é conhecida com precisão</td></tr>
      <tr><td>Estrelas próximas</td><td><b>Paralaxe</b>: o deslocamento aparente ao longo do ano</td><td>Milhares de parsecs, com o satélite Gaia</td><td>Pela UA, obtida do degrau anterior</td></tr>
      <tr><td>Galáxias próximas</td><td><b>Cefeidas</b>: estrelas pulsantes cujo período revela a luminosidade real</td><td>Dezenas de milhões de anos-luz</td><td>Por cefeidas próximas, medidas por paralaxe</td></tr>
      <tr><td>Galáxias distantes</td><td><b>Supernovas tipo Ia</b>: explodem sempre com brilho quase idêntico</td><td>Bilhões de anos-luz</td><td>Por supernovas em galáxias que também têm cefeidas</td></tr>
      <tr><td>Escala cosmológica</td><td><b>Desvio para o vermelho</b> e a lei de Hubble</td><td>Todo o Universo observável</td><td>Pelas supernovas do degrau anterior</td></tr>
    </tbody></table></div>
  <p>Repare na estrutura: cada método só funciona porque foi <b>calibrado pelo anterior</b>. É literalmente uma escada — e isso tem uma consequência séria, que a Aula 02 já preparou ao falar de incerteza. Se o degrau da paralaxe tiver um erro sistemático, esse erro se propaga para todos os degraus acima. Foi exatamente por isso que a idade estimada do Universo mudou tanto ao longo do século XX: a constante de Hubble depende de toda a cadeia, e cada recalibração de um degrau movia o resultado final.</p>
  <p>O primeiro degrau, aliás, conecta esta aula com a próxima: a paralaxe é o mesmo princípio que <b>Hiparco</b> usou com duas cidades para medir a distância da Lua, no módulo 15 desta mesma aula. Muda a linha de base — de centenas de quilômetros entre cidades para 300 milhões de quilômetros entre dois pontos da órbita terrestre —, mas a geometria é idêntica.</p>
  <div class="why"><span class="t">Por que isso importa</span>Esta hierarquia é a mesma escada de escalas da Aula 01, agora com números. É provável que uma questão peça para ordenar os degraus ou associar cada um à sua ordem de grandeza — é o jeito mais direto de cobrar "noção de escala".</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir <b>raio</b> com <b>diâmetro</b> nas dimensões da Galáxia. O slide fala em 50.000 anos-luz; a literatura costuma citar ~100.000 de diâmetro<sup class="ref">2</sup>. Os dois estão certos, são medidas diferentes da mesma coisa. Leia se o enunciado pede raio ou diâmetro.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">3</span>Quantas estrelas existem?</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>~100 bilhões de galáxias, cada uma com ~100 bilhões de estrelas.</li>
    <li>10¹¹ × 10¹¹ = 10²² estrelas.</li>
    <li>10.000.000.000.000.000.000.000 — dez sextilhões de estrelas.</li>
  </ul></div>
  <p>Este slide é um exemplo perfeito de <b>estimativa de ordem de grandeza</b>, o raciocínio que a física chama de estimativa de Fermi. Ninguém contou estrela por estrela. O que se faz é tomar duas quantidades razoavelmente conhecidas, multiplicar, e aceitar o resultado como ordem de grandeza — não como número exato. Repare que a conta é trivial: ao multiplicar potências de dez, basta somar os expoentes. 10¹¹ × 10¹¹ = 10²².</p>
  <p>Para dar dimensão ao resultado: estima-se que existam entre 10¹⁸ e 10¹⁹ grãos de areia em todas as praias e desertos da Terra. Ou seja, há <b>mais estrelas no Universo observável do que grãos de areia no planeta inteiro</b>, por um fator de mil ou mais. É essa comparação que o slide quer provocar.</p>
  <div class="numgrid">
    <div><b>10¹¹</b><span>galáxias, na estimativa clássica</span></div>
    <div><b>10¹¹</b><span>estrelas por galáxia, em média</span></div>
    <div><b>10²²</b><span>estrelas no total</span></div>
    <div><b>10¹⁸</b><span>grãos de areia na Terra, para comparar</span></div>
  </div>
  <div class="callout plus"><b>O número de galáxias está em disputa ativa.</b> A estimativa de 100 a 120 bilhões vem do Hubble Deep Field, dos anos 1990. Em 2016, um trabalho liderado por Christopher Conselice, em Nottingham, argumentou que o total seria de pelo menos <b>2 trilhões</b>, dez vezes mais, ao contabilizar galáxias fracas demais para serem detectadas<sup class="ref">4</sup>. Depois, em 2021, medidas do brilho de fundo feitas pela sonda New Horizons — longe da poeira que ilumina o céu perto da Terra — apontaram para um total mais próximo de <b>centenas de bilhões</b><sup class="ref">5</sup>. A conclusão honesta: o expoente fica entre 11 e 12, e a conta do slide segue válida como ordem de grandeza. É um bom exemplo de ciência viva, com números em revisão.</div>
  <div class="why"><span class="t">Por que isso importa</span>Estimativa de ordem de grandeza é ferramenta de trabalho, não curiosidade. Em Física você vai fazer isso o tempo todo: multiplicar duas aproximações para descobrir se algo é plausível. Aceitar um resultado "certo dentro de um fator de dez" faz parte da formação.</div>
  <div class="trap"><span class="t">Erro comum</span>Somar as quantidades em vez de multiplicá-las. Ao <b>multiplicar</b> potências de dez, os <b>expoentes se somam</b>: 10¹¹ × 10¹¹ = 10²². Somar as quantidades daria 2 × 10¹¹, que é onze ordens de grandeza menor.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">E</span>A ferramenta: potências de dez e notação científica</h3>
  <p class="lead">Módulo de ferramenta. O professor usa potências de dez o tempo todo nesta aula, e vai usar em todas as seguintes. Vale parar cinco minutos e deixar isso automático — em Física você usará isso na primeira semana.</p>
  <p>Escrever <b>10.000.000.000.000.000.000.000</b> é inviável. Em notação científica isso vira <b>10²²</b>, e a leitura fica imediata: o expoente conta quantas casas o número tem depois do 1. A forma geral é um número entre 1 e 10 multiplicado por uma potência de dez — 384.400 km vira 3,844 × 10⁵ km, e 0,0000001 m vira 1 × 10⁻⁷ m.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Operação</th><th>Regra</th><th>Exemplo desta aula</th></tr></thead>
    <tbody>
      <tr><td>Multiplicar</td><td>Somam-se os expoentes</td><td>10¹¹ × 10¹¹ = 10²² estrelas</td></tr>
      <tr><td>Dividir</td><td>Subtraem-se os expoentes</td><td>10²² ÷ 10¹⁸ = 10⁴ — há 10 mil vezes mais estrelas que grãos de areia</td></tr>
      <tr><td>Elevar a uma potência</td><td>Multiplicam-se os expoentes</td><td>(10³)² = 10⁶</td></tr>
      <tr><td>Somar</td><td>Só é possível com o mesmo expoente</td><td>3 × 10⁵ + 2 × 10⁵ = 5 × 10⁵</td></tr>
    </tbody></table></div>
  <p><b>Ordem de grandeza</b> é a potência de dez mais próxima de um valor. A ordem de grandeza de 384.400 é 10⁵; a de 700.000 já é 10⁶, porque está mais perto de um milhão do que de cem mil. Comparar ordens de grandeza é comparar expoentes — e essa é a operação mental que a aula inteira pede.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Prefixo</th><th>Símbolo</th><th>Potência</th><th>Onde aparece</th></tr></thead>
    <tbody>
      <tr><td>quilo</td><td>k</td><td>10³</td><td>quilômetro; 1 kpc = mil parsecs</td></tr>
      <tr><td>mega</td><td>M</td><td>10⁶</td><td>megaparsec, unidade de distância entre galáxias</td></tr>
      <tr><td>giga</td><td>G</td><td>10⁹</td><td>Ga = bilhão de anos, usado em geologia</td></tr>
      <tr><td>tera</td><td>T</td><td>10¹²</td><td>escalas de dados e de energia</td></tr>
      <tr><td>mili / micro / nano</td><td>m / µ / n</td><td>10⁻³ / 10⁻⁶ / 10⁻⁹</td><td>comprimentos de onda: a luz visível vive na faixa de centenas de nanômetros</td></tr>
    </tbody></table></div>
  <div class="why"><span class="t">Por que isso importa</span>É a diferença entre travar e resolver numa questão de ordem de grandeza. E é a linguagem em que todas as tabelas deste painel estão escritas — dominar isso reduz o esforço de todas as aulas seguintes.</div>
  <div class="trap"><span class="t">Erro comum</span>Somar expoentes ao <b>somar</b> quantidades. Só na multiplicação os expoentes se somam. E cuidado com expoente negativo: 10⁻³ é um milésimo, não menos mil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">4</span>O Ano Cósmico</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Origem da Terra: 31 de agosto.</li>
    <li>Cambriano: 16 de dezembro.</li>
    <li>Hominídeos: 31 de dezembro, 23h21.</li>
    <li>Civilização: 31 de dezembro, 23h59m23s.</li>
    <li>Era Espacial: 31 de dezembro, 23h59m59,8s.</li>
  </ul></div>
  <p>O Ano Cósmico — popularizado por Carl Sagan — comprime os 13,8 bilhões de anos de história do Universo em um único ano de calendário. Cada <b>segundo</b> desse ano equivale a cerca de 440 anos reais; cada <b>dia</b>, a cerca de 38 milhões de anos. É provavelmente a melhor ferramenta já inventada para tornar o tempo profundo compreensível.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Data no ano cósmico</th><th>Evento</th><th>Tempo real aproximado</th></tr></thead>
    <tbody>
      <tr><td>1º de janeiro</td><td>Big Bang</td><td>13,8 bilhões de anos atrás</td></tr>
      <tr><td>31 de agosto</td><td>Origem da Terra</td><td>4,5 bilhões de anos atrás</td></tr>
      <tr><td>16 de dezembro</td><td>Cambriano — explosão de vida complexa</td><td>~540 milhões de anos atrás</td></tr>
      <tr><td>31 de dezembro, 23h21</td><td>Primeiros hominídeos</td><td>~7 milhões de anos atrás</td></tr>
      <tr><td>31 de dezembro, 23h59m23s</td><td>Início da civilização</td><td>~10 mil anos atrás</td></tr>
      <tr><td>31 de dezembro, 23h59m59,8s</td><td>Era Espacial</td><td>~70 anos atrás</td></tr>
    </tbody></table></div>
  <p>Os números falam por si, mas vale explicitar. A Terra só aparece quando <b>dois terços</b> do ano já passaram. Toda a vida complexa — do primeiro trilobita até você — cabe nas duas últimas semanas. A civilização inteira, da agricultura à internet, ocupa os <b>últimos 37 segundos</b>. E tudo que a humanidade fez fora da atmosfera cabe nos <b>últimos dois décimos de segundo</b>, um piscar antes da meia-noite.</p>
  <p>Há uma leitura que costuma passar despercebida: se a Terra se formou em 31 de agosto e a vida complexa só em 16 de dezembro, então a maior parte da história do nosso planeta transcorreu com vida <b>microscópica e nada mais</b>. Foram bilhões de anos de bactérias. Isso tem consequência direta para as Ciências da Terra: o registro geológico é, na maior parte de sua extensão, um registro sem fósseis visíveis a olho nu.</p>
  <p><b>Como fazer a conta você mesmo.</b> A regra de três é direta: divida o tempo real desde o evento pela idade do Universo, multiplique por 365 dias, e conte a partir de 1º de janeiro. Um exemplo que vale treinar, porque é candidato a questão: a extinção dos dinossauros, há 66 milhões de anos. Como cada dia cósmico vale ~38 milhões de anos, 66 milhões correspondem a menos de dois dias — ou seja, os dinossauros desapareceram por volta de <b>30 de dezembro</b>. Toda a era dos mamíferos, incluindo nós, cabe no último dia e meio do ano.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Equivalência</th><th>Vale</th></tr></thead>
    <tbody>
      <tr><td>1 segundo cósmico</td><td>~440 anos</td></tr>
      <tr><td>1 minuto cósmico</td><td>~26 mil anos</td></tr>
      <tr><td>1 hora cósmica</td><td>~1,6 milhão de anos</td></tr>
      <tr><td>1 dia cósmico</td><td>~38 milhões de anos</td></tr>
      <tr><td>1 mês cósmico</td><td>~1,15 bilhão de anos</td></tr>
    </tbody></table></div>
  <p><b>Uma comparação que ajuda a fixar a proporção.</b> Se a história do Universo fosse a distância de um braço estendido, do ombro à ponta do dedo, toda a existência humana caberia na espessura de uma unha — e uma única passada de lixa apagaria a civilização inteira. A imagem é antiga e circula em livros de divulgação, mas funciona porque troca tempo por espaço, que é a dimensão em que a intuição funciona melhor.</p>
  <p><b>O que o Ano Cósmico revela sobre a Terra.</b> Vale insistir num ponto que a tabela esconde: entre 31 de agosto e 16 de dezembro — <b>três meses e meio cósmicos</b>, ou cerca de 3,5 bilhões de anos reais — a vida na Terra existiu, mas foi quase toda microscópica. Isso significa que, se um visitante tivesse pousado aqui num instante aleatório da história do planeta, o mais provável é que encontrasse apenas colônias de bactérias. Complexidade é fenômeno recente e, até onde sabemos, raro.</p>
  <div class="why"><span class="t">Por que isso importa</span>O tempo profundo é o conceito que unifica as duas metades do seu curso. Sem ele não faz sentido falar em evolução estelar, tectônica de placas ou datação radiométrica. E é contraintuitivo o bastante para render discursiva.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que o Ano Cósmico é uma escala "natural". Ele é uma <b>proporção</b>: cada intervalo real foi dividido pela idade do Universo e multiplicado por um ano. Se a prova pedir para localizar outro evento, é essa regra de três que se aplica.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">5</span>Dia, mês e ano: as unidades que o céu impôs</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>A unidade de tempo mais óbvia para os antigos era o dia. DIES (lat.) 'dia' &lt; *dejo- (ind.eur.) 'brilho, dia, Sol, Deus'.</li>
    <li>Note a semelhança numa língua de outra parte do mundo: 'ARA (tupi) 'brilho, dia, verão, Sol, Universo'.</li>
    <li>Para unidades mais longas, próprias a viagens e grandes jornadas, usou-se o período lunar: o mês. MENSIS (lat.) &lt; *mēnōt (ind.eur.) 'Lua'.</li>
    <li>O ano tinha importância para a agricultura e para o cômputo de eventos religiosos e políticos. ANNUS (lat.) &lt; *āno- (ind.eur.) 'anel'.</li>
  </ul></div>
  <p>Este é um dos slides mais bonitos da aula, e é fácil passar batido por ele. O professor está mostrando que as unidades de tempo <b>não foram inventadas</b> — foram <b>observadas</b>. Não existe escolha humana em quanto dura um dia: ele é o período de rotação da Terra. O mês vem do ciclo de fases da Lua; o ano, da translação. Toda a nossa contagem de tempo é, na origem, astronomia aplicada.</p>
  <p>A etimologia comprova isso de um jeito elegante. <b>Dies</b>, dia em latim, vem de uma raiz indo-europeia que significava ao mesmo tempo brilho, dia, Sol e divindade — a mesma raiz de <i>Deus</i> e de <i>Zeus</i>. <b>Mensis</b>, mês, vem da raiz de Lua, e é prima de palavras como <i>menstrual</i> e do inglês <i>moon</i> e <i>month</i>. E <b>annus</b> vem de uma raiz que significava <b>anel</b> — o ano como ciclo que se fecha e recomeça, o que aliás sobrevive em <i>anel</i> e <i>anular</i>.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Unidade</th><th>Fenômeno astronômico</th><th>Origem da palavra</th><th>Duração real</th></tr></thead>
    <tbody>
      <tr><td>Dia</td><td>Rotação da Terra sobre o próprio eixo</td><td><i>dies</i> &lt; *dejo- : brilho, Sol, divindade</td><td>24 h solares médias; 23h56m sideral</td></tr>
      <tr><td>Mês</td><td>Ciclo de fases da Lua</td><td><i>mensis</i> &lt; *mēnōt : Lua</td><td>29,5 dias sinódicos</td></tr>
      <tr><td>Ano</td><td>Translação da Terra em torno do Sol</td><td><i>annus</i> &lt; *āno- : anel, ciclo</td><td>365,2422 dias</td></tr>
    </tbody></table></div>

        <text y="68" font-size="9.5" fill="var(--muted)" text-anchor="middle">*āno- : anel</text>
        <text y="84" font-size="9.5" font-weight="700" fill="#0E8C93" text-anchor="middle">translação</text>
        <text y="104" font-size="9" fill="var(--muted2)" text-anchor="middle">parentes: anel, anular</text>
      </g>
      <rect x="60" y="164" width="580" height="30" rx="8" fill="var(--surface3)"/>
      <text x="350" y="184" font-size="10.5" font-weight="700" fill="var(--text)" text-anchor="middle">tupi 'ARA — brilho, dia, verão, Sol, Universo · sem parentesco, mesma associação</text>
    </svg>
    <div class="figcap">As três unidades de tempo não foram inventadas: foram <b>observadas</b>. E a palavra guardou o fenômeno que a originou — o que só se percebe ao abrir a etimologia.</div>
  </div>
  <p><b>O detalhe do tupi merece atenção.</b> O professor destaca que <b>'ara</b>, em tupi, reúne o mesmo feixe de significados — brilho, dia, verão, Sol, Universo — em uma língua sem qualquer parentesco com o indo-europeu, do outro lado do mundo. Isso não é coincidência linguística: é convergência conceitual. Povos que nunca se encontraram chegaram à mesma associação porque estavam olhando para o mesmo céu e resolvendo o mesmo problema. Vale como argumento de que a astronomia é, de fato, um saber universal — e é um belo achado para citar numa discursiva sobre o papel civilizatório da astronomia.</p>
  <div class="why"><span class="t">Por que isso importa</span>Amarra a Aula 02 na Aula 01. Lá o slide dizia que a astronomia serve para "medição do tempo"; aqui se vê que ela não apenas serve — ela <b>é</b> a origem das unidades. E prepara o terreno para o problema central dos calendários: essas três unidades naturais não são múltiplas umas das outras.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que dia, mês e ano foram convenções arbitrárias. A convenção está na <b>divisão</b> — 24 horas, 60 minutos, 7 dias na semana são escolhas culturais, herdadas dos babilônios e do sistema sexagesimal. As três unidades-base, não.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">6</span>Sacerdotes e cientistas: quem detinha o céu detinha poder</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Os responsáveis pela observação sistemática do céu eram sacerdotes.</li>
    <li>O céu e o movimento dos astros precisavam ser computados e interpretados, porque a vida social dependia disso. Era preciso saber em que época plantar, quando viriam as fortes chuvas.</li>
    <li>Contar dias era fácil, mas medir unidades longas, como o ano, exigia observar continuamente as modificações do céu em função do movimento do Sol.</li>
  </ul></div>
  <p>Aqui o professor faz uma observação sociológica importante: por milhares de anos, <b>observar o céu era função religiosa</b>, não científica. E havia uma lógica material nisso. Quem sabia prever a cheia do rio, a estação de plantio ou o retorno das chuvas detinha uma informação da qual dependia a sobrevivência coletiva. Esse saber concentrava poder — e o poder se organizava em torno do templo.</p>
  <p>Repare no contraste que o slide monta: <b>contar dias era fácil</b>; medir o ano, não. Um dia se conta olhando o Sol nascer. Mas o ano não tem marca óbvia — nada acontece no céu que diga "acabou o ano". Foi preciso desenvolver técnicas: acompanhar o ponto do horizonte onde o Sol nasce, que se desloca ao longo do ano e volta; medir a sombra de uma vara ao meio-dia, que atinge um mínimo e um máximo; observar quais estrelas aparecem no horizonte ao amanhecer. Isso exige <b>registro sistemático por muitos anos</b> — e por isso instituições, não indivíduos.</p>

    <div class="figcap">É esta a razão material de a astronomia nascer dentro de instituições: um indivíduo não vive o suficiente para calibrar sozinho um calendário.</div>
  </div>
  <p>É por essa razão que a astronomia nasce ligada a Estados e templos organizados: só uma instituição atravessa gerações. As tábuas babilônicas cobrem séculos de observações; os sacerdotes egípcios acompanhavam o nascer helíaco de Sirius, que antecedia a cheia do Nilo. Essa continuidade institucional é o que transforma observação isolada em <b>dado</b>.</p>
  <div class="why"><span class="t">Por que isso importa</span>É a resposta profunda para "por que a astronomia é milenar". Não é curiosidade estética: é que a agricultura, e portanto a civilização, dependia dela. E o modelo se repete até hoje em escala diferente — o Observatório Nacional foi criado em 1827 para dar hora oficial e apoiar a navegação, não para satisfazer curiosidade.</div>
  <div class="trap"><span class="t">Erro comum</span>Ler "sacerdotes" como sinônimo de superstição. Eles faziam <b>registro sistemático e previsão verificável</b> — a parte empírica era genuína. O que faltava era a busca por explicação física, que os gregos introduziriam depois. Essa distinção volta no módulo do método científico.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">7</span>Quando o céu quebra a regra: eclipses, cometas e novas</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>O papel dos sacerdotes observadores era ainda mais necessário quando algo inesperado quebrava a regularidade do céu.</li>
    <li>Eclipses, cometas, meteoros, novas e supernovas não seguiam nenhum período óbvio. Sua aparição súbita em meio a um céu misterioso e regular era motivo de apreensão e desespero.</li>
    <li>O evento precisava ser interpretado, pois poderia significar algo, antecipar eventos inesperados também na Terra.</li>
  </ul></div>
  <p>O ponto aqui é o <b>contraste</b>. O céu é, acima de tudo, previsível: o Sol nasce todo dia, as fases da Lua se repetem, as estrelas voltam nas mesmas datas. Essa regularidade é justamente o que o tornava útil como calendário e relógio. Quando algo rompia esse padrão, o abalo era grande — porque colocava em xeque a única coisa realmente confiável que se conhecia.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Fenômeno</th><th>O que é, fisicamente</th><th>Por que assustava</th></tr></thead>
    <tbody>
      <tr><td>Eclipse solar</td><td>A Lua se interpõe entre a Terra e o Sol</td><td>O Sol, fonte da vida, some em pleno dia. É o evento mais dramático do céu</td></tr>
      <tr><td>Eclipse lunar</td><td>A Lua entra no cone de sombra da Terra</td><td>A Lua avermelha, o que muitas culturas leram como sangue</td></tr>
      <tr><td>Cometa</td><td>Corpo de gelo que desenvolve coma e cauda ao se aproximar do Sol</td><td>Aparece do nada, cresce por semanas e some. Não respeita as constelações</td></tr>
      <tr><td>Meteoro</td><td>Partícula que se incandesce ao entrar na atmosfera</td><td>Instantâneo e imprevisível; associado a presságios pessoais</td></tr>
      <tr><td>Nova e supernova</td><td>Explosão que aumenta brutalmente o brilho de uma estrela</td><td>Uma estrela <b>nova</b> aparece onde não havia nada, e depois some. Rompe a ideia de céu imutável</td></tr>
    </tbody></table></div>
  <p>Vale registrar duas supernovas históricas que aparecem em qualquer curso de astronomia. A de <b>1054</b> foi registrada por astrônomos chineses e árabes: ficou visível de dia por semanas, e hoje sabemos que seus restos formam a Nebulosa do Caranguejo. A de <b>1572</b>, observada por Tycho Brahe, teve consequência filosófica enorme: como o objeto novo não mostrava paralaxe, tinha de estar além da Lua — e isso demolia a doutrina aristotélica de que os céus, acima da esfera lunar, eram <b>imutáveis</b>. Um dado observacional derrubou dois mil anos de metafísica.</p>
  <p><b>E, no entanto, eclipses são previsíveis.</b> Aqui está a virada mais interessante do módulo. O slide os coloca entre os fenômenos "sem período óbvio" — e essa é exatamente a percepção de quem observa por poucos anos. Mas os babilônios, com séculos de registros acumulados, descobriram algo notável: eclipses se repetem num ciclo de <b>18 anos, 11 dias e 8 horas</b>, chamado <b>Saros</b>. Passado um Saros, a configuração Sol-Terra-Lua se repete quase exatamente, e um eclipse muito parecido volta a acontecer.</p>
  <p>O ciclo existe porque três períodos lunares diferentes quase se encaixam: 223 meses sinódicos (de fase) equivalem a quase 242 meses draconíticos (de passagem pelos nodos) e a quase 239 meses anomalísticos (de variação de distância). Esse "quase" é o suficiente para prever. As oito horas extras têm um efeito curioso: como a Terra girou um terço de volta nesse intervalo, o eclipse seguinte da série é visível cerca de 120° de longitude a oeste.</p>
  <p>Isso reforça um argumento que atravessa a aula: o que parece caótico com pouca observação vira <b>regular com registro suficiente</b>. Um sacerdote que dispusesse das tábuas de gerações anteriores podia anunciar um eclipse — e o poder político disso é evidente. É também o embrião do método científico: encontrar padrão onde parecia haver capricho.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este módulo é a ponte para o fim da aula. É aqui que aparece a origem histórica da astrologia: eventos inesperados <b>precisavam significar algo</b>. A astronomia surge quando se troca a pergunta "o que isso anuncia?" por "o que isso é?".</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir <b>meteoro</b> (o risco de luz na atmosfera), <b>meteoroide</b> (o corpo no espaço) e <b>meteorito</b> (o fragmento que chega ao solo). E "nova" não significa estrela recém-nascida: é uma estrela antiga que teve um surto de brilho.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">8</span>Stonehenge e os alinhamentos: a astronomia em pedra</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Alinhamentos de Stonehenge.</li>
  </ul></div>
  <p>O slide traz só imagens, mas o assunto merece desenvolvimento, porque é a prova material de tudo que os dois módulos anteriores afirmaram. Stonehenge, no sul da Inglaterra, foi erguido em etapas ao longo de cerca de 1.500 anos, a partir de aproximadamente 3000 a.C.<sup class="ref">8</sup> — ou seja, é anterior às pirâmides de Gizé em sua fase inicial, e foi construído por uma sociedade sem escrita.</p>
  <p>O alinhamento mais famoso é o do <b>eixo principal</b>: olhando do centro do monumento em direção à Heel Stone, vê-se o Sol nascer exatamente sobre ela no <b>solstício de verão</b>. Na direção oposta, alinha-se com o pôr do Sol no <b>solstício de inverno</b> — e há bons argumentos de que este era o alinhamento principal, já que o solstício de inverno marca a virada do ano agrícola. Construir isso exige duas coisas: saber onde o Sol nasce em cada época, o que requer <b>anos de observação</b>, e mobilizar trabalho coletivo para mover blocos de dezenas de toneladas.</p>
  <p>Stonehenge não é caso isolado. O mesmo padrão aparece em culturas sem contato entre si: <b>Newgrange</b>, na Irlanda, tem uma abertura que ilumina a câmara interna apenas no solstício de inverno; <b>Chichén Itzá</b>, no México maia, projeta uma sombra em forma de serpente na escadaria nos equinócios; e o <b>Parque Nacional de Sete Cidades</b> e sítios megalíticos como o <b>Rego Grande</b>, no Amapá — apelidado de "Stonehenge brasileiro" — mostram alinhamentos solsticiais em contexto indígena amazônico. A recorrência reforça o argumento do módulo 5: povos distintos, mesmo céu, mesmas soluções.</p>

    <div class="figttl">Figura · O princípio de um alinhamento solsticial</div>

    <div class="figcap">O ponto do horizonte onde o Sol nasce vai e volta ao longo do ano, entre dois extremos que são os solstícios. Marcar esses extremos com pedras transforma o monumento num calendário permanente — e é por isso que a construção exige observação acumulada por gerações.</div>
  </div>
  <div class="why"><span class="t">Por que isso importa</span>Stonehenge é o argumento arqueológico de que a astronomia antecede a escrita. Se cair uma discursiva sobre a antiguidade da astronomia, é o exemplo mais forte disponível — e a área que estuda isso tem nome: <b>arqueoastronomia</b>.</div>
  <div class="trap"><span class="t">Erro comum</span>Descrever Stonehenge como "observatório" no sentido moderno. Ele não servia para investigar a natureza dos astros, e sim para <b>marcar datas</b>. É calendário monumental, com função ritual e agrícola.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">9</span>O calendário romano e a herança dos nomes</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>A palavra calendário tem origem romana, da mesma forma que o nosso, baseado num desenvolvido pelos romanos cerca de 200 a.C.</li>
    <li>Provavelmente começava no primeiro dia da primavera (equinócio vernal), e talvez tivesse somente 10 meses.</li>
    <li>Se o ano começasse em março, setembro, outubro, novembro e dezembro seriam o sétimo, oitavo, nono e décimo meses.</li>
    <li>Este calendário não tinha o número certo de dias e meses para acordo com fenômenos astronômicos, tendo bastante uso político.</li>
  </ul></div>
  <p>A palavra <b>calendário</b> vem de <i>calendae</i>, o nome romano do primeiro dia de cada mês — dia em que se anunciavam publicamente as dívidas e se faziam os pagamentos. A raiz é o verbo <i>calare</i>, "proclamar", porque um sacerdote anunciava em voz alta o início do mês ao avistar a Lua nova. Ou seja: até a palavra guarda a origem astronômica e sacerdotal descrita nos módulos anteriores.</p>
  <p>O detalhe dos nomes dos meses é a evidência que sobreviveu. Se o ano romano começava em <b>março</b>, então a contagem fecha perfeitamente:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Mês</th><th>Posição se o ano começa em março</th><th>Origem do nome</th></tr></thead>
    <tbody>
      <tr><td>Março</td><td>1º</td><td>Marte, deus da guerra — início da temporada de campanhas</td></tr>
      <tr><td>Abril, maio, junho</td><td>2º a 4º</td><td>Origens disputadas: Vênus, Maia e Juno estão entre as hipóteses</td></tr>
      <tr><td>Julho</td><td>5º originalmente (<i>Quintilis</i>)</td><td>Renomeado em homenagem a Júlio César</td></tr>
      <tr><td>Agosto</td><td>6º originalmente (<i>Sextilis</i>)</td><td>Renomeado em homenagem a Augusto</td></tr>
      <tr><td><b>Setembro</b></td><td><b>7º</b></td><td><i>septem</i> = sete</td></tr>
      <tr><td><b>Outubro</b></td><td><b>8º</b></td><td><i>octo</i> = oito</td></tr>
      <tr><td><b>Novembro</b></td><td><b>9º</b></td><td><i>novem</i> = nove</td></tr>
      <tr><td><b>Dezembro</b></td><td><b>10º</b></td><td><i>decem</i> = dez</td></tr>
    </tbody></table></div>
  <p>Os quatro últimos são a prova viva: chamamos de "décimo mês" o nosso décimo <b>segundo</b> mês porque o calendário mudou de início e os nomes ficaram. É um fóssil linguístico dentro de um objeto que usamos todo dia.</p>
  <p><b>E o uso político.</b> O professor menciona que o calendário romano "tinha bastante uso político", e isso merece explicação. No sistema pré-juliano, cabia aos pontífices decidir quando inserir um mês extra para corrigir a defasagem. Como mandatos de magistrados e prazos de contratos e tributos eram contados em meses, decidir esticar ou encurtar o ano virou instrumento de poder: prolongava-se o ano de um aliado no cargo, encurtava-se o de um adversário. Quando Júlio César assumiu a reforma, o calendário estava dessincronizado das estações em cerca de três meses.</p>
  <div class="why"><span class="t">Por que isso importa</span>Mostra que calendário não é assunto puramente técnico — é infraestrutura social. E prepara o próximo módulo: a reforma juliana só aconteceu porque a bagunça tinha virado problema de governo.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que setembro sempre foi o nono mês e que os nomes são arbitrários. É o oposto: os nomes estão certos, o <b>início do ano</b> é que mudou.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">10</span>O calendário juliano</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Em 46 a.C. Júlio César pediu ao astrônomo Sosígenes que desenvolvesse um calendário em melhor acordo com eventos astronômicos.</li>
    <li>Foi criado o Calendário Juliano, com 12 meses alternando entre 30 e 31 dias (à exceção de janeiro).</li>
    <li>O sétimo mês passou a chamar-se julho, em homenagem a Julius Caesar. Seu sucessor, Augustus Caesar, mudou o oitavo para agosto, que passou a ter 31 dias, e os meses subsequentes passaram a alternar.</li>
    <li>Por causa disso, fevereiro passou a ter 28 dias.</li>
  </ul></div>
  <p>A reforma de <b>46 a.C.</b> é o primeiro caso documentado de política pública baseada em assessoria astronômica. César convocou <b>Sosígenes de Alexandria</b> — a grafia do slide traz "Sisógenes" — e o encarregou de produzir um calendário ancorado no ano solar, não nas conveniências dos pontífices. A solução foi abandonar o ciclo lunar como base e adotar <b>365 dias com um dia extra a cada quatro anos</b>, produzindo um ano médio de 365,25 dias.</p>
  <p>Para colocar o novo sistema em fase com as estações, o ano de 46 a.C. precisou de <b>445 dias</b> — ficou conhecido como "o ano da confusão". É o preço de qualquer reforma de calendário: em algum momento é preciso engolir um ajuste bruto de uma vez.</p>
  <p>A história dos comprimentos dos meses, contada no slide, explica a irregularidade que sobrevive até hoje. O desenho original alternava 31 e 30 dias. Quando <i>Quintilis</i> virou <b>julho</b>, em homenagem a César, e depois <i>Sextilis</i> virou <b>agosto</b>, em homenagem a Augusto, teria parecido diminuição de status que o mês de Augusto tivesse 30 dias enquanto o de César tinha 31. Agosto ganhou um dia — tirado de fevereiro, que já era o mês de ajuste — e a alternância dos meses seguintes foi reorganizada para não gerar três meses seguidos de 31 dias. É por isso que julho e agosto têm 31 dias em sequência, e que fevereiro ficou com 28.</p>
  <div class="callout plus"><b>Contexto histórico.</b> Alguns historiadores contestam a versão de que Augusto tenha reorganizado os comprimentos, atribuindo o arranjo a ajustes anteriores. O que é consensual: os nomes de julho e agosto homenageiam César e Augusto, e fevereiro é o mês curto por ser, desde o calendário romano antigo, o mês onde se fazia o ajuste. Como o slide adota a versão clássica, é ela que vale para a prova — mas saber que há discussão é útil.</div>
  <div class="why"><span class="t">Por que isso importa</span>O juliano é a base do nosso calendário, e entender sua lógica — ano médio de 365,25 dias — é pré-requisito para entender por que a reforma gregoriana foi necessária. Um decorre do outro.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que o calendário juliano "não tinha bissexto". Tinha, e é justamente essa a inovação: um dia extra a cada quatro anos. O erro dele foi <b>excesso</b> de correção, não ausência.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">11</span>A reforma gregoriana e os dez dias que sumiram</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Os egípcios sabiam que o ano não durava 365 dias, mas aproximadamente 365 dias e 6 horas.</li>
    <li>Para melhor acordo, os romanos passaram a acrescentar um dia a cada quatro anos, no mês de fevereiro.</li>
    <li>Como a correção não é exata — são 5 horas, 48 minutos e 46 segundos, em vez de 6 h — temos outro problema.</li>
    <li>Estabeleceu-se que séculos não divisíveis por 400 não são bissextos. 2000 foi bissexto, 1900 não.</li>
    <li>A modificação veio em 1582, com o Papa Gregório XIII. O novo calendário levou à perda de 10 dias em 1582, entre 4 e 15 de outubro. Problemas, como aluguéis.</li>
  </ul></div>
  <p>Toda a matemática dos calendários cabe numa frase: o ano trópico dura <b>365 dias, 5 horas, 48 minutos e 46 segundos</b>, e nenhum número inteiro de dias dá conta disso. O juliano arredondou para 365,25 e, portanto, <b>sobrestimou</b> o ano em 11 minutos e 14 segundos. Parece nada. Mas 11 minutos por ano viram um dia a cada 128 anos, e cerca de <b>dez dias</b> ao longo dos catorze séculos entre o Concílio de Niceia, em 325, e o século XVI.</p>
  <div class="numgrid">
    <div><b>365d 5h 48m 46s</b><span>duração real do ano trópico</span></div>
    <div><b>+11 min/ano</b><span>erro do calendário juliano</span></div>
    <div><b>1 dia / 128 anos</b><span>acúmulo desse erro</span></div>
    <div><b>10 dias</b><span>defasagem corrigida em 1582</span></div>
    <div><b>26 s/ano</b><span>erro residual do gregoriano</span></div>
    <div><b>1 dia / 3.300 anos</b><span>quando isso voltará a incomodar</span></div>
  </div>
  <p><b>Por que a Igreja se importava.</b> A data da Páscoa é definida em relação ao equinócio de março. Com a defasagem acumulada, o equinócio astronômico estava caindo por volta de 11 de março, e não no 21 fixado em Niceia. A festa mais importante do calendário cristão estava saindo do lugar — e foi isso que motivou a reforma, mais do que qualquer preocupação astronômica abstrata.</p>
  <p><b>A regra corrigida</b> é simples e vale memorizar: é bissexto todo ano divisível por 4, <b>exceto</b> os divisíveis por 100, <b>salvo</b> os divisíveis por 400. Assim, 1600 e 2000 foram bissextos; 1700, 1800 e 1900 não foram. A regra remove três dias a cada quatro séculos, ajustando o ano médio para 365,2425 dias — a 26 segundos por ano do valor real.</p>
  <div class="fig">
    <div class="figttl">Figura · Outubro de 1582, o mês que perdeu dez dias</div>

    <div class="figcap">Repare que a sequência dos <b>dias da semana</b> não foi interrompida: quinta foi seguida de sexta. Só a numeração pulou. Esse cuidado foi deliberado, para não bagunçar o ciclo litúrgico semanal.</div>
  </div>
  <p><b>"Problemas, como aluguéis."</b> O comentário lacônico do slide esconde uma bagunça real. Contratos, salários, juros e prazos judiciais eram contados em dias — e dez dias sumiram do calendário sem que ninguém tivesse deixado de trabalhar ou de ocupar um imóvel. Houve disputa sobre pagar o mês cheio, e vários lugares editaram regras específicas. Some-se a isso que a adoção foi <b>desigual</b>: países católicos aderiram em 1582; a Inglaterra e suas colônias só em <b>1752</b>, quando já eram onze dias de diferença; a Rússia só depois da Revolução, em 1918, com treze dias. Por isso a Revolução de Outubro russa aconteceu, no nosso calendário, em novembro.</p>
  <div class="why"><span class="t">Por que isso importa</span>É o exemplo mais concreto de toda a aula sobre como uma correção astronômica de minutos por ano se transforma, acumulada por séculos, em problema social, jurídico e religioso. Se houver uma discursiva sobre calendários, é aqui que está a história completa.</div>
  <div class="trap"><span class="t">Erro comum</span>Errar a regra dos séculos. O teste é duplo: divisível por 100 <b>e</b> por 400 é bissexto (2000); divisível por 100 mas não por 400 não é (1900). E cuidado: a defasagem corrigida foi de <b>10 dias em 1582</b>, mas quem adotou depois teve de descontar mais.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">12</span>Outros calendários do mundo</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Outros calendários importantes são, por exemplo: judeu (lunar), islâmico (lunar), maia (solar), inca (lunar), chinês (combinação de solar e lunar).</li>
  </ul></div>
  <p>A lista do professor mostra que a humanidade resolveu o mesmo problema de formas diferentes, e cada escolha tem consequência prática. Há três famílias, definidas pelo que o calendário decide priorizar.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Tipo</th><th>Segue</th><th>Consequência</th><th>Exemplos</th></tr></thead>
    <tbody>
      <tr><td><b>Lunar puro</b></td><td>Apenas as fases da Lua; 12 meses somam ~354 dias</td><td>Desliza cerca de 11 dias por ano em relação às estações. As datas percorrem o ano inteiro em ~33 anos</td><td>Islâmico</td></tr>
      <tr><td><b>Solar puro</b></td><td>Apenas o ano trópico</td><td>Fixo em relação às estações, mas os meses não têm relação com a Lua</td><td>Gregoriano, maia</td></tr>
      <tr><td><b>Luni-solar</b></td><td>Meses lunares, com meses extras inseridos periodicamente</td><td>Mantém os meses colados na Lua <b>e</b> as datas coladas nas estações, ao custo de anos de comprimento variável</td><td>Judaico, chinês</td></tr>
    </tbody></table></div>
  <div class="fig">
    <div class="figttl">Figura · O que acontece com cada família ao longo de 33 anos</div>

    <div class="figcap">A barra verde nunca sai do lugar; a roxa atravessa todas as estações; a azul balança e é corrigida. Cada família paga um preço diferente pela mesma impossibilidade aritmética.</div>
  </div>
  <p><b>Islâmico.</b> Lunar puro, com 12 meses de 29 ou 30 dias, totalizando 354 ou 355 dias. É por isso que o Ramadã se move: ao longo da vida de uma pessoa, ele cai em todas as estações. Não é defeito — é escolha deliberada de manter o mês colado à Lua observada.</p>
  <p><b>Judaico.</b> Luni-solar. Insere um décimo terceiro mês em sete de cada dezenove anos, seguindo o ciclo metônico — a constatação de que 19 anos solares correspondem quase exatamente a 235 meses lunares. Por isso as festas judaicas oscilam algumas semanas no nosso calendário, mas nunca mudam de estação.</p>
  <p><b>Chinês.</b> Também luni-solar, com meses intercalares. O Ano-Novo cai entre 21 de janeiro e 20 de fevereiro, sempre na segunda lua nova após o solstício de inverno — daí a data variável.</p>
  <p><b>Maia.</b> Solar, e de uma sofisticação notável: operava com dois ciclos simultâneos — o <i>Haab'</i>, de 365 dias, e o <i>Tzolk'in</i>, ritual, de 260 — que se combinavam num ciclo de 52 anos. Para datas longas usavam a <b>Conta Longa</b>, que registra dias corridos desde uma data inicial mítica. Foi o fim de um dos seus grandes ciclos, em 2012, que gerou a onda de boato sobre fim do mundo — um caso exemplar de pseudociência, tema do fim desta aula.</p>
  <div class="why"><span class="t">Por que isso importa</span>Mostra que não existe calendário "certo": existe calendário <b>otimizado para um objetivo</b>. Quem prioriza a Lua abre mão das estações; quem prioriza as estações abre mão da Lua; quem quer os dois paga com complexidade. É uma boa questão de comparação.</div>
  <div class="trap"><span class="t">Erro comum</span>Chamar o calendário chinês de lunar. Ele é <b>luni-solar</b> — se fosse lunar puro, o Ano-Novo percorreria todas as estações, como o Ramadã, e não ficaria preso ao fim do inverno.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">R</span>Do gnômon ao relógio atômico</h3>
  <p class="lead">Os calendários resolvem o tempo longo. Falta a outra metade da história, que o professor deixa implícita: como se mediu o tempo <b>dentro</b> do dia — e como a definição de segundo acabou deixando de ser astronômica.</p>
  <p>O instrumento mais antigo é o <b>gnômon</b>: uma simples vara vertical. A direção da sombra dá a hora; o comprimento ao meio-dia dá a época do ano. Foi com um gnômon que Eratóstenes mediu a Terra. Dele derivou o <b>relógio de sol</b>, que enfrenta um problema conceitual interessante: como a duração do dia solar varia ao longo do ano, as "horas" de um relógio de sol antigo não tinham todas o mesmo tamanho.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Instrumento</th><th>Como funciona</th><th>Limitação</th></tr></thead>
    <tbody>
      <tr><td>Gnômon e relógio de sol</td><td>Direção da sombra projetada por uma haste</td><td>Só funciona de dia e com céu limpo</td></tr>
      <tr><td>Clepsidra</td><td>Escoamento controlado de água</td><td>A vazão muda com o nível e com a temperatura</td></tr>
      <tr><td>Ampulheta</td><td>Escoamento de areia</td><td>Mede intervalos, não a hora do dia</td></tr>
      <tr><td>Relógio mecânico (séc. XIV)</td><td>Escape regulando a descida de um peso</td><td>Erro de minutos por dia; não servia no mar</td></tr>
      <tr><td>Pêndulo (Huygens, 1656)</td><td>Oscilação de período constante</td><td>Não funciona em navio balançando</td></tr>
      <tr><td>Cronômetro marítimo (Harrison, séc. XVIII)</td><td>Mola e escape resistentes a movimento e temperatura</td><td>Caro e artesanal — mas resolveu a longitude<sup class="ref">7</sup></td></tr>
      <tr><td>Relógio atômico (1955 em diante)</td><td>Frequência de transição do átomo de césio</td><td>Precisão de nanossegundos — hoje define o segundo</td></tr>
    </tbody></table></div>
  <p><b>A virada conceitual.</b> Até 1960, o segundo era definido como uma fração do dia solar médio — ou seja, o tempo era ancorado na rotação da Terra. O problema é que a rotação terrestre <b>não é perfeitamente constante</b>: ela desacelera lentamente por efeito das marés, e sofre pequenas variações irregulares. Quando os relógios atômicos ficaram mais estáveis que o próprio planeta, a definição se inverteu: hoje o segundo é definido por uma propriedade do átomo de césio, e é a <b>rotação da Terra</b> que é medida contra ele.</p>
  <p>É por isso que existem os <b>segundos bissextos</b>: de tempos em tempos acrescenta-se um segundo ao relógio civil para reconciliá-lo com a posição real do Sol. É a mesma lógica do ano bissexto, três módulos atrás, só que na escala do segundo — e mostra que o problema de conciliar convenção humana com movimento celeste nunca terminou, apenas mudou de precisão.</p>
  <div class="why"><span class="t">Por que isso importa</span>Fecha o bloco "Tempo" do roteiro. E introduz uma ideia que reaparece em Física: unidades fundamentais deixaram de ser definidas por objetos ou movimentos e passaram a ser definidas por constantes da natureza — foi o que aconteceu também com o metro e com o quilograma.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que o dia tem exatamente 86.400 segundos sempre. Tem, por definição do relógio civil — mas o dia solar real varia, e é por isso que segundos bissextos são inseridos de vez em quando.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">13</span>Aristarco e o tamanho da Lua</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Aristarco mediu o tamanho relativo da Lua com respeito à Terra considerando quanto tempo a Lua ficava imersa na sombra da Terra durante um eclipse lunar.</li>
    <li>Assim, ele estimou que o raio lunar medisse cerca de 1/3 do raio terrestre.</li>
  </ul></div>
  <p>Começa aqui a parte mais impressionante da aula: três séculos antes de Cristo, sem telescópio, sem relógio preciso e sem trigonometria moderna, gregos mediram o Sistema Solar usando <b>sombra, ângulo e paciência</b>. Aristarco de Samos, por volta de 270 a.C., é o protagonista.</p>
  <p><b>A ideia.</b> Durante um eclipse lunar, a Lua atravessa o cone de sombra que a Terra projeta. Se você cronometrar quanto tempo a Lua leva para entrar completamente na sombra e comparar com quanto tempo ela leva para atravessá-la inteira, obtém a razão entre o diâmetro da Lua e o diâmetro da sombra terrestre àquela distância. Como a Lua se move com velocidade aproximadamente constante na órbita, <b>tempo vira comprimento</b> — e é só isso que se precisa medir.</p>
  <div class="fig">
    <div class="figttl">Figura · O método da sombra</div>
    <svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="95" r="34" fill="#38bdf8"/>
      <text x="70" y="148" font-size="10" font-weight="800" fill="var(--text)" text-anchor="middle">Terra</text>
      <path d="M70 61 L640 84 L640 106 L70 129 Z" fill="var(--text)" opacity=".14"/>
      <path d="M70 61 L640 84 M70 129 L640 106" stroke="var(--muted)" stroke-width="1"/>
      <line x1="470" y1="70" x2="470" y2="120" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="470" y="62" font-size="9" fill="var(--muted)" text-anchor="middle">diâmetro da sombra aqui</text>
      <g fill="#e2e8f0" stroke="var(--line2)">
        <circle cx="386" cy="95" r="11" opacity=".45"/><circle cx="470" cy="95" r="11"/><circle cx="556" cy="95" r="11" opacity=".45"/></g>
      <g stroke="#B23A2B" stroke-width="1.6"><path d="M386 132 L556 132"/><path d="M386 128 L386 136"/><path d="M556 128 L556 136"/></g>
      <text x="471" y="150" font-size="9.5" font-weight="700" fill="#B23A2B" text-anchor="middle">tempo de travessia → comprimento</text>
      <text x="640" y="176" font-size="9" fill="var(--muted2)" text-anchor="end">a razão entre os dois comprimentos dá o tamanho relativo da Lua</text>
    </svg>
    <div class="figcap">A engenhosidade está em transformar uma medida de <b>tempo</b>, que se podia fazer com clepsidra, numa medida de <b>tamanho</b>, que ninguém conseguiria fazer diretamente. Esse tipo de troca é a essência do método astronômico.</div>
  </div>
  <p><b>O resultado.</b> Aristarco chegou a um raio lunar de cerca de <b>1/3</b> do raio terrestre. O valor moderno é <b>0,27</b>, ou aproximadamente 1/3,7<sup class="ref">9</sup>. Um erro de uns 25% — excelente, considerando que ele cronometrava a olho um evento noturno e precisava supor que os raios do Sol chegam paralelos.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este é o primeiro caso, na aula, de <b>medida indireta</b>: obter uma grandeza inacessível a partir de outra, mensurável, através de um modelo geométrico. É assim que a astronomia funciona até hoje — ninguém mede a massa de uma estrela diretamente.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que Aristarco mediu o tamanho <b>absoluto</b> da Lua. Ele mediu a <b>razão</b> em relação à Terra. Converter em quilômetros só foi possível depois que Eratóstenes mediu o tamanho da própria Terra — as duas medidas se completam.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">14</span>Aristarco e a distância até a Lua</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Comparando o diâmetro angular da Lua na esfera celeste com o diâmetro real da Lua, Aristarco mediu a distância da Terra à Lua em 380.000 km.</li>
  </ul></div>
  <p>Com o tamanho da Lua já estimado, o passo seguinte é quase imediato — e usa um conceito que vale guardar para o resto do curso: o <b>diâmetro angular</b>. Um objeto de tamanho conhecido, colocado a certa distância, ocupa um ângulo determinado no campo de visão. Quanto mais longe, menor o ângulo. Se você conhece o tamanho real e mede o ângulo, a distância sai de uma relação simples.</p>
  <p>A Lua tem diâmetro angular de aproximadamente <b>meio grau</b> — cerca de 0,52°. É um valor que você mesmo pode conferir: com o braço estendido, a unha do dedo mínimo cobre aproximadamente meio grau de céu, e portanto cobre a Lua cheia inteira. Muita gente se surpreende com isso, porque a Lua "parece" muito maior. Aplicando a relação, a distância dá cerca de <b>110 vezes</b> o diâmetro lunar.</p>
  <p>Aristarco chegou a <b>380.000 km</b>. O valor moderno é <b>384.400 km</b><sup class="ref">9</sup> — um erro de cerca de 1%. É um resultado extraordinário para o século III a.C., e vale reconhecer que ele se beneficiou de alguma compensação de erros: a superestimativa do tamanho da Lua ajudou a corrigir imprecisões na medida angular.</p>

  </div>

    <div class="figcap">Diâmetro angular sozinho não diz nada sobre tamanho real. Só com a distância a informação fecha — e é exatamente essa relação que Aristarco usou.</div>
  </div>
  <div class="callout plus"><b>A coincidência que torna eclipses totais possíveis.</b> O Sol tem diâmetro angular de aproximadamente 0,53°, quase idêntico ao da Lua. Ele é ~400 vezes maior que a Lua e está ~400 vezes mais distante — e por isso os dois parecem do mesmo tamanho no céu. É pura coincidência da nossa época, e é o que permite o eclipse solar total, em que a Lua cobre o disco solar com precisão quase exata. Como a Lua se afasta alguns centímetros por ano, essa coincidência tem prazo de validade.</div>
  <div class="why"><span class="t">Por que isso importa</span>Diâmetro angular é conceito de uso permanente em astronomia — é como se descrevem tamanhos aparentes de planetas, galáxias e campos de visão de telescópios. E a relação "tamanho real, tamanho aparente, distância: conhecendo dois, obtém-se o terceiro" reaparece o tempo todo.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir tamanho <b>angular</b> com tamanho <b>real</b>. O Sol e a Lua têm quase o mesmo tamanho angular e tamanhos reais absurdamente diferentes. Sem a distância, o ângulo sozinho não diz nada sobre dimensão.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">15</span>Hiparco e o eclipse de 129 a.C.</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Hiparco estimou a distância Terra–Lua usando as observações de um eclipse do Sol observado como total, no Helesponto, e como parcial, em Alexandria, no dia 29/11/129 a.C.</li>
    <li>Ele encontrou que a distância Terra–Lua valia 62 a 73 raios da Terra (o valor correto é ~60 raios).</li>
  </ul></div>
  <p>Hiparco, cerca de um século depois de Aristarco, ataca o mesmo problema por um caminho completamente diferente — e o método dele é essencialmente uma <b>paralaxe</b>, o mesmo princípio que se usa hoje para medir distâncias estelares.</p>
  <p><b>A ideia.</b> Um eclipse solar é um evento local: a sombra da Lua cobre uma faixa estreita da Terra. No mesmo instante, observadores em lugares diferentes veem coisas diferentes. Em <b>29 de novembro de 129 a.C.</b>, o eclipse foi <b>total</b> no Helesponto — o estreito de Dardanelos, na atual Turquia — e apenas <b>parcial</b> em Alexandria, no Egito, onde cerca de um quinto do disco solar permaneceu visível. Essa diferença é medível, e depende diretamente de quão longe a Lua está: se estivesse muito distante, os dois observadores veriam praticamente a mesma coisa.</p>
  <p>Conhecendo a distância entre as duas cidades e a diferença de aparência do eclipse, Hiparco montou o triângulo e obteve <b>entre 62 e 73 raios terrestres</b>. O valor correto é de aproximadamente <b>60 raios</b><sup class="ref">9</sup> — 384.400 km divididos por 6.371 km. Ele acertou a ordem de grandeza e chegou a poucos por cento do limite inferior do seu intervalo.</p>
  <p><b>O detalhe metodológico que vale destacar:</b> Hiparco entregou um <b>intervalo</b>, não um número único. Isso é notável, porque significa que ele reconhecia a incerteza da própria medida — exatamente o que se espera de um resultado experimental moderno, e que você vai aprender formalmente em Física, quando estudar propagação de incertezas. Dois mil anos antes, um astrônomo grego já entendia que medida sem margem de erro é medida incompleta.</p>
  <div class="fig">

    <div class="figcap">O ângulo entre as duas linhas de visada é minúsculo, mas suficiente. Quanto mais perto estivesse a Lua, maior seria a diferença entre o que cada cidade viu. Medindo essa diferença, obtém-se a distância.</div>
  </div>
  <div class="why"><span class="t">Por que isso importa</span>É o mesmo princípio da paralaxe estelar e do parsec, vistos na Aula 01 — só que com a linha de base sendo a distância entre duas cidades, em vez do diâmetro da órbita terrestre. Reconhecer essa continuidade metodológica ao longo de dois mil anos é o tipo de síntese que rende em discursiva.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que Hiparco mediu em quilômetros. Ele mediu em <b>raios terrestres</b> — uma unidade relativa. Assim como Aristarco, ele dependia da medida de Eratóstenes para converter em distância absoluta.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">16</span>Aristarco e a distância até o Sol: o erro genial</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Aristarco usou um engenhoso argumento geométrico para mostrar que o Sol estava muito mais distante da Terra do que a Lua.</li>
    <li>Ele calculou o ângulo entre o Sol e a Lua, na esfera celeste, no momento em que a Lua estava exatamente no quarto crescente ou minguante. Segundo suas contas, o ângulo valeria 87°, implicando que o Sol estava 19 vezes mais distante que a Lua.</li>
    <li>Hoje sabemos que esse ângulo vale 89°51' — ou seja, o Sol está 380 vezes mais distante que a Lua.</li>
  </ul></div>
  <p>Este é o raciocínio mais elegante de toda a aula, e também o mais instrutivo — porque o método está <b>certo</b> e o resultado está <b>errado</b>, por um motivo que vale entender.</p>
  <p><b>A construção.</b> Quando a Lua está exatamente em quarto crescente ou minguante, vemos metade do seu disco iluminado. Isso só acontece quando o ângulo Terra–Lua–Sol vale exatamente <b>90°</b>. Ou seja: nesse instante, Terra, Lua e Sol formam um <b>triângulo retângulo</b>, com o ângulo reto na Lua. Se você medir da Terra o ângulo entre a direção da Lua e a direção do Sol, terá dois ângulos do triângulo — e a razão entre os lados fica determinada. Geometria pura, sem nenhuma suposição física.</p>
  <div class="fig">
    <div class="figttl">Figura · O triângulo do quarto crescente</div>

    <div class="figcap">O triângulo é retângulo na Lua, por construção geométrica. Basta medir o ângulo na Terra para que a razão entre as distâncias fique determinada. O problema é que esse ângulo é próximo demais de 90°, e o resultado é extremamente sensível a pequenos erros.</div>
  </div>
  <p><b>Onde mora o problema.</b> Aristarco mediu 87°, quando o valor real é <b>89°51'</b> — uma diferença de menos de 3 graus, que qualquer instrumento antigo cometeria facilmente, ainda mais porque é difícil identificar o instante exato do quarto crescente. Só que a função envolvida explode perto de 90°: 3 graus de erro no ângulo produzem um erro de <b>vinte vezes</b> no resultado. Ele obteve 19 vezes a distância da Lua; o correto é cerca de <b>390 vezes</b>.</p>

    </tbody></table></div>
  <div class="why"><span class="t">Por que isso importa</span>É a melhor lição de <b>propagação de erro</b> que a história da ciência oferece, e você vai reencontrá-la formalmente em Física. A moral: um método geométrico correto pode produzir resultado muito errado se a configuração for mal condicionada. Boa medida não depende só de raciocínio certo — depende de escolher uma geometria em que o erro não seja amplificado.</div>
  <div class="trap"><span class="t">Erro comum</span>Tratar o resultado de Aristarco como "erro bobo". O raciocínio é impecável; o que faltava era instrumento com precisão de minutos de arco, que só chegaria com Tycho Brahe, dezoito séculos depois.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">17</span>O heliocentrismo grego que foi esquecido</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Com base em seus cálculos de distância, Aristarco concluiu que o Sol deveria ser muitas vezes maior do que a Terra.</li>
    <li>Sendo maior, não poderia girar em torno dela. Seu raciocínio levou-o a formular o primeiro Sistema do Mundo Heliocêntrico, que acabou esquecido anos depois.</li>
  </ul></div>
  <p>Aqui a aula mostra algo raro: uma <b>inferência física a partir de uma medida</b>, e não de doutrina. O encadeamento é limpo. Se o Sol está 19 vezes mais distante que a Lua e ainda assim aparece com o mesmo tamanho angular, então ele é 19 vezes maior que a Lua — e portanto várias vezes maior que a própria Terra. E aí Aristarco dá o passo decisivo: <b>não faz sentido que o corpo maior orbite o menor</b>. Logo, é a Terra que gira em torno do Sol.</p>
  <p>Note que ele chegou a essa conclusão com um número <b>vinte vezes subestimado</b>. Se soubesse que o Sol é 400 vezes mais distante e cerca de 109 vezes o diâmetro da Terra, o argumento seria ainda mais forte. A conclusão estava certa mesmo com a medida errada — o que ilustra que ordem de grandeza, às vezes, basta para decidir uma questão qualitativa.</p>
  <p><b>Por que foi esquecido.</b> Havia uma objeção observacional legítima: se a Terra se move em torno do Sol, as estrelas deveriam mostrar <b>paralaxe</b> ao longo do ano. Ninguém observava paralaxe alguma. A resposta correta seria que as estrelas estão longe demais para que o efeito fosse perceptível a olho nu — e de fato a primeira paralaxe estelar só foi medida em <b>1838</b>, por Bessel, com instrumentos modernos. Mas, na época, distâncias tão absurdas pareciam implausíveis. Somaram-se a isso a física aristotélica, que exigia a Terra imóvel no centro, e o enorme sucesso preditivo do modelo geocêntrico de Ptolomeu. O heliocentrismo ficou dormente por <b>dezoito séculos</b>, até Copérnico — que, aliás, cita Aristarco em rascunhos da sua obra.</p>
  <div class="why"><span class="t">Por que isso importa</span>É o melhor exemplo de que ciência não avança só com a ideia certa: ela precisa de <b>evidência</b> que a comunidade consiga verificar e de instrumentos à altura. A objeção da paralaxe era boa ciência, não teimosia — e só pôde ser respondida quando a tecnologia alcançou a pergunta.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que Copérnico "descobriu" o heliocentrismo. Ele o <b>reintroduziu</b> com desenvolvimento matemático completo, dezoito séculos depois de Aristarco. Em prova de história da astronomia, essa precedência costuma ser cobrada.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">18</span>A astronomia como ciência: o método</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Embora as primeiras elucubrações relacionadas à Astronomia tenham tido caráter social, prático e ritualístico, logo a curiosidade humana se impôs e começou a considerar a natureza dos objetos.</li>
    <li>Os gregos foram os primeiros povos a dar às observações esta atenção distintiva, usando-as para extrair informação física sobre o mundo.</li>
    <li>Este método de inferência foi aperfeiçoado gradativamente com o tempo, dando origem ao que chamamos de método científico.</li>
  </ul></div>
  <p>Aqui a aula fecha o arco. Os babilônios e egípcios <b>registravam e previam</b> com competência notável — mas não perguntavam o que os astros <b>são</b>. Os gregos fizeram essa virada: passaram a tratar as observações como evidência sobre a natureza física do mundo. Aristarco e Hiparco são exatamente isso em ação — não estavam prevendo presságios, estavam medindo tamanhos e distâncias.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Etapa</th><th>O que acontece</th><th>Na aula de hoje</th></tr></thead>
    <tbody>
      <tr><td>Observação</td><td>Registro sistemático de um fenômeno</td><td>Cronometrar a Lua atravessando a sombra da Terra</td></tr>
      <tr><td>Pergunta</td><td>Formular o problema de forma respondível</td><td>Qual é o tamanho da Lua comparado ao da Terra?</td></tr>
      <tr><td>Hipótese / modelo</td><td>Propor uma explicação ou construção geométrica testável</td><td>Supor raios solares paralelos e sombra cônica</td></tr>
      <tr><td>Previsão</td><td>Deduzir consequências verificáveis</td><td>Se o Sol está 19× mais distante, deve ser 19× maior</td></tr>
      <tr><td>Teste</td><td>Confrontar com novas observações</td><td>Hiparco refaz a medida por outro caminho e compara</td></tr>
      <tr><td>Revisão</td><td>Ajustar, refutar ou refinar o modelo</td><td>O valor de 87° é corrigido quando surgem instrumentos melhores</td></tr>
    </tbody></table></div>
