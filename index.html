    <div class="figcap">A diferença entre o meio-dia solar verdadeiro e o meio-dia do relógio chama-se <b>equação do tempo</b>, e chega a cerca de 16 minutos. Relógios de sol bem-feitos trazem uma tabela de correção justamente por causa disso.</div>
  </div>
  <p><b>Por que isso conecta tudo.</b> O analema é a prova visual de que o "dia solar" de 24 horas é uma <b>média</b>, e não uma medida exata do movimento real — exatamente o ponto do módulo 5 sobre dia sideral e dia solar. E é a razão física por trás dos relógios de sol precisarem de correção, tema que a Aula 02 encostou ao falar de gnômon e medida do tempo.</p>
  <p>Um efeito colateral curioso: por causa da equação do tempo, <b>o dia mais curto do ano não coincide com o pôr do Sol mais cedo</b>. No Rio, o pôr do Sol mais cedo acontece por volta do início de dezembro, algumas semanas antes do solstício, e o nascer mais tarde só em janeiro. Quem observa o céu com atenção percebe isso — e é uma boa pergunta para levar ao professor.</p>
  <div class="why"><span class="t">Por que isso importa</span>Mostra que os conceitos da aula não são isolados: inclinação e forma da órbita se combinam para produzir um fenômeno observável. É o tipo de síntese que uma discursiva de nível mais alto pede — e é assunto que impressiona quando você domina.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que o analema é causado só pela inclinação do eixo. Sem a excentricidade da órbita, ele seria uma linha vertical, e não um oito. As duas causas são necessárias.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">16</span>Precessão</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>O eixo de rotação da Terra gira em torno de outro eixo, como um pião.</li>
    <li>O período desse giro é 25.725 anos.</li>
    <li>Devido a esse fenômeno, os polos norte e sul celestes movem-se no céu com relação às constelações.</li>
    <li>O mesmo fenômeno leva ao deslocamento dos signos astrológicos em comparação com as constelações astronômicas, e ao conceito das chamadas Eras (de Peixes, de Aquário, etc.).</li>
  </ul></div>
  <p>A analogia do <b>pião</b> é perfeita. Um pião girando rápido não cai de imediato: seu eixo descreve um cone lento em torno da vertical. A Terra faz o mesmo. Ela é ligeiramente achatada nos polos, e a atração da Lua e do Sol sobre essa saliência equatorial produz um torque que faz o eixo "bambear" — completando um cone a cada <b>cerca de 26 mil anos</b><sup class="ref">8</sup>. O valor do slide, 25.725 anos, está na faixa das estimativas; hoje se cita com mais frequência ~25.770 anos.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Consequência</th><th>O que muda</th></tr></thead>
    <tbody>
      <tr><td>A estrela polar troca</td><td>Hoje o polo norte celeste aponta perto de Polaris. Há 4.800 anos apontava para Thuban, em Dragão — e era essa a estrela usada pelos egípcios. Daqui a ~13 mil anos, apontará perto de Vega</td></tr>
      <tr><td>Os equinócios recuam</td><td>O ponto vernal desliza ~50 segundos de arco por ano ao longo da eclíptica, o que dá cerca de 1° a cada 72 anos, ou um signo inteiro a cada ~2.150 anos</td></tr>
      <tr><td>Signos saem das constelações</td><td>As datas astrológicas foram fixadas há ~2.000 anos e não acompanharam o deslocamento — daí a defasagem de quase um signo</td></tr>
      <tr><td>As "Eras" astrológicas</td><td>Cada uma corresponde ao tempo que o ponto vernal leva para atravessar uma constelação: ~2.150 anos. Daí "Era de Peixes", "Era de Aquário"</td></tr>
      <tr><td>Ano trópico ≠ ano sideral</td><td>A diferença de ~20 minutos entre os dois vem justamente da precessão</td></tr>
      <tr><td>Clima em escala geológica</td><td>Junto com a variação da obliquidade e da excentricidade, compõe os ciclos de Milankovitch, associados às glaciações<sup class="ref">8</sup></td></tr>
    </tbody></table></div>
  <p><b>Quem descobriu.</b> Foi <b>Hiparco</b>, no século II a.C. — o mesmo do eclipse da Aula 02. Ele comparou suas medidas de posições estelares com registros babilônicos de séculos antes e notou um deslocamento sistemático. É um feito notável: detectar um efeito de 1° por século exige comparar dados separados por muitas gerações, o que só é possível quando existe <b>registro escrito preservado</b>. É o argumento do módulo 6 da Aula 02 em ação — a astronomia depende de instituições que atravessam séculos.</p>
  <div class="callout plus"><b>Sobre a grafia do slide.</b> O título aparece como "Processão", mas o fenômeno é a <b>precessão</b> — do latim <i>praecedere</i>, "ir adiante", porque os equinócios se antecipam a cada ano. Provavelmente é só um deslize de digitação, mas vale escrever certo na prova.</div>
  <div class="why"><span class="t">Por que isso importa</span>É o fecho perfeito da aula: um movimento lento demais para ser percebido numa vida, mas que muda a estrela polar, desloca os signos, separa ano trópico de ano sideral e ajuda a explicar eras glaciais. E conecta as três aulas do módulo — Hiparco da Aula 02, o zodíaco desta, e o tempo profundo da anterior.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir precessão com a mudança de estações, ou achar que ela altera a inclinação do eixo. A inclinação permanece em ~23,5°; o que muda é a <b>direção</b> para onde o eixo aponta. A variação da própria obliquidade é outro ciclo, de ~41 mil anos.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">!</span>Precisões e complementos</h3>
  <div class="callout"><b>A inversão hemisférica — o ponto mais importante desta aula.</b> O slide de equinócios e solstícios nomeia as estações pela convenção do hemisfério norte: junho como "solstício de verão" e dezembro como "solstício de inverno". No Brasil é o inverso. Além disso, nesse mesmo bloco as direções norte e sul aparecem trocadas — em <b>junho</b> o Sol atinge o máximo <b>ao norte</b> do equador celeste (+23,5°, sobre o Trópico de Câncer) e em <b>dezembro</b>, o máximo <b>ao sul</b> (−23,5°, sobre o Trópico de Capricórnio). Um slide posterior do próprio professor traz essa versão correta. Como é um ponto que decide questão objetiva, <b>vale perguntar em aula</b> qual convenção ele espera nas respostas.</div>
  <div class="callout"><b>"Eixo inclinado 23,5° com relação à eclíptica."</b> A formulação exata é: o eixo faz 23,5° com a <b>perpendicular</b> ao plano da eclíptica, ou o plano do equador faz 23,5° com o plano da eclíptica. O ângulo entre o eixo e o próprio plano orbital é 66,5°. O outro slide, que diz "23,5° a partir da vertical", está correto.</div>
  <div class="callout"><b>"365,26 dias" é o ano sideral.</b> O ano <b>trópico</b>, que os calendários seguem, é de 365,242 dias<sup class="ref">4</sup>. A diferença de ~20 minutos vem da precessão. Se a questão for sobre calendário, use o trópico.</div>
  <div class="callout"><b>"Uma rotação a cada 24 horas."</b> A rotação em relação às estrelas leva 23h56m04s. As 24 horas são o dia <b>solar</b> médio — e é justamente essa diferença que produz os 3m56s do movimento anual.</div>
  <div class="callout"><b>Equinócio não tem exatamente 12 h de dia.</b> São cerca de 12h07 por causa da refração atmosférica e da convenção de medir pela borda do disco solar. O dia de exatamente 12 horas, o equilux, cai alguns dias antes ou depois.</div>
  <div class="callout"><b>Datas dos equinócios e solstícios variam.</b> O professor usa "~21", e o til é importante: as datas oscilam entre 19 e 23 conforme o ano e o fuso, porque o ano trópico não tem número inteiro de dias e os bissextos reposicionam o calendário. O equinócio de setembro cai com mais frequência em 22 ou 23.</div>
  <div class="callout"><b>"Processão" é precessão.</b> Deslize de digitação no título do último slide.</div>
  <div class="callout plus"><b>Período da precessão.</b> O slide traz 25.725 anos; a literatura atual costuma citar ~25.770. Diferença irrelevante para qualquer efeito da disciplina — a ordem de grandeza, ~26 mil anos, é o que importa.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">G</span>Glossário da aula</h3>
  <div class="gloss">
    <div><b>Esfera celeste</b>Esfera imaginária de raio arbitrário centrada no observador, onde se projetam todos os astros. Modelo sem realidade física, mas em uso profissional até hoje.</div>
    <div><b>Polo celeste</b>Prolongamento do eixo de rotação da Terra até a esfera celeste. Sua altura acima do horizonte é igual à latitude do observador.</div>
    <div><b>Equador celeste</b>Projeção do equador terrestre na esfera celeste. Referência para a declinação.</div>
    <div><b>Eclíptica</b>Caminho aparente do Sol na esfera celeste ao longo do ano; equivale à projeção do plano orbital da Terra. Cruza o equador celeste a 23,5°.</div>
    <div><b>Obliquidade da eclíptica</b>O ângulo de 23,5° entre a eclíptica e o equador celeste. É a mesma inclinação do eixo terrestre, vista de outro jeito.</div>
    <div><b>Nodo</b>Ponto em que a órbita da Lua cruza a eclíptica. Só há eclipse quando a Lua está sobre um nodo e em fase nova ou cheia.</div>
    <div><b>Movimento diurno</b>Rotação aparente de todo o céu em torno dos polos celestes, uma vez por dia. Reflexo da rotação da Terra.</div>
    <div><b>Movimento anual</b>Mudança gradual das constelações visíveis ao longo do ano, causada pela translação da Terra. Uma estrela nasce 3m56s mais cedo a cada noite.</div>
    <div><b>Dia sideral</b>Rotação completa em relação às estrelas: 23h56m04s.</div>
    <div><b>Dia solar</b>Tempo para o Sol voltar à mesma posição no céu: 24 h em média. Maior que o sideral porque a Terra avançou na órbita.</div>
    <div><b>Ano sideral</b>Volta completa em torno do Sol em relação às estrelas: 365,256 dias.</div>
    <div><b>Ano trópico</b>Intervalo entre dois equinócios de março: 365,242 dias. É o ano que os calendários seguem.</div>
    <div><b>Circumpolar</b>Astro que, de uma dada latitude, nunca se põe. A extensão dessa região cresce com a latitude.</div>
    <div><b>Constelação</b>Região do céu com fronteiras oficiais. São 88, definidas pela UAI em 1928. As estrelas de uma constelação não têm relação física entre si.</div>
    <div><b>Asterismo</b>Desenho reconhecível de estrelas sem status oficial, como as Três Marias dentro de Órion.</div>
    <div><b>Nascer helíaco</b>Primeira reaparição de uma estrela no horizonte leste antes do amanhecer, após período de invisibilidade. Usado como marcador de calendário.</div>
    <div><b>Equinócio</b>Instante em que o Sol cruza o equador celeste. Dia e noite com durações quase iguais em todo o planeta. Ocorre por volta de 21 de março e 23 de setembro.</div>
    <div><b>Solstício</b>Instante de máximo afastamento do Sol em relação ao equador celeste, quando ele inverte o movimento norte-sul. Do latim: o Sol se detém.</div>
    <div><b>Equilux</b>Dia com exatamente 12 horas de luz. Não coincide com o equinócio por causa da refração atmosférica.</div>
    <div><b>Trópico</b>Paralelo a 23,5° de latitude, onde o Sol chega ao zênite no solstício. Câncer ao norte, Capricórnio ao sul.</div>
    <div><b>Círculo polar</b>Paralelo a 66,5°, a partir do qual existe pelo menos um dia por ano sem pôr do Sol e um sem nascer.</div>
    <div><b>Sol da meia-noite</b>Fenômeno em que o Sol permanece acima do horizonte por 24 h ou mais, acima dos círculos polares.</div>
    <div><b>Zênite</b>Ponto diretamente acima da cabeça do observador. Fora dos trópicos, o Sol nunca chega a ele.</div>
    <div><b>Zodíaco</b>Faixa de ~8° para cada lado da eclíptica, onde se movem o Sol, a Lua e os planetas. A eclíptica atravessa 13 constelações, não 12.</div>
    <div><b>Ofiúco</b>A décima terceira constelação do zodíaco astronômico, entre Escorpião e Sagitário. O Sol passa por ela cerca de 18 dias por ano.</div>
    <div><b>Precessão</b>Giro lento do eixo de rotação da Terra, como um pião, com período de ~26 mil anos. Descoberta por Hiparco no século II a.C.</div>
    <div><b>Ponto vernal</b>Ponto da esfera celeste onde o Sol cruza o equador celeste no equinócio de março. Origem da ascensão reta — e ele se desloca por causa da precessão.</div>
    <div><b>Ciclos de Milankovitch</b>Variações lentas da órbita e do eixo da Terra — excentricidade, obliquidade e precessão — associadas às glaciações.</div>
    <div><b>Periélio e afélio</b>Pontos de menor e maior distância ao Sol: ~147 e ~152 milhões de km. Curiosamente, o periélio ocorre no verão do hemisfério sul.</div>
    <div><b>Refração atmosférica</b>Desvio da luz ao atravessar a atmosfera, que faz um astro parecer mais alto do que está. Prolonga o dia em alguns minutos.</div>
  </div>
</div>

<div class="lsec">

<div class="lsec">
  <h3><span class="lnum">✓</span>O que provavelmente cai da Aula 03</h3>
  <p class="lead">Esta é a aula mais cobrável do módulo até agora. Tem definições fechadas, ângulos, datas e um mecanismo físico que se explica em três frases — tudo que uma prova com objetivas e discursivas aproveita bem.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Formato provável</th><th>O que estudar</th></tr></thead>
    <tbody>
      <tr><td>Definição objetiva</td><td>Esfera celeste; eclíptica; equador celeste; equinócio; solstício; circumpolar; asterismo; obliquidade</td></tr>
      <tr><td>Número exato</td><td>23,5°; 66,5°; 3m56s; 23h56m04s; ~26 mil anos de precessão; 88 constelações</td></tr>
      <tr><td>Associação</td><td>Trópico ↔ latitude; data ↔ estação em cada hemisfério; fenômeno ↔ movimento que o causa</td></tr>
      <tr><td>Dedução simples</td><td>Círculo polar = 90° − obliquidade; altura do polo celeste = latitude</td></tr>
      <tr><td>Pegadinha conceitual</td><td>Estações causadas pela distância; a Lua ou o céu que giram; eixo a 23,5° do plano orbital; equinócio com 12 h exatas</td></tr>
      <tr><td>Discursiva de mecanismo</td><td>Por que existem estações, com os dois efeitos; por que o dia solar é maior que o sideral; o experimento de Eratóstenes</td></tr>
      <tr><td>Discursiva de síntese</td><td>Como a inclinação do eixo explica trópicos, círculos polares, solstícios e a altura do Sol; por que os signos não batem com as constelações</td></tr>
    </tbody></table></div>
  <p><b>Onde eu apostaria as fichas.</b> Primeiro, <b>as estações</b> — é o assunto que o professor mais repete, com cinco slides seguidos, e o que tem a pegadinha mais famosa. Segundo, a <b>inclinação de 23,5°</b> e suas consequências, porque o próprio slide faz a pergunta "qual a relação disso com os trópicos?", o que soa muito como enunciado de prova. Terceiro, os <b>3m56s</b>, por ser o número mais específico e memorável da aula. E vale ficar atento à <b>convenção hemisférica</b>: se aparecer "solstício de verão", confira se o enunciado se refere a junho ou dezembro.</p>
  <div class="why"><span class="t">Simulado relâmpago</span><b>(1)</b> Em que data o Sol está sobre o Trópico de Capricórnio, e que estação começa no Rio? <b>(2)</b> Por que o dia solar dura 4 minutos a mais que o sideral? <b>(3)</b> Deduza a latitude do Círculo Polar Ártico a partir da obliquidade. <b>(4)</b> Dê os dois efeitos que fazem o verão ser mais quente. <b>(5)</b> Por que a eclíptica tem esse nome? <b>(6)</b> Quantas constelações a eclíptica atravessa, e qual é a que não virou signo?</div>
  <div class="callout plus"><b>O que veio dos slides e o que eu acrescentei.</b> Todos os tópicos, números e definições são do professor. Ampliei com: a discussão da esfera celeste como modelo, a relação altura do polo = latitude e o uso do Cruzeiro do Sul, a distinção constelação/asterismo e o nascer helíaco, o detalhamento do experimento de Eratóstenes e o desfazimento do mito da Terra plana medieval, a distinção sideral/solar com a figura do avanço orbital, a dedução dos cinco paralelos a partir da obliquidade, o comportamento do céu em diferentes latitudes, os nodos e a condição de eclipse, Ofiúco e a defasagem dos signos, os dois efeitos que causam as estações com o contra-argumento do periélio, a trajetória do Sol ao longo do ano com aplicação em arquitetura, e a descoberta da precessão por Hiparco com os ciclos de Milankovitch. Tudo alinhado ao Oliveira Filho &amp; Saraiva e à apostila do CIAA/INPE, ambos da bibliografia da ementa.</div>
</div>

`

<div class="lsec">
  <h3><span class="lnum">0</span>Como usar este roteiro</h3>
  <p class="lead">Este é o roteiro oficial dos sete experimentos de ótica da Unidade 1, reorganizado para você levar ao laboratório. Cada módulo traz objetivo, material, montagem, o passo a passo exato, as tabelas a preencher, as perguntas a responder — e o que costuma dar errado.</p>
  <div class="slidebox"><div class="t">O que o roteiro pede</div><ul>
    <li>Ao começar cada experimento, leia os seus objetivos.</li>
    <li>Certifique-se de ter disponível todo o material a ser utilizado.</li>
    <li>Comece a ler a atividade experimental proposta e siga as instruções passo a passo.</li>
    <li>Anote em seu caderno de registros os resultados e suas conclusões.</li>
    <li>Ao final do trabalho de cada experimento, esboce uma pequena conclusão.</li>
  </ul></div>
  <p><b>O caderno de registros é o que vira relatório.</b> Vale insistir nisso, porque é o erro mais caro do semestre: o relatório final só pode ser escrito a partir do que você anotou <b>na hora</b>. Medida não anotada é medida perdida, e não dá para voltar ao laboratório depois que a janela fecha. Leve o caderno, anote valores brutos com unidade, e registre também o que <b>não</b> saiu como esperado — isso rende discussão no relatório.</p>
  <div class="trap"><span class="t">Atenção · o índice do roteiro está errado</span>
    A lista da <b>página 1</b> do roteiro traz 3 · Interação da luz com a matéria, 4 · O método dos raios e 5 · Espelho plano. Mas os <b>títulos das seções</b>, conferidos no PDF original, dizem outra coisa: a seção da página 9 é explicitamente <b>"Experimento 3 - O método dos raios"</b>.
    <br><br>Vale a <b>numeração das seções</b>, que é a adotada aqui — é ela que aparece em cada página do documento e é o que o monitor tem em mãos. Ainda assim, ao mandar a mensagem de marcação, <b>cite o título junto com o número</b>: "gostaria de marcar o EXP 3 — método dos raios". Aí não há como dar ruído.</div>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Nº</th><th>Título</th><th>Janela</th><th>Papel milim.</th><th>O que você constrói</th></tr></thead>
    <tbody>
      <tr><td><b>1</b></td><td>Propagação da luz num meio homogêneo</td><td>17/08 a 11/09</td><td>não</td><td>O modelo de propagação retilínea, testado com medida</td></tr>
      <tr><td><b>2</b></td><td>Emissão da luz por diferentes fontes</td><td>17/08 a 11/09</td><td>não</td><td>A distinção entre fonte puntiforme e fonte extensa</td></tr>
      <tr><td><b>3</b></td><td>O método dos raios</td><td>17/08 a 11/09</td><td><b>sim</b></td><td>Localizar um ponto luminoso traçando raios</td></tr>
      <tr><td><b>4</b></td><td>Formação de imagens por um espelho plano</td><td>17/08 a 11/09</td><td><b>sim</b></td><td>Onde fica a imagem e a lei da reflexão</td></tr>
      <tr><td><b>5</b></td><td>Interação da luz com a matéria</td><td>14/09 a 09/10</td><td><b>sim</b></td><td>A lei de Snell e o índice de refração, com incerteza</td></tr>
      <tr><td><b>6</b></td><td>A luz se propaga em linha reta</td><td>14/09 a 09/10</td><td><b>sim*</b></td><td>Verificação direta com laser e três orifícios</td></tr>
      <tr><td><b>7</b></td><td>Raios de luz vão e voltam pelo mesmo caminho</td><td>14/09 a 09/10</td><td><b>sim*</b></td><td>O princípio da reversibilidade</td></tr>
    </tbody></table></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:-6px">* Nestes dois há divergência entre as fontes: no <b>6</b>, o roteiro lista papel milimetrado no material e a monitoria não; no <b>7</b>, é o contrário. A recomendação prática é a mesma nos dois casos — leve.</p>
  <div class="why"><span class="t">A lógica da sequência</span>Os experimentos não são independentes: <b>1 e 2</b> constroem o modelo de propagação retilínea; <b>3</b> o transforma em ferramenta — o método dos raios; <b>4 e 5</b> aplicam essa ferramenta a espelho e refração; <b>6 e 7</b> testam propriedades gerais. Repare que a ordem das seções faz muito mais sentido pedagógico que a do índice: você aprende o método dos raios <i>antes</i> de precisar dele para achar a imagem no espelho.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">1</span>Experimento 1 · Propagação da luz num meio homogêneo</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Construir um modelo de propagação da luz a partir das observações realizadas</span></div>
    <div><b>Equipamento</b><span>Caixa escura com acessórios</span></div>
    <div><b>Duração típica</b><span>Uma sessão de monitoria</span></div>
  </div>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Caixa escura · Máscaras · Fonte de luz 1 · Régua · Figuras imantadas</li>
  </ul></div>
  <div class="fig">
    <div class="figttl">Montagem · fonte, máscara e anteparo</div>
    <svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="70" width="18" height="80" rx="3" fill="#fde68a" stroke="#C2751B"/>
      <circle cx="39" cy="110" r="5" fill="#fff" stroke="#C2751B"/>
      <text x="39" y="168" font-size="9.5" font-weight="700" fill="var(--text)" text-anchor="middle">L₁</text>
      <rect x="250" y="34" width="10" height="150" fill="var(--surface3)" stroke="var(--line2)"/>
      <rect x="250" y="102" width="10" height="16" fill="var(--bg)"/>
      <text x="255" y="26" font-size="9.5" font-weight="700" fill="var(--text)" text-anchor="middle">máscara · d</text>
      <rect x="620" y="20" width="10" height="178" fill="var(--surface3)" stroke="var(--line2)"/>
      <text x="625" y="14" font-size="9.5" font-weight="700" fill="var(--text)" text-anchor="middle">anteparo</text>
      <g stroke="#C2751B" stroke-width="1.5">
        <line x1="48" y1="110" x2="250" y2="102"/><line x1="48" y1="110" x2="250" y2="118"/>
        <line x1="260" y1="102" x2="620" y2="56"/><line x1="260" y1="118" x2="620" y2="164"/></g>
      <line x1="620" y1="56" x2="620" y2="164" stroke="#B23A2B" stroke-width="4"/>
      <text x="646" y="114" font-size="10.5" font-weight="800" fill="#B23A2B">L</text>
      <g stroke="var(--muted)" stroke-width="1"><line x1="39" y1="186" x2="255" y2="186"/><line x1="255" y1="196" x2="625" y2="196"/></g>
      <text x="147" y="182" font-size="10" font-weight="700" fill="var(--muted)" text-anchor="middle">a</text>
      <text x="440" y="192" font-size="10" font-weight="700" fill="var(--muted)" text-anchor="middle">b</text>
    </svg>
    <div class="figcap"><b>a</b> = fonte até a máscara · <b>b</b> = máscara até o anteparo · <b>d</b> = diâmetro do orifício · <b>D</b> = diâmetro da mancha medida · <b>L</b> = diâmetro previsto pelo modelo.</div>
  </div>
  <p><b>Primeira exploração — antes das medidas.</b> Coloque a fonte com a lâmpada L₁ acesa na frente da máscara com orifício circular de <b>d = 1 cm</b> e alinhe os dois. Ponha a <b>maior</b> figura imantada no anteparo e movimente o anteparo até que a mancha luminosa fique do mesmo tamanho da figura. Troque pela figura <b>menor</b> e repita. A pergunta do roteiro: <b>o anteparo se aproximou ou se afastou da máscara?</b> Compare os dois casos — essa observação qualitativa já sugere o modelo.</p>
  <p><b>Primeira parte — medidas.</b> Agora com números, anotando tudo na <b>Tabela 1</b>:</p>
  <ol style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Meça o diâmetro do orifício da máscara, <b>d</b>.</li>
    <li>Coloque a lâmpada L₁ a cerca de <b>15 cm</b> da máscara (a ≈ 15 cm).</li>
    <li>Coloque o anteparo a cerca de <b>55 cm</b> da máscara (b ≈ 55 cm).</li>
    <li>Observe a região iluminada no anteparo — a <b>mancha luminosa</b>.</li>
    <li>Meça o diâmetro <b>D</b> da mancha no anteparo.</li>
    <li>Registre a <b>incerteza</b> de cada medida: metade da menor divisão do instrumento.</li>
  </ol>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>#</th><th>a</th><th>δa</th><th>b</th><th>δb</th><th>d</th><th>δd</th><th>D</th><th>δD</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>2</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>3</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>4</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
    </tbody>
  </table></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:-6px">Tabela 1 — medidas em cm, com <b>quatro linhas</b>. Leve esta tabela desenhada no caderno antes de entrar.</p>
  <div class="callout plus"><b>Sobre a letra D.</b> A lista de definições do roteiro descreve D como "o diâmetro da figura imantada que você usou", mas o passo 5 manda medir "o diâmetro da mancha luminosa circular (D) no anteparo". Na prática dá no mesmo, porque o procedimento inicial ajusta a mancha até ficar do tamanho da figura — mas o que você <b>mede com a régua</b>, e anota, é a <b>mancha</b>.</div>
  <p><b>Segunda parte — mais três medidas.</b> Repita o procedimento <b>mais três vezes</b>, mantendo fixa a distância <b>a ≈ 15 cm</b> e variando <b>b entre aproximadamente 30 cm e 50 cm</b>. Anote todas as medidas na Tabela 1, sempre em centímetros, e complete as quatro linhas.</p>
  <div class="why"><span class="t">Por que quatro pontos e não um</span>Com uma única medida, qualquer concordância entre previsão e resultado pode ser sorte. Com quatro valores de b diferentes, você testa se o modelo funciona <b>em toda uma faixa</b> — e é isso que transforma uma coincidência numa verificação. Repare que a fórmula prevê L crescendo linearmente com b: os quatro pontos permitem enxergar essa tendência.</div>
  <div class="fig">
    <div class="figttl">A pergunta central · reta ou curva?</div>
    <svg viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0,0)">
        <circle cx="40" cy="90" r="5" fill="#C2751B"/>
        <rect x="150" y="40" width="8" height="100" fill="var(--surface3)"/><rect x="150" y="82" width="8" height="16" fill="var(--bg)"/>
        <rect x="300" y="20" width="8" height="140" fill="var(--surface3)"/>
        <g stroke="#C2751B" stroke-width="1.6"><line x1="45" y1="90" x2="300" y2="40"/><line x1="45" y1="90" x2="300" y2="140"/><line x1="45" y1="90" x2="300" y2="90"/></g>
        <text x="170" y="172" font-size="10.5" font-weight="800" fill="var(--text)" text-anchor="middle">Figura 3a · propagação retilínea</text>
      </g>
      <line x1="350" y1="16" x2="350" y2="164" stroke="var(--border)"/>
      <g transform="translate(380,0)">
        <circle cx="40" cy="90" r="5" fill="#0E8C93"/>
        <rect x="150" y="40" width="8" height="100" fill="var(--surface3)"/><rect x="150" y="82" width="8" height="16" fill="var(--bg)"/>
        <rect x="290" y="10" width="8" height="160" fill="var(--surface3)"/>
        <g stroke="#0E8C93" stroke-width="1.6" fill="none">
          <path d="M45 90 Q 180 70 290 20"/><path d="M45 90 Q 180 110 290 160"/><line x1="45" y1="90" x2="290" y2="90"/></g>

      </g>
    </svg>
    <div class="figcap">As duas hipóteses explicam uma mancha circular. O que as separa é a <b>previsão quantitativa</b> do tamanho — e é isso que a medida vai decidir. A hipótese mais simples é a retilínea.</div>
  </div>
  <p><b>Segunda parte — a previsão.</b> Se a propagação é retilínea, dá para <b>prever</b> o tamanho da mancha por semelhança de triângulos:</p>
  <div class="fig" style="text-align:center">
    <div class="figttl">A fórmula a verificar</div>
    <svg viewBox="0 0 700 90" xmlns="http://www.w3.org/2000/svg">
      <text x="350" y="42" font-size="22" font-weight="700" fill="var(--text)" text-anchor="middle">L = (d / a) · (a + b) = d · (1 + b/a)</text>
      <text x="350" y="72" font-size="11.5" fill="var(--muted)" text-anchor="middle">o diâmetro previsto da mancha, a partir de três grandezas medidas</text>
    </svg>
  </div>
  <p>Como L é calculado a partir de a, b e d — cada uma com sua incerteza —, ele <b>não é um valor único, e sim uma faixa</b>. Estime os extremos e a incerteza:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Grandeza</th><th>Como calcular</th></tr></thead>
    <tbody>
      <tr><td>L<sub>máx</sub></td><td>(d + δd) · (1 + (b + δb)/(a − δa))</td></tr>
      <tr><td>L<sub>mín</sub></td><td>(d − δd) · (1 + (b − δb)/(a + δa))</td></tr>
      <tr><td>δL</td><td>(L<sub>máx</sub> − L<sub>mín</sub>) / 2</td></tr>
    </tbody></table></div>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>#</th><th>L</th><th>L<sub>máx</sub></th><th>L<sub>mín</sub></th><th>δL</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>2</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>3</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td>4</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
    </tbody>
  </table></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:-6px">Tabela 2 — cálculos em cm, uma linha para cada medida da Tabela 1.</p>
  <p><b>O teste do modelo:</b> compare a faixa prevista <b>L ± δL</b> com o valor medido <b>D ± δD</b>. Se as duas faixas se sobrepõem, o modelo retilíneo passou no teste. Se não, ou o modelo falha, ou alguma incerteza foi subestimada — e discutir qual dos dois é exatamente o tipo de análise que rende no relatório.</p>
  <p><b>Terceira parte — ampliando as observações.</b> Sem mover a caixa e sem trocar a máscara, observe o que acontece se:</p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>a lâmpada L₁ for apagada e a L₂ acesa;</li>
    <li>a L₂ for apagada e a L₃ acesa;</li>
    <li>a L₃ for apagada e a L₁ acesa;</li>
    <li>você trocar a forma da máscara — o que muda na mancha?</li>
    <li>repita os itens a) e b) com a nova máscara.</li>
  </ol>
  <div class="why"><span class="t">A pergunta que fecha o experimento</span>Suas observações poderiam ser explicadas com o modelo de propagação retilínea da luz? Para um modelo ser considerado <b>físico</b>, não basta explicar o caso em que foi construído — ele precisa continuar valendo em situações novas. É exatamente o que a terceira parte testa.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>Antes de ligar a fonte</h5>
    <ul>
      <li>Peça para <b>apagar a luz da sala</b> ou reduzir ao máximo. A borda da mancha fica muito mais definida no escuro, e é dela que sai a maior parte da sua incerteza.</li>
      <li>Marque a lápis, na base ou na mesa, as posições da fonte, da máscara e do anteparo. Se algo esbarrar, você recupera a montagem sem refazer tudo.</li>
      <li>Confira de onde você vai medir <b>a</b>: a distância que importa é até o <b>filamento</b> da lâmpada, não até o vidro nem até a borda do suporte. Escolher o ponto errado gera erro sistemático que aparece nas quatro medidas.</li>
    </ul>
    <h5>Medindo a mancha</h5>
    <ul>
      <li>A borda é <b>difusa</b>, não uma linha. Defina um critério — por exemplo, "onde o brilho cai visivelmente" — e use exatamente o <b>mesmo critério</b> nas quatro medidas. Escreva o critério no caderno; isso vale ponto no relatório.</li>
      <li>Meça o diâmetro <b>duas vezes, em direções perpendiculares</b>, e use a média. A mancha raramente é um círculo perfeito.</li>
      <li>Encoste a régua no anteparo, alinhada com o centro da mancha. Medir a alguns centímetros de distância introduz erro de paralaxe.</li>
      <li>Como a borda é difusa, é honesto adotar uma incerteza <b>maior</b> que a da régua — e justificar. Isso é sinal de maturidade experimental, não de desleixo.</li>
    </ul>
    <h5>Escolhendo os quatro pontos</h5>
    <ul>
      <li>Espalhe bem o <b>b</b> dentro da faixa pedida (30 a 50 cm). Pontos amontoados não revelam a tendência linear que a fórmula prevê.</li>
      <li>Mantenha <b>a</b> realmente fixo entre as quatro medidas — é o que a segunda parte exige. Se precisar mexer, remeça e anote.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> as faixas L ± δL e D ± δD devem se sobrepor nas quatro linhas. Se D vier <b>sistematicamente maior</b> que L em todas, suspeite de fonte não perfeitamente puntiforme — e guarde essa observação, porque é exatamente o assunto do experimento 2.</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Medir a mancha "no olho" em vez de com régua encostada no anteparo · esquecer de anotar as incertezas na hora · mover a caixa entre as medidas de a e b · confundir o diâmetro da mancha (D) com o diâmetro da figura imantada · não anotar o número da máscara usada.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">2</span>Experimento 2 · Emissão da luz por diferentes fontes</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Construir um modelo para a emissão de luz por uma fonte não puntiforme</span></div>
    <div><b>Montagem</b><span>a ≈ 20 cm e b ≈ 20 cm</span></div>
    <div><b>Novidade</b><span>Lâmpada halógena L₄, de filamento linear</span></div>
  </div>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Caixa escura, máscaras, régua, anteparo</li>
    <li>Fonte de luz com lâmpadas L₁, L₂ e L₃, e lâmpada halógena L₄ com filamento linear (220 V e 300 W)</li>
  </ul></div>
  <p>Monte com o suporte das lâmpadas a <b>a ≈ 20 cm</b> da máscara e o anteparo a <b>b ≈ 20 cm</b> do outro lado — a mesma configuração da figura do experimento anterior.</p>
  <p><b>Primeira parte — somando fontes puntiformes.</b> Ligue cada lâmpada <b>separadamente</b>, com as outras desligadas, e observe a mancha. Depois ligue <b>L₁ e L₂ ao mesmo tempo</b> e observe. A mancha resultante poderia ser explicada pelo modelo de propagação retilínea?</p>
  <p>Em seguida, desligue L₁ e ligue <b>L₂ e L₃ juntas</b>. Por fim, ligue <b>as três ao mesmo tempo</b>. Suas observações estão de acordo com o modelo? Por quê?</p>
  <div class="fig">
    <div class="figttl">Três fontes puntiformes contra uma fonte extensa</div>
    <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0,0)">
        <g fill="#fde68a" stroke="#C2751B"><circle cx="40" cy="60" r="7"/><circle cx="40" cy="90" r="7"/><circle cx="40" cy="120" r="7"/></g>
        <g font-size="9" fill="var(--muted)"><text x="18" y="63">L₂</text><text x="18" y="93">L₁</text><text x="18" y="123">L₃</text></g>
        <rect x="150" y="30" width="8" height="120" fill="var(--surface3)"/><rect x="150" y="82" width="8" height="14" fill="var(--bg)"/>

        <g stroke="#C2751B" stroke-width="1.2" opacity=".8">
          <line x1="47" y1="60" x2="290" y2="126"/><line x1="47" y1="90" x2="290" y2="90"/><line x1="47" y1="120" x2="290" y2="52"/></g>
        <g fill="#C2751B" opacity=".55"><rect x="286" y="44" width="10" height="18"/><rect x="286" y="82" width="10" height="18"/><rect x="286" y="118" width="10" height="18"/></g>

      </g>

        <rect x="32" y="52" width="14" height="76" rx="7" fill="#fde68a" stroke="#C2751B"/>
        <text x="16" y="94" font-size="9" fill="var(--muted)">L₄</text>
        <rect x="150" y="30" width="8" height="120" fill="var(--surface3)"/><rect x="150" y="82" width="8" height="14" fill="var(--bg)"/>

        <g stroke="#0E8C93" stroke-width="1" opacity=".55">
          <line x1="46" y1="54" x2="280" y2="130"/><line x1="46" y1="70" x2="280" y2="112"/><line x1="46" y1="90" x2="280" y2="90"/>
          <line x1="46" y1="110" x2="280" y2="68"/><line x1="46" y1="126" x2="280" y2="50"/></g>
        <rect x="276" y="46" width="10" height="88" fill="#0E8C93" opacity=".4"/>

    <div class="figcap">Uma fonte extensa equivale a infinitas fontes puntiformes lado a lado. Cada uma projeta sua própria mancha, e a sobreposição delas produz um centro uniforme com bordas gradualmente mais escuras — a <b>penumbra</b>.</div>
  </div>
  <p><b>Segunda parte — a fonte extensa.</b> Agora com a lâmpada de filamento linear L₄:</p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Coloque L₄ a <b>a ≈ 20 cm</b> da máscara com abertura circular de d = 1 cm. Você conseguiria explicar a mancha observada com o seu modelo?</li>
    <li><b>Afaste ao máximo</b> a lâmpada L₄ da máscara. Você conseguiria explicar a mancha com o modelo da propagação retilínea?</li>
    <li>Compare o item a) com a segunda parte do experimento 2, com L₁, L₂ e L₃ acesas.</li>
    <li>Compare o item b) com o experimento 1, com apenas L₁ acesa.</li>
    <li>Que nome você daria para uma fonte como a do experimento 1, com apenas L₁ acesa, e para a fonte usada agora, com apenas L₄?</li>
    <li>Repita as observações com as outras máscaras — principalmente a triangular e a cruz — e verifique se seu modelo continua válido.</li>
    <li>Tente elaborar um modelo de propagação da luz para a fonte com a lâmpada L₄.</li>
  </ol>
  <div class="why"><span class="t">Onde este experimento quer chegar</span>Na distinção entre <b>fonte puntiforme</b> e <b>fonte extensa</b>. A resposta do item e) é justamente essa dupla de nomes. E o item b) tem um resultado bonito: quanto mais longe a fonte extensa, mais ela se comporta como puntiforme — é por isso que o Sol, que é gigantesco, produz sombras razoavelmente nítidas aqui na Terra.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>O que observar, e não só olhar</h5>
    <ul>
      <li>O ponto central deste experimento é a <b>borda</b> da mancha, não o centro. Com fonte puntiforme ela é relativamente abrupta; com fonte extensa aparece um gradiente — a <b>penumbra</b>, região iluminada por apenas <i>parte</i> da fonte.</li>
      <li><b>Desenhe</b> cada mancha no caderno, com o gradiente indicado a lápis. Descrição verbal do tipo "ficou maior" não sustenta relatório; desenho sustenta.</li>
      <li>Com L₁ e L₂ juntas, olhe se as duas manchas se <b>sobrepõem parcialmente</b>: a região comum fica mais clara e as pontas mais fracas. É a soma de duas fontes puntiformes, e explica de onde vem a penumbra.</li>
      <li>Ao afastar a L₄ ao máximo, repare que a penumbra <b>encolhe</b>. Quanto maior a distância comparada ao tamanho da fonte, mais ela se comporta como puntiforme — é a resposta do item b) e a razão de o Sol, gigantesco, produzir sombras razoavelmente nítidas aqui.</li>
    </ul>
    <h5>Cuidados com a halógena L₄</h5>
    <ul>
      <li>São <b>300 W</b>: ela esquenta muito rápido e o vidro queima ao toque. Manuseie pelo suporte, e desligue entre uma observação e outra.</li>
      <li>Não olhe diretamente para o filamento aceso por muito tempo — o brilho ofusca e atrapalha justamente a percepção de borda que o experimento pede.</li>
    </ul>
    <h5>Organização das anotações</h5>
    <ul>
      <li>Monte uma tabelinha simples: <b>configuração</b> (quais lâmpadas, qual máscara, distância) × <b>desenho da mancha</b> × <b>observação</b>. São muitas combinações, e sem isso vira bagunça.</li>
      <li>Anote a resposta do item e) com as palavras exatas: fonte <b>puntiforme</b> e fonte <b>extensa</b>. É o vocabulário que o experimento quer instalar.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> você consegue explicar cada mancha observada desenhando raios retos a partir de <i>cada ponto</i> da fonte. Se conseguir fazer isso inclusive para a máscara triangular e a de cruz, o modelo passou no teste do item f).</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Ligar mais de uma lâmpada quando o roteiro pede uma só · esquecer de registrar qual lâmpada estava acesa em cada observação · não desenhar as manchas no caderno (desenho vale mais que descrição verbal aqui) · deixar a halógena L₄ ligada por muito tempo, que esquenta bastante — ela é de 300 W.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">5</span>Experimento 5 · Interação da luz com a matéria</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Descrever quantitativamente a propagação da luz ao encontrar um meio diferente</span></div>
    <div><b>Resultado</b><span>O índice de refração n, com incerteza</span></div>
    <div><b>Papel milimetrado</b><span>obrigatório</span></div>
  </div>
  <div class="slidebox"><div class="t">Material e condições</div><ul>
    <li>Lente semicircular de acrílico com superfície polida, caneta laser, papel milimetrado, placa de isopor, alfinetes, lápis, régua e transferidor.</li>
    <li>Quanto <b>menos iluminada</b> a sala, melhor.</li>
  </ul></div>
  <p><b>O vocabulário, antes de começar.</b> O raio que chega à lente é o <b>raio incidente</b>. O que não penetra e muda de direção, permanecendo no ar, é o <b>raio refletido</b>. O que penetra na lente é o <b>raio refratado</b>. A linha perpendicular à superfície no ponto de incidência é a <b>normal</b>. Os três ângulos são sempre medidos <b>em relação à normal</b>, nunca em relação à superfície — esse é o erro número um do experimento.</p>
  <div class="fig">
    <div class="figttl">Os três raios e os três ângulos</div>

      <text x="304" y="72" font-size="10.5" font-weight="800" fill="#B23A2B">θ₁</text>
      <path d="M350 64 A 48 48 0 0 0 388 82" fill="none" stroke="#C2751B" stroke-width="1.6"/>
      <text x="386" y="70" font-size="10.5" font-weight="800" fill="#C2751B">θ₂</text>
      <path d="M350 160 A 48 48 0 0 0 374 152" fill="none" stroke="#2C8055" stroke-width="1.6"/>
      <text x="382" y="164" font-size="10.5" font-weight="800" fill="#2C8055">θ₃</text>
      <circle cx="350" cy="112" r="4" fill="var(--text)"/>
      <text x="336" y="128" font-size="10" font-weight="700" fill="var(--text)">O</text>

    </svg>
    <div class="figcap">θ₁ é o ângulo de incidência, θ₂ o de reflexão e θ₃ o de refração — todos medidos a partir da <b>normal</b>. A face plana AB é onde o laser entra nesta configuração.</div>
  </div>
  <p><b>Montagem.</b> Prenda o papel milimetrado sobre a placa de isopor com alfinetes. Coloque a lente semicircular deitada sobre o papel, com o <b>diâmetro coincidindo com uma das linhas</b> do papel. Desenhe o contorno da lente a lápis e marque o <b>centro O</b>. Trace, a lápis, as direções dos raios que vão incidir sobre O: <b>0°</b> (que é a própria normal), <b>30°</b>, <b>45°</b> e <b>60°</b>.</p>
  <p><b>Procedimento.</b></p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Faça a luz do laser incidir sobre o centro O, seguindo uma das direções traçadas.</li>
    <li>Para marcar as direções dos raios, use <b>alfinetes</b>: um no centro da lente, um sobre a reta do raio incidente, um sobre a do refletido e um sobre a do refratado. Isso melhora bastante a exatidão. Pode ser necessário mover ligeiramente o laser para que todos os raios fiquem visíveis.</li>
    <li>Marque a posição dos alfinetes anotando a que raio pertencem. Para 45°, por exemplo: <b>I₄₅</b> para o incidente, <b>R₄₅</b> para o refletido, <b>T₄₅</b> para o refratado (T de transmitido). Retire os alfinetes e desenhe cuidadosamente os raios. Repita para os quatro ângulos: <b>0°, 30°, 45° e 60°</b>.</li>
    <li>Meça θ₂ e θ₃ com o transferidor e complete a primeira parte da Tabela 3. Considere as incertezas dos ângulos como iguais entre si e estime seu valor.</li>
  </ol>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>θ₁</th><th>θ₂</th><th>θ₃</th><th>δθ</th><th>n = sen θ₁ / sen θ₃</th><th>δn</th></tr></thead>
    <tbody>
      <tr><td><b>0°</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>—</td><td>—</td></tr>
      <tr><td><b>30°</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td><b>45°</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
      <tr><td><b>60°</b></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>
    </tbody></table></div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:-6px">Tabela 3 — medidas em graus e cálculos. Note que para θ₁ = 0° não há o que calcular: o raio passa sem desviar.</p>
  <p><b>O cálculo.</b> Para cada ângulo com θ₁ ≠ 0, calcule o <b>índice de refração</b>:</p>
  <div class="fig" style="text-align:center">
    <div class="figttl">A grandeza que o experimento mede</div>
    <svg viewBox="0 0 700 96" xmlns="http://www.w3.org/2000/svg">
      <text x="350" y="44" font-size="22" font-weight="700" fill="var(--text)" text-anchor="middle">n = sen θ₁ / sen θ₃</text>
      <text x="350" y="74" font-size="11.5" fill="var(--muted)" text-anchor="middle">calcule o seno com a calculadora em GRAUS — e o valor do seno fica sempre entre −1 e 1</text>
    </svg>
  </div>
  <p><b>A incerteza de n é indireta</b>, e por isso precisa ser estimada pelos extremos:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Grandeza</th><th>Como calcular</th></tr></thead>
    <tbody>
      <tr><td>n<sub>máx</sub></td><td>sen(θ₁ + δθ) / sen(θ₃ − δθ)</td></tr>
      <tr><td>n<sub>mín</sub></td><td>sen(θ₁ − δθ) / sen(θ₃ + δθ)</td></tr>
      <tr><td>δn</td><td>(n<sub>máx</sub> − n<sub>mín</sub>) / 2</td></tr>
    </tbody></table></div>
  <p><b>Conclusão a escrever.</b> Analise a Tabela 3 e procure a regularidade entre o quociente dos senos de θ₁ e θ₃. É possível generalizar o resultado, escrevendo uma "lei para a refração"? Se os quatro valores de n concordarem dentro das incertezas, você acabou de <b>medir a lei de Snell</b> — e o acrílico tem n em torno de 1,5.</p>
  <p><b>Terceira parte — entrando pela face curva e fora do centro.</b> Agora inverta a geometria e faça a luz incidir na <b>superfície semicircular</b>, como na Figura 8. Trace os raios incidentes, refletidos e refratados nas duas superfícies, a semicircular e a plana. Depois responda:</p>
  <ul style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Nesse caso, ao se refratar na superfície plana AB, o raio <b>se aproxima ou se afasta</b> da normal?</li>
    <li>Faça a luz incidir na superfície AB em um ponto <b>fora do centro O</b>. Compare com a situação em que a incidência ocorre sobre o centro.</li>
    <li>Você poderia explicar <b>por que o centro da lente foi escolhido</b> para se realizar o experimento?</li>
  </ul>
  <div class="why"><span class="t">A resposta da última pergunta</span>Quando o raio entra apontando para o centro O, ele atinge a face curva <b>perpendicularmente</b> — ou seja, ao longo do próprio raio da semicircunferência. Incidência perpendicular significa desvio zero: a luz atravessa a face curva sem refratar. Isso <b>isola</b> o fenômeno que se quer medir, que passa a acontecer só na face plana. Se você incidir fora do centro, aparece uma refração extra na entrada, e os ângulos deixam de ser os que a fórmula pressupõe — é exatamente isso que a comparação pedida no roteiro quer que você observe.</div>
  <p><b>Quarta parte — reflexão interna total.</b> Com o raio incidindo na superfície plana AB, como na Figura 9 (lado esquerdo), varie o ângulo de incidência entre <b>0° e 90°</b> e verifique a existência de raios refratados <b>no interior da lente</b>. Repita o procedimento com os raios incidindo na <b>superfície semicircular</b>, como na Figura 9 (lado direito), e verifique a existência de raios refratados <b>no ar</b>.</p>
  <p>Você vai encontrar um comportamento marcante num dos dois casos: passando de certo ângulo, o raio refratado <b>desaparece</b> e toda a luz é refletida. É o <b>ângulo crítico</b>, e o fenômeno é a <b>reflexão interna total</b> — o mesmo princípio que faz a fibra óptica funcionar. Repare que ele só ocorre quando a luz vai do meio <b>mais</b> refringente para o <b>menos</b> refringente, ou seja, do acrílico para o ar.</p>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>Alinhamento — onde se ganha ou se perde o experimento</h5>
    <ul>
      <li>O feixe do laser precisa correr <b>rente ao papel e paralelo à mesa</b>. Se a caneta estiver inclinada, o traço que você vê no papel não é a projeção fiel do raio, e todos os ângulos saem viesados. Apoie a caneta na mesa ou calce com um livro.</li>
      <li>Alinhe o <b>diâmetro</b> da lente com uma linha do milimetrado, como o roteiro pede: essa linha vira sua referência para a face plana e facilita traçar a normal exatamente a 90°.</li>
      <li>Desenhe o contorno da lente e marque o centro <b>O</b> antes de acender o laser. Se a lente escorregar depois, o contorno permite recolocá-la.</li>
      <li>Entrar pela <b>face curva</b> apontando para O é o que garante desvio zero na entrada. Confira: se aparecer refração já na entrada, seu raio não está mirando o centro.</li>
    </ul>
    <h5>Marcando os raios</h5>
    <ul>
      <li>Use os <b>alfinetes</b> como o roteiro manda, em vez de traçar direto olhando o feixe. Alfinete define dois pontos por reta e melhora bastante a exatidão; olho traçando à mão livre não.</li>
      <li>Coloque o alfinete do raio refratado o <b>mais longe possível</b> do centro, ainda dentro da linha visível. Braço de alavanca maior significa ângulo mais preciso.</li>
      <li>Rotule tudo na hora: I₄₅, R₄₅, T₄₅. Depois de tirar os alfinetes, os furos são indistinguíveis.</li>
      <li>Sala escura ajuda muito a enxergar o raio <b>dentro</b> do acrílico, que é o mais fraco dos três.</li>
    </ul>
    <h5>Cálculo</h5>
    <ul>
      <li>Calculadora em <b>graus</b>. Se n der algo em torno de 0,3 ou 3,5, quase certamente é isso.</li>
      <li>O acrílico tem índice de refração em torno de <b>1,49</b>. Se seus quatro valores caírem perto disso e concordarem entre si dentro das incertezas, o experimento fechou.</li>
      <li>Para a reflexão interna total, o ângulo crítico do acrílico fica em torno de <b>42°</b> — é por volta desse valor que o raio refratado deve sumir na quarta parte.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> os três valores de n (para 30°, 45° e 60°) concordam entre si dentro das incertezas e ficam próximos de 1,49. E o θ₂ medido deve ser igual a θ₁ em todos os casos — a lei da reflexão aparece de graça neste experimento, e vale mencionar.</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Medir os ângulos a partir da <b>superfície</b> em vez da normal · calculadora em radianos · esquecer que o raio refletido também existe e só marcar o refratado · mover a lente depois de desenhar o contorno · sala clara demais para enxergar o raio dentro do acrílico · <b>nunca aponte o laser para os olhos, nem para os do monitor</b>.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">3</span>Experimento 3 · O método dos raios</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Apresentar o método dos raios e localizar experimentalmente a posição de imagens</span></div>
    <div><b>Princípio</b><span>Um ponto emite incontáveis raios, e todos se cruzam nele</span></div>
    <div><b>Onde fazer</b><span>Pode ser feito em casa ou em sala de aula</span></div>
  </div>
  <div class="slidebox"><div class="t">Objetivo, na íntegra</div><ul>
    <li>Desenvolver sua capacidade de encontrar experimentalmente a posição de imagens formadas por dispositivos ópticos (espelhos, lentes etc.).</li>
    <li>Apresentar o método dos raios, que consiste em desenhar experimentalmente as trajetórias dos raios luminosos emitidos por um ponto luminoso.</li>
    <li>Este método é utilizado para construir as imagens dos objetos formados em "detectores" — o nosso cérebro, filmes fotográficos, anteparos, entre outros.</li>
    <li><b>Informação preliminar:</b> um ponto luminoso emite um número incontável de raios luminosos. A interseção desses raios ocorre no ponto luminoso.</li>
  </ul></div>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Placa de isopor · <b>papel milimetrado</b> · lápis · régua</li>
    <li>Alfinetes com cabeça esférica de diâmetro aproximado de 4 mm</li>
  </ul></div>
  <div class="callout plus"><b>Papel milimetrado ou A4?</b> A lista de material pede <b>papel milimetrado</b>, mas o primeiro passo da atividade diz "fixe uma folha de papel A4". É uma inconsistência do próprio roteiro. Leve <b>milimetrado</b>: ele atende os dois casos, é o que consta no material, e a quadrícula ajuda muito a traçar retas e medir distâncias com precisão. A monitoria também lista o experimento 3 entre os que exigem milimetrado.</div>
  <p><b>A ideia por trás.</b> Um ponto luminoso emite um número incontável de raios luminosos, em todas as direções, e a interseção deles ocorre <b>no próprio ponto</b>. Logo, se você conseguir traçar duas ou mais direções de raios que saem de um ponto, o cruzamento delas revela onde o ponto está — <b>mesmo que você não possa vê-lo diretamente</b>. É essa a ferramenta que o experimento 4 vai usar para achar a imagem no espelho, que não existe fisicamente.</p>
  <div class="fig">
    <div class="figttl">Como três pares de alfinetes localizam um ponto</div>
    <svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg">
      <rect x="60" y="30" width="580" height="150" rx="6" fill="var(--surface2)" stroke="var(--line2)"/>
      <text x="70" y="24" font-size="9.5" font-weight="700" fill="var(--muted)">A</text>
      <text x="630" y="24" font-size="9.5" font-weight="700" fill="var(--muted)">B</text>
      <circle cx="360" cy="72" r="6" fill="#B23A2B"/>
      <text x="360" y="62" font-size="10" font-weight="800" fill="#B23A2B" text-anchor="middle">1</text>
      <g fill="var(--text)">
        <circle cx="300" cy="112" r="4"/><circle cx="250" cy="146" r="4"/>
        <circle cx="376" cy="118" r="4"/><circle cx="392" cy="160" r="4"/>
        <circle cx="440" cy="104" r="4"/><circle cx="520" cy="132" r="4"/></g>
      <g stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3">
        <line x1="360" y1="72" x2="230" y2="160"/><line x1="360" y1="72" x2="398" y2="176"/><line x1="360" y1="72" x2="548" y2="142"/></g>
      <g font-size="9" fill="var(--muted)">
        <text x="292" y="106">2</text><text x="242" y="140">3</text>
        <text x="382" y="114">4</text><text x="398" y="156">5</text>
        <text x="446" y="98">6</text><text x="526" y="126">7</text></g>
      <text x="350" y="200" font-size="9.5" fill="var(--muted2)" text-anchor="middle">cada par de alfinetes alinhado com o olho define uma reta; as três retas se cruzam no alfinete 1</text>
    </svg>
    <div class="figcap">Você nunca mede a posição do alfinete 1 diretamente. Ela aparece como o <b>ponto de encontro</b> das retas — e é exatamente assim que se localiza uma imagem óptica.</div>
  </div>
  <p><b>Procedimento.</b></p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Fixe uma folha de papel A4 em uma placa de isopor.</li>
    <li>Coloque o <b>alfinete 1</b>, verticalmente, na posição indicada pela figura do roteiro (AE = ½ AB e EF = ⅓ BD). Feche um olho e, com o outro <b>no mesmo nível da placa</b>, observe o alfinete 1.</li>
    <li>Coloque o <b>alfinete 2</b> entre seu olho e o alfinete 1, separados por cerca de <b>5 cm</b>.</li>
    <li>Coloque o <b>alfinete 3</b> entre seu olho e o alfinete 2, de modo que os três fiquem <b>alinhados</b>. Quando o alinhamento for perfeito, você verá apenas o alfinete 3, o mais próximo — os outros dois ficam escondidos atrás dele.</li>
    <li>Retire os alfinetes 2 e 3 e trace, com cuidado, a reta que passa pelos dois furinhos deixados por eles. Essa é a reta <b>raio 2-3</b>.</li>
    <li>Repita todo o procedimento com os alfinetes <b>4 e 5</b>, e depois <b>6 e 7</b>, escolhendo <b>direções diferentes</b>. As novas retas são <b>raio 4-5</b> e <b>raio 6-7</b>. Retire o alfinete 1 e prolongue os três raios.</li>
  </ol>
  <p><b>Perguntas do roteiro.</b></p>
  <ol style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>As retas que chamamos de raios representam as trajetórias de raios luminosos provenientes do alfinete? Por quê?</li>
    <li>O ponto de encontro dos seus raios coincide com o furinho deixado pelo alfinete 1? O resultado alcançado está razoável? Por quê?</li>
    <li>Quantos raios você precisa traçar para encontrar a posição do alfinete 1?</li>
  </ol>
  <div class="why"><span class="t">A resposta da pergunta 3 vale ouro</span>Geometricamente, <b>dois</b> raios bastam para determinar um ponto — duas retas não paralelas se cruzam em exatamente um lugar. O terceiro raio não é redundância inútil: ele serve de <b>verificação</b>. Se os três não se cruzam num ponto único, mas formam um pequeno triângulo, o tamanho desse triângulo é uma medida direta do seu erro experimental. Discuta isso na conclusão.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>A técnica do alinhamento</h5>
    <ul>
      <li>Espete os alfinetes <b>bem verticais</b>. Confira olhando de lado, rente à placa: um alfinete inclinado desloca a reta e você nem percebe.</li>
      <li>Feche um olho e coloque o outro <b>no nível da placa</b>, não acima dela. Olhar de cima é o erro mais comum e destrói o alinhamento.</li>
      <li>O critério de acerto é visual e binário: quando o alinhamento está perfeito, você vê <b>apenas o alfinete da frente</b>. Se enxergar dois, ainda não está.</li>
      <li>Respeite os <b>5 cm</b> de separação entre o par. Quanto mais afastados, menor o erro angular da reta — dois alfinetes colados amplificam qualquer imprecisão.</li>
    </ul>
    <h5>Escolhendo as três direções</h5>
    <ul>
      <li>Escolha direções <b>bem diferentes</b> entre si, idealmente separadas por uns 60°. Raios quase paralelos se cruzam num ponto mal definido, e o cruzamento "escorrega".</li>
      <li>Numere cada raio no papel assim que traçá-lo: 2-3, 4-5, 6-7. Depois de tirar os alfinetes, os furinhos são todos iguais.</li>
    </ul>
    <h5>Do furo à reta</h5>
    <ul>
      <li>Use lápis apontado e régua apoiada <b>exatamente sobre os dois furos</b>. Um traço 1 mm fora de um furo já joga o cruzamento vários milímetros adiante.</li>
      <li>Não fure o papel mais que o necessário: furo alargado vira uma mancha, e você perde a referência de onde estava o centro.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> os três raios não vão se cruzar num ponto matemático — vão formar um pequeno <b>triângulo de erro</b>. Meça o maior lado dele: abaixo de uns <b>2 mm</b>, seu traçado está muito bom. Esse triângulo é a resposta quantitativa da pergunta 2 do roteiro, e citá-lo com o valor medido rende bem mais que responder "coincidiu razoavelmente".</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Olhar com os dois olhos, o que impede o alinhamento · olhar de cima em vez de no nível da placa · alfinetes inclinados em vez de verticais · pares muito próximos entre si, que amplificam o erro angular · furar o papel demais e perder a marca exata · escolher direções quase iguais para os três raios, o que degrada o cruzamento.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">4</span>Experimento 4 · Formação de imagens por um espelho plano</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Aplicar o método dos raios para localizar a imagem formada por um dispositivo óptico</span></div>
    <div><b>O que se descobre</b><span>Onde fica a imagem e a lei da reflexão</span></div>
    <div><b>Instrumento novo</b><span>Transferidor</span></div>
  </div>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Placa de isopor, papel milimetrado, lápis, régua, transferidor</li>
    <li>Alfinetes com cabeça esférica de ~4 mm</li>
    <li>Espelho com 20 cm de largura e 2 cm de altura, e base para mantê-lo vertical</li>

    <div class="figcap">Os raios 2-3 parecem vir de trás do espelho. Prolongando-os, encontra-se a imagem 1'. A verificação central: <b>d₁ = d</b>, ou seja, a imagem fica tão atrás do espelho quanto o objeto está à frente.</div>
  </div>
  <p><b>Procedimento.</b></p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Fixe uma folha de papel sobre a placa de isopor.</li>
    <li>Coloque o <b>alfinete 1</b> verticalmente na posição indicada, com AE = ½ AB e ED = ⅓ BF. <span style="color:var(--warn)">O roteiro manda ver a "Figura 4" aqui, mas a Figura 4 é a da caixa escura do experimento 1 — a figura correta é a <b>13 (a)</b>, citada no passo seguinte.</span></li>
    <li>Coloque o espelho no meio do papel, em pé, sobre a base.</li>
    <li>Desenhe com cuidado a linha <b>I-J</b> para marcar a posição do espelho. Faça isso antes de qualquer outra coisa — se o espelho sair do lugar, a linha salva o experimento.</li>
    <li>Use o <b>método dos raios</b> do experimento anterior para desenhar dois raios que <b>parecem ser emitidos pela imagem</b> do alfinete. Chame-os de raio <b>2-3</b> e raio <b>4-5</b>.</li>
    <li>Prolongue os raios 2-3 e 4-5 <b>para trás do espelho</b> até encontrarem a posição da imagem. Se quiser, retire o espelho — a posição dele já está marcada.</li>
    <li>Meça a distância perpendicular <b>d₁</b> da imagem 1' até a reta do espelho, e compare com a distância perpendicular <b>d</b> do alfinete 1 ao espelho.</li>
    <li>Oriente o raio 2-3 no sentido que aponta para <b>fora</b> do espelho.</li>
    <li>Trace a reta ligando o alfinete 1 ao ponto <b>C</b>, onde o raio 2-3 cruza a reta I-J. Oriente a reta 1-C no sentido de afastar-se do alfinete.</li>
    <li>Trace a normal em C e meça os ângulos <b>α</b> e <b>β</b> formados pelo raio 2-3 e pela reta 1-C com essa normal.</li>
    <li>Repita o mesmo com o raio 4-5: chame de <b>G</b> o cruzamento com I-J, ligue 1-G, trace a normal em G e meça os ângulos <b>γ</b> e <b>δ</b>.</li>
  </ol>
  <p><b>Perguntas do roteiro.</b></p>
  <ol style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>A reta poligonal orientada 1-C-2-3 é a trajetória de um raio luminoso? Por quê?</li>
    <li>Os raios que parecem ser emitidos pela imagem do alfinete 1 são os raios refletidos no espelho? Por quê?</li>
    <li>Um ser humano entra num quarto pouco iluminado e vê dois objetos absolutamente iguais. Ele é capaz de dizer se os dois são reais ou se um deles é a imagem do outro num espelho plano?</li>
  </ol>
  <div class="why"><span class="t">Os dois resultados que o experimento entrega</span>Primeiro: <b>d₁ = d</b> dentro das incertezas — a imagem é simétrica ao objeto em relação ao plano do espelho. Segundo: <b>α = β</b> e <b>γ = δ</b> — o ângulo de incidência é igual ao de reflexão. Você acabou de medir a <b>lei da reflexão</b>. E a imagem é <b>virtual</b>: nenhum raio de luz passa realmente por 1'; eles apenas parecem vir de lá, e é por isso que ela não pode ser projetada num anteparo.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>O erro sistemático que quase todo mundo comete</h5>
    <ul>
      <li>Espelho comum é <b>espelhado no verso</b>: a camada refletora fica <i>atrás</i> do vidro. Quando você desenha a linha I-J encostando o lápis na face da frente, está marcando a posição errada — a reflexão de verdade acontece alguns milímetros mais atrás.</li>
      <li>O efeito não é aleatório, é <b>sistemático</b>: ele empurra a imagem para trás e faz <b>d₁ sair consistentemente maior que d</b>. Se seus dois valores diferirem sempre no mesmo sentido, e por uma quantia da ordem da espessura do vidro, você achou a causa.</li>
      <li>Como lidar: marque I-J pela face frontal, que é o que dá para fazer, e <b>declare isso na discussão</b> como fonte de erro sistemático, estimando a espessura do espelho. Reconhecer um viés e quantificá-lo vale muito mais do que fingir que ele não existe.</li>
    </ul>
    <h5>Montagem</h5>
    <ul>
      <li>Espelho <b>perfeitamente vertical</b> na base. Inclinação faz a imagem sair do plano do papel, e aí os raios traçados não se cruzam onde deveriam.</li>
      <li>Trace a linha I-J <b>antes de qualquer outra coisa</b>, com o espelho ainda posicionado. Depois disso, se ele escorregar, você recoloca.</li>
      <li>Ponha o alfinete 1 a uma distância confortável do espelho — nem colado, nem no canto da folha. Você vai precisar de espaço para prolongar os raios <b>para trás</b> do espelho.</li>
    </ul>
    <h5>Traçado e ângulos</h5>
    <ul>
      <li>Desenhe as normais com <b>esquadro</b> ou usando a quadrícula do milimetrado. Normal torta contamina α, β, γ e δ de uma vez.</li>
      <li>Meça sempre a partir da <b>normal</b>, nunca da superfície do espelho. É a mesma convenção do experimento 5.</li>
      <li>Prolongue os raios com traço fino e contínuo. Traço tremido espalha o cruzamento e a imagem "some" numa região em vez de num ponto.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> dois resultados devem aparecer. <b>d₁ ≈ d</b> dentro das incertezas, com a diferença explicável pela espessura do vidro; e <b>α ≈ β</b> e <b>γ ≈ δ</b>, que é a lei da reflexão. Se os ângulos baterem em poucos graus, seu traçado está bom.</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Marcar a linha do espelho na frente do vidro em vez de na superfície refletora — que fica atrás, e essa diferença de milímetros aparece na medida · espelho não perfeitamente vertical · prolongar os raios com traço tremido, o que espalha o cruzamento · medir os ângulos a partir do espelho em vez da normal · esquecer de orientar as retas com o sentido de propagação, que o roteiro pede explicitamente.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">6</span>Experimento 6 · A luz se propaga em linha reta</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Verificar diretamente a propagação retilínea com laser e três orifícios</span></div>
    <div><b>Bônus</b><span>Tornar o feixe visível com pó de giz</span></div>
    <div><b>Papel milimetrado</b><span>não precisa</span></div>
  </div>
  <div class="slidebox"><div class="t">Antes de começar, responda no caderno</div><ul>
    <li>1. O que são fontes de luz?</li>
    <li>2. Olhe ao seu redor e faça uma lista de objetos que se comportam como fontes de luz.</li>
    <li>3. Quando dizemos que uma fonte de luz é pontual ou puntiforme?</li>
    <li>4. E quando dizemos que uma fonte de luz é extensa?</li>
    <li>5. O que é um raio luminoso?</li>
    <li>6. O que acontece com a luz ao encontrar um objeto opaco?</li>
  </ul></div>
  <p>Estas seis perguntas prévias não são enfeite: elas recuperam tudo que os experimentos 1 e 2 construíram. Responda antes de ir, com suas palavras — o monitor pode perguntar, e a resposta ao item 3 e 4 sai direto do experimento 2.</p>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Três blocos de madeira perfurados idênticos, ou três dobradiças de porta idênticas</li>
    <li>Caneta laser · pó de giz, talco ou farinha de trigo · anteparo (papel A4 ou parede)</li>
    <li><b>Papel milimetrado</b></li>
  </ul></div>
  <div class="callout plus"><b>Divergência sobre o papel milimetrado.</b> A lista de material do roteiro <b>inclui</b> papel milimetrado neste experimento, mas a apresentação da monitoria não lista o 6 entre os que exigem. Como custa pouco, <b>leve mesmo assim</b> — melhor sobrar que faltar na frente do monitor.</div>

    <div class="figcap">O feixe só é visível de lado quando há algo para espalhar a luz. No ar limpo, você vê o ponto onde ele bate — mas não o caminho.</div>

  <p><b>Procedimento.</b></p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Alinhe os três blocos ou três dobradiças. Use uma régua, ou tome um dos lados da mesa como referência para o alinhamento.</li>
    <li>De uma das extremidades, faça o laser atravessar os orifícios.</li>
    <li>O que você observa no anteparo?</li>
    <li>Agora <b>desalinhe</b> o orifício de um dos blocos.</li>
    <li>O que você observa no anteparo?</li>
    <li>Você consegue observar o facho do laser que se propaga pelo ar até atingir o obstáculo?</li>
    <li>Com a ajuda de alguém, jogue <b>pó de giz</b> em cima da luz do laser. O que acontece? Agora você consegue ver o facho?</li>
    <li>O que você pode concluir sobre a propagação da luz no ar?</li>
  </ol>
  <div class="why"><span class="t">A física do item g)</span>Você não enxerga um feixe de luz "de lado" no ar limpo, porque a luz só chega ao seu olho se algo a <b>desviar</b> na sua direção. As partículas de giz fazem esse papel: espalham a luz em todas as direções, e uma fração dela atinge seu olho — revelando o trajeto. É o mesmo motivo pelo qual se veem raios de sol atravessando a poeira de um galpão, ou os faróis num dia de neblina. E é também o motivo pelo qual o céu é azul: espalhamento da luz solar pelas moléculas do ar.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>Conseguindo o alinhamento</h5>
    <ul>
      <li>Use a <b>borda da mesa</b> como referência reta e encoste os três blocos nela. É mais confiável que alinhar no olho, e é a própria sugestão do roteiro.</li>
      <li>Alinhe os blocos <b>antes</b> de acender o laser, e depois só ajuste finamente. Tentar alinhar perseguindo o ponto vermelho leva muito mais tempo.</li>
      <li>Confira a altura: os três orifícios precisam estar na <b>mesma altura</b>, não só na mesma linha. Se um bloco estiver sobre uma dobra do papel ou desnivelado, o feixe passa por cima.</li>
      <li>Anteparo branco e sala mais escura aumentam muito o contraste do ponto.</li>
    </ul>
    <h5>O momento do pó de giz</h5>
    <ul>
      <li><b>Combine antes com o monitor</b> — em algumas bancadas isso não é permitido por causa da sujeira nos equipamentos.</li>
      <li>Use <b>pouco</b> pó, e jogue de cima, deixando cair através do feixe. Nuvem densa demais espalha luz para todo lado e some com o contraste.</li>
      <li>Fotografe ou desenhe o feixe visível na hora. É a observação mais bonita do experimento e a que sustenta a conclusão do item h).</li>
    </ul>
    <h5>Segurança com o laser</h5>
    <ul>
      <li><b>Nunca</b> aponte para os olhos, nem para os do colega ou do monitor, nem por um instante. Ao pegar ou soltar a caneta, mantenha o feixe apontado para a mesa.</li>
      <li>Cuidado com <b>reflexos</b>: relógio, anel, celular e superfícies metálicas devolvem o feixe em direções que você não controla. Tire acessórios brilhantes da bancada.</li>
      <li>Se possível, <b>apoie ou fixe</b> a caneta em vez de segurá-la solta — reduz tremor e reduz o risco de varrer o feixe pela sala sem querer.</li>
      <li>Nunca observe o feixe através de lupa, binóculo ou qualquer instrumento óptico.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> alinhados, aparece um ponto nítido no anteparo; desalinhando <b>um único</b> bloco, o ponto some por completo — a luz não contorna o obstáculo. E com o pó, o trajeto aparece como uma linha <b>reta</b> entre a caneta e o bloco. Esses três fatos juntos são a resposta do item h).</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Jogar pó demais e sujar a sala e o equipamento — use pouco, e combine antes com o monitor · apontar o laser para os olhos de alguém ao virar a caneta · concluir apenas "a luz anda reto" sem articular <b>por que</b> o desalinhamento prova isso · não registrar as respostas das seis perguntas prévias, que fazem parte do experimento.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">7</span>Experimento 7 · Raios de luz vão e voltam pelo mesmo caminho</h3>
  <div class="numgrid">
    <div><b>Objetivo</b><span>Verificar o princípio da reversibilidade dos raios luminosos</span></div>
    <div><b>Montagem</b><span>Dois espelhos planos e uma folha branca</span></div>
    <div><b>Truque</b><span>Duas cores de caneta, uma para cada sentido</span></div>
  </div>
  <div class="slidebox"><div class="t">Antes de começar, responda no caderno</div><ul>
    <li>1. O que são espelhos?</li>
    <li>2. Quais os tipos de espelho que você conhece? Faça uma lista.</li>
    <li>3. De que forma a luz se comporta ao interagir com um meio transparente e polido?</li>
    <li>4. Quais as leis que regem a interação da luz com um meio transparente e polido?</li>
  </ul></div>
  <div class="slidebox"><div class="t">Material utilizado</div><ul>
    <li>Dois espelhos planos · folha de papel · caneta laser · régua · caneta · <b>alfinete</b></li>
  </ul></div>
  <div class="callout plus"><b>Duas observações sobre o material.</b> O roteiro lista <b>alfinete</b> aqui, provavelmente para prender a folha ou marcar pontos da trajetória. E, ao contrário do que a monitoria divulgou, a lista deste experimento <b>não</b> menciona papel milimetrado — mas leve, já que a monitoria pede. Sobre as canetas: o roteiro cita "caneta" no singular na lista, e no passo g) pede explicitamente uma <b>de cor diferente</b> para a segunda trajetória. Leve duas.</div>

    <div class="figttl">A mesma trajetória, nos dois sentidos</div>
