    <div class="figcap">Este é o ponto que quem cita Feynman fora de contexto ignora: há <b>graus</b>. Tratar as três afirmações como equivalentes porque "nada é certo" é justamente o erro que ele estava combatendo.</div>
  </div>
  <p><b>Um ponto que costuma ser mal contado.</b> O método científico não é uma receita rígida seguida em ordem por todo cientista. Descobertas acontecem por acaso, por analogia, por insistência em anomalias. O que caracteriza a ciência não é o roteiro, e sim o <b>compromisso</b>: toda afirmação precisa ser testável, o método precisa ser público para que outros repitam, e a conclusão precisa ceder diante de evidência contrária. É por isso que a astronomia, apesar de não poder fazer experimentos no sentido de laboratório — ninguém coloca uma estrela sobre a bancada —, é ciência plena: ela faz <b>previsões verificáveis</b> por observação.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este módulo é o elo com a CMT111, que trata de como a ciência se constrói. E é o preparo direto para os dois módulos finais: os limites do conhecimento científico e o que é pseudociência.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que ciência exige experimento controlado. Astronomia, geologia e cosmologia são <b>ciências observacionais</b>: não se manipula o objeto, mas se testam previsões contra observações novas — e isso basta.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">19</span>Os limites da ciência</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li><i>"O conhecimento científico pode ser descrito como um grupo de asserções com graus variáveis de incerteza; algumas mais prováveis que outras, mas nenhuma absolutamente certa."</i> — R. Feynman</li>
  </ul></div>
  <p>A citação de Richard Feynman é o coração filosófico da aula, e é fácil lê-la como derrotismo. Não é. Ela diz três coisas.</p>
  <p><b>Primeira: certeza absoluta não faz parte do pacote.</b> Nenhuma afirmação científica é definitiva, porque toda ela permanece exposta a evidência futura. Isso não é fraqueza — é exatamente o que permite à ciência se corrigir. Um sistema que oferecesse certeza absoluta seria, por construção, incapaz de aprender.</p>
  <p><b>Segunda: há graus.</b> "Nada é absolutamente certo" não significa que tudo vale igual. Que a Terra orbita o Sol é uma asserção com incerteza tão pequena que, para qualquer efeito prático, é fato. Que a energia escura acelera a expansão é bem sustentado, mas com margem maior. Que existe vida em outro planeta é, por ora, especulação informada. Confundir esses três níveis é o erro típico de quem usa Feynman para justificar que "cientista também não sabe de nada".</p>
  <p><b>Terceira: a incerteza é declarada.</b> Ciência publica sua margem de erro. Hiparco entregando "62 a 73 raios terrestres" faz exatamente isso, dois mil anos antes. Um resultado sem incerteza declarada não é mais confiável — é menos, porque esconde o que não sabe.</p>
  <div class="callout plus"><b>O que a ciência não responde.</b> Há perguntas que o método simplesmente não alcança, porque não geram previsões testáveis: se a vida tem propósito, o que é justo, se uma obra é bela. Não são perguntas inferiores — são perguntas de outra natureza, e pertencem à filosofia, à ética, à arte. Reconhecer esse limite é parte da honestidade científica, e é o oposto do cientificismo, que trata o método como única forma legítima de conhecimento.</div>
  <div class="why"><span class="t">Por que isso importa</span>Esse é o ponto exato que separa a ciência da pseudociência do próximo módulo. Pseudociência costuma prometer o que a ciência recusa: certeza total, explicação para tudo, ausência de margem de erro.</div>
  <div class="trap"><span class="t">Erro comum</span>Usar a frase de Feynman para relativizar tudo. Ele está defendendo o rigor, não o abandono dele: o cientista honesto <b>quantifica</b> sua incerteza em vez de fingir que não existe.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">20</span>Pseudociência</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Pseudociência.</li>
  </ul></div>
  <p>O slide final traz apenas imagens, mas o assunto encerra a aula e conversa diretamente com a distinção astronomia/astrologia que apareceu na Aula 01. <b>Pseudociência</b> é um conjunto de afirmações apresentadas com aparência de ciência — vocabulário técnico, gráficos, menção a "estudos" — mas que não se submete ao que torna a ciência confiável<sup class="ref">15</sup>.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Sinal de alerta</th><th>Como se manifesta</th><th>Como a ciência se comporta</th></tr></thead>
    <tbody>
      <tr><td>Infalseabilidade</td><td>A afirmação se ajusta a qualquer resultado; nenhuma observação poderia refutá-la</td><td>Especifica de antemão o que contaria como refutação</td></tr>
      <tr><td>Imunidade à evidência contrária</td><td>Quando o teste falha, inventa-se uma explicação ad hoc para salvar a tese</td><td>Revisa ou abandona a hipótese</td></tr>
      <tr><td>Ausência de revisão por pares</td><td>Divulga direto ao público, evitando o crivo técnico</td><td>Publica em periódicos onde especialistas podem atacar o método</td></tr>
      <tr><td>Apelo à conspiração</td><td>Explica a rejeição acadêmica como perseguição, não como falha de evidência</td><td>Trata rejeição como sinal de que falta evidência melhor</td></tr>
      <tr><td>Estagnação</td><td>Repete os mesmos argumentos por décadas, sem produzir resultado novo</td><td>Progride: novas previsões, novos testes, novas descobertas</td></tr>
      <tr><td>Anedota como prova</td><td>Casos isolados e depoimentos substituem estatística</td><td>Exige amostra, controle e significância</td></tr>
      <tr><td>Promessa de certeza</td><td>Oferece respostas totais e sem margem de erro</td><td>Declara incerteza — como na frase de Feynman</td></tr>
    </tbody></table></div>
  <p><b>Exemplos que orbitam a astronomia.</b> A <b>astrologia</b>, já discutida. O <b>terraplanismo</b>, que exige descartar navegação, aviação, geodésia e toda a exploração espacial de uma vez. A alegação de que as <b>missões Apollo</b> foram encenadas, contrariada inclusive por refletores a laser deixados na Lua, que qualquer observatório equipado pode usar até hoje. As profecias de fim do mundo baseadas em <b>alinhamentos planetários</b> ou no fim de um ciclo do calendário maia, como em 2012 — que, como visto no módulo 12, era apenas o fim de um ciclo de contagem, sem qualquer previsão associada.</p>
  <p><b>Três casos para analisar com a tabela na mão.</b> O exercício de aplicar os critérios é mais útil que decorá-los.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Caso</th><th>Que sinais aparecem</th><th>O que a ciência responde</th></tr></thead>
    <tbody>
      <tr><td><b>Astrologia</b></td><td>Infalseabilidade — previsões vagas o bastante para caber em qualquer resultado; anedota como prova; estagnação: os mesmos princípios há dois mil anos, sem revisão sequer diante da precessão</td><td>Testes cegos, em que astrólogos tentam parear cartas natais a perfis de personalidade, não superam o acaso</td></tr>
      <tr><td><b>Terraplanismo</b></td><td>Apelo à conspiração em escala global; hipóteses ad hoc para cada evidência contrária; rejeição seletiva de dados</td><td>Exigiria descartar de uma vez navegação, aviação, geodésia, satélites e a própria medida de Eratóstenes, de 240 a.C.</td></tr>
      <tr><td><b>Apollo como encenação</b></td><td>Anedota visual — "as sombras estão erradas" — no lugar de análise; ignora evidência independente</td><td>Refletores a laser deixados na Lua são usados até hoje por observatórios de vários países para medir a distância Terra-Lua com precisão de centímetros</td></tr>
    </tbody></table></div>
  <p><b>Por que pseudociência é atraente.</b> Vale entender o mecanismo, não só rotular. Ela oferece três coisas que a ciência recusa: <b>certeza</b>, num mundo em que a resposta honesta costuma ser "provavelmente"; <b>simplicidade</b>, com uma explicação única para fenômenos complexos; e <b>pertencimento</b>, colocando quem acredita no grupo dos que enxergam o que os outros não veem. Nada disso tem a ver com inteligência — pessoas muito inteligentes caem, e caem justamente por serem hábeis em construir justificativas para o que já querem acreditar.</p>
  <p><b>O caso do éter merece um parágrafo.</b> No século XIX, físicos supunham que a luz precisava de um meio para se propagar, chamado éter luminífero. Era hipótese respeitável, defendida por gente de primeira linha. Em 1887, o experimento de <b>Michelson-Morley</b> tentou detectar o movimento da Terra através desse meio — e não encontrou nada. O resultado negativo derrubou a hipótese e pavimentou o caminho para a relatividade restrita, em 1905. Repare no contraste com a tabela acima: a comunidade científica <b>projetou o teste que poderia matar sua própria ideia</b>, aceitou o resultado e mudou de posição. É essa disposição, e não o acerto, que define ciência.</p>
  <p><b>Uma distinção que importa.</b> Estar errado não faz de alguém pseudocientista. A física do século XIX estava errada sobre o éter luminífero, e era ciência de primeira linha: a hipótese era testável, foi testada — no experimento de Michelson-Morley — e foi abandonada quando falhou. Pseudociência não é o erro; é a <b>recusa em se expor ao teste</b>.</p>
  <div class="why"><span class="t">Por que isso importa</span>Como futuro cientista das Ciências da Terra, você vai encontrar isso profissionalmente: negação de mudança climática, contestação da idade da Terra, alegações sobre "energias" de minerais. Ter o critério de demarcação claro é ferramenta de trabalho — e é o tipo de tema que rende discursiva de opinião fundamentada.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que basta usar palavras técnicas para ser ciência, ou que hipótese ousada é pseudociência. Buracos negros, matéria escura e Big Bang foram ideias ousadíssimas — e são ciência porque geraram previsões que foram testadas.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">!</span>Precisões e complementos</h3>
  <div class="callout"><b>"Universo visível: 15 bilhões de anos-luz."</b> O número mistura duas ideias. A idade do Universo é de ~13,8 bilhões de anos, e esse é o tempo de viagem da luz. Mas, por causa da expansão, a distância <b>atual</b> até a borda do que podemos observar é de ~46,5 bilhões de anos-luz<sup class="ref">3</sup>. Se a questão pedir a idade, use 13,8 Ga; se pedir o raio do Universo observável, use ~46 bilhões de anos-luz.</div>
  <div class="callout"><b>"Via Láctea: 50.000 anos-luz."</b> É o <b>raio</b>. O diâmetro usualmente citado é de ~100.000 anos-luz<sup class="ref">2</sup>. Preste atenção ao que o enunciado pede.</div>
  <div class="callout"><b>"Grupo Local: 1,5 milhão de anos-luz."</b> Estimativas modernas costumam falar em alguns milhões de anos-luz de extensão, e a distância só até Andrômeda já é de ~2,5 milhões. O valor depende de quais galáxias anãs se contam como membros. A ordem de grandeza — milhões de anos-luz — é o que importa.</div>
  <div class="callout"><b>"~100 bilhões de galáxias."</b> Estimativa clássica. Em 2016 propôs-se 2 trilhões<sup class="ref">4</sup>; medidas de 2021 puxaram de volta para centenas de bilhões<sup class="ref">5</sup>. A conta do slide segue válida como ordem de grandeza, e o debate é excelente exemplo de ciência em revisão.</div>
  <div class="callout"><b>Sosígenes, não Sisógenes.</b> O astrônomo alexandrino consultado por Júlio César aparece grafado como Sosígenes na literatura. Diferença de transliteração, sem consequência conceitual.</div>
  <div class="callout"><b>Aristarco e o raio da Lua.</b> O slide traz 1/3; o valor moderno é 0,27 do raio terrestre<sup class="ref">9</sup>, ou cerca de 1/3,7. O slide está certo como aproximação da estimativa histórica.</div>
  <div class="callout"><b>"O Sol está 380 vezes mais distante que a Lua."</b> Usando 149,6 milhões de km e 384.400 km, a razão dá ~389<sup class="ref">9</sup><sup class="ref">10</sup>. O slide arredonda para 380 — sem problema, mas se a prova pedir a conta, use os valores exatos.</div>
  <div class="callout plus"><b>Sobre o eclipse de Hiparco.</b> Alguns autores situam o evento em 190 a.C., em vez de 129 a.C., e há discussão sobre quais cidades foram usadas. O método e a ordem de grandeza do resultado são consensuais; a data específica, menos. Como o slide adota 129 a.C., é essa que vale para a prova.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">G</span>Glossário da aula</h3>
  <div class="gloss">
    <div><b>Ordem de grandeza</b>A potência de dez mais próxima de um valor. Comparar ordens de grandeza é comparar expoentes, não dígitos.</div>
    <div><b>Estimativa de Fermi</b>Cálculo aproximado que combina quantidades conhecidas para chegar a um resultado válido dentro de um fator de dez. É o método do slide das 10²² estrelas.</div>
    <div><b>Ano cósmico</b>Escala em que os 13,8 bilhões de anos do Universo são comprimidos num único ano. Cada segundo equivale a ~440 anos.</div>
    <div><b>Ano trópico</b>Intervalo entre dois equinócios de março: 365 dias, 5 h, 48 min e 46 s. É o ano que os calendários solares tentam acompanhar.</div>
    <div><b>Mês sinódico</b>Intervalo entre duas luas novas: 29,5 dias. É a base dos calendários lunares.</div>
    <div><b>Calendário lunar</b>Segue apenas as fases da Lua; 12 meses somam ~354 dias e as datas deslizam pelas estações. Caso do islâmico.</div>
    <div><b>Calendário luni-solar</b>Usa meses lunares e insere meses extras para não perder as estações. Casos do judaico e do chinês.</div>
    <div><b>Ciclo metônico</b>Constatação de que 19 anos solares equivalem quase exatamente a 235 meses lunares. É a base da intercalação no calendário judaico.</div>
    <div><b>Calendas</b>Primeiro dia do mês romano, quando se anunciavam dívidas. Origem da palavra calendário.</div>
    <div><b>Calendário juliano</b>Reforma de 46 a.C., com ano médio de 365,25 dias e um bissexto a cada quatro anos. Sobrestima o ano em 11 minutos.</div>
    <div><b>Calendário gregoriano</b>Reforma de 1582, que removeu três bissextos a cada quatro séculos. Ano médio de 365,2425 dias.</div>
    <div><b>Ano da confusão</b>O ano de 46 a.C., esticado para 445 dias para colocar o calendário juliano em fase com as estações.</div>
    <div><b>Diâmetro angular</b>Ângulo que um objeto ocupa no céu. O da Lua e o do Sol valem ambos cerca de meio grau.</div>
    <div><b>Medida indireta</b>Obter uma grandeza inacessível a partir de outra, mensurável, por meio de um modelo. Método de Aristarco e de toda a astronomia.</div>
    <div><b>Paralaxe</b>Diferença na posição aparente de um objeto vista de dois pontos distintos. Hiparco a usou entre duas cidades; hoje se usa entre dois pontos da órbita da Terra.</div>
    <div><b>Propagação de erro</b>Como a incerteza de uma medida se transmite ao resultado final. O caso dos 87° de Aristarco é o exemplo clássico de amplificação.</div>
    <div><b>Heliocentrismo</b>Modelo em que a Terra e os planetas orbitam o Sol. Proposto por Aristarco no século III a.C. e retomado por Copérnico em 1543.</div>
    <div><b>Geocentrismo</b>Modelo com a Terra imóvel no centro. Consolidado por Ptolomeu, dominou por catorze séculos por ter bom poder preditivo.</div>
    <div><b>Arqueoastronomia</b>Estudo de como sociedades antigas observavam e registravam o céu, a partir de monumentos e vestígios materiais.</div>
    <div><b>Nascer helíaco</b>Primeira aparição de uma estrela no horizonte leste pouco antes do amanhecer, após período de invisibilidade. O de Sirius anunciava a cheia do Nilo.</div>
    <div><b>Método científico</b>Compromisso com afirmações testáveis, método público e revisão diante de evidência contrária — mais do que uma sequência fixa de etapas.</div>
    <div><b>Falseabilidade</b>Propriedade de uma afirmação que pode, em princípio, ser refutada por observação. Critério central de demarcação.</div>
    <div><b>Pseudociência</b>Conjunto de afirmações com aparência científica que não se submete a teste, revisão nem refutação.</div>
    <div><b>Hipótese ad hoc</b>Remendo criado só para salvar uma tese de evidência contrária, sem gerar previsão nova. Sinal clássico de pseudociência.</div>
    <div><b>Ciência observacional</b>Ciência que não manipula seu objeto, mas testa previsões contra novas observações. Caso da astronomia, da geologia e da cosmologia.</div>
  </div>
</div>

<div class="lsec">
  <h3><span class="lnum">✓</span>O que provavelmente cai da Aula 02</h3>
  <p class="lead">Esta aula é mais "cobrável" que a primeira: ela tem números redondos, datas, regras e um raciocínio geométrico fechado. É material que se encaixa com facilidade tanto em objetiva quanto em discursiva.</p>

  <p><b>Onde eu apostaria as fichas.</b> Três candidatos se destacam. O primeiro é a <b>regra do bissexto</b>, porque é objetiva, tem pegadinha embutida (1900) e o professor gastou um slide inteiro nela. O segundo é o <b>método de Aristarco</b>, porque é o único raciocínio geométrico completo da aula e presta-se a discursiva de mecanismo. O terceiro é a <b>demarcação ciência/pseudociência</b>, porque encerra a aula, conversa com a CMT111 e permite uma questão de opinião fundamentada.</p>
  <div class="why"><span class="t">Simulado relâmpago</span><b>(1)</b> 1900 foi bissexto? E 2000? Justifique com a regra. <b>(2)</b> Explique em três frases como Aristarco estimou o tamanho da Lua. <b>(3)</b> Por que o calendário islâmico faz o Ramadã mudar de estação? <b>(4)</b> Qual a diferença entre 13,8 bilhões de anos e 46,5 bilhões de anos-luz? <b>(5)</b> Cite três sinais de alerta de pseudociência. <b>(6)</b> Por que 10¹¹ × 10¹¹ = 10²² e não 2 × 10¹¹?</div>

  html:`
<div class="lsec">
  <h3><span class="lnum">0</span>Onde esta aula se encaixa</h3>
  <p class="lead">A Aula 03 desce do cosmos para o céu que você enxerga da janela. Depois das escalas gigantescas e das medidas gregas, o professor volta ao concreto: como descrever o que se vê, por que o céu gira, por que ele muda ao longo do ano e por que existem estações.</p>
  <p>O roteiro tem seis blocos encadeados. Primeiro o <b>modelo</b> — a esfera celeste e seus marcadores. Depois as <b>constelações</b>, que são o vocabulário de posição. Em seguida os <b>movimentos reais</b> da Terra, rotação e translação, e o <b>movimento aparente</b> que eles produzem no céu. Daí sai a <b>eclíptica</b>, o caminho do Sol entre as estrelas. E tudo desemboca nas <b>estações</b>, a consequência mais palpável de toda essa geometria.</p>
  <p>Este é provavelmente o conteúdo mais cobrável do módulo até agora: tem definições precisas, datas, ângulos e um mecanismo que se explica em três frases. Vale estudar com atenção — e com um cuidado extra, porque quase todo material didático de astronomia é escrito no hemisfério norte, e várias afirmações se invertem para quem mora no Rio de Janeiro. O módulo de precisões, no fim, trata disso em detalhe.</p>
</div>

<div class="lsec">
  <h3><span class="lnum">1</span>A esfera celeste: um modelo que não existe</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>O céu, visto por um observador terrestre, parece uma abóbada. Sem a noção de perspectiva, devido à distância aos corpos celestes, temos a impressão de que nos circunda uma esfera de raio indeterminado.</li>
    <li>As milhares de estrelas vistas no céu estão a distâncias muito distintas, o que torna difícil imaginar a distribuição 3D delas.</li>
    <li>Para observações simples podemos considerar como se todas estivessem à mesma distância, espalhadas num domo gigante sobre nós.</li>
    <li>A esfera celeste não tem realidade física, sendo um dos primeiros modelos usados pelos humanos para descrever o Universo conhecido.</li>
  </ul></div>
  <p>A frase decisiva é a última: <b>a esfera celeste não tem realidade física</b>. Ela é um <b>modelo</b> — e é útil justamente por ser falsa de um jeito controlado. Ao fingir que todas as estrelas estão à mesma distância, você joga fora a informação de profundidade, que não interessa para descrever posições, e fica com um problema de geometria esférica com apenas dois ângulos.</p>
  <p>Por que a ilusão funciona tão bem? Porque as estrelas estão <b>tão longe</b> que nossa percepção de profundidade não alcança. O cérebro estima distância comparando as imagens dos dois olhos, e essa técnica se esgota a poucas dezenas de metros. Para tudo além disso, o céu vira superfície. É por isso que ninguém, olhando para cima, percebe que Sirius está a 8,6 anos-luz e Betelgeuse a mais de 500: as duas parecem igualmente grudadas no mesmo domo.</p>
  <p><b>Um modelo falso pode ser uma ferramenta excelente.</b> É exatamente o que a Aula 02 discutiu sobre método. A esfera celeste faz previsões corretas sobre onde um astro estará amanhã, embora esteja errada sobre a estrutura do Universo. A astronomia de posição, a navegação e todo o apontamento de telescópios funcionam em cima dela até hoje — e nenhum astrônomo acredita que exista uma esfera de cristal ali em cima.</p>
  <div class="why"><span class="t">Por que isso importa</span>É o primeiro contato do curso com a ideia de <b>modelo</b>: uma representação deliberadamente simplificada, adotada porque funciona no domínio pretendido. Física e geociências farão isso o tempo todo — ponto material, gás ideal, Terra esférica. Saber quando o modelo vale e quando quebra é a competência central.</div>
  <div class="trap"><span class="t">Erro comum</span>Tratar a esfera celeste como coisa real, ou como "o erro dos antigos". Ela segue em uso profissional. O erro dos antigos não foi usar o modelo — foi acreditar que a esfera existia de fato e que era ela que girava.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">2</span>Os marcadores: polos e equador celestes</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Na esfera celeste podemos imaginar alguns marcadores, como os polos norte e sul celestes, além do equador celeste.</li>
    <li>Estes são extensões dos polos e do equador terrestres para a esfera celeste.</li>
    <li>Estes marcadores eram muito úteis para navegadores.</li>
  </ul></div>
  <p>A ideia é simples e poderosa: <b>projetar a Terra no céu</b>. Prolongue o eixo de rotação em ambas as direções até furar a esfera celeste — os dois pontos obtidos são os <b>polos celestes</b>. Infle o plano do equador terrestre até cortar a esfera — o círculo resultante é o <b>equador celeste</b>. Feito isso, o céu ganha um sistema de referência rígido, com equivalentes de latitude e longitude.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Na Terra</th><th>Projetado no céu</th><th>Para que serve</th></tr></thead>
    <tbody>
      <tr><td>Polo Norte e Polo Sul</td><td>Polos celestes norte e sul</td><td>Eixo em torno do qual o céu inteiro parece girar</td></tr>
      <tr><td>Equador</td><td>Equador celeste</td><td>Referência para medir a declinação</td></tr>
      <tr><td>Latitude</td><td>Declinação</td><td>Distância angular ao norte ou ao sul do equador celeste</td></tr>
      <tr><td>Longitude</td><td>Ascensão reta</td><td>Posição ao longo do equador celeste, a partir do ponto vernal</td></tr>
    </tbody></table></div>
  <div class="fig">
    <div class="figttl">Figura · A altura do polo celeste é a sua latitude</div>
    <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(115,110)">
        <circle r="46" fill="#38bdf8" opacity=".55"/>
        <line x1="-46" y1="0" x2="46" y2="0" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="3 2"/>
        <circle cx="0" cy="-46" r="4" fill="#B23A2B"/>
        <line x1="0" y1="-46" x2="0" y2="-80" stroke="#B23A2B" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text y="72" font-size="10" font-weight="800" fill="var(--text)" text-anchor="middle">Equador · 0°</text>
        <text y="88" font-size="9" fill="var(--muted)" text-anchor="middle">polo no horizonte</text>
      </g>
      <g transform="translate(350,110)">
        <circle r="46" fill="#38bdf8" opacity=".55"/>
        <line x1="-46" y1="0" x2="46" y2="0" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="3 2"/>
        <circle cx="18" cy="42" r="4" fill="#B23A2B"/>
        <line x1="18" y1="42" x2="42" y2="72" stroke="#B23A2B" stroke-width="1.6" stroke-dasharray="4 3"/>
        <path d="M4 46 A 20 20 0 0 1 22 56" fill="none" stroke="#0E8C93" stroke-width="1.8"/>
        <text x="-6" y="66" font-size="9.5" font-weight="800" fill="#0E8C93" text-anchor="end">23°</text>
        <text y="90" font-size="10" font-weight="800" fill="var(--text)" text-anchor="middle">Rio · 23° S</text>
        <text y="106" font-size="9" fill="var(--muted)" text-anchor="middle">polo a 23° de altura</text>
      </g>
      <g transform="translate(585,110)">
        <circle r="46" fill="#38bdf8" opacity=".55"/>
        <line x1="-46" y1="0" x2="46" y2="0" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="3 2"/>
        <circle cx="0" cy="46" r="4" fill="#B23A2B"/>
        <line x1="0" y1="46" x2="0" y2="80" stroke="#B23A2B" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text y="72" font-size="10" font-weight="800" fill="var(--text)" text-anchor="middle">Polo · 90° S</text>
        <text y="88" font-size="9" fill="var(--muted)" text-anchor="middle">polo no zênite</text>
      </g>
      <text x="350" y="24" font-size="10.5" font-weight="800" fill="var(--text)" text-anchor="middle">quanto mais perto do polo terrestre, mais alto o polo celeste</text>
    </svg>
    <div class="figcap">Medir a altura do polo celeste é medir a própria latitude. Foi essa relação de uma linha que permitiu navegar por milênios sem qualquer relógio.</div>
  </div>
  <p><b>Por que os navegadores se importavam tanto.</b> Existe uma relação de uma linha que resolvia metade do problema da navegação: a <b>altura do polo celeste acima do horizonte é igual à sua latitude</b>. Se você está a 23° sul, o polo sul celeste está a 23° acima do horizonte sul. No hemisfério norte o truque é fácil, porque a estrela Polar fica quase exatamente sobre o polo — basta medir a altura dela. No hemisfério sul não há estrela brilhante no polo, e por isso se usa o <b>Cruzeiro do Sul</b>: prolongando cerca de 4,5 vezes o braço maior da cruz, chega-se à posição aproximada do polo sul celeste.</p>
  <p>Vale conectar com a Aula 02: é por isso que a <b>latitude</b> sempre foi fácil e a <b>longitude</b> foi o pesadelo de três séculos. Latitude se lê direto no céu, com um instrumento de ângulo. Longitude exige comparar horas, e portanto um relógio confiável a bordo.</p>
  <div class="why"><span class="t">Por que isso importa</span>Este sistema é o que permite catalogar objetos. Quando você ler as coordenadas de uma galáxia num artigo, serão ascensão reta e declinação — exatamente estes marcadores. É a infraestrutura invisível de toda a astronomia observacional.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que a Polar é a estrela mais brilhante do céu. Não é, nem entra entre as quarenta mais brilhantes. Ela importa por <b>posição</b>, não por brilho — e não é visível na maior parte do Brasil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">3</span>Constelações</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Padrões de estrelas no céu, podendo lembrar imagens do cotidiano. Note que as estrelas não têm relação física, estando a distâncias diversas.</li>
    <li>Eram úteis para controle de estações, navegações, colheita, etc.</li>
  </ul></div>
  <p>O professor faz questão de dizer que as estrelas de uma constelação <b>não têm relação física</b>, e o exemplo mais didático está bem acima da nossa cabeça: o <b>Cruzeiro do Sul</b>. Suas estrelas estão a distâncias que vão de cerca de 88 a mais de 350 anos-luz. Elas só formam uma cruz porque estamos olhando de um ponto de vista muito específico — o nosso. Um observador em outra parte da Galáxia veria estrelas espalhadas, sem desenho algum.</p>
  <div class="fig">
    <div class="figttl">Figura · O Cruzeiro do Sul não existe no espaço</div>
    <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
      <text x="150" y="22" font-size="10" font-weight="800" fill="var(--text)" text-anchor="middle">COMO VEMOS DA TERRA</text>

    <div class="figcap">À esquerda, a cruz. À direita, as mesmas estrelas em profundidade: espalhadas por mais de 260 anos-luz. O desenho só existe na nossa linha de visada — é o argumento mais forte contra a ideia de que estrelas de uma constelação "pertencem" umas às outras.</div>
  </div>
  <p>Vale também distinguir dois termos que costumam ser confundidos. <b>Constelação</b>, no sentido oficial, é uma <b>região do céu</b> com fronteiras precisas, e são 88 delas, definidas pela UAI em 1928<sup class="ref">2</sup>. Cada ponto do céu pertence a exatamente uma constelação, como um município pertence a um estado. Já <b>asterismo</b> é apenas um desenho reconhecível, sem status oficial: as Três Marias são um asterismo dentro de Órion. O Cruzeiro do Sul, por sua vez, é constelação oficial — e a menor das 88.</p>
  <p><b>Para que serviam, na prática.</b> A utilidade citada pelo professor funciona por um mecanismo específico: o <b>nascer helíaco</b>. Uma estrela passa parte do ano invisível, encoberta pela luz do Sol, e um dia reaparece no horizonte leste pouco antes do amanhecer. Essa reaparição acontece sempre na mesma época do ano e serve de marco de calendário. No Egito, o nascer helíaco de Sirius anunciava a cheia do Nilo. Vários povos indígenas brasileiros usavam as <b>Plêiades</b> do mesmo modo, para marcar o início da estação de plantio — e há registros dessa prática em culturas de todo o continente.</p>
  <div class="callout plus"><b>As constelações indígenas brasileiras.</b> Vale conhecer, porque mostra que o recorte greco-romano das 88 é <b>uma</b> convenção, não a única possível — e porque é conteúdo do nosso próprio território. Povos tupi-guarani, entre outros, organizavam o céu com figuras distintas, e várias usam as <b>manchas escuras</b> da Via Láctea, e não as estrelas brilhantes: enxergavam a forma no que <b>não</b> tem luz, o oposto do método europeu.</div>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Constelação indígena</th><th>Como é formada</th><th>Para que servia</th></tr></thead>
    <tbody>
      <tr><td><b>Ema</b> (Guirá Nhandu)</td><td>Nuvem escura do Saco de Carvão forma a cabeça; o corpo se estende pela Via Láctea. Inclui o Cruzeiro do Sul</td><td>Seu surgimento no leste, por volta de junho, anuncia a estação seca no Sudeste</td></tr>
      <tr><td><b>Homem Velho</b></td><td>Reúne estrelas que os gregos separaram entre Órion e Touro, incluindo as Três Marias</td><td>Sua aparição marca o início do verão e a época de plantio</td></tr>
      <tr><td><b>Veado</b> e <b>Anta do Norte</b></td><td>Também combinam estrelas de constelações greco-romanas diferentes</td><td>Marcadores sazonais do ciclo agrícola e de caça</td></tr>
      <tr><td><b>Sete Estrelas</b> (Plêiades)</td><td>Aglomerado aberto, um dos poucos objetos reconhecidos por praticamente todas as culturas</td><td>Seu nascer helíaco marcava o início do ano em várias tradições</td></tr>
    </tbody></table></div>
  <p>Repare que essas figuras <b>atravessam</b> as fronteiras oficiais: o Homem Velho pega pedaços de Órion e de Touro. Isso não é erro — é outro recorte, feito por quem observava o mesmo céu com outras necessidades. O Observatório do Valongo e vários grupos de pesquisa brasileiros estudam esse material dentro da <b>etnoastronomia</b>, e é o tipo de assunto que costuma render bem numa discursiva sobre o papel cultural da astronomia.</p>
  <div class="why"><span class="t">Por que isso importa</span>Constelações são o sistema de endereçamento informal do céu, e seguem em uso: nomes de estrelas variáveis, supernovas e chuvas de meteoros derivam da constelação onde aparecem. E o argumento de que "não têm relação física" volta com força na discussão sobre astrologia, no módulo do Zodíaco.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir constelação com asterismo, e imaginar que constelações são grupos de estrelas fisicamente próximas. São regiões do céu, e o agrupamento é efeito de perspectiva.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">4</span>A Terra é redonda: o experimento de Eratóstenes</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Sabemos que vários povos antigos consideravam que a Terra fosse plana.</li>
    <li>A noção de Terra esférica é frequentemente associada a Colombo, mas foi aventada inicialmente na Grécia Antiga, graças a um experimento de Eratóstenes em 240 a.C.</li>
  </ul></div>
  <p>Eratóstenes, bibliotecário de Alexandria, fez a medida considerada a mais elegante da Antiguidade — e o método cabe em um parágrafo. Ele sabia que, no solstício de verão ao meio-dia, o Sol ficava exatamente a pino em <b>Siena</b>, atual Assuã: a luz atingia o fundo de um poço profundo e varas verticais não projetavam sombra. No mesmo instante, em <b>Alexandria</b>, cerca de 800 km ao norte, uma vara vertical projetava uma sombra correspondente a um ângulo de aproximadamente <b>7,2°</b>.</p>
  <p>Se a Terra fosse plana e o Sol estivesse distante, os raios chegariam paralelos e as duas varas teriam a mesma sombra — nenhuma. A diferença só se explica pela <b>curvatura</b>. E mais: 7,2° é exatamente 1/50 de uma volta completa. Logo, a distância entre as duas cidades corresponde a 1/50 da circunferência da Terra. Multiplicando por 50, ele obteve um valor que, dependendo de como se converte a unidade grega usada, fica entre 1% e 15% do valor moderno, de 40.075 km. Sem satélite e sem telescópio: com uma vara e um poço.</p>

    <div class="figttl">Figura · O raciocínio de Eratóstenes</div>

    <div class="figcap">A genialidade está em transformar uma diferença de <b>sombras</b> numa medida de <b>planeta</b>. É outro caso de medida indireta, como as de Aristarco na Aula 02 — e exigia uma única suposição: que os raios do Sol chegam paralelos, o que só vale se o Sol estiver muito longe.</div>
  </div>
  <div class="callout plus"><b>O mito da Terra plana medieval.</b> O slide menciona a associação com Colombo, e vale desfazê-la de vez: nenhum europeu instruído do século XV achava a Terra plana. A esfericidade era consenso desde a Grécia e foi transmitida pela Idade Média sem interrupção. A disputa com Colombo foi sobre o <b>tamanho</b> da Terra — ele a subestimava, e seus críticos estavam certos ao dizer que a Ásia ficava longe demais para a viagem proposta. A lenda de que se acreditava em Terra plana foi popularizada no século XIX, sobretudo por uma biografia romanceada de Colombo escrita por Washington Irving em 1828.</div>
  <div class="why"><span class="t">Por que isso importa</span>Fecha o arco da Aula 02: aqui está o terceiro grande medidor grego, ao lado de Aristarco e Hiparco. E é a medida que <b>faltava</b> para converter as deles — sabendo o raio da Terra, "60 raios terrestres até a Lua" vira quilômetros.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que Eratóstenes "provou que a Terra é redonda". A esfericidade já era aceita entre os gregos; o que ele fez foi <b>medir</b> o tamanho dela — coisa bem mais difícil.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">5</span>Rotação e translação: os dois movimentos</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Rotação: giro de um objeto em torno de si mesmo. A Terra completa uma rotação por dia, uma vez a cada 24 horas.</li>
    <li>Revolução (ou translação): movimento de um objeto ao redor de outro. A Terra completa uma volta em torno do Sol a cada 365,26 dias.</li>
  </ul></div>
  <p>Os dois movimentos causam praticamente tudo que se vê no céu. A <b>rotação</b> produz o dia e a noite e o movimento diurno das estrelas. A <b>translação</b> produz a mudança do céu ao longo do ano e, combinada com a inclinação do eixo, as estações.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Movimento</th><th>Período</th><th>Velocidade</th><th>O que causa</th></tr></thead>
    <tbody>
      <tr><td>Rotação</td><td>23h56m04s sideral; 24h solar médio<sup class="ref">4</sup></td><td>~1.670 km/h no equador</td><td>Dia e noite; movimento diurno; achatamento nos polos</td></tr>
      <tr><td>Translação</td><td>365,256 dias sideral; 365,242 trópico<sup class="ref">4</sup></td><td>~107.000 km/h</td><td>Ano; mudança das constelações visíveis; estações, junto com a inclinação</td></tr>
    </tbody></table></div>
  <p><b>Por que há dois valores para cada período.</b> O <b>dia sideral</b>, de 23h56m04s, é o tempo para a Terra dar uma volta completa em relação às <b>estrelas</b>. O <b>dia solar</b>, de 24h, é o tempo para o Sol voltar à mesma posição no céu — e é maior porque, enquanto a Terra gira, ela também avança na órbita e precisa girar um pouco a mais para reencontrar o Sol. A diferença é de <b>3 minutos e 56 segundos</b>, exatamente o número que o professor usa no módulo seguinte.</p>
  <p>Do mesmo modo, o <b>ano sideral</b> (365,256 dias) é a volta completa em relação às estrelas, e o <b>ano trópico</b> (365,242 dias) é o intervalo entre dois equinócios de março, ligeiramente menor por causa da precessão — tema do último módulo desta aula. O valor do slide, 365,26, é o ano sideral. Os calendários seguem o ano trópico, porque o que interessa é manter as estações no lugar.</p>
  <div class="why"><span class="t">Por que isso importa</span>Toda a Aula 03 explora as consequências desses dois movimentos. E a distinção sideral versus solar explica o número mais específico da aula, os 3m56s por noite.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que a rotação leva exatamente 24 horas. Leva 23h56m04s; as 24 horas são o dia <b>solar</b>, que já embute o avanço orbital.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">6</span>O movimento diurno</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>O reflexo do movimento de rotação da Terra faz crer que sejam as estrelas e demais corpos celestes que se movam em torno desta. Esse movimento aparente é chamado "movimento diurno".</li>
    <li>Ao observarmos o céu noturno podemos constatar que as estrelas surgem no leste, movem-se pelo céu e se põem no oeste, assim como faz o Sol.</li>
    <li>Para os antigos, o nascer e o pôr das estrelas era explicado pela rotação da esfera celeste em torno de nós. Atualmente é claro que é a rotação da Terra que causa isso. Não é a esfera celeste que gira, mas a Terra.</li>
  </ul></div>
  <p>Este é o exemplo mais limpo do curso sobre a diferença entre <b>fenômeno observado</b> e <b>explicação</b>. O que se observa é indiscutível: os astros nascem a leste e se põem a oeste. O que <b>causa</b> isso é outra questão — e as duas explicações concorrentes, céu girando ou Terra girando, produzem exatamente a mesma aparência. Decidir entre elas exigiu muito mais do que olhar para cima.</p>
  <p>O movimento diurno tem uma característica que vale entender: os astros descrevem <b>círculos paralelos ao equador celeste</b>, centrados nos polos celestes. Quanto mais perto do polo, menor o círculo. Astros suficientemente próximos do polo descrevem círculos que nunca cruzam o horizonte — são os <b>circumpolares</b>, que nunca se põem. O tamanho dessa região depende da latitude:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Onde você está</th><th>Como o céu gira</th><th>Circumpolares</th></tr></thead>
    <tbody>
      <tr><td>No equador (0°)</td><td>Os astros sobem perpendiculares ao horizonte; os polos celestes ficam no horizonte</td><td>Nenhum. Ao longo do ano vê-se o céu inteiro</td></tr>
      <tr><td>No Rio (~23° S)</td><td>Os círculos são inclinados; o polo sul celeste fica a 23° de altura</td><td>Uma faixa estreita ao redor do polo sul celeste</td></tr>
      <tr><td>Num polo (90°)</td><td>Os astros giram paralelos ao horizonte, sem nascer nem se pôr</td><td>Todos os visíveis. Vê-se sempre a mesma metade da esfera celeste</td></tr>
    </tbody></table></div>

  </div>
  <p><b>Um detalhe do hemisfério sul.</b> Nos livros do hemisfério norte, o céu gira no sentido anti-horário em torno da Polar. Aqui, olhando para o sul, o céu gira no sentido <b>horário</b> em torno do polo sul celeste. Fotos de longa exposição feitas no Brasil mostram os traços circulares nesse sentido — bom detalhe para não errar numa questão com figura.</p>
  <div class="why"><span class="t">Por que isso importa</span>É a base de qualquer observação prática, inclusive as do Valongo. Saber que o céu gira, e a que velocidade, explica por que um telescópio precisa de montagem que acompanhe o movimento: sem isso, o objeto sai do campo em segundos.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que "o Sol nasce exatamente no leste". Só nos equinócios. No resto do ano ele nasce um pouco ao norte ou ao sul do leste — assunto do módulo 15.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">7</span>O movimento anual e os 3 minutos e 56 segundos</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Ao observarmos o céu noturno por alguns meses verificamos que novas constelações aparecem no leste, ao passo que outras desaparecem no oeste.</li>
    <li>A descoberta de que estrelas diversas são visíveis em épocas diferentes foi muito importante para a medida do tempo.</li>
    <li>A cada mês temos uma parte do céu bloqueada; como se estivéssemos sentados num círculo em torno de uma fogueira e não conseguíssemos ver uma pessoa sentada do outro lado do fogo.</li>
    <li>Nosso movimento planetário também faz com que uma dada estrela surja no céu 3 minutos e 56 segundos mais cedo a cada noite. Ao longo de um ano inteiro isso totaliza 24 h.</li>
  </ul></div>
  <p>A <b>analogia da fogueira</b> é excelente e vale guardar exatamente como está. Imagine um grupo sentado em círculo à noite, com uma fogueira no centro. Você não consegue ver quem está do outro lado, porque o brilho do fogo ofusca. Se todos se levantarem e caminharem um pouco ao redor, quem estava escondido aparece e outra pessoa some atrás do fogo. A fogueira é o Sol; as pessoas são as constelações; e o movimento é a translação da Terra. As constelações "do outro lado do Sol" são invisíveis porque só estão acima do horizonte durante o dia.</p>
  <p>É por isso que Órion é uma constelação de verão no hemisfério sul e Escorpião, de inverno. As duas estão em lados aproximadamente opostos do céu — e há inclusive uma lenda grega que explica isso mitologicamente, dizendo que Órion foge do escorpião e por isso os dois nunca aparecem juntos.</p>
  <p><b>Agora o número.</b> Os 3 minutos e 56 segundos por noite são a consequência precisa da diferença entre dia sideral e dia solar, vista no módulo anterior. Enquanto a Terra completa uma rotação em relação às estrelas — 23h56m04s —, ela também avançou cerca de 1° na órbita. Para o <b>Sol</b> voltar à mesma posição no céu, é preciso girar esse 1° a mais, o que leva aproximadamente 4 minutos. Consequência: em relação ao relógio solar que usamos, as estrelas se adiantam 3m56s por dia.</p>
  <div class="numgrid">
    <div><b>3m56s</b><span>por noite que uma estrela se adianta</span></div>
    <div><b>~2 h</b><span>de adiantamento por mês</span></div>
    <div><b>24 h</b><span>acumuladas em um ano — o céu volta ao mesmo lugar</span></div>
    <div><b>~1°</b><span>de avanço orbital da Terra por dia</span></div>
  </div>
  <div class="fig">
    <div class="figttl">Figura · Por que o dia solar é mais longo que o dia sideral</div>

  </div>
  <div class="why"><span class="t">Por que isso importa</span>É o mecanismo que transforma o céu num calendário. Como a aparência do céu se repete a cada ano com precisão, observar quais constelações estão visíveis diz em que época do ano se está — foi assim que povos sem escrita marcavam o tempo.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que as constelações "somem" ou "aparecem" por algum movimento delas. Elas continuam no mesmo lugar; o que muda é <b>de que lado do Sol nós estamos</b>, e portanto qual metade do céu fica visível à noite.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">8</span>Trópicos e círculos polares</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Os trópicos e os círculos polares são paralelos terrestres definidos com base no movimento aparente do Sol em torno da Terra.</li>
    <li>No Trópico de Câncer... Sobre o Equador... Enquanto isso, no polo norte...</li>
  </ul></div>
  <p>Aqui está uma das ideias mais elegantes da aula: <b>cinco linhas no mapa-múndi são consequência direta de um único número</b> — a inclinação de 23,5° do eixo terrestre. Elas não foram escolhidas por conveniência cartográfica; foram <b>desenhadas pelo Sol</b>.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Paralelo</th><th>Latitude</th><th>Definição astronômica</th></tr></thead>
    <tbody>
      <tr><td>Trópico de Câncer</td><td>23,5° N</td><td>Latitude mais ao norte em que o Sol chega ao zênite — acontece no solstício de junho</td></tr>
      <tr><td>Equador</td><td>0°</td><td>O Sol passa pelo zênite duas vezes por ano, nos equinócios</td></tr>
      <tr><td>Trópico de Capricórnio</td><td>23,5° S</td><td>Latitude mais ao sul em que o Sol chega ao zênite — no solstício de dezembro</td></tr>
      <tr><td>Círculo Polar Ártico</td><td>66,5° N</td><td>A partir daqui existe pelo menos um dia por ano em que o Sol não se põe, e outro em que não nasce</td></tr>
      <tr><td>Círculo Polar Antártico</td><td>66,5° S</td><td>O mesmo, com as datas invertidas</td></tr>
    </tbody></table></div>
  <p><b>A conta é imediata.</b> Os trópicos ficam a 23,5° porque esse é o máximo que o Sol se afasta do equador celeste. Os círculos polares ficam a 66,5° porque 90° − 23,5° = 66,5°. Ou seja: se você souber a obliquidade, deduz as cinco linhas de cabeça. E se a inclinação da Terra fosse outra, o mapa-múndi teria trópicos em outro lugar.</p>
  <p><b>Por que "Câncer" e "Capricórnio".</b> Os nomes vêm das constelações do Zodíaco em que o Sol se encontrava nos solstícios, na época em que a nomenclatura foi fixada, na Antiguidade. Só que — e este é um belo gancho para o módulo da precessão — por causa do deslocamento lento do eixo terrestre, hoje o Sol está em <b>Touro</b> no solstício de junho e em <b>Sagitário</b> no de dezembro. Os nomes ficaram; o céu se moveu.</p>
  <p><b>O Brasil é o país dos trópicos.</b> O Trópico de Capricórnio atravessa São Paulo, Paraná e Mato Grosso do Sul. O Rio de Janeiro, a ~22,9° S, fica pouquíssimo ao norte dele — o que significa que o Sol chega <b>quase</b> ao zênite no verão carioca, mas não exatamente. Em cidades ao norte, como Belém, Manaus e Salvador, o Sol passa pelo zênite duas vezes por ano, e nesses dias objetos verticais não projetam sombra ao meio-dia. É o fenômeno que Eratóstenes usou em Siena, e que se pode observar aqui.</p>
  <div class="why"><span class="t">Por que isso importa</span>Conecta astronomia com geografia e clima, o que é exatamente o espírito das Ciências da Terra. A faixa entre os trópicos é a zona tropical justamente por receber luz mais direta o ano inteiro — a base física da classificação climática.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que "trópico" é uma faixa de clima quente definida por temperatura. É uma definição <b>astronômica</b>, ligada à posição do Sol no zênite. O clima é consequência, não a definição.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">9</span>O Sol da meia-noite e os extremos de latitude</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Enquanto isso, no polo norte... O Sol da meia-noite.</li>
  </ul></div>
  <p>O slide mostra a fotografia clássica: o Sol raspando o horizonte à meia-noite, sem se pôr. É a consequência mais espetacular da inclinação do eixo, e o teste final para saber se você entendeu a geometria.</p>
  <p><b>O que acontece nos polos.</b> Num polo, o eixo de rotação aponta para o zênite, e o equador celeste coincide com o horizonte. Isso significa que os astros giram <b>paralelos ao horizonte</b>, sem nascer nem se pôr. Para o Sol, cuja declinação varia ao longo do ano entre −23,5° e +23,5°, o resultado é dramático: durante cerca de <b>seis meses</b> ele fica acima do horizonte, descrevendo espirais lentas, e durante os outros seis fica abaixo. Um dia e uma noite por ano.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Latitude</th><th>Duração do dia ao longo do ano</th><th>Fenômeno característico</th></tr></thead>
    <tbody>
      <tr><td>Equador · 0°</td><td>Praticamente 12 h de dia e 12 h de noite o ano inteiro</td><td>Nenhuma variação sazonal significativa de duração</td></tr>
      <tr><td>Rio de Janeiro · 23° S</td><td>De ~10h30 no inverno a ~13h30 no verão</td><td>Variação perceptível, mas moderada</td></tr>
      <tr><td>Círculo Polar · 66,5°</td><td>Vai de 0 h a 24 h conforme a época</td><td>Um dia por ano sem pôr do Sol e um sem nascer</td></tr>
      <tr><td>Polo · 90°</td><td>Seis meses de dia e seis de noite</td><td>Sol da meia-noite por meio ano; noite polar no outro</td></tr>
    </tbody></table></div>
  <p><b>Um detalhe que costuma surpreender:</b> no polo, o Sol não fica parado no céu durante o verão. Ele descreve um <b>círculo completo</b> em torno do observador a cada 24 horas, subindo lentamente em espiral até o solstício e depois descendo até tocar o horizonte no equinócio. E há um bônus de refração: como a atmosfera desvia a luz, o Sol continua visível por alguns dias mesmo já estando geometricamente abaixo do horizonte.</p>
  <div class="why"><span class="t">Por que isso importa</span>É o caso-limite que testa o modelo. Se você consegue prever o que acontece no polo, no equador e no Rio a partir da mesma geometria, entendeu a inclinação do eixo. É o tipo de raciocínio que uma discursiva bem-feita pede.</div>
  <div class="trap"><span class="t">Erro comum</span>Chamar o Sol da meia-noite de "dia que nunca acaba" em qualquer lugar do Ártico. Só ocorre acima do círculo polar, e o número de dias com o fenômeno aumenta com a latitude: um só no círculo polar, seis meses no polo.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">10</span>A inclinação do eixo</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>O eixo de rotação da Terra está inclinado cerca de 23,5 graus com relação à eclíptica. Qual a relação disso com os trópicos?</li>
    <li>O eixo de rotação terrestre não é perpendicular à sua órbita em torno do Sol, tendo uma inclinação de 23,5° a partir da vertical.</li>
  </ul></div>
  <p>Este número é o mais importante da aula inteira. Dele saem os trópicos, os círculos polares, as estações, os solstícios, os equinócios e a inclinação da eclíptica em relação ao equador celeste. Uma única grandeza explica seis fenômenos.</p>
  <p><b>Uma precisão sobre a formulação.</b> A segunda frase do professor é a mais exata: o eixo está inclinado 23,5° <b>a partir da vertical</b>, ou seja, em relação à perpendicular ao plano orbital. Equivalentemente, o <b>plano do equador</b> terrestre faz 23,5° com o <b>plano da eclíptica</b>. A primeira frase, "inclinado 23,5° com relação à eclíptica", lida ao pé da letra daria 66,5°, já que o ângulo entre o eixo e o próprio plano orbital é o complemento. É provável que seja apenas concisão de slide, mas vale saber enunciar da forma exata, sobretudo em discursiva.</p>
  <div class="numgrid">
    <div><b>23,44°</b><span>obliquidade atual, medida com precisão<sup class="ref">4</sup></span></div>
    <div><b>66,56°</b><span>ângulo entre o eixo e o plano da eclíptica</span></div>
    <div><b>22,1° a 24,5°</b><span>faixa em que a obliquidade oscila em ~41 mil anos</span></div>
    <div><b>0,013°</b><span>por século — a taxa em que ela vem diminuindo</span></div>
  </div>
  <p><b>A obliquidade não é constante.</b> Ela oscila entre cerca de 22,1° e 24,5° num ciclo de aproximadamente 41 mil anos — um dos <b>ciclos de Milankovitch</b><sup class="ref">8</sup>, junto com a precessão e a variação da excentricidade da órbita. Essas variações alteram a distribuição de luz solar entre as estações e os hemisférios, e são hoje aceitas como um dos gatilhos das eras glaciais. É um dos pontos em que a astronomia entra diretamente na geologia e na climatologia — ou seja, é exatamente o tipo de conexão que justifica esta disciplina existir.</p>
  <p><b>E se não houvesse inclinação?</b> O exercício mental ajuda a fixar. Com eixo perpendicular à órbita, não haveria estações: todo lugar teria o mesmo padrão de luz o ano inteiro, com 12 horas de dia em qualquer latitude. Os trópicos e os círculos polares desapareceriam do mapa, porque o Sol só chegaria ao zênite no equador. E com uma inclinação muito maior, como os 98° de Urano, os polos apontariam quase para o Sol em cada solstício, produzindo estações extremas.</p>
  <div class="why"><span class="t">Por que isso importa</span>Se você guardar um único número desta aula, guarde este. Ele responde à pergunta que o próprio professor deixa no slide — "qual a relação disso com os trópicos?" — e é a chave dos dois módulos seguintes.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que o eixo faz 23,5° com o plano da órbita. Faz 23,5° com a <b>perpendicular</b> a esse plano, ou 66,5° com o plano em si.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">11</span>A eclíptica</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>A eclíptica é a projeção do caminho aparente do Sol na esfera celeste devido à translação da Terra. A rigor, é a projeção do plano orbital da Terra na esfera celeste.</li>
    <li>A eclíptica marca o caminho traçado pelo Sol ao longo de um ano.</li>
    <li>É a extensão da órbita terrestre na esfera celeste, da mesma forma que o equador celeste é a extensão do equador terrestre.</li>
    <li>O nome eclíptica vem do fato de que somente quando a Lua nova ou cheia cruza esta linha um eclipse pode ocorrer.</li>
  </ul></div>
  <p>O professor dá duas definições, e vale entender que são a mesma coisa vista de dois jeitos. <b>Do ponto de vista do observador</b>, a eclíptica é o caminho que o Sol percorre entre as estrelas ao longo do ano — ele avança cerca de 1° por dia, e completa a volta em 365 dias. <b>Do ponto de vista geométrico</b>, é a projeção do plano orbital da Terra na esfera celeste. A primeira é o que se vê; a segunda é o que é.</p>
  <p>Como o eixo da Terra é inclinado, a eclíptica <b>não coincide</b> com o equador celeste: os dois grandes círculos se cruzam num ângulo de 23,5°, chamado <b>obliquidade da eclíptica</b>. Eles se cortam em dois pontos, que são exatamente os <b>equinócios</b>. Toda a geometria das estações está contida nessa figura — e é por isso que ela aparece na capa desta aula.</p>
  <p><b>A origem do nome</b> é um detalhe bonito que o slide traz. Eclipse vem do grego <i>ékleipsis</i>, "abandono, desaparecimento". A Lua orbita num plano inclinado cerca de 5° em relação à eclíptica, e por isso, na maior parte dos meses, ela passa acima ou abaixo da linha Terra-Sol. Só quando a Lua está <b>cruzando</b> a eclíptica — nos pontos chamados <b>nodos</b> — e simultaneamente em fase nova ou cheia é que os três corpos se alinham e ocorre eclipse. A linha ganhou o nome de "a linha dos eclipses" porque é ali que eles acontecem.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Condição</th><th>O que acontece</th></tr></thead>
    <tbody>
      <tr><td>Lua nova, longe de um nodo</td><td>Lua nova comum — passa acima ou abaixo do Sol</td></tr>
      <tr><td>Lua nova, sobre um nodo</td><td><b>Eclipse solar</b></td></tr>
      <tr><td>Lua cheia, longe de um nodo</td><td>Lua cheia comum</td></tr>
      <tr><td>Lua cheia, sobre um nodo</td><td><b>Eclipse lunar</b></td></tr>
    </tbody></table></div>
  <div class="fig">
    <div class="figttl">Figura · Por que a Lua quase sempre "erra" o Sol</div>
    <svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="100" x2="670" y2="100" stroke="#5eead4" stroke-width="2"/>
      <text x="36" y="92" font-size="9.5" font-weight="700" fill="#0E8C93">eclíptica — plano da órbita da Terra</text>
      <path d="M30 140 Q 200 40 350 100 T 670 60" stroke="#7A4FA3" stroke-width="2" fill="none"/>
      <text x="620" y="46" font-size="9.5" font-weight="700" fill="#7A4FA3" text-anchor="end">órbita da Lua, inclinada ~5°</text>
      <g fill="#B23A2B"><circle cx="350" cy="100" r="6"/><circle cx="122" cy="100" r="6"/></g>
      <text x="350" y="122" font-size="10" font-weight="800" fill="#B23A2B" text-anchor="middle">nodo</text>
      <text x="122" y="122" font-size="10" font-weight="800" fill="#B23A2B" text-anchor="middle">nodo</text>
      <g fill="#94a3b8"><circle cx="230" cy="62" r="7"/><circle cx="500" cy="76" r="7"/></g>
      <text x="230" y="48" font-size="9" fill="var(--muted)" text-anchor="middle">Lua acima do plano</text>
      <text x="500" y="62" font-size="9" fill="var(--muted)" text-anchor="middle">Lua abaixo</text>
      <text x="350" y="166" font-size="9.5" fill="var(--muted2)" text-anchor="middle">eclipse exige duas coisas ao mesmo tempo: estar <tspan font-weight="700">sobre um nodo</tspan> e estar em fase <tspan font-weight="700">nova ou cheia</tspan></text>
    </svg>
    <div class="figcap">Na maioria dos meses a Lua passa acima ou abaixo da linha Terra–Sol. Só nos nodos os três corpos podem se alinhar — e daí o nome da linha: eclíptica.</div>
  </div>
  <p>Isso responde de forma definitiva a pergunta "por que não há eclipse todo mês", que apareceu na Aula 01: porque as duas condições — fase certa <b>e</b> posição sobre o nodo — precisam coincidir, e isso ocorre apenas algumas vezes por ano.</p>
  <p><b>Os planetas também andam pela eclíptica — mas com um truque.</b> Como todos orbitam praticamente no mesmo plano, eles aparecem sempre dentro da faixa do zodíaco. Só que o movimento deles não é uniforme: de tempos em tempos, um planeta <b>para, anda para trás por semanas e depois retoma</b> o sentido normal. É o <b>movimento retrógrado</b>, e foi o maior enigma da astronomia antiga.</p>
  <p>A explicação é elegante e puramente geométrica: trata-se de <b>ultrapassagem</b>. Quando a Terra, que orbita mais rápido por estar mais perto do Sol, alcança e passa um planeta externo como Marte, ele parece recuar contra o fundo de estrelas — do mesmo modo que um carro ultrapassado na estrada parece andar para trás em relação à paisagem distante. O efeito é aparente, não real.</p>
  <div class="fig">
    <div class="figttl">Figura · Por que Marte parece andar para trás</div>

      <circle cx="70" cy="150" r="16" fill="#fbbf24"/>

      <text x="250" y="40" font-size="9" fill="#B23A2B">Marte (mais lento)</text>

        <line x1="130" y1="128" x2="560" y2="96"/><line x1="162" y1="108" x2="560" y2="60"/><line x1="200" y1="96" x2="560" y2="120"/></g>
      <line x1="590" y1="30" x2="590" y2="170" stroke="var(--line2)" stroke-width="1.5"/>
      <text x="640" y="26" font-size="9.5" font-weight="700" fill="var(--text)" text-anchor="middle">fundo de estrelas</text>
      <g fill="#B23A2B"><circle cx="590" cy="96" r="4"/><circle cx="590" cy="60" r="4"/><circle cx="590" cy="120" r="4"/></g>
      <g font-size="9" fill="var(--muted)"><text x="600" y="100">1</text><text x="600" y="64">2</text><text x="600" y="124">3</text></g>
      <text x="440" y="188" font-size="9.5" fill="var(--muted2)" text-anchor="middle">a posição aparente sobe, depois desce — o laço retrógrado</text>
    </svg>
    <div class="figcap">O planeta nunca inverte de fato. O que se inverte é a <b>linha de visada</b>, porque a Terra ultrapassa por dentro. Este fenômeno é o que obrigou Ptolomeu a inventar os epiciclos — e é o que o heliocentrismo explica sem nenhum artifício.</div>
  </div>
  <p><b>Por que isso é historicamente decisivo.</b> No modelo geocêntrico, o movimento retrógrado não tem explicação natural: foi preciso postular que cada planeta girava num pequeno círculo — o <b>epiciclo</b> — cujo centro, por sua vez, girava em torno da Terra. Funcionava para prever posições, mas ao custo de uma engrenagem cada vez mais complicada. No heliocentrismo, a retrogradação sai de graça, como consequência inevitável de planetas orbitando com velocidades diferentes. Foi um dos argumentos mais fortes de Copérnico — e conecta diretamente com Aristarco, na Aula 02.</p>
  <div class="why"><span class="t">Por que isso importa</span>A eclíptica é a linha organizadora do Sistema Solar visto da Terra. Como todos os planetas orbitam aproximadamente no mesmo plano, todos aparecem sempre perto dela. Se você vir um "astro brilhante" fora da faixa da eclíptica, não é planeta.</div>
  <div class="trap"><span class="t">Erro comum</span>Confundir eclíptica com equador celeste. Equador celeste é a projeção do <b>equador da Terra</b>; eclíptica é a projeção da <b>órbita</b>. Entre eles há 23,5°, e é dessa diferença que nascem as estações.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">12</span>O Zodíaco — e a constelação que ficou de fora</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>À medida que a Terra revolve em torno do Sol, o Sol parece mover-se entre as estrelas, ao longo de um conjunto de constelações chamadas de Zodíaco (gr. Ζωδιακός).</li>
    <li>O caminho aparente do Sol projetado na esfera celeste é chamado de eclíptica.</li>
  </ul></div>
  <p>A palavra <b>Zodíaco</b> vem do grego <i>zōdiakós</i>, ligado a <i>zōon</i>, "animal" — a faixa dos animais, já que a maioria das figuras é de bichos. Trata-se simplesmente da faixa de céu, com cerca de 8° para cada lado da eclíptica, dentro da qual se movem o Sol, a Lua e os planetas. Ela ganhou importância porque é onde <b>tudo que se move acontece</b>.</p>
  <p><b>Por que 12 constelações?</b> A divisão em doze é babilônica e tem motivo prático: aproximadamente doze lunações cabem num ano, então dividir a faixa em doze setores de 30° criava uma correspondência cômoda entre a posição do Sol e o mês. É importante notar que os <b>signos</b> astrológicos são esses setores de 30° exatos, ao passo que as <b>constelações</b> astronômicas têm tamanhos bem diferentes entre si.</p>
  <div class="callout plus"><b>São treze, não doze.</b> Com as fronteiras oficiais fixadas pela UAI em 1928, a eclíptica atravessa <b>treze</b> constelações. A décima terceira é <b>Ofiúco</b>, o Serpentário, entre Escorpião e Sagitário — o Sol passa por ela por cerca de dezoito dias, todo ano, entre o fim de novembro e meados de dezembro<sup class="ref">10</sup>. Ela nunca entrou na lista astrológica porque a divisão em doze é anterior à demarcação oficial e nunca foi revista. Some-se a isso a <b>precessão</b>, tema do último módulo: as datas dos signos foram fixadas há cerca de dois mil anos, e desde então o céu se deslocou quase um signo inteiro. O resultado é que, para a maioria das pessoas, o Sol estava numa constelação diferente da indicada pelo seu signo. Este é o exemplo mais concreto da distinção astronomia/astrologia que a Aula 02 encerrou.</div>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Aspecto</th><th>Signos (astrologia)</th><th>Constelações (astronomia)</th></tr></thead>
    <tbody>
      <tr><td>Quantidade</td><td>12</td><td>13 cruzadas pela eclíptica</td></tr>
      <tr><td>Tamanho</td><td>Setores iguais de 30°</td><td>Áreas bem diferentes; o Sol passa 45 dias em Virgem e 7 em Escorpião</td></tr>
      <tr><td>Referência</td><td>Datas fixas, ancoradas no equinócio de ~2.000 anos atrás</td><td>Posição real do Sol contra o fundo estelar, hoje</td></tr>
      <tr><td>Finalidade</td><td>Atribuir características e prever destinos</td><td>Localizar objetos no céu</td></tr>
    </tbody></table></div>
  <div class="why"><span class="t">Por que isso importa</span>É o ponto em que a geometria da aula encontra o debate de método da aula anterior. E é um ótimo exemplo de discursiva: explicar, com base na precessão e nas fronteiras da UAI, por que as datas dos signos não correspondem à posição real do Sol.</div>
  <div class="trap"><span class="t">Erro comum</span>Dizer que "a astronomia mudou os signos". A astronomia não mexeu em nada: ela apenas <b>descreve</b> onde o Sol está. Quem fixou datas há dois mil anos e não as revisou foi a tradição astrológica.</div>
</div>
<div class="lsec">
  <h3><span class="lnum">13</span>Equinócios e solstícios</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Equinócio da primavera (~21 de março): ponto em que o Sol cruza o equador celeste.</li>
    <li>Solstício (~21 de junho): ponto de máximo afastamento do Sol em relação ao equador celeste.</li>
    <li>Equinócio de outono (~21 de setembro): ponto em que o Sol cruza o equador celeste.</li>
    <li>Solstício (~21 de dezembro): ponto de máximo afastamento do Sol em relação ao equador celeste.</li>
    <li>A primavera e o outono ocorrem quando o Sol cruza o equador celeste. Nestas épocas dias e noites têm durações iguais, e por isso são chamadas de equinócios.</li>
    <li>O início do verão e do inverno são chamados de solstícios, quando o Sol muda o sentido de seu movimento norte-sul.</li>
  </ul></div>
  <p>São as quatro datas em que a geometria da eclíptica produz marcos observáveis. Como a eclíptica e o equador celeste se cruzam em dois pontos, o Sol passa por eles duas vezes ao ano — são os <b>equinócios</b>, quando o Sol está exatamente sobre o equador celeste e o dia dura o mesmo que a noite em todo o planeta. Entre eles, o Sol atinge os pontos de máximo afastamento — são os <b>solstícios</b>, quando ele "para" de subir ou descer e inverte o sentido do movimento norte-sul. O nome vem do latim <i>sol</i> + <i>sistere</i>, "o Sol se detém".</p>

  <div class="trap"><span class="t">Atenção redobrada nesta tabela</span>O slide do professor nomeia as estações pela convenção do <b>hemisfério norte</b> — chama junho de "solstício de verão" e dezembro de "solstício de inverno". Para nós, no Rio, é o contrário: <b>junho é inverno e dezembro é verão</b>. Além disso, no bloco de definições o slide troca as direções norte e sul; num slide posterior ele mesmo traz a versão correta, dizendo que "em junho o Sol está ao norte do equador celeste, enquanto em dezembro está ao sul". A tabela acima segue essa versão, que é a correta. <b>Vale confirmar com o professor em aula</b> qual convenção ele quer nas respostas — é o tipo de detalhe que decide uma questão objetiva.</div>
  <p><b>Sobre "dias e noites de durações iguais".</b> A afirmação é quase exata, e o "aproximadamente" do slide é bem colocado. Nos equinócios o dia dura cerca de 12 h 07 min, e não 12 h exatas, por dois motivos: a <b>refração atmosférica</b>, que desvia a luz e faz o Sol parecer acima do horizonte quando geometricamente já se pôs; e a convenção de contar o nascer e o pôr pela <b>borda</b> do disco solar, não pelo centro. O dia com exatamente 12 horas de luz — chamado <b>equilux</b> — cai alguns dias antes ou depois do equinócio, dependendo da latitude.</p>
  <div class="why"><span class="t">Por que isso importa</span>São quatro datas com nome, definição geométrica e consequência observável — material perfeito para questão objetiva. E a inversão entre hemisférios é a pegadinha mais provável da aula inteira.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">14</span>As estações: por que a inclinação é a causa</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>Ao longo do ano o eixo de rotação mantém aproximadamente a mesma direção e inclinação. Em função disso, a luz solar incide de forma mais direta no hemisfério norte por uma parte do ano, e mais diretamente no hemisfério sul na outra parte, causando variação na quantidade de calor recebida.</li>
    <li>Uma superfície plana exposta diretamente ao Sol intercepta mais radiação (e portanto calor) que a mesma superfície quando inclinada.</li>
    <li>Portanto, as estações são causadas pela inclinação do eixo de rotação da Terra, que também acarreta mais horas diurnas no verão que no inverno.</li>
  </ul></div>
  <p>O professor entrega o mecanismo completo, e ele tem <b>dois efeitos somados</b>. Vale separá-los, porque a maioria das explicações populares menciona só um.</p>
  <p><b>Primeiro efeito: concentração da luz.</b> Um feixe de luz de área fixa, ao atingir uma superfície perpendicularmente, se concentra numa área pequena. Se atingir inclinado, o mesmo feixe se espalha por uma área maior — e a energia por metro quadrado cai. É por isso que a mesma quantidade de radiação aquece mais no verão: ela chega mais direta. O fator é o cosseno do ângulo de incidência.</p>
  <p><b>Segundo efeito: duração do dia.</b> No verão, o hemisfério inclinado na direção do Sol tem mais horas de luz — no Rio, cerca de 13h30 no solstício de dezembro contra 10h30 no de junho. Mais horas recebendo energia, todo dia, durante meses.</p>
  <div class="fig">
    <div class="figttl">Figura · O mesmo feixe, dois ângulos</div>

    <div class="figcap">O número de raios é o mesmo nos dois casos — a energia que chega é a mesma. O que muda é a <b>área</b> sobre a qual ela se distribui. Este desenho é a resposta completa à pergunta "por que existem estações", e vale reproduzi-lo numa discursiva.</div>
  </div>
  <div class="callout plus"><b>E a distância ao Sol?</b> A órbita da Terra é ligeiramente elíptica: estamos a cerca de 147 milhões de km no <b>periélio</b>, no início de janeiro, e a 152 milhões no <b>afélio</b>, no início de julho<sup class="ref">12</sup>. Ou seja, estamos <b>mais perto</b> do Sol durante o verão do hemisfério sul. Se a distância fosse a causa das estações, o planeta inteiro teria verão em janeiro — o que não acontece. A variação de ~3% na distância produz um efeito real, porém pequeno, e ele é <b>superado</b> pelo efeito da inclinação. Esta é a evidência decisiva contra a explicação errada mais comum sobre estações.</div>
  <p><b>O atraso das estações.</b> Se o solstício de dezembro é o dia de maior insolação no hemisfério sul, por que janeiro e fevereiro são mais quentes que dezembro? A resposta é <b>inércia térmica</b>. O solstício marca o pico da <b>energia recebida</b>, não o pico da <b>temperatura</b>. Enquanto a energia que chega for maior que a que o planeta devolve ao espaço, a superfície continua acumulando calor — e isso segue por algumas semanas depois do solstício. O oceano, com sua enorme capacidade térmica, atrasa ainda mais o processo.</p>
  <p>É a mesma razão pela qual o dia mais quente não é ao meio-dia, e sim por volta das 15h: o pico de radiação e o pico de temperatura não coincidem. Guardar essa distinção evita um erro conceitual comum e rende bem numa discursiva — porque mostra que você separou <b>causa astronômica</b> de <b>resposta térmica do planeta</b>.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Evento</th><th>Pico astronômico</th><th>Pico térmico observado no Rio</th></tr></thead>
    <tbody>
      <tr><td>Verão</td><td>Solstício, ~21 de dezembro</td><td>Janeiro e fevereiro</td></tr>
      <tr><td>Inverno</td><td>Solstício, ~21 de junho</td><td>Julho e agosto</td></tr>
      <tr><td>Dia</td><td>Meio-dia solar</td><td>Meio da tarde, por volta das 15h</td></tr>
    </tbody></table></div>
  <p><b>Por que os oceanos suavizam tudo.</b> A água precisa de muito mais energia que a terra para aquecer o mesmo tanto — e demora igualmente para esfriar. Por isso cidades litorâneas têm amplitude térmica menor que cidades no interior na mesma latitude, e por isso o hemisfério sul, que tem muito mais oceano que o norte, tem estações mais suaves. Some-se a isso o fato, visto no bloco anterior, de que estamos mais perto do Sol no verão do sul: os dois efeitos parcialmente se cancelam, e o resultado é um hemisfério de clima mais ameno.</p>
  <div class="why"><span class="t">Por que isso importa</span>É o mecanismo central da aula e um dos conceitos mais mal explicados na educação básica. Saber apresentá-lo com os dois efeitos — concentração e duração — mais o contra-argumento do periélio é uma resposta completa de discursiva.</div>
  <div class="trap"><span class="t">Erro comum</span>Atribuir as estações à distância ao Sol. Além de errado, o argumento não explica por que os hemisférios têm estações opostas ao mesmo tempo — a distância é a mesma para os dois.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">15</span>A trajetória do Sol ao longo do ano</h3>
  <div class="slidebox"><div class="t">No slide do professor</div><ul>
    <li>A inclinação da eclíptica também significa que, ao longo do ano, os pontos no horizonte onde o Sol nasce e se põe não são, em geral, exatamente leste e oeste.</li>
    <li>Ao longo do ano o Sol nasce primeiro ao norte do leste e depois ao sul.</li>
    <li>Essa é também a explicação para o Sol aparecer tão alto no céu no verão e tão baixo no inverno.</li>
    <li>Da mesma forma que a posição do Sol em relação às constelações pode ser usada para indicar as estações, também pode-se usar a posição do nascer e do pôr do Sol. Um exemplo é o monumento de Stonehenge.</li>
  </ul></div>
  <p>Este módulo transforma a geometria em algo que você pode verificar da sua própria janela. Ao longo do ano, duas coisas mudam no caminho do Sol pelo céu: <b>onde ele nasce e se põe</b>, e <b>quão alto ele chega</b> ao meio-dia.</p>

  </div>
  <p><b>Como verificar na prática.</b> Escolha uma janela ou um ponto fixo do quintal e marque, ao longo de alguns meses, onde o Sol se põe em relação a um prédio ou a uma árvore. O deslocamento é grande e perfeitamente visível a olho nu — no Rio, o ponto do pôr do Sol varia cerca de 47° ao longo do ano, ou seja, mais de um oitavo do horizonte. É exatamente essa observação que Stonehenge e outros monumentos registraram em pedra, como visto na Aula 02.</p>
  <p><b>Sobre a altura ao meio-dia.</b> No Rio, a ~23° S, o Sol ao meio-dia fica a cerca de <b>90°</b> de altura no solstício de dezembro — quase exatamente a pino, porque estamos quase sobre o Trópico de Capricórnio — e a cerca de <b>43°</b> no de junho. Essa diferença de quase 47° é o que faz as sombras de inverno serem tão mais longas, e é a razão pela qual projeto arquitetônico com beiral funciona: um beiral bem dimensionado barra o Sol alto do verão e deixa entrar o Sol baixo do inverno.</p>
  <div class="why"><span class="t">Por que isso importa</span>Une tudo: inclinação, eclíptica, solstícios e trópicos aparecem numa única observação que qualquer pessoa pode fazer. E é o conteúdo com aplicação prática mais direta — arquitetura, energia solar e agricultura dependem disso.</div>
  <div class="trap"><span class="t">Erro comum</span>Achar que o Sol passa pelo zênite todo dia ao meio-dia. Isso só acontece entre os trópicos, e mesmo lá apenas em dois dias do ano. No Rio, ele nunca chega exatamente ao zênite.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">A</span>O analema: quando o meio-dia não é meio-dia</h3>
  <p class="lead">Módulo complementar, e um dos fenômenos mais bonitos que decorrem de tudo que a aula construiu. Ele junta a inclinação do eixo com a forma da órbita, e produz um desenho no céu que muita gente nunca ouviu falar.</p>
  <p>Se você fotografar o Sol <b>sempre no mesmo horário do relógio</b>, do mesmo lugar, ao longo de um ano inteiro, e sobrepuser as imagens, não obterá um ponto nem uma linha reta. Obterá um <b>oito alongado</b> — o <b>analema</b>. A pergunta é: por que o Sol não está no mesmo lugar às 12h de janeiro e às 12h de julho?</p>
  <p><b>Duas causas somadas.</b> A primeira já é conhecida desta aula: a <b>inclinação do eixo</b> faz a declinação do Sol variar entre +23,5° e −23,5°, o que produz o movimento vertical do oito. A segunda é a <b>excentricidade da órbita</b>: como a órbita é levemente elíptica, a Terra se move mais rápido perto do periélio, em janeiro, e mais devagar no afélio, em julho — pela segunda lei de Kepler. Isso faz o Sol adiantar ou atrasar em relação ao relógio, produzindo o movimento horizontal.</p>
  <div class="fig">
