    <div class="figcap">Se a trajetória de volta coincide com a de ida, a luz é <b>reversível</b>: percorre o mesmo caminho nos dois sentidos. É por isso que, se você enxerga alguém pelo espelho, essa pessoa também enxerga você.</div>
  </div>
  <p><b>Procedimento.</b></p>
  <ol type="a" style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Coloque os dois espelhos planos dispostos verticalmente sobre a folha branca, na configuração da figura do roteiro.</li>
    <li>Faça o feixe da caneta laser incidir em um dos espelhos.</li>
    <li>O que acontece com o raio luminoso ao encontrar o espelho?</li>
    <li>E com o raio que sai desse espelho e encontra o segundo espelho?</li>
    <li>Trace as trajetórias dos raios sobre a folha, usando segmentos de reta com <b>setas indicando o sentido</b> de propagação.</li>
    <li>Em seguida, faça o feixe incidir <b>no sentido oposto</b> — ou seja, primeiro no espelho 2.</li>
    <li>Trace a nova trajetória na <b>mesma folha</b>, com uma caneta de <b>cor diferente</b>, indicando o sentido de propagação.</li>
    <li>O que você pode dizer sobre as trajetórias desenhadas? São diferentes ou idênticas?</li>
  </ol>
  <div class="why"><span class="t">O princípio que o experimento demonstra</span>A <b>reversibilidade dos raios luminosos</b>: se a luz percorre um caminho de A até B, ela percorre exatamente o mesmo caminho de B até A. Parece óbvio, mas é uma propriedade profunda — decorre das leis da reflexão e da refração serem simétricas na troca de sentido. Consequência cotidiana: no retrovisor, se você vê o olho do motorista de trás, ele necessariamente vê o seu.</div>
  <div class="pratica"><span class="t">Na prática · como sair com dados bons</span>
    <h5>A regra de ouro deste experimento</h5>
    <ul>
      <li><b>Nada pode se mover entre a ida e a volta.</b> O experimento inteiro depende disso. Antes de acender o laser, contorne a base dos dois espelhos a lápis e prenda a folha com o alfinete que o roteiro lista no material.</li>
      <li>Escolha uma geometria em que os dois espelhos formem um ângulo claro entre si e o feixe saia por uma direção livre — se o raio voltar quase por cima da ida, fica impossível comparar as trajetórias.</li>
      <li>Se algum espelho encostar ou sair do contorno no meio do processo, <b>recomece</b>. Dado com espelho movido não prova nada, e o monitor percebe.</li>
    </ul>
    <h5>Traçando as trajetórias</h5>
    <ul>
      <li>Marque <b>dois pontos por trecho</b> de raio, bem afastados, e depois una com régua. Tentar acompanhar o feixe com o lápis à mão livre produz linha torta.</li>
      <li>Ponha as <b>setas de sentido</b> em cada segmento no momento em que traça. É o ponto do experimento, e é o que a pergunta h) cobra.</li>
      <li>Na volta, use a <b>segunda cor</b> desde o primeiro segmento. Trocar de cor no meio bagunça a comparação.</li>
    </ul>
    <h5>Comparando</h5>
    <ul>
      <li>Não conclua "são idênticas" no olho: <b>meça</b>. Escolha dois ou três pontos ao longo do percurso e meça, com régua, a distância entre a linha de ida e a de volta. Reportar "coincidem dentro de 1 mm" é uma conclusão experimental; "parecem iguais" não é.</li>
      <li>Se houver desvio sistemático crescente, provavelmente um espelho girou levemente ou o feixe não estava no plano da folha.</li>
    </ul>
    <div class="crit"><span class="ic">✓</span><div><b>Como saber que deu certo:</b> as duas trajetórias se sobrepõem dentro de poucos milímetros, com as setas apontando em sentidos opostos. Isso é a <b>reversibilidade</b>: o caminho é o mesmo, só o sentido muda. Uma boa frase de conclusão liga isso à experiência cotidiana — se você vê o olho de alguém pelo retrovisor, essa pessoa necessariamente vê o seu.</div></div>
  </div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Não marcar a posição dos espelhos na folha antes de começar — se um deles se mover entre as duas passagens, o resultado perde o sentido · traçar as duas trajetórias com a mesma cor, tornando impossível comparar · esquecer as setas de sentido, que são o ponto do experimento · concluir "são idênticas" sem medir ou sobrepor para verificar.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">T</span>Técnicas que valem para vários experimentos</h3>
  <p class="lead">Quatro dos sete experimentos usam alfinetes, quatro usam laser e cinco pedem traçado preciso no papel. Vale dominar essas técnicas uma vez só — elas decidem a qualidade dos dados em todos eles.</p>

  <h4 style="font-size:15px;font-weight:700;margin:18px 0 8px">O método dos alfinetes, bem feito</h4>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Detalhe</th><th>Por que importa</th></tr></thead>
    <tbody>
      <tr><td>Alfinete perfeitamente <b>vertical</b></td><td>Inclinação desloca o furo em relação ao ponto que você mirou. Confira olhando rente à placa, de lado</td></tr>
      <tr><td>Olho <b>no nível da placa</b>, um só aberto</td><td>Olhar de cima faz você alinhar as cabeças dos alfinetes, não as bases — e as bases é que marcam o papel</td></tr>
      <tr><td>Separação <b>grande</b> entre o par</td><td>O erro angular da reta cai com a distância entre os dois furos. 5 cm é o mínimo do roteiro; mais é melhor</td></tr>
      <tr><td>Direções <b>bem diferentes</b></td><td>Retas quase paralelas se cruzam num ponto mal definido. Procure separações de uns 60°</td></tr>
      <tr><td>Furos <b>pequenos</b></td><td>Furo alargado vira mancha e você perde o centro. Não gire o alfinete ao tirar</td></tr>
      <tr><td>Régua <b>sobre os dois furos</b></td><td>1 mm de desvio no traço vira vários milímetros no cruzamento distante</td></tr>
    </tbody></table></div>

  <h4 style="font-size:15px;font-weight:700;margin:20px 0 8px">O método da paralaxe — a alternativa que vale conhecer</h4>
  <p>Existe uma segunda técnica clássica para localizar imagens, usada em roteiros de óptica da UFRJ e de outras universidades, e ela serve como <b>conferência independente</b> do resultado do experimento 4.</p>
  <p>A ideia: coloque um alfinete de referência atrás do espelho, na posição onde você <i>acha</i> que a imagem está. Olhe para a imagem e para esse alfinete ao mesmo tempo e <b>mova a cabeça lateralmente</b>. Se os dois estiverem realmente na mesma posição, eles se movem juntos e permanecem sobrepostos. Se estiverem a distâncias diferentes, um "desliza" em relação ao outro — é a <b>paralaxe</b>. Ajuste o alfinete até a separação sumir.</p>

  <div class="why"><span class="t">Como usar isso a seu favor</span>Faça o experimento 4 pelo método dos raios, como o roteiro manda, e depois <b>confira</b> a posição encontrada com a paralaxe. Duas técnicas independentes chegando ao mesmo ponto é um argumento forte no relatório — e é exatamente o tipo de iniciativa que diferencia um trabalho.</div>

  <h4 style="font-size:15px;font-weight:700;margin:20px 0 8px">Segurança com a caneta laser</h4>
  <div class="trap"><span class="t">Regras que não se negociam</span>
    Nunca aponte o feixe para os olhos de ninguém, nem para os seus — nem "de brincadeira", nem por um instante. Ao pegar ou largar a caneta, mantenha o feixe voltado para a mesa. Cuidado com <b>reflexos inesperados</b> em relógio, anel, celular, régua metálica ou superfície polida: o feixe volta numa direção que você não controla. Não observe o feixe através de lupa, binóculo ou qualquer instrumento óptico. Sempre que possível, <b>apoie ou fixe</b> a caneta em vez de segurá-la solta.</div>
  <p>Essas recomendações seguem os guias de segurança com laser de instituições de ensino, que classificam ponteiros até 5 mW como utilizáveis em sala <b>desde que</b> o feixe nunca seja dirigido a pessoas e superfícies espelhadas sejam evitadas.</p>

  <h4 style="font-size:15px;font-weight:700;margin:20px 0 8px">Traçado e registro</h4>
  <ul style="font-size:14px;line-height:1.75;padding-left:22px">
    <li>Lápis bem apontado, traço fino. Caneta esferográfica não permite corrigir e engrossa o ponto de cruzamento.</li>
    <li>Aproveite a <b>quadrícula do milimetrado</b> como referência de perpendicularidade — ela substitui o esquadro na hora de traçar normais.</li>
    <li>Rotule tudo <b>no momento</b> em que traça. Depois de tirar os alfinetes, todos os furos são iguais.</li>
    <li>Anote a hora, a data e quem estava no grupo no alto da folha. Se o relatório for escrito semanas depois, isso salva.</li>
    <li>Fotografe a folha e a montagem com o celular antes de sair. Não substitui o registro escrito, mas resolve dúvidas de memória.</li>
  </ul>
  <div class="crit"><span class="ic">✓</span><div><b>O teste final, antes de sair da sala:</b> olhe suas anotações e pergunte se você conseguiria escrever o relatório <b>só com elas</b>, sem lembrar de nada. Se a resposta for não, ainda dá tempo de completar — depois que a janela fecha, não dá.</div></div>
</div>

<div class="lsec">
  <h3><span class="lnum">I</span>Incertezas: como medir e como propagar</h3>
  <p class="lead">Módulo de ferramenta. Os experimentos 1 e 3 exigem incerteza em toda medida e ainda pedem propagação para grandezas calculadas. Isso reaparece em todos os relatórios do semestre, então vale dominar de uma vez.</p>
  <p><b>Regra 1 — incerteza de leitura.</b> Toda medida experimental tem incerteza, representada por <b>δ</b>, inerente ao processo de medir: o instrumento, o observador, as condições. A incerteza absoluta de leitura é <b>metade da menor divisão da escala</b> do instrumento.</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Instrumento</th><th>Menor divisão</th><th>Incerteza δ</th></tr></thead>
    <tbody>
      <tr><td>Régua escolar</td><td>1 mm</td><td>0,5 mm = 0,05 cm</td></tr>
      <tr><td>Papel milimetrado</td><td>1 mm</td><td>0,5 mm</td></tr>
      <tr><td>Transferidor comum</td><td>1°</td><td>0,5°</td></tr>
      <tr><td>Termômetro do exemplo do roteiro</td><td>2 °C</td><td>1 °C</td></tr>
    </tbody></table></div>
  <p>Na prática do laboratório, vale ser honesto: se a borda da mancha luminosa é <b>difusa</b>, sua incerteza real é maior que a da régua — porque não é o instrumento que limita, é a definição do que se está medindo. Registrar isso, e justificar, é sinal de maturidade experimental e costuma ser bem avaliado.</p>
  <p><b>Regra 2 — propagação por extremos.</b> Quando uma grandeza é <b>calculada</b> a partir de outras medidas, ela não tem um valor único: tem uma <b>faixa</b>. O método que o roteiro adota é direto — calcule o valor máximo e o mínimo possíveis, e tome a metade da diferença:</p>
  <div class="fig" style="text-align:center">
    <div class="figttl">A receita geral</div>
    <svg viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg">
      <text x="350" y="42" font-size="21" font-weight="700" fill="var(--text)" text-anchor="middle">δX = (X<tspan font-size="14">máx</tspan> − X<tspan font-size="14">mín</tspan>) / 2</text>
      <text x="350" y="76" font-size="11.5" fill="var(--muted)" text-anchor="middle">e o resultado se escreve como X ± δX, com a mesma unidade</text>
    </svg>
  </div>
  <p><b>O truque de saber para que lado empurrar.</b> Para achar o máximo de uma expressão, aumente o que está no <b>numerador</b> e diminua o que está no <b>denominador</b>. Veja como isso se aplica aos dois casos do roteiro:</p>
  <div class="tblwrap"><table class="data">
    <thead><tr><th>Experimento</th><th>Fórmula</th><th>Máximo</th></tr></thead>
    <tbody>
      <tr><td>1 · mancha luminosa</td><td>L = d · (1 + b/a)</td><td>d e b nos valores máximos, a no mínimo</td></tr>
      <tr><td>3 · índice de refração</td><td>n = sen θ₁ / sen θ₃</td><td>θ₁ no máximo, θ₃ no mínimo</td></tr>
    </tbody></table></div>
  <p><b>Regra 3 — como comparar.</b> Duas medidas são <b>compatíveis</b> quando suas faixas se sobrepõem. Se você previu L = 4,2 ± 0,3 cm e mediu D = 4,0 ± 0,2 cm, as faixas [3,9; 4,5] e [3,8; 4,2] se cruzam — o modelo passou. Se não se cruzarem, há três explicações possíveis, e discutir qual delas vale mais que forçar concordância: o modelo está errado, alguma incerteza foi subestimada, ou existe um erro sistemático na montagem.</p>
  <p><b>Regra 4 — algarismos.</b> A incerteza se escreve com <b>um algarismo significativo</b>, e o valor central é arredondado até a mesma casa decimal. Escreva 4,2 ± 0,3 cm, e não 4,23 ± 0,31 cm nem 4 ± 0,3 cm. Também não escreva número sem unidade — em laboratório, número sem unidade não é resultado.</p>
  <div class="why"><span class="t">Por que isso importa mais do que parece</span>É o conteúdo mais transferível de toda a disciplina. Ele reaparece nos experimentos de elétrica, no relatório final, em toda disciplina experimental do curso e em qualquer artigo científico que você vier a ler. E é exatamente o que separa "achei 1,5" de "medi n = 1,49 ± 0,04, compatível com o valor tabelado do acrílico".</div>
  <div class="trap"><span class="t">Erros que custam conceito</span>Escrever resultado sem incerteza · incerteza com dois ou três algarismos · esquecer a unidade · usar a média de várias medidas sem dizer quantas foram · calcular a incerteza de uma grandeza indireta "no olho", sem passar pelos extremos.</div>
</div>

<div class="lsec">
  <h3><span class="lnum">✓</span>Checklist antes de ir ao laboratório</h3>
  <p class="lead">Cinco minutos de preparo evitam a maior parte das perdas de conceito. A avaliação leva em conta chegar no horário e <b>fazer o experimento como esperado</b> — e boa parte disso se decide antes de entrar na sala F2-40.</p>

      <tr><td><b>Depois</b></td><td>Marcar o experimento como feito no rastreador da aba Laboratório · só então marcar o próximo, já que é um horário por vez</td></tr>
    </tbody></table></div>
  <div class="why"><span class="t">A conta que vale lembrar</span>A nota do experimento é <b>conceito × relatório ÷ 10</b>. O conceito é a parte que não depende de saber física: chegar no horário, se comportar e fazer o experimento como pedido já entrega o fator 2. É o ponto mais barato do semestre — e, sendo multiplicativo, também o mais caro de perder.</div>
  <div class="trap"><span class="t">O que a monitoria penaliza explicitamente</span>Faltar sem justificativa plausível · chegar atrasado · não se comportar · marcar vários horários de uma vez. E lembre: se não puder comparecer, avise <b>com antecedência</b> por mensagem escrita.</div>

['Distâncias','Parsec','Distância em que 1 UA subtende 1 segundo de arco.','O nome vem de "paralaxe de um segundo". Vale ~3,26 anos-luz ou ~206.265 UA. É a régua profissional: distância em parsecs = 1 dividido pela paralaxe em segundos de arco.','D'],

['Luz e instrumentos','Espectro eletromagnético','Conjunto de todas as radiações, do rádio aos raios gama.','Todas são a mesma coisa física, diferindo em comprimento de onda e energia. O visível é uma fatia estreitíssima. Cada faixa revela fenômenos distintos.','λ'],
['Luz e instrumentos','Corpo negro','Emissor térmico ideal, cuja radiação depende só da temperatura.','Não é um corpo preto. Estrelas são boas aproximações. O perfil de emissão é o que permite deduzir temperatura a partir da cor.','λ'],
['Luz e instrumentos','Lei de Wien','Quanto maior a temperatura, menor o comprimento de onda em que a emissão é máxima.','Na prática: estrelas frias são avermelhadas (~3.000 K), o Sol é amarelado (~5.800 K) e as quentes são azuladas (acima de 20.000 K). Cor é termômetro.','λ'],
['Luz e instrumentos','Lei de Stefan-Boltzmann','A energia total emitida por unidade de área cresce com a quarta potência da temperatura.','Dobrar a temperatura multiplica a emissão por dezesseis. Combinada com o raio, dá a luminosidade total da estrela.','λ'],
['Luz e instrumentos','Leis de Kirchhoff','As três regras que descrevem os tipos de espectro.','Sólido ou gás denso e quente produz espectro contínuo. Gás rarefeito e quente produz linhas de emissão. Gás mais frio na frente de fonte contínua produz linhas de absorção — o caso das estrelas.','λ'],
['Luz e instrumentos','Linha espectral','Risca escura ou brilhante em posição exata do espectro, característica de um elemento.','Funciona como impressão digital química. É o que permite saber a composição de um astro sem jamais chegar perto dele.','λ'],
['Luz e instrumentos','Efeito Doppler','Variação do comprimento de onda observado quando fonte e observador se aproximam ou se afastam.','O mesmo fenômeno da sirene de ambulância, aplicado à luz. Permite medir velocidade radial, detectar exoplanetas e mapear rotação de galáxias.','λ'],
['Luz e instrumentos','Desvio para o vermelho','Deslocamento das linhas espectrais para comprimentos de onda maiores.','Indica afastamento. Não significa que o objeto pareça vermelho. Em escala cosmológica, decorre da expansão do próprio espaço, e foi como Hubble descobriu que o Universo se expande.','U'],
['Luz e instrumentos','Espectrógrafo','Instrumento que decompõe a luz em seu espectro.','Entrega composição química, temperatura, velocidade radial e até campo magnético. É a ferramenta mais poderosa da astrofísica, e consome boa parte do tempo dos grandes telescópios.','K'],
['Luz e instrumentos','Fotometria','Medida precisa do brilho de um astro.','Responde perguntas de variação no tempo: pulsação de estrelas variáveis, trânsito de exoplanetas, curvas de luz de supernovas.','K'],
['Luz e instrumentos','CCD','Detector eletrônico que registra imagens convertendo luz em carga elétrica.','Substituiu a chapa fotográfica na astronomia e depois migrou para as câmeras de consumo. É um dos exemplos mais citados de tecnologia derivada de ciência básica.','K'],
['Luz e instrumentos','Refrator','Telescópio que usa lente para desviar a luz.','Foi o tipo de Galileu e é o caso do Cooke do Valongo. Sofre aberração cromática e não escala: lentes grandes deformam sob o próprio peso, porque só podem ser apoiadas pelas bordas.','K'],
['Luz e instrumentos','Refletor','Telescópio que usa espelho côncavo para formar a imagem.','Sem aberração cromática e apoiável por trás em toda a superfície. Todo telescópio grande moderno é refletor.','K'],
['Luz e instrumentos','Ritchey-Chrétien','Desenho óptico de refletor que corrige aberrações fora do eixo.','Virou padrão em telescópios profissionais. É o caso do telescópio de 1,60 m do Pico dos Dias.','K'],
['Luz e instrumentos','Abertura','Diâmetro do espelho ou lente principal de um telescópio.','Decide duas coisas: a luz coletada, que cresce com o quadrado do diâmetro, e o poder de resolução, que cresce proporcionalmente. É o número que define a classe do instrumento.','K'],
['Luz e instrumentos','Seeing','Borrão da imagem causado pela turbulência atmosférica.','Um sítio bom tem seeing abaixo de 1 segundo de arco em boa parte das noites. É o principal critério na escolha de um observatório, e o que a óptica adaptativa corrige.','K'],
['Luz e instrumentos','Óptica adaptativa','Técnica que corrige a distorção atmosférica em tempo real.','Um sensor mede a deformação da frente de onda centenas de vezes por segundo e um espelho deformável a compensa, às vezes com estrela-guia artificial a laser. Aproxima um telescópio de solo da nitidez de um espacial.','K'],
['Luz e instrumentos','Interferometria','Combinação da luz de vários telescópios separados.','Fornece resolução equivalente à de um instrumento do tamanho da distância entre eles. É o princípio do ALMA e das redes que produziram a primeira imagem de um buraco negro.','K'],
['Luz e instrumentos','Janela atmosférica','Faixa do espectro que atravessa a atmosfera e chega ao solo.','Rádio e visível passam bem; o infravermelho passa parcialmente, em janelas estreitas; ultravioleta, raios X e gama são bloqueados. É por isso que existem telescópios espaciais.','K'],

['Sistema Solar','Fusão nuclear','Reação em que núcleos leves se unem formando um mais pesado, liberando energia.','No Sol, hidrogênio vira hélio no núcleo, a ~15 milhões de kelvin. Não é combustão: libera milhões de vezes mais energia por partícula, e é o que permite ao Sol durar bilhões de anos.','5'],
['Sistema Solar','Fotosfera','Camada visível do Sol, de onde escapa a luz que enxergamos.','Está a cerca de 5.778 K. É nela que aparecem as manchas solares.','5'],
['Sistema Solar','Mancha solar','Região mais fria e escura da fotosfera, onde o campo magnético é intenso.','Seu número sobe e desce num ciclo de aproximadamente 11 anos. Nos máximos, aumentam explosões e ejeções de massa coronal.','5'],
['Sistema Solar','Vento solar','Fluxo contínuo de partículas carregadas emitido pelo Sol.','Produz auroras ao interagir com o campo magnético terrestre e é o que faz a cauda de íons dos cometas apontar sempre para longe do Sol.','5'],
['Sistema Solar','Hipótese nebular','Modelo padrão de formação do Sistema Solar a partir do colapso de uma nuvem de gás e poeira.','Explica de uma vez o plano orbital comum, o sentido único das órbitas e a divisão entre rochosos internos e gigantes externos.','N'],
['Sistema Solar','Linha de gelo','Distância a partir da qual a temperatura do disco protoplanetário permitia que voláteis condensassem.','Dentro dela sobrou pouco material sólido, e nasceram planetas pequenos e rochosos. Fora dela havia muito mais material, e nasceram os gigantes.','N'],
['Sistema Solar','Planetas terrestres','Mercúrio, Vênus, Terra e Marte: rochosos, pequenos e densos.','Também chamados internos. Têm superfície sólida, poucas ou nenhuma lua e atmosferas finas ou ausentes.','4'],
['Sistema Solar','Planetas jovianos','Júpiter, Saturno, Urano e Netuno: gigantes gasosos e de gelo.','Também chamados externos. Têm muitas luas, sistemas de anéis e nenhuma superfície sólida definida. Só Júpiter tem 318 massas terrestres.','4'],
['Sistema Solar','Cinturão de asteroides','Região entre as órbitas de Marte e Júpiter concentrando corpos rochosos.','A influência gravitacional de Júpiter impediu que esse material se juntasse num planeta.','N'],
['Sistema Solar','Cinturão de Kuiper','Disco de corpos gelados além da órbita de Netuno.','Origem dos cometas de período curto, que dão a volta em menos de 200 anos e orbitam quase no plano dos planetas.','N'],
['Sistema Solar','Nuvem de Oort','Envoltório aproximadamente esférico de corpos gelados a cerca de 100.000 UA.','Origem dos cometas de período longo, cujas órbitas podem ter qualquer inclinação e períodos de até 30 milhões de anos.','N'],
['Sistema Solar','Cometa','Corpo de gelo e poeira que desenvolve coma e caudas ao se aproximar do Sol.','Núcleo de poucos quilômetros; coma, o envelope difuso; e duas caudas — a de poeira, curva, e a de íons, reta. Ambas apontam para longe do Sol.','N'],
['Sistema Solar','Meteorito','Fragmento de corpo do Sistema Solar que sobrevive à entrada na atmosfera e atinge o solo.','São amostras grátis do Sistema Solar primitivo, e foi datando meteoritos que se estabeleceu a idade de 4,6 bilhões de anos.','N'],
['Sistema Solar','Rotação síncrona','Situação em que o período de rotação de um corpo iguala o de translação.','É o caso da Lua, que por isso mostra sempre a mesma face para a Terra. Resulta do acoplamento de maré ao longo do tempo.','L'],
['Sistema Solar','Maré','Deformação causada pela diferença de atração gravitacional entre lados opostos de um corpo.','Como o lado voltado para a Lua é mais atraído que o oposto, há duas marés altas por dia, e não uma.','L'],
['Sistema Solar','Mês sinódico','Intervalo entre duas luas novas consecutivas: 29,5 dias.','Maior que o período orbital de 27,3 dias porque, enquanto a Lua completa a volta, a Terra também avançou na órbita e o alinhamento com o Sol precisa ser recuperado.','L'],
['Sistema Solar','Diferenciação','Separação do interior de um planeta por densidade, com os materiais pesados afundando.','Na Terra, ferro e níquel formaram o núcleo enquanto silicatos leves subiram. É por isso que a composição da crosta não vale para o planeta inteiro, e é a origem do campo magnético.','L'],
['Sistema Solar','Velocidade de escape','Velocidade mínima para um corpo escapar da gravidade de um planeta.','Na Terra, cerca de 11,2 km/s. Determina também se um planeta consegue reter atmosfera.','T'],
['Sistema Solar','Assistência gravitacional','Manobra em que uma sonda ganha velocidade ao passar perto de um planeta.','Rouba um pouco da energia orbital do planeta sem gastar combustível. Foi assim que as Voyager percorreram o Sistema Solar externo.','T'],

['Estrelas','Equilíbrio hidrostático','Balanço entre a gravidade que comprime a estrela e a pressão interna que a sustenta.','É a trégua que mantém uma estrela estável. Quando o combustível nuclear acaba e a pressão cede, o equilíbrio quebra e a estrela morre.','★'],
['Estrelas','Sequência principal','Faixa do diagrama HR onde ficam as estrelas que queimam hidrogênio no núcleo.','Cerca de 90% das estrelas estão nela, incluindo o Sol. É a fase mais longa e estável da vida estelar.','★'],
['Estrelas','Diagrama HR','Gráfico de luminosidade contra temperatura das estrelas.','Provavelmente o gráfico mais importante da astronomia. A posição de uma estrela nele revela em que fase da vida ela está. O eixo de temperatura cresce para a esquerda, por herança histórica.','★'],
['Estrelas','Classificação espectral','Sequência O, B, A, F, G, K, M, da mais quente à mais fria.','Cada classe se subdivide de 0 a 9. O Sol é G2. A ordem é herança histórica que sobreviveu à reorganização por temperatura.','★'],
['Estrelas','Anã marrom','Objeto com massa insuficiente para ligar a fusão de hidrogênio.','Abaixo de aproximadamente 0,08 massa solar. Fica entre planeta gigante e estrela fracassada.','★'],
['Estrelas','Anã branca','Remanescente denso de uma estrela de até ~8 massas solares.','Caroço de carbono e oxigênio do tamanho da Terra, que apenas esfria ao longo de bilhões de anos. É o destino do Sol.','★'],
['Estrelas','Supernova','Explosão que marca a morte de uma estrela massiva.','Ocorre quando o núcleo de ferro colapsa. Dispersa elementos pesados pelo meio interestelar e pode brilhar mais que a galáxia inteira por semanas.','★'],
['Estrelas','Estrela de nêutrons','Remanescente ultradenso, com cerca de 1,4 massa solar comprimida em ~20 km.','Se girar rapidamente e emitir feixes de radiação, é observada como pulsar.','★'],
['Estrelas','Buraco negro','Região onde a gravidade é tão intensa que nem a luz escapa.','Buracos negros estelares resultam do colapso de estrelas acima de ~25 massas solares. Os supermassivos, no centro de galáxias, alimentam AGNs e quasares.','★'],
['Estrelas','Nebulosa planetária','Camadas externas ejetadas por uma estrela de baixa massa em fim de vida.','Não tem nada a ver com planetas — o nome vem da aparência arredondada nos telescópios antigos.','★'],
['Estrelas','Nucleossíntese','Produção de elementos químicos por reações nucleares no interior das estrelas.','O Big Bang produziu quase só hidrogênio e hélio. Carbono, oxigênio, cálcio e ferro vieram de estrelas; elementos mais pesados que o ferro exigem supernovas ou colisões de estrelas de nêutrons.','★'],
['Estrelas','Meio interestelar','Gás e poeira que preenchem o espaço entre as estrelas de uma galáxia.','É berço e cemitério estelar: dele nascem estrelas, e a ele elas devolvem material enriquecido ao morrer.','3'],
['Estrelas','Nuvem molecular','Região densa e fria do meio interestelar onde estrelas se formam.','O colapso gravitacional dessas nuvens fragmenta e produz vários núcleos que aquecem até ligar a fusão.','★'],

['Galáxias e Universo','Via Láctea','Nossa galáxia: espiral barrada com centenas de bilhões de estrelas.','Disco de ~100 mil anos-luz de diâmetro e ~1.000 de espessura. O Sol fica a ~8 kpc do centro e leva ~230 milhões de anos para completar uma volta.','6'],
['Galáxias e Universo','Disco, bojo e halo','As três componentes estruturais de uma galáxia espiral.','O disco concentra gás, poeira e estrelas jovens, com os braços espirais. O bojo central é denso, com estrelas velhas e um buraco negro supermassivo. O halo é esférico e esparso, com aglomerados globulares antigos.','6'],
['Galáxias e Universo','Classificação de Hubble','Esquema que separa galáxias em elípticas, espirais, lenticulares e irregulares.','Elípticas de E0 a E7; espirais Sa, Sb, Sc e as barradas SBa, SBb, SBc; lenticulares S0 como meio-termo. A Via Láctea é espiral barrada.','U'],
['Galáxias e Universo','Grupo Local','Conjunto de mais de setenta galáxias que inclui a Via Láctea e Andrômeda.','A maioria são anãs, entre elas as Nuvens de Magalhães, visíveis a olho nu do hemisfério sul. Andrômeda se aproxima e deve colidir conosco em ~4 bilhões de anos.','U'],
['Galáxias e Universo','Estrutura em grande escala','Padrão de distribuição das galáxias no Universo.','A distribuição não é aleatória: forma grupos, aglomerados, superaglomerados, filamentos e vazios — a chamada teia cósmica.','U'],
['Galáxias e Universo','AGN','Núcleo ativo de galáxia, alimentado por um buraco negro supermassivo.','Libera mais energia que todas as estrelas da galáxia somadas, a partir de uma região do tamanho do Sistema Solar.','U'],
['Galáxias e Universo','Quasar','O tipo mais luminoso e distante de núcleo ativo.','Tão brilhantes que foram inicialmente confundidos com estrelas — daí o nome, de "quasi-stellar radio source". São vistos a bilhões de anos-luz, ou seja, no Universo jovem.','U'],
['Galáxias e Universo','Lei de Hubble','Galáxias se afastam de nós com velocidade proporcional à distância.','Observada em 1929. Não significa que estejamos no centro: o próprio espaço se expande, como pontos num balão sendo inflado.','U'],
['Galáxias e Universo','Big Bang','Modelo segundo o qual o Universo surgiu de um estado quente e denso há ~13,8 bilhões de anos.','Decorre de extrapolar a expansão para trás no tempo. É sustentado também pela radiação cósmica de fundo e pela abundância de elementos leves.','U'],
['Galáxias e Universo','Matéria escura','Componente que exerce gravidade mas não emite luz.','Postulada porque as bordas das galáxias giram rápido demais para a massa visível. Responde por cerca de cinco vezes mais massa que a matéria comum.','U'],
['Galáxias e Universo','Energia escura','Componente associada à aceleração da expansão do Universo.','Somada à matéria escura, faz com que a matéria comum — de que estrelas, planetas e você são feitos — seja apenas cerca de 5% do conteúdo do Universo.','U'],
['Galáxias e Universo','Universo observável','Região do Universo de onde a luz teve tempo de chegar até nós.','Impõe um horizonte: não é o tamanho do Universo, é o limite do que podemos ver.','U'],

['Instituições','UAI','União Astronômica Internacional, entidade que organiza a astronomia mundial.','Fixou as 88 constelações em 1928 e a definição exata da UA em 2012. Sua Assembleia Geral de 2009 aconteceu no Rio de Janeiro.','8'],
['Instituições','SAB','Sociedade Astronômica Brasileira.','Reúne a maioria dos cerca de 600 astrônomos brasileiros. Suas reuniões anuais são o principal ponto de encontro da comunidade.','8'],
['Instituições','LNA','Laboratório Nacional de Astrofísica, em Itajubá (MG).','Administra o Observatório do Pico dos Dias e representa o Brasil em consórcios internacionais.','7'],
['Instituições','OPD','Observatório do Pico dos Dias, em Brazópolis (MG), a 1.864 m.','Maior observatório óptico do país. Abriga o telescópio de 1,60 m Perkin-Elmer, dois de 60 cm e uma buscadora de cometas. É público: qualquer pessoa pode submeter proposta.','7'],
['Instituições','Observatório do Valongo','Unidade da UFRJ que sedia o curso de graduação em Astronomia.','Fundado em 5 de julho de 1881 como Observatório Astronômico da Escola Polythécnica. O curso foi criado em 1958. Fica na Ladeira do Pedro Antônio, 43, Saúde.','9'],
['Instituições','Radome','Cúpula que protege uma antena de rádio sem bloquear o sinal.','O do Rádio Observatório de Itapetinga tem cerca de 25 metros de altura e abriga a antena de 13,7 m.','7']
];

function updateExecProgress(){
  const pctEl=document.getElementById('exPct');
  if(!pctEl) return;
  const n=route.execN||1, E=EXEC.find(x=>x.n===n);
  if(!E) return;
  let tot=0,dn=0,k=0;
  E.fases.forEach(f=>f.p.forEach(()=>{ tot++; if(S.execDone&&S.execDone[n+':'+(k++)]) dn++; }));
  const pct=tot?Math.round(dn/tot*100):0;
  pctEl.textContent=pct+'%';
  pctEl.style.color=(pct===100)?'var(--ok)':byCode(route.subject).color;
  const c=document.getElementById('exCnt'); if(c) c.textContent=dn+'/'+tot;
  const b=document.getElementById('exBar');
  if(b){ b.style.width=pct+'%'; b.style.background=(pct===100)?'var(--ok)':byCode(route.subject).grad; }
}
function viewExec(su){
  const n=route.execN||1;
  const E=EXEC.find(x=>x.n===n)||EXEC[0];
  let tot=0,dn=0,k=0;
  E.fases.forEach(f=>f.p.forEach(()=>{ tot++; if(S.execDone&&S.execDone[n+':'+(k++)]) dn++; }));
  const pct=tot?Math.round(dn/tot*100):0;

  let h='<div class="note" style="margin-bottom:14px">Guia de bancada. Cada linha é <b style="color:var(--text)">uma ação só</b>, na ordem de execução — feito para você seguir com o celular na mão durante o experimento. Toque para marcar; fica salvo neste computador. Os tempos são estimativas para você não se perder na sessão.</div>';

  h+='<div class="chips" style="margin-bottom:15px">'+EXEC.map(x=>{
    let t=0,d=0,j=0;
    x.fases.forEach(f=>f.p.forEach(()=>{ t++; if(S.execDone&&S.execDone[x.n+':'+(j++)]) d++; }));
    const full=(t&&d===t);
    return '<button class="btn sm exsel'+(x.n===n?' primary':'')+'" data-n="'+x.n+'" style="'+(full&&x.n!==n?'border-color:var(--ok);color:var(--ok)':'')+'">EXP '+x.n+(full?' ✓':'')+'</button>';
  }).join('')+'</div>';

  h+='<div class="card" style="padding:19px 22px;margin-bottom:16px;border-left:4px solid '+su.color+'">'+
    '<div class="row" style="justify-content:space-between;align-items:flex-start">'+
    '<div style="flex:1;min-width:200px"><div class="tagr" style="border:none;background:none;padding:0;color:'+su.color+'">Experimento '+E.n+' · '+E.tempo+' · '+tot+' passos</div>'+
    '<h2 style="margin:4px 0 0;font-size:20px;font-weight:680;letter-spacing:-.3px">'+E.tit+'</h2></div>'+
    '<div style="text-align:right"><div id="exPct" style="font-size:24px;font-weight:680;color:'+(pct===100?'var(--ok)':su.color)+'">'+pct+'%</div>'+
    '<div class="small muted" id="exCnt">'+dn+'/'+tot+'</div></div></div>'+
    '<div class="bar" style="margin-top:12px"><i id="exBar" style="width:'+pct+'%;background:'+(pct===100?'var(--ok)':su.grad)+'"></i></div>'+
    '<div class="row" style="margin-top:13px"><button class="btn sm" id="exReset">Zerar este experimento</button>'+
    '<span class="small muted">marque conforme executa — assim você não perde o passo se for interrompido</span></div></div>';

  let idx=0;
  E.fases.forEach(f=>{
    h+='<div class="fase"><div class="fh"><b>'+f.f+'</b><span>'+f.t+'</span></div>';
    f.p.forEach(p=>{
      const key=n+':'+idx, on=S.execDone&&S.execDone[key];
      h+='<div class="step'+(on?' on':'')+'" data-k="'+key+'">'+
        '<span class="nn">'+(idx+1)+'</span>'+
        '<span class="bx">'+CHECK+'</span>'+
        '<span class="tx">'+p+'</span></div>';
      idx++;
    });
    h+='</div>';
  });

  h+='<div class="why" style="margin-top:6px"><span class="t">Ao terminar</span>Volte em <b>Como funciona a monitoria</b> e marque o experimento como <b>feito</b> no rastreador. Lembre que só se marca o próximo horário depois de realizar o atual.</div>';
  return h;
}

const DIAC=new RegExp('[\\u0300-\\u036f]','g');
const slug=s=>s.toLowerCase().normalize('NFD').replace(DIAC,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,44);
SUBJECTS.forEach(su=>{
  su.lessons=LESSONS[su.code]||[];

  su.cards.forEach(c=>{ c.id=su.code+':c:'+slug(c.q); if(c.l&&!c.m) c.m=modOf(c.q); });

});
const byCode=c=>SUBJECTS.find(s=>s.code===c);

function subProgress(su){
  let tot=0,dn=0;
  su.topics.forEach(t=>t.subs.forEach(x=>{tot++; if(S.done[x.id])dn++;}));
  return {tot,dn,pct:tot?Math.round(dn/tot*100):0};
}
function overall(){
  let tot=0,dn=0;
  SUBJECTS.forEach(su=>{const p=subProgress(su);tot+=p.tot;dn+=p.dn;});
  return {tot,dn,pct:tot?Math.round(dn/tot*100):0};
}

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysTo(iso){
  const p=iso.split('-'); const t=new Date(+p[0],+p[1]-1,+p[2]);
  const n=new Date(); n.setHours(0,0,0,0);
  return Math.round((t-n)/86400000);
}
function ring(pct,color,size=56){
  const r=(size-7)/2, c=2*Math.PI*r;
  return '<svg class="ring" viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;flex:none">'+
    '<circle class="bgc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'"/>'+

    '</svg>';
}

/* camadas geológicas decorativas no cabeçalho — um aceno às Ciências da Terra */
function drawStrata(){
  const svg=document.querySelector('.strata');
  if(!svg) return;
  const dark=S.theme==='dark';
  const bands=dark
    ? [['#1B1811',0],['#211D15',44],['#191610',88],['#231F17',126],['#1B1812',164],['#221E16',202],['#191610',240],['#201C14',276]]
    : [['#EFE7D6',0],['#E8DEC8',44],['#F2EADB',88],['#E4D9C0',126],['#EDE4D2',164],['#E9DFC9',202],['#F1E9D9',240],['#E6DBC3',276]];
  let s='';
  bands.forEach(function(b,i){
    const c=b[0], y=b[1];
    let d='M0 '+y;
    for(let x=0;x<=1400;x+=175){
      const yy=y+Math.sin((x/175+i*1.7))*7+Math.cos(x/420+i)*4;
      d+=' L'+x+' '+yy.toFixed(1);
    }
    d+=' L1400 320 L0 320 Z';
    s+='<path d="'+d+'" fill="'+c+'" opacity="'+(0.85-i*0.04).toFixed(2)+'"/>';
  });
  svg.innerHTML=s;
}

function nextClass(){
  const now=new Date(), startH=[8,10,13,15], endH=[10,12,15,17];
  for(let add=0;add<8;add++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+add);
    const di=d.getDay()-1;
    if(di<0||di>4) continue;
    for(let h=0;h<4;h++){
      const code=SCHEDULE.cells[h][di];
      if(!code) continue;
      if(add===0 && now.getHours()>=endH[h]) continue;
      const live = add===0 && now.getHours()>=startH[h] && now.getHours()<endH[h];
      return {code,day:SCHEDULE.days[di],hour:SCHEDULE.hours[h],add,live};
    }
  }
  return null;
}

function nextFor(code){
  const now=new Date(), startH=[8,10,13,15], endH=[10,12,15,17];
  for(let add=0;add<8;add++){
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+add), di=d.getDay()-1;
    if(di<0||di>4) continue;
    for(let hh=0;hh<4;hh++){
      if(SCHEDULE.cells[hh][di]!==code) continue;
      if(add===0&&now.getHours()>=endH[hh]) continue;
      return (add===0?'hoje':add===1?'amanhã':SCHEDULE.days[di]+'ª')+' · '+SCHEDULE.hours[hh]+'h';
    }
  }
  return null;
}

function lessonModules(L){
  if(L._mods) return L._mods;
  const parts=L.html.split('<div class="lsec">').filter(s=>s.trim());
  L._mods=parts.map((p,i)=>{
    const hm=p.match(/<h3>[\s\S]*?<\/h3>/);
    const head=hm?hm[0]:'';
    const nm=head.match(/lnum">([\s\S]*?)<\/span>/);
    const title=head.replace(/<span[\s\S]*?<\/span>/,'').replace(/<[^>]+>/g,'').trim();
    const body=(hm?p.replace(head,''):p).replace(/<\/div>\s*$/,'');
    const words=body.replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length;
    return {i, n:nm?nm[1]:String(i), title, body, words, min:Math.max(1,Math.round(words/190))};
  });
  if(L.order) L._mods.sort((x,y)=>{
    const a=L.order.indexOf(x.n), b=L.order.indexOf(y.n);
    return (a<0?99:a)-(b<0?99:b);
  });
  L._mods.push({i:L._mods.length, n:'F', title:'Fontes consultadas', refs:true, words:0, min:1,
    body:'<p class="lead" style="max-width:70ch">Tudo que eu acrescentei aos slides do professor veio daqui. Os números em azul no texto apontam para esta lista.</p>'+
      (L.refmap?'<div class="tblwrap"><table class="data"><thead><tr><th>Módulo</th><th>Fontes usadas</th></tr></thead><tbody>'+
        L.refmap.map(r=>'<tr><td>'+r[0]+'</td><td style="font-variant-numeric:tabular-nums">'+r[1]+'</td></tr>').join('')+'</tbody></table></div>':'')+
      '<ol class="refs">'+
      L.refs.map(r=>'<li>'+r.t+'<a href="'+r.u+'" target="_blank" rel="noopener">'+r.u+'</a></li>').join('')+'</ol>'});
  return L._mods;
}

    '</div>'+
    '<div style="margin:19px 18px 0;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;background:'+su.grad+'"></div></div>'+
    '<div class="small muted" style="margin:9px 18px 0">Segundas e quartas, 08–10h, '+su.room+'. As três provas e a segunda chamada são às 17h. '+
      'Clique num tópico da ementa para marcá-lo como estudado — é o mesmo estado da aba <b style="color:var(--text)">Tópicos</b>.</div>'+
  '</div>';

  const TIQUE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  let mes='', aberto=false;
  CRONO.forEach(c=>{
    const y=+c.d.slice(0,4), mo=+c.d.slice(5,7), dd=+c.d.slice(8);
    const key=c.d.slice(0,7);
    if(key!==mes){
      if(aberto) h+='</div>';
      mes=key;
      h+='<div class="sec-title">'+MESES[mo-1]+'</div><div class="card" style="padding:0;overflow:hidden">';
      aberto=true;
    }
    const cor = c.k==='prova'?'var(--danger)' : c.k==='aula'?su.color : 'var(--muted2)';
    const off = c.k!=='aula'&&c.k!=='prova';
    let chips='';
    (c.m||[]).forEach(par=>{
      const t=su.topics[par[0]]; if(!t) return;
      par[1].forEach(si=>{
        const x=t.subs[si]; if(!x) return;
        chips+='<button class="cchk'+(S.done[x.id]?' done':'')+'" data-sid="'+x.id+'" title="'+esc(t.t)+'">'+TIQUE+'<span>'+esc(x.t)+'</span></button>';
      });
    });
    h+='<div class="cro'+(c.d<hoje?' past':'')+(c.d===hoje?' today':'')+(off?' k-off':'')+'" style="--cro:'+cor+'">'+
       '<div class="cdt"><b>'+dd+'</b><span>'+DS[new Date(y,mo-1,dd).getDay()]+'</span></div>'+
       '<div class="cnm">'+c.n+'</div>'+
       '<div class="cbd"><div class="ctt">'+c.t+'</div>'+
         (c.x?'<span class="ctag">'+c.x+'</span>':'')+
         (chips?'<div class="cchips">'+chips+'</div>':'')+
       '</div></div>';
  });
  if(aberto) h+='</div>';

  h+='<div class="sec-title">Três coisas para conferir com o professor</div>'+
     '<div class="card" style="padding:20px 22px">'+
     '<ul class="tl" style="margin:0">'+
     '<li><b>P2</b>O cronograma marca <b style="color:var(--text)">Revisão + P2</b> duas vezes na semana 11, em 26/10 e em 28/10, com o mesmo texto e horário. Nas outras provas há uma linha só. Coloquei a contagem regressiva em <b style="color:var(--text)">28/10</b>, que é a quarta-feira — o mesmo dia da semana da P1 e da P3 —, mas isso é dedução minha, não o que está escrito.</li>'+
     '<li><b>Listas</b>As listas 1, 2 e 3 aparecem com asterisco nas aulas 2, 6 e 7. O asterisco remete a uma legenda que não veio no arquivo. Se for data de entrega, mando para os prazos.</li>'+
     '<li><b>Derivada</b>A ementa que montei tem uma unidade de <b style="color:var(--text)">taxa de variação e derivada</b>. O cronograma vai só até <b style="color:var(--text)">tendências e limites</b>, na aula 23 — de derivada, aparece apenas reta tangente, na aula 20. É bem provável que a derivada fique para Cálculo I.</li>'+
     '</ul></div>'+
     '<div class="note" style="margin-top:14px">Fonte: <b style="color:var(--text)">Cronograma Introdução ao Cálculo I 2026-2</b>, planilha entregue pelo professor. '+
     'A conversão da planilha embaralhou 14 das 34 datas (dia e mês trocados). Reconstruí todas pelo dia da semana: '+
     'toda aula cai numa segunda ou numa quarta, e os três feriados batem com 7 de setembro, 12 de outubro e 2 de novembro.</div>';
  return h;
}
function viewTopics(su){
  let h='<div style="margin-bottom:13px"><input type="text" id="tfilter" placeholder="filtrar tópicos desta matéria..."></div>';
  su.topics.forEach((t,i)=>{
    const dn=t.subs.filter(x=>S.done[x.id]).length;
    const open=dn>0&&dn<t.subs.length;
    h+='<div class="topic'+(open?' open':'')+'" data-search="'+esc((t.t+' '+t.s.join(' ')).toLowerCase())+'">'+
       '<div class="head"><div class="num" style="'+(dn===t.subs.length?'background:'+su.grad+';color:#fff':'')+'">'+(i+1)+'</div>'+
       '<h4>'+t.t+'</h4>'+(t.draft?'<span class="tagr">esboço</span>':'<span class="tagr" style="border-color:'+su.color+';color:'+su.color+'">aula dada</span>')+
       '<span class="small muted" style="white-space:nowrap">'+dn+'/'+t.subs.length+'</span>'+CHEV+'</div>'+
       '<div class="body">'+t.subs.map(x=>
         '<label class="chk'+(S.done[x.id]?' done':'')+'" data-sid="'+x.id+'"><span class="box">'+CHECK+'</span><span>'+x.t+'</span></label>').join('')+
       '</div></div>';
  });
  const nreal=su.topics.filter(t=>t.real).length;
  h+='<div class="note" style="margin-top:15px">'+(nreal?'<b style="color:var(--text)">'+nreal+' unidade</b> vem do material real do professor. ':'')+
     'As marcadas como <b style="color:var(--text)">esboço</b> são minha previsão da ementa — mande a aula em <b style="color:var(--text)">.md</b> e eu troco pelo conteúdo verdadeiro, sem perder o que você já marcou.</div>';
  return h;
}
function viewFlash(su){
  if(!su.cards.length) return '<div class="card empty">Ainda sem flashcards nesta matéria.</div>';
  const rev=su.cards.filter(c=>(S.cardBox[c.id]||1)<3).length;
  let h='<div class="row" style="margin-bottom:15px"><button class="btn sm" id="fAll">Todos ('+su.cards.length+')</button>'+
        '<button class="btn sm" id="fRev">Para revisar ('+rev+')</button>'+
        '<span class="small muted">clique no card para virar</span></div><div class="grid g2">';
  su.cards.forEach(c=>{
    const box=S.cardBox[c.id]||1;
    h+='<div class="fcard" data-box="'+box+'">'+
       '<div class="inner"><div class="face"><span class="lvl">'+(c.l?'aula '+String(c.l).padStart(2,'0')+' · ':'')+'nível '+box+'/3</span><div class="q">'+c.q+'</div>'+
       '<div class="small muted" style="margin-top:15px">clique para ver a resposta</div></div>'+
       '<div class="face back"><div class="a">'+c.a+'</div>'+
       '<div class="row" style="margin-top:17px"><button class="btn sm know" data-cid="'+c.id+'" style="border-color:var(--ok);color:var(--ok)">Sei</button>'+
       '<button class="btn sm again" data-cid="'+c.id+'" style="border-color:var(--warn);color:var(--warn)">Revisar</button></div></div></div></div>';
  });
  return h+'</div>';
}
function viewQuiz(su){
  if(!su.quiz.length) return '<div class="card empty">Ainda sem questões nesta matéria.</div>';
  let h='<div class="row" style="margin-bottom:15px"><button class="btn sm" id="qReset">Refazer</button><span class="small muted" id="qScore"></span></div>';
  su.quiz.forEach((q,i)=>{
    const ans=S.quiz[q.id];
    h+='<div class="card qz">'+(q.l?'<span class="tagr" style="float:right;margin-left:9px">aula '+String(q.l).padStart(2,'0')+'</span>':'')+
       '<div class="qt">'+(i+1)+'. '+q.q+'</div>'+
       q.o.map((o,j)=>{
         let cls='opt';
         if(ans!==undefined){ if(j===q.c)cls+=' right'; else if(j===ans)cls+=' wrong'; }
         return '<div class="'+cls+'" data-qid="'+q.id+'" data-i="'+j+'"><span class="k">'+'ABCD'[j]+'</span><span>'+o+'</span></div>';
       }).join('')+
       (ans!==undefined?'<div class="expl">'+q.e+'</div>':'')+'</div>';
  });
  return h;
}
function viewNotas(su){
  return '<div class="card" style="padding:18px 20px">'+
    '<div class="small muted" style="margin-bottom:10px">Anotações livres — dúvidas para levar pro professor, links, lembretes. Salva sozinho.</div>'+
    '<textarea id="notes" rows="16" placeholder="Escreva aqui...">'+esc(S.notes[su.code]||'')+'</textarea></div>';
}
function bindSubject(){
  const su=byCode(route.subject);
  const back=document.getElementById('back');
  if(back) back.onclick=()=>{route.subject=null;route.tab='materias';render();};
  document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{route.sub=b.dataset.sub;render();});
  document.querySelectorAll('.lsel').forEach(b=>b.onclick=()=>{route.lesson=+b.dataset.i;route.mod=0;render();});
  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{route.mod=+b.dataset.mod;render();});
  document.querySelectorAll('.labsec').forEach(b=>b.onclick=()=>{ route.labsec=b.dataset.ls; render(); });
  document.querySelectorAll('.exsel').forEach(b=>b.onclick=()=>{ route.execN=+b.dataset.n; render(); });
  document.querySelectorAll('.step').forEach(s=>s.onclick=()=>{
    const k=s.dataset.k;
    if(!S.execDone) S.execDone={};
    if(S.execDone[k]) delete S.execDone[k]; else S.execDone[k]=1;
    save();
    s.classList.toggle('on');
    updateExecProgress();
  });
  const exr=document.getElementById('exReset');
  if(exr) exr.onclick=()=>{
    const n=route.execN||1;
    if(S.execDone) Object.keys(S.execDone).forEach(k=>{ if(k.indexOf(n+':')===0) delete S.execDone[k]; });
    save(); render();
  };
  document.querySelectorAll('.expst').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n;
    if(!S.exp) S.exp={};
    if(!S.exp[n]) S.exp[n]={s:0,c:''};
    S.exp[n].s=((S.exp[n].s||0)+1)%3;
    save(); render();
  });
  document.querySelectorAll('.expcc').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n, c=b.dataset.c;
    if(!S.exp) S.exp={};
    if(!S.exp[n]) S.exp[n]={s:0,c:''};
    S.exp[n].c=(S.exp[n].c===c)?'':c;
    if(S.exp[n].c) S.exp[n].s=2;
    save(); render();
  });
  document.querySelectorAll('.gcard').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
  const gf=document.getElementById('gfilter');
  const gapply=()=>{
    const q=(gf?gf.value:'').toLowerCase().trim();
    const cat=(document.querySelector('.gcat.primary')||{dataset:{cat:''}}).dataset.cat;
    document.querySelectorAll('.gcard').forEach(c=>{
      const okq=!q||c.dataset.s.indexOf(q)>=0, okc=!cat||c.dataset.cat===cat;
      c.style.display=(okq&&okc)?'':'none';
      if(q&&okq&&okc) c.classList.add('open');
    });
  };
  if(gf) gf.oninput=gapply;
  document.querySelectorAll('.gcat').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.gcat').forEach(x=>x.classList.remove('primary'));
    b.classList.add('primary'); gapply();
  });
  const rb=document.getElementById('readBtn');
  if(rb) rb.onclick=()=>{
    const k=rb.dataset.k;
    if(S.read[k]) delete S.read[k]; else S.read[k]=1;
    save(); render();
  };

  document.querySelectorAll('.topic .head').forEach(hd=>hd.onclick=()=>hd.parentElement.classList.toggle('open'));
  document.querySelectorAll('.chk').forEach(c=>c.onclick=(e)=>{
    e.preventDefault();
    const id=c.dataset.sid;
    if(S.done[id]) delete S.done[id]; else S.done[id]=1;
    save(); render();
  });
  document.querySelectorAll('.cchk').forEach(c=>c.onclick=()=>{
    const id=c.dataset.sid;
    if(S.done[id]) delete S.done[id]; else S.done[id]=1;
    save();
    document.querySelectorAll('.cchk[data-sid="'+id+'"]').forEach(o=>o.classList.toggle('done',!!S.done[id]));
    const p=subProgress(su), g=document.querySelector('.hero .glass');
    if(g) g.innerHTML='<b>'+p.pct+'%</b><span>'+p.dn+'/'+p.tot+' tópicos</span>';
  });
  const tf=document.getElementById('tfilter');
  if(tf) tf.oninput=()=>{
    const q=tf.value.toLowerCase().trim();
    document.querySelectorAll('.topic').forEach(t=>{
      const hit=!q||t.dataset.search.includes(q);
      t.style.display=hit?'':'none';
      if(q&&hit) t.classList.add('open');
    });
  };

  document.querySelectorAll('.fcard').forEach(f=>f.onclick=(e)=>{ if(!e.target.closest('button')) f.classList.toggle('flip'); });
  document.querySelectorAll('.know').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); const id=b.dataset.cid;
    S.cardBox[id]=Math.min(3,(S.cardBox[id]||1)+1); save(); render();
  });
  document.querySelectorAll('.again').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); S.cardBox[b.dataset.cid]=1; save(); render();
  });
  const fa=document.getElementById('fAll'), fr=document.getElementById('fRev');
  if(fa) fa.onclick=()=>document.querySelectorAll('.fcard').forEach(f=>f.style.display='');
  if(fr) fr.onclick=()=>document.querySelectorAll('.fcard').forEach(f=>f.style.display=(+f.dataset.box<3)?'':'none');

  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(S.quiz[o.dataset.qid]!==undefined) return;
    S.quiz[o.dataset.qid]=+o.dataset.i; save(); render();
  });
  const qr=document.getElementById('qReset');
  if(qr) qr.onclick=()=>{ su.quiz.forEach(q=>delete S.quiz[q.id]); save(); render(); };
  const sc=document.getElementById('qScore');
  if(sc){
    const done=su.quiz.filter(q=>S.quiz[q.id]!==undefined);
    const right=done.filter(q=>S.quiz[q.id]===q.c).length;
    sc.textContent=done.length?right+' de '+done.length+' corretas':'';
  }
  const nt=document.getElementById('notes');
  if(nt) nt.oninput=()=>{ S.notes[su.code]=nt.value; save(); };
}

/* =======================================================================
   9. PRAZOS
   ======================================================================= */
function viewPrazos(){
  let h='<div class="sec-title">Nova prova ou entrega</div><div class="card" style="padding:18px 20px">'+
    '<div class="grid" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end;gap:11px">'+
    '<div><div class="small muted" style="margin-bottom:6px">O quê</div><input type="text" id="dTitle" placeholder="P1 de Cálculo, relatório da prática 2..."></div>'+
    '<div><div class="small muted" style="margin-bottom:6px">Matéria</div><select id="dCode"><option value="">geral</option>'+SUBJECTS.map(s=>'<option value="'+s.code+'">'+s.short+'</option>').join('')+'</select></div>'+
    '<div><div class="small muted" style="margin-bottom:6px">Data</div><input type="date" id="dDate" value="'+todayISO()+'"></div>'+
    '<button class="btn primary" id="dAdd">Adicionar</button></div></div>';
  const up=upcoming(), past=allDl().filter(d=>daysTo(d.date)<0).sort((a,b)=>b.date.localeCompare(a.date));
  h+='<div class="sec-title">Próximos ('+up.length+')</div>';
  h+=up.length?'<div class="card">'+up.map(d=>dlRow(d)).join('')+'</div>':'<div class="card empty">Nada agendado. Assim que sair o calendário de provas, cadastre aqui.</div>';
  if(past.length) h+='<div class="sec-title">Já passaram</div><div class="card" style="opacity:.55">'+past.map(d=>dlRow(d,true)).join('')+'</div>';
  return h;
}
function dlRow(d,old){
  const n=daysTo(d.date), su=byCode(d.code);
  const cls=old?'':(n<=2?'urgent':(n<=7?'soon':''));
  const p=d.date.split('-');
  return '<div class="dl '+cls+'"><div class="cd"><b>'+(old?'—':n)+'</b><span>'+(old?'passou':(n===1?'dia':'dias'))+'</span></div>'+
    '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:650">'+esc(d.title)+'</div>'+
    '<div class="small muted">'+p[2]+'/'+p[1]+'/'+p[0]+(su?' · <span style="color:'+su.color+'">'+su.short+'</span>':' · geral')+'</div></div>'+
    (d.fixo?'<span class="tagr" style="white-space:nowrap">calendário oficial</span>'
           :'<button class="btn sm dDel" data-id="'+d.id+'">remover</button>')+'</div>';
}
function bindPrazos(){
  const add=document.getElementById('dAdd');
  if(add) add.onclick=()=>{
    const t=document.getElementById('dTitle').value.trim();
    if(!t) return;
    S.deadlines.push({id:'d'+Date.now(),title:t,code:document.getElementById('dCode').value,date:document.getElementById('dDate').value});
    save(); render();
  };
  document.querySelectorAll('.dDel').forEach(b=>b.onclick=()=>{
    S.deadlines=S.deadlines.filter(d=>d.id!==b.dataset.id); save(); render();
  });
}

/* =======================================================================
   10. FOCO
   ======================================================================= */
let pomo={left:25*60,run:false,mode:'foco'};
function viewFoco(){
  const done=(S.pomo.date===todayISO())?S.pomo.count:0;
  const filled=done===0?0:((done-1)%4)+1;
  let h='<div class="sec-title">Sessão de estudo</div><div class="card pomo">'+
    '<div class="mode">'+pomo.mode+'</div><div class="time" id="pTime">'+fmt(pomo.left)+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:24px">'+
    '<button class="btn primary" id="pStart">'+(pomo.run?'Pausar':'Começar')+'</button>'+
    '<button class="btn" id="pReset">Zerar</button>'+
    '<button class="btn" id="pSkip">Pular para '+(pomo.mode==='foco'?'pausa':'foco')+'</button></div>'+
    '<div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<filled?'on':'')+'"></i>').join('')+'</div>'+
    '<div class="small muted" style="margin-top:12px">'+done+' sessão(ões) hoje · '+(done*25)+' min</div></div>';
  h+='<div class="sec-title">Como usar</div><div class="card" style="padding:20px 22px;font-size:14px;line-height:1.75">'+
    '<b>25 minutos de foco, 5 de pausa.</b> Escolha <i>um</i> tópico da lista de uma matéria antes de começar — não "estudar Cálculo", e sim "inequações com módulo". '+
    'Ao terminar a sessão, volte na matéria e marque o que fechou. A cada 4 sessões, faça uma pausa longa de 15–20 min.<div class="hr"></div>'+
    '<div class="small muted">O contador zera à meia-noite e vive só neste navegador.</div></div>';
  return h;
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
setInterval(()=>{
  if(!pomo.run) return;
  pomo.left--;
  const t=document.getElementById('pTime');
  if(t) t.textContent=fmt(pomo.left);
  if(pomo.left<=0){
    if(pomo.mode==='foco'){
      if(S.pomo.date!==todayISO()) S.pomo={date:todayISO(),count:0};
      S.pomo.count++;
      if(!S.pomoHist) S.pomoHist={};
      S.pomoHist[todayISO()]=(S.pomoHist[todayISO()]||0)+1;
      save(); pomo.mode='pausa'; pomo.left=5*60;
    } else { pomo.mode='foco'; pomo.left=25*60; }
    pomo.run=false;
    if(route.tab==='foco'&&!route.subject) render();
  }
},1000);
function bindFoco(){
  document.getElementById('pStart').onclick=()=>{ pomo.run=!pomo.run; render(); };
  document.getElementById('pReset').onclick=()=>{ pomo.run=false; pomo.left=(pomo.mode==='foco'?25:5)*60; render(); };
  document.getElementById('pSkip').onclick=()=>{ pomo.mode=(pomo.mode==='foco'?'pausa':'foco'); pomo.left=(pomo.mode==='foco'?25:5)*60; pomo.run=false; render(); };
}

/* =======================================================================
   11. TEMA + BACKUP
   ======================================================================= */
const SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function applyTheme(){
  document.body.dataset.theme=S.theme;
  document.getElementById('themeIcon').innerHTML=(S.theme==='dark')?SUN:MOON;
  drawStrata();
}
document.getElementById('themeBtn').onclick=()=>{ S.theme=(S.theme==='dark')?'light':'dark'; save(); applyTheme(); };

const modal=document.getElementById('modal');
modal.onclick=(e)=>{ if(e.target===modal) modal.classList.remove('on'); };
document.getElementById('backupBtn').onclick=()=>{
  document.getElementById('modalBody').innerHTML=
    '<h3 style="margin:0 0 5px;font-family:var(--serif);font-size:19px;font-weight:600">Backup do progresso</h3>'+
    '<div class="small muted" style="margin-bottom:13px">Copie este texto para guardar. Para restaurar, cole um backup aqui e clique em restaurar.</div>'+
    '<textarea id="bkText" rows="10">'+esc(JSON.stringify(S))+'</textarea>'+
    '<div class="row" style="margin-top:13px"><button class="btn primary" id="bkRestore">Restaurar deste texto</button>'+
    '<button class="btn" id="bkClose">Fechar</button>'+
    '<button class="btn" id="bkWipe" style="color:var(--danger);border-color:var(--danger)">Apagar tudo</button></div>';
  modal.classList.add('on');
  document.getElementById('bkClose').onclick=()=>modal.classList.remove('on');
  document.getElementById('bkRestore').onclick=()=>{
    try{ S=Object.assign({},DEF,JSON.parse(document.getElementById('bkText').value)); save(); modal.classList.remove('on'); applyTheme(); render(); }
    catch(e){ alert('Texto inválido.'); }
  };
  document.getElementById('bkWipe').onclick=()=>{
    if(confirm('Apagar todo o progresso salvo?')){ S=JSON.parse(JSON.stringify(DEF)); save(); modal.classList.remove('on'); applyTheme(); render(); }
  };
  const ta=document.getElementById('bkText'); ta.focus(); ta.select();
};

applyTheme();
render();
</script>
