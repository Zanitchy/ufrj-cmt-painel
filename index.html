<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Painel Cmt Ufrj",
  "schemaVersion": 1,
  "description": "Painel de estudos do 1º período de Ciências Matemáticas e da Terra (UFRJ, Turma B): cards das 5 disciplinas com checklist de tópicos, flashcards com repetição espaçada, quiz, notas, grade horária, prazos com contagem regressiva e timer pomodoro. Progresso salvo em localStorage."
}
</script>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel CMT · UFRJ</title>
<style>
:root { color-scheme: light; }
:root{
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
  --bg:#f7f5f1; --surface:#ffffff; --surface2:#faf8f5; --surface3:#f2efe9;
  --text:#17171d; --muted:#6a6a77; --border:#e7e2da;
  --shadow:0 1px 2px rgba(20,16,10,.04),0 10px 30px -16px rgba(20,16,10,.22);
  --shadow-lg:0 2px 6px rgba(20,16,10,.05),0 24px 50px -22px rgba(20,16,10,.35);
  --ok:#15803d; --warn:#c2680a; --danger:#c02626; --accent:#4f46e5;
}
body[data-theme="dark"]{
  --bg:#0a0c11; --surface:#131720; --surface2:#181d27; --surface3:#1f2531;
  --text:#e9ecf3; --muted:#98a1b1; --border:#232936;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -16px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 26px 55px -24px rgba(0,0,0,.9);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s; position:relative; min-height:100vh;
}
body:before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 380px at 8% -6%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 70%),
    radial-gradient(620px 340px at 96% 2%, color-mix(in srgb,#06b6d4 11%,transparent), transparent 70%);
}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px 80px;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--accent)}

/* ================= header ================= */
header.top{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(16px) saturate(1.4);
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  border-bottom:1px solid var(--border);
}
.top-inner{max-width:1140px;margin:0 auto;padding:15px 22px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.crest{
  width:46px;height:46px;border-radius:15px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#4f46e5,#0891b2 48%,#059669);
  box-shadow:0 8px 22px -8px rgba(79,70,229,.75);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.6px
}
.crest:after{
  content:'';position:absolute;inset:0;opacity:.75;
  background-image:radial-gradient(1px 1px at 22% 28%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),
  radial-gradient(1px 1px at 40% 72%,#fff,transparent),radial-gradient(1px 1px at 84% 62%,#fff,transparent),
  radial-gradient(1px 1px at 12% 60%,#fff,transparent),radial-gradient(1px 1px at 58% 46%,#fff,transparent);
}
.brand h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.spacer{flex:1}
.icon-btn{width:37px;height:37px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;transition:.18s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.pill{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text)}
nav.tabs{max-width:1140px;margin:0 auto;padding:0 22px;display:flex;gap:4px;overflow-x:auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:.18s}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}

/* ================= generic ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.sec-title{
  font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:34px 0 13px;display:flex;align-items:center;gap:11px
}
.sec-title:after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(292px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;transition:.18s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:10px 13px;font-size:13.5px;outline:none;transition:.18s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13.5px}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.tagr{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.hr{height:1px;background:var(--border);margin:18px 0}
.bar{height:7px;border-radius:999px;background:var(--surface3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ================= dashboard ================= */
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.stat .lab{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);position:relative}
.stat .val{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.8px;margin-top:5px;line-height:1.05;position:relative}
.stat .sub{font-size:12px;color:var(--muted);margin-top:3px;position:relative}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:var(--surface3)}
.prog-row{display:flex;align-items:center;gap:15px;padding:13px 17px;width:100%;text-align:left;border-radius:14px;transition:.18s}
.prog-row:hover{background:var(--surface2)}

/* ================= subject cards ================= */
.subj{padding:0;overflow:hidden;text-align:left;width:100%;display:block;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.subj:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.subj .cover{height:96px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px 18px}
.subj .cover .wm{position:absolute;right:-14px;top:-18px;opacity:.22;color:#fff}
.subj .cover .code{color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.9}
.subj h3{margin:9px 18px 0;font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.subj .meta{padding:11px 18px 0;display:flex;gap:6px;flex-wrap:wrap}
.subj .foot{margin-top:14px;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2);display:flex;justify-content:space-between;align-items:center;font-size:11.5px;gap:8px}

/* ================= grade ================= */
.gradewrap{overflow-x:auto;padding-bottom:4px}
table.grade{width:100%;border-collapse:separate;border-spacing:6px;min-width:730px}
table.grade th{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 4px;text-align:center}
table.grade td{vertical-align:top;padding:0;width:16%}
.slot{border-radius:14px;padding:11px 12px;min-height:80px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);transition:.18s}
.slot:hover{transform:translateY(-2px)}
.slot.free{background:transparent;border-style:dashed;box-shadow:none;opacity:.4}
.slot .n{font-size:13px;font-weight:750;line-height:1.25}
.slot .r{font-size:10.5px;color:var(--muted);margin-top:3px}
.hcol{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;padding-right:6px !important;width:66px !important;font-variant-numeric:tabular-nums}
.slot.now{outline:2px solid var(--accent);outline-offset:2px}

/* ================= topics ================= */
.topic{border:1px solid var(--border);border-radius:15px;overflow:hidden;background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow)}
.topic > .head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;user-select:none}
.topic > .head:hover{background:var(--surface2)}
.topic .num{width:27px;height:27px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--surface3);color:var(--muted)}
.topic h4{margin:0;font-size:14px;font-weight:650;flex:1}
.chev{transition:transform .22s;color:var(--muted);flex:none}
.topic.open .chev{transform:rotate(90deg)}
.topic .body{display:none;padding:2px 15px 13px 52px}
.topic.open .body{display:block}
.chk{display:flex;align-items:flex-start;gap:11px;padding:6px 0;font-size:13.5px;cursor:pointer}
.box{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border);flex:none;margin-top:1px;display:grid;place-items:center;transition:.18s;background:var(--surface2)}
.chk:hover .box{border-color:var(--accent)}
.chk.done .box{background:var(--ok);border-color:var(--ok)}
.chk.done .box svg{opacity:1}
.box svg{opacity:0;transition:.18s}
.chk.done span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

/* ================= flashcards ================= */
.fcard{perspective:1400px;height:238px;cursor:pointer}
.fcard .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.fcard.flip .inner{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--border);background:var(--surface);padding:24px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.fcard .face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--surface2),var(--surface))}
.fcard .q{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.35}
.fcard .a{font-size:13.8px;line-height:1.6}
.fcard .lvl{position:absolute;top:13px;right:15px;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ================= quiz ================= */
.qz{padding:18px 20px;margin-bottom:12px}
.qz .qt{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:13px;line-height:1.4}
.opt{display:flex;gap:11px;align-items:center;padding:10px 13px;border:1px solid var(--border);border-radius:11px;margin-bottom:7px;cursor:pointer;font-size:13.5px;transition:.18s;background:var(--surface2)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface2))}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface2))}
.opt .k{width:23px;height:23px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface);border:1px solid var(--border)}
.expl{font-size:12.8px;color:var(--muted);margin-top:9px;border-left:2px solid var(--accent);padding:3px 0 3px 12px;line-height:1.6}

/* ================= deadlines ================= */
.dl{display:flex;align-items:center;gap:15px;padding:15px 17px;border-bottom:1px solid var(--border)}
.dl:last-child{border-bottom:none}
.dl .cd{width:64px;flex:none;text-align:center;border-radius:13px;padding:8px 4px;background:var(--surface2);border:1px solid var(--border)}
.dl .cd b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.05}
.dl .cd span{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl.urgent .cd{background:color-mix(in srgb,var(--danger) 13%,var(--surface2));border-color:var(--danger)}
.dl.urgent .cd b{color:var(--danger)}
.dl.soon .cd{background:color-mix(in srgb,var(--warn) 13%,var(--surface2));border-color:var(--warn)}

/* ================= pomodoro ================= */
.pomo{text-align:center;padding:40px 22px;position:relative;overflow:hidden}
.pomo .time{font-family:var(--serif);font-size:72px;font-weight:600;letter-spacing:-3px;font-variant-numeric:tabular-nums;line-height:1}
.pomo .mode{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:20px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface3);transition:.3s}
.dots i.on{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}

/* ================= modal ================= */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(8,10,15,.6);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal .card{width:100%;max-width:640px;padding:24px;max-height:84vh;overflow:auto}
.back-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);margin:24px 0 8px;transition:.18s}
.back-link:hover{color:var(--accent);gap:10px}
.subtabs{display:flex;gap:7px;margin:18px 0 20px;flex-wrap:wrap}
.subtabs button{padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:650;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:.18s}
.subtabs button:hover{border-color:var(--accent);color:var(--accent)}
.subtabs button.on{background:var(--accent);border-color:transparent;color:#fff}
.note{font-size:12.8px;color:var(--muted);background:var(--surface2);border:1px dashed var(--border);border-radius:13px;padding:13px 15px;line-height:1.6}

/* ================= subject hero ================= */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;color:#fff;box-shadow:var(--shadow-lg)}
.hero .stars{position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 26%,#fff,transparent),radial-gradient(1px 1px at 26% 62%,#fff,transparent),
  radial-gradient(1.6px 1.6px at 41% 18%,#fff,transparent),radial-gradient(1px 1px at 55% 74%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 68% 34%,#fff,transparent),radial-gradient(1px 1px at 79% 66%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 88% 22%,#fff,transparent),radial-gradient(1px 1px at 94% 52%,#fff,transparent),
  radial-gradient(1px 1px at 6% 78%,#fff,transparent),radial-gradient(1.3px 1.3px at 34% 88%,#fff,transparent),
  radial-gradient(1px 1px at 62% 12%,#fff,transparent),radial-gradient(1px 1px at 18% 44%,#fff,transparent);
  animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-26px)}}
.hero .inner{position:relative;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .kicker{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
.hero h2{margin:5px 0 0;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.6px;line-height:1.15}
.hero .glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:15px;padding:11px 16px;backdrop-filter:blur(6px);text-align:center}
.hero .glass b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.hero .glass span{font-size:10.5px;opacity:.85;letter-spacing:.04em}

/* ================= aulas / conteúdo ================= */
.lsec{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px 26px;margin-bottom:14px}
.lsec > h3{margin:0 0 14px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:13px;line-height:1.25}
.lnum{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--sans);font-size:12px;font-weight:800;color:#fff;background:var(--accent);box-shadow:0 5px 14px -5px var(--accent)}
.lsec p{margin:0 0 12px;font-size:15px;line-height:1.75;max-width:74ch}
.lsec p:last-child{margin-bottom:0}
.lsec ul,.lsec ol{margin:0 0 12px;padding-left:21px;font-size:14.6px;line-height:1.75;max-width:74ch}
.lsec li{margin-bottom:7px}
.lsec .lead{font-size:15.5px;color:var(--muted)}
.lsec .lead::first-letter{float:left;font-family:var(--serif);font-size:54px;line-height:.8;padding:5px 11px 0 0;color:var(--accent);font-weight:600}
sup.ref{font-size:9.5px;font-weight:800;color:var(--accent);cursor:default;padding:0 1px;vertical-align:super}
.chips{display:flex;gap:8px;flex-wrap:wrap}
table.data{width:100%;border-collapse:collapse;font-size:13.4px;margin:6px 0 12px}
table.data th{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 11px;border-bottom:1.5px solid var(--border)}
table.data td{padding:10px 11px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--surface2)}
table.data td:first-child{font-weight:650}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);margin-bottom:12px}
.fig{margin:16px 0;padding:20px;background:var(--surface2);border:1px solid var(--border);border-radius:16px}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.figttl{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.figcap{font-size:12.4px;color:var(--muted);margin-top:14px;line-height:1.6;padding-top:12px;border-top:1px dashed var(--border)}
ul.tl{list-style:none;padding:0;margin:4px 0 0}
ul.tl li{position:relative;padding:0 0 17px 30px;border-left:2px solid var(--border);margin-left:26px;font-size:14px;line-height:1.5}
ul.tl li:last-child{border-left-color:transparent;padding-bottom:0}
ul.tl li:before{content:'';position:absolute;left:-6.5px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--surface)}
ul.tl li b{position:absolute;left:-84px;top:1px;width:50px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px;color:var(--accent)}
.callout{border-left:3px solid var(--warn);background:var(--surface2);border-radius:0 13px 13px 0;padding:14px 17px;font-size:14px;line-height:1.7;margin:0 0 11px;max-width:76ch}
.callout:last-child{margin-bottom:0}
.callout.plus{border-left-color:var(--accent)}
.callout b{color:var(--text)}
.gloss{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.gloss div{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:12px 14px;font-size:13.2px;line-height:1.55}
.gloss b{display:block;margin-bottom:3px;font-family:var(--serif);font-size:14.5px;font-weight:600}
.think{counter-reset:t;list-style:none;padding:0;margin:0}
.think li{position:relative;padding:11px 0 11px 38px;font-size:14.2px;border-bottom:1px dashed var(--border);line-height:1.6}
.think li:last-child{border-bottom:none}
.think li:before{counter-increment:t;content:counter(t);position:absolute;left:0;top:11px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--accent);color:#fff}
ol.refs{list-style:none;counter-reset:r;padding:0;margin:0}
ol.refs li{counter-increment:r;position:relative;padding:9px 0 9px 34px;font-size:12.8px;line-height:1.55;border-bottom:1px solid var(--border)}
ol.refs li:last-child{border-bottom:none}
ol.refs li:before{content:counter(r);position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--surface3);color:var(--muted)}
ol.refs a{word-break:break-all;font-size:11.5px;color:var(--muted);text-decoration:none;display:block;margin-top:2px}
ol.refs a:hover{color:var(--accent)}
.numgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));margin-bottom:14px}
.numgrid div{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 15px}
.numgrid b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.15;color:var(--accent)}
.numgrid span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
/* ================= painel inicial ================= */
.dash-hero{
  position:relative;overflow:hidden;border-radius:26px;padding:32px 34px;color:#fff;margin-top:24px;
  background:linear-gradient(115deg,#312e81 0%,#1d4ed8 38%,#0891b2 70%,#047857 100%);
  box-shadow:0 30px 60px -30px rgba(30,58,138,.75)
}
.dash-hero .inner{position:relative;z-index:2}
.dash-hero .k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.78}
.dash-hero h1{margin:8px 0 0;font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-1px;line-height:1.05}
.dash-hero .sub{margin-top:10px;font-size:14.5px;opacity:.88;max-width:60ch;line-height:1.6}
.dash-hero .orb{position:absolute;border-radius:50%;pointer-events:none}
.o1{width:340px;height:340px;right:-90px;top:-140px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.o2{width:210px;height:210px;right:130px;bottom:-120px;background:radial-gradient(circle,rgba(16,185,129,.4),transparent 66%)}
.o3{width:26px;height:26px;right:80px;top:52px;background:#fde68a;box-shadow:0 0 34px 10px rgba(253,230,138,.55)}
.weekstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:24px;position:relative;z-index:2}
.weekstrip > div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:15px;padding:11px 8px 12px;text-align:center;backdrop-filter:blur(4px)}
.weekstrip .d{font-size:10px;font-weight:800;letter-spacing:.13em;opacity:.8}
.weekstrip .cnt{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:3px;line-height:1.1}
.weekstrip .dd{display:flex;gap:4px;justify-content:center;margin-top:8px;min-height:7px}
.weekstrip .dd i{width:7px;height:7px;border-radius:50%}
.weekstrip .today{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.6);box-shadow:0 8px 22px -10px rgba(0,0,0,.6)}
.stile{position:relative;overflow:hidden;padding:18px 19px;display:flex;gap:15px;align-items:center;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;width:100%}
.stile:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.stile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.stile .rr{position:relative;flex:none}
.stile .rr b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.stile h4{margin:0;font-size:14px;font-weight:700;line-height:1.3}
.stile .m{font-size:11.5px;color:var(--muted);margin-top:4px}
.cont{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;padding:22px 24px;cursor:pointer;transition:.2s;width:100%;text-align:left}
.cont:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.cont .badge{width:54px;height:54px;border-radius:17px;flex:none;display:grid;place-items:center;color:#fff}
.cont .k{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.cont h4{margin:5px 0 0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.3px}
.cont .go{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);font-size:17px;color:var(--accent)}
.bars7{display:flex;gap:7px;align-items:flex-end;height:64px;margin-top:6px}
.bars7 div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px;align-items:center}
.bars7 i{width:100%;border-radius:5px 5px 0 0;background:var(--surface3);min-height:4px;display:block}
.bars7 span{font-size:9px;color:var(--muted);font-weight:700}
/* ================= layout de aula em módulos ================= */
.lesson-grid{display:grid;grid-template-columns:258px minmax(0,1fr);gap:26px;align-items:start}
.lindex{position:sticky;top:104px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px 14px;max-height:calc(100vh - 130px);overflow:auto}
.lindex h5{margin:0 0 4px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lindex .prog{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.mitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 9px;border-radius:11px;font-size:12.8px;line-height:1.35;color:var(--muted);transition:.16s;margin-bottom:2px}
.mitem:hover{background:var(--surface2);color:var(--text)}
.mitem.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--text);font-weight:650}
.mitem .mn{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:9.5px;font-weight:800;background:var(--surface3);color:var(--muted)}
.mitem.on .mn{background:var(--accent);color:#fff}
.mitem.read .mn{background:var(--ok);color:#fff}
.mnav{display:flex;gap:11px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.mnav .btn{flex:1;min-width:150px;text-align:left;padding:13px 15px;border-radius:14px}
.mnav .btn span{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.mhead{position:relative;overflow:hidden;border-radius:20px;margin-bottom:15px;box-shadow:var(--shadow-lg)}
.mhead .illo{display:block;width:100%;height:auto}
.mhead .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;background:linear-gradient(to top,rgba(6,8,14,.9),rgba(6,8,14,.45) 55%,transparent);color:#fff}
.mhead .cap .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.mhead .cap h3{margin:4px 0 0;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.slidebox{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:0 14px 14px 0;padding:14px 17px;margin:0 0 14px}
.slidebox .t{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.slidebox ul{margin:0;padding-left:18px;font-size:13.6px;line-height:1.6;font-style:italic;color:var(--muted)}
.slidebox li{margin-bottom:3px}
.why,.trap{border-radius:14px;padding:15px 18px;margin:0 0 12px;font-size:14px;line-height:1.7;border:1px solid var(--border)}
.why{background:color-mix(in srgb,var(--accent) 8%,var(--surface2));border-left:3px solid var(--accent)}
.trap{background:color-mix(in srgb,var(--warn) 9%,var(--surface2));border-left:3px solid var(--warn)}
.why .t,.trap .t{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.why .t{color:var(--accent)}
.trap .t{color:var(--warn)}
.mminis{margin-top:15px}
.readbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--border);font-size:13px;font-weight:650;color:var(--muted);transition:.18s;margin-top:15px}
.readbtn:hover{border-color:var(--accent);color:var(--accent)}
.readbtn.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.mselect{display:none}
/* execução passo a passo */
.fase{margin-bottom:20px}
.fase .fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;padding-bottom:6px;border-bottom:1.5px solid var(--border)}
.fase .fh b{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fase .fh span{font-size:11px;color:var(--muted2);white-space:nowrap;font-weight:600}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--border);font-size:13.8px;line-height:1.55;cursor:pointer}
.step:last-child{border-bottom:none}
.step:hover{background:var(--surface2)}
.step .nn{font-size:10.5px;font-weight:800;color:var(--muted2);width:22px;flex:none;text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.step .bx{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border);flex:none;margin-top:1px;display:grid;place-items:center;background:var(--surface);transition:.15s}
.step.on .bx{background:var(--ok);border-color:var(--ok)}
.step .bx svg{opacity:0;transition:.15s}
.step.on .bx svg{opacity:1}
.step.on .tx{color:var(--muted2);text-decoration:line-through;text-decoration-thickness:1px}
.step .tx b{color:var(--text)}
.step.on .tx b{color:var(--muted2)}
.execbar{position:sticky;top:96px;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding:12px 0;margin-bottom:14px;border-bottom:1px solid var(--border)}
/* bloco de prática de laboratório */
.pratica{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--ok);border-radius:0 14px 14px 0;padding:16px 19px;margin:0 0 12px}
.pratica > .t{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:10px}
.pratica h5{margin:12px 0 5px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
.pratica h5:first-of-type{margin-top:0}
.pratica ul{margin:0;padding-left:19px;font-size:13.6px;line-height:1.65}
.pratica li{margin-bottom:5px}
.pratica b{color:var(--text)}
.crit{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-top:11px;font-size:13.2px;line-height:1.55}
.crit .ic{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:12px;font-weight:800}
/* glossário clicável */
.gcard{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:14px 15px;cursor:pointer;transition:.18s;position:relative}
.gcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.gcard.open{background:var(--surface);border-color:var(--accent)}
.gcat{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.gterm{font-size:15px;font-weight:700;letter-spacing:-.015em;margin-bottom:4px;padding-right:18px}
.gcard:after{content:'+';position:absolute;top:12px;right:14px;font-size:15px;font-weight:700;color:var(--muted2);transition:.2s}
.gcard.open:after{content:'−';color:var(--accent)}
.gshort{font-size:12.8px;line-height:1.5;color:var(--muted)}
.gfull{display:none;font-size:13px;line-height:1.65;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.gcard.open .gfull{display:block}
.gmod{font-size:10.5px;color:var(--muted2);margin-top:8px;letter-spacing:.03em}
@media(max-width:900px){
  .lesson-grid{grid-template-columns:1fr}
  .lindex{position:static;max-height:none}
}
/* =====================================================================
   RE-SKIN "ATLAS": papel quente, hairlines, tipografia editorial
   ===================================================================== */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#FAF6EE; --surface:#FFFFFF; --surface2:#F5F0E4; --surface3:#EBE3D2;
  --text:#1D2A2E; --muted:#66604F; --muted2:#9C947F;
  --border:#E6DCC8; --line2:#D3C6AB;
  --shadow:0 1px 2px rgba(60,48,26,.05),0 8px 24px -12px rgba(60,48,26,.18);
  --shadow-lg:0 2px 4px rgba(60,48,26,.06),0 18px 36px -14px rgba(60,48,26,.34);
  --ok:#2C8055; --warn:#B4761C; --danger:#B23A2B; --accent:#3A4BA8;
}
body[data-theme="dark"]{
  --bg:#15130E; --surface:#1E1B15; --surface2:#232019; --surface3:#2C2820;
  --text:#EFEADC; --muted:#A79E88; --muted2:#8A8270;
  --border:#332E24; --line2:#423B2E;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -16px rgba(0,0,0,.85);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55),0 24px 48px -22px rgba(0,0,0,.95);
  --ok:#5FBF8B; --warn:#D9A441; --danger:#E07A6C;
}
body{font-size:14.5px;font-family:var(--sans)}
body:before{display:none}
.wrap{max-width:1200px;padding:0 20px 84px}

/* cabeçalho do app */
header.top{background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--border)}
.top-inner{max-width:1200px;padding:13px 20px}
.crest{border-radius:11px;width:40px;height:40px;background:linear-gradient(135deg,#3A4BA8,#0E8C93 52%,#C2751B)}
.crest:after{opacity:.55}
.brand h1{font-size:16px;font-weight:680;letter-spacing:-.02em}
.brand p{font-size:11px;color:var(--muted2);letter-spacing:.02em}
.pill{border-radius:7px;border-color:var(--border);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);padding:5px 11px}
.icon-btn{border-radius:9px;width:34px;height:34px}
nav.tabs{max-width:1200px;padding:0 20px;gap:2px}
nav.tabs button{font-size:13.5px;font-weight:560;padding:11px 15px;color:var(--muted)}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--text)}

/* cabeçalho editorial de página */
.pagehead{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface2);margin-top:22px}
.pagehead .strata{position:absolute;inset:0;width:100%;height:100%}
.pagehead .ph{position:relative;padding:34px 32px 28px}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);margin:0 0 11px;font-weight:600}
.pagehead h1{font-size:clamp(26px,4vw,42px);line-height:1.04;margin:0 0 13px;font-weight:680;letter-spacing:-.025em;color:var(--text)}
.grad{background:linear-gradient(96deg,#3A4BA8 2%,#0E8C93 38%,#C2751B 70%,#2C8055);-webkit-background-clip:text;background-clip:text;color:transparent}
.pagehead .sub{color:var(--muted);max-width:640px;margin:0 0 24px;font-size:14.5px;line-height:1.55}
.kpis{display:flex;flex-wrap:wrap;gap:0}
.kpi{padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line2)}
.kpi:last-child{border:0;margin-right:0}
.kpi b{display:block;font-size:22px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi span{font-size:10px;color:var(--muted2);letter-spacing:.09em;text-transform:uppercase;font-weight:600}

/* títulos de seção */
.sec-title{font-size:11px;letter-spacing:.16em;color:var(--muted2);font-weight:700;margin:40px 0 14px;text-transform:uppercase}
.sec-title:after{background:var(--border)}

/* superfícies */
.card{border-radius:14px;border-color:var(--border);box-shadow:var(--shadow)}
.tag{border-radius:6px;background:var(--surface2);border-color:var(--border);color:var(--muted);font-weight:560;font-size:10.5px;padding:3px 8px}
.tagr{border-radius:5px;background:var(--surface2);border-color:var(--border);letter-spacing:.14em;font-size:9px}
.btn{border-radius:9px;font-weight:560;border-color:var(--border);background:var(--surface)}
.btn:hover{border-color:var(--line2);color:var(--text);background:var(--surface2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{background:var(--text);color:var(--bg);filter:none;opacity:.88}
.note{border-radius:11px;border-style:solid;background:var(--surface2);color:var(--muted);font-size:12.4px}
.bar{background:var(--surface3);height:8px}
input[type=text],input[type=date],textarea,select{border-radius:9px;background:var(--surface2)}
input:focus,textarea:focus,select:focus{border-color:var(--line2)}

/* KPI cards do painel */
.stat{padding:15px 17px;border-radius:14px}
.stat:before{display:none}
.stat .lab{font-size:10px;letter-spacing:.11em;color:var(--muted2);font-weight:700}
.stat .val{font-size:23px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.stat .sub{font-size:11.5px;color:var(--muted2)}

/* faixa da semana */
.dash-hero{background:none!important;box-shadow:none;padding:0;margin-top:22px;color:var(--text);border-radius:0;overflow:visible}
.dash-hero .stars,.dash-hero .orb{display:none}
.weekstrip{grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.weekstrip > div{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 8px;backdrop-filter:none;box-shadow:var(--shadow)}
.weekstrip .d{color:var(--muted2);letter-spacing:.14em;font-size:9.5px}
.weekstrip .cnt{font-size:19px;font-weight:680;font-variant-numeric:tabular-nums;color:var(--text)}
.weekstrip .today{background:var(--surface2);border-color:var(--line2);box-shadow:none}
.weekstrip .today .cnt{color:var(--accent)}

/* tiles de matéria */
.stile{border-radius:14px;padding:16px 17px}
.stile h4{font-size:13.6px;font-weight:620}
.stile .m{font-size:11.4px;color:var(--muted2)}
.cont{border-radius:14px}
.cont h4{font-size:17px;font-weight:660;letter-spacing:-.015em}
.cont .k{color:var(--muted2);letter-spacing:.14em}
.cont .badge{border-radius:12px;width:48px;height:48px}
.cont .go{background:var(--surface2);border-color:var(--border);color:var(--text)}
.bars7 i{background:var(--surface3);border-radius:3px 3px 0 0}

/* cards de disciplina */
.subj{border-radius:16px}
.subj .cover{height:88px;padding:13px 17px}
.subj .cover:after{content:"";position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(circle at 18% 30%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 62% 74%,#fff 0 1px,transparent 1.4px);
  background-size:16px 16px,22px 22px}
.subj .cover .wm{opacity:.2;right:-10px;top:-14px}
.subj .cover .code{font-size:9.5px;letter-spacing:.18em;font-weight:700;opacity:.9;position:relative}
.subj h3{font-size:16px;font-weight:660;letter-spacing:-.012em;margin:10px 17px 0}
.subj .foot{background:var(--surface2);font-size:11px}

/* hero da disciplina */
.hero{border-radius:16px;padding:22px 24px}
.hero .stars{opacity:.3}
.hero h2{font-size:23px;font-weight:680;letter-spacing:-.025em}
.hero .kicker{letter-spacing:.16em;font-size:10px}
.hero .glass{border-radius:11px}
.hero .glass b{font-size:21px;font-weight:680;font-variant-numeric:tabular-nums}

/* aula */
.subtabs button{border-radius:8px;font-weight:560;font-size:12.5px;padding:8px 14px}
.subtabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.lindex{border-radius:14px}
.mitem{border-radius:9px;font-size:12.4px}
.mitem.on{background:var(--surface2);color:var(--text);font-weight:620}
.mitem .mn{border-radius:6px;background:var(--surface3);color:var(--muted2)}
.mitem.on .mn{background:var(--text);color:var(--bg)}
.mitem.read .mn{background:var(--ok);color:#fff}
.lsec{border-radius:14px;padding:22px 24px}
