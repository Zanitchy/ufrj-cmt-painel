      {l:3,m:'11',q:'Como identificar um planeta no céu a olho nu?',a:'Ele estará sempre dentro da faixa do zodíaco, perto da eclíptica, porque todos os planetas orbitam praticamente no mesmo plano. Um astro brilhante fora dessa faixa não é planeta.'},
      {l:3,m:'14',q:'Por que janeiro é mais quente que dezembro, se o solstício é em dezembro?',a:'Inércia térmica. O solstício marca o pico da energia RECEBIDA, não da temperatura. Enquanto a energia que chega superar a que é devolvida ao espaço, a superfície acumula calor — e o oceano, com alta capacidade térmica, atrasa ainda mais.'},
      {l:3,m:'14',q:'Qual a analogia diária do atraso das estações?',a:'O dia mais quente não é ao meio-dia, e sim por volta das 15h. Pico de radiação e pico de temperatura nunca coincidem — mesma física, escalas diferentes.'},
      {l:3,m:'14',q:'Por que o hemisfério sul tem estações mais suaves?',a:'Tem muito mais oceano, e a água amortece variações térmicas. Além disso, estamos mais perto do Sol no verão do sul e mais longe no inverno — dois efeitos que se cancelam parcialmente e produzem clima mais ameno.'},
      {l:3,m:'A',q:'O que é o analema?',a:'O desenho em forma de oito que o Sol traça se fotografado sempre no mesmo horário do relógio ao longo de um ano. O movimento vertical vem da inclinação do eixo; o horizontal, da órbita elíptica e da variação de velocidade da Terra.'},
      {l:3,m:'A',q:'O que é a equação do tempo?',a:'A diferença entre o meio-dia solar verdadeiro e o meio-dia do relógio, que chega a cerca de 16 minutos. É por isso que relógios de sol precisos trazem tabela de correção.'},
      {l:3,m:'A',q:'Por que o dia mais curto não coincide com o pôr do Sol mais cedo?',a:'Por causa da equação do tempo. No Rio, o pôr do Sol mais cedo ocorre semanas antes do solstício de dezembro, e o nascer mais tarde só em janeiro — efeito da combinação entre inclinação e excentricidade.'},
      {l:3,m:'6',q:'A inclinação das trajetórias dos astros em relação ao horizonte vale quanto?',a:'90° menos a sua latitude. No equador os astros sobem na vertical; num polo giram paralelos ao horizonte, sem nascer nem se pôr; no Rio, as trajetórias são inclinadas.'},
      {l:3,m:'6',q:'Em que sentido o céu gira, visto do Brasil?',a:'Horário, em torno do polo sul celeste, para quem olha para o sul — o inverso do que descrevem os livros do hemisfério norte, onde gira em sentido anti-horário em torno da Polar.'},
      {l:3,m:'8',q:'Onde no Brasil o Sol passa exatamente pelo zênite, e quando?',a:'Em qualquer lugar entre os trópicos, duas vezes por ano — em Belém, Manaus, Salvador. Nesses dias, objetos verticais não projetam sombra ao meio-dia. No Rio, a 22,9° S, ele chega perto mas nunca exatamente.'},
      {l:3,m:'9',q:'No polo, durante o verão, o Sol fica parado no céu?',a:'Não. Ele descreve um círculo completo em torno do observador a cada 24 h, subindo em espiral até o solstício e descendo até tocar o horizonte no equinócio. São seis meses de dia e seis de noite.'},
      {l:3,m:'10',q:'E se a Terra não tivesse inclinação no eixo?',a:'Não haveria estações: todo lugar teria o mesmo padrão de luz o ano inteiro, com 12 h de dia em qualquer latitude. Trópicos e círculos polares sumiriam do mapa, e o Sol só chegaria ao zênite no equador.'},
      {l:3,m:'13',q:'Por que dizemos "solstício" e "equinócio"?',a:'Solstício vem do latim sol + sistere, "o Sol se detém" — é quando ele para de subir ou descer e inverte o movimento norte-sul. Equinócio vem de aequus + nox, noite igual — dia e noite com durações quase iguais.'},
      {l:3,m:'15',q:'Quanto varia o ponto do pôr do Sol ao longo do ano, no Rio?',a:'Cerca de 47° no horizonte — mais de um oitavo da volta completa, perfeitamente visível a olho nu se você marcar a posição em relação a um prédio ou árvore ao longo de alguns meses.'},
      {l:3,m:'15',q:'Qual a altura do Sol ao meio-dia no Rio, no verão e no inverno?',a:'Cerca de 90° em dezembro, quase a pino, porque estamos quase sobre o Trópico de Capricórnio; e cerca de 43° em junho. A diferença de ~47° explica as sombras longas de inverno e o funcionamento de beirais.'},
      {l:3,m:'16',q:'Qual a diferença entre precessão e variação da obliquidade?',a:'Precessão muda a DIREÇÃO para onde o eixo aponta, em ~26 mil anos, mantendo a inclinação. A variação da obliquidade muda a própria INCLINAÇÃO, entre 22,1° e 24,5°, em ~41 mil anos. São dois ciclos de Milankovitch distintos.'},
      {l:3,m:'1',q:'O que é a esfera celeste, e por que ela é útil se não é real?',a:'Esfera imaginária de raio arbitrário centrada no observador, onde se projetam todos os astros. É um modelo deliberadamente falso: joga fora a profundidade, que não interessa para posições, e reduz o problema a dois ângulos. Segue em uso profissional.'},
      {l:3,m:'2',q:'Qual a relação entre a altura do polo celeste e a sua latitude?',a:'São iguais. A 23° sul, o polo sul celeste está a 23° acima do horizonte sul. É o que tornava a latitude fácil de medir no mar — e por isso os navegadores usavam a Polar no norte e o Cruzeiro do Sul aqui.'},
      {l:3,m:'2',q:'Quais são os equivalentes celestes de latitude e longitude?',a:'Declinação e ascensão reta. A declinação mede a distância angular ao norte ou ao sul do equador celeste; a ascensão reta mede a posição ao longo dele, a partir do ponto vernal.'},
      {l:3,m:'3',q:'Constelação e asterismo: qual a diferença?',a:'Constelação é uma região do céu com fronteiras oficiais — são 88, fixadas pela UAI em 1928, e cada ponto do céu pertence a uma. Asterismo é apenas um desenho reconhecível sem status oficial, como as Três Marias dentro de Órion.'},
      {l:3,m:'3',q:'As estrelas do Cruzeiro do Sul são vizinhas?',a:'Não. Estão entre ~88 e mais de 350 anos-luz. A cruz só existe do nosso ponto de vista: é efeito de perspectiva, e um observador em outra parte da Galáxia não veria desenho algum.'},
      {l:3,m:'4',q:'Como Eratóstenes mediu a Terra em 240 a.C.?',a:'No solstício, ao meio-dia, o Sol ficava a pino em Siena (sem sombra) enquanto em Alexandria, 800 km ao norte, uma vara projetava sombra de 7,2°. Como 7,2° é 1/50 de volta, a distância entre as cidades é 1/50 da circunferência.'},
      {l:3,m:'4',q:'O mito da Terra plana medieval',a:'Nenhum europeu instruído do século XV achava a Terra plana — a esfericidade era consenso desde a Grécia. A disputa com Colombo era sobre o tamanho da Terra, e os críticos dele estavam certos. A lenda foi popularizada por uma biografia romanceada de 1828.'},
      {l:3,m:'5',q:'Dia sideral e dia solar: qual a diferença e por quê?',a:'Sideral é a rotação completa em relação às estrelas: 23h56m04s. Solar é o tempo para o Sol voltar à mesma posição: 24 h. A diferença de 3m56s existe porque, enquanto gira, a Terra avança ~1° na órbita e precisa girar um pouco mais para reencontrar o Sol.'},
      {l:3,m:'6',q:'O que são astros circumpolares?',a:'Os que descrevem círculos tão próximos do polo celeste que nunca cruzam o horizonte, e portanto nunca se põem. A extensão dessa região cresce com a latitude: nenhuma no equador, todos os visíveis num polo.'},
      {l:3,m:'7',q:'A analogia da fogueira',a:'Pessoas sentadas em círculo não veem quem está do outro lado do fogo. A fogueira é o Sol, as pessoas são as constelações. Ao longo do ano a Terra muda de posição, e as constelações antes ofuscadas aparecem enquanto outras somem.'},
      {l:3,m:'7',q:'Por que uma estrela nasce 3m56s mais cedo a cada noite?',a:'Porque o dia solar é ~4 minutos mais longo que o sideral. Em relação ao nosso relógio, as estrelas se adiantam. Ao longo de um ano isso acumula 24 h — uma volta completa —, e o céu volta à mesma aparência.'},
      {l:3,m:'8',q:'Por que os trópicos ficam a 23,5° e os círculos polares a 66,5°?',a:'Porque 23,5° é o máximo afastamento do Sol em relação ao equador celeste, e 66,5° = 90° − 23,5°. As cinco linhas do mapa-múndi saem todas do mesmo número: a obliquidade.'},
      {l:3,m:'8',q:'Por que os trópicos se chamam Câncer e Capricórnio?',a:'Eram as constelações em que o Sol se encontrava nos solstícios quando os nomes foram fixados, na Antiguidade. Por causa da precessão, hoje ele está em Touro em junho e em Sagitário em dezembro. Os nomes ficaram; o céu se moveu.'},
      {l:3,m:'9',q:'Por que existe o Sol da meia-noite?',a:'Acima dos círculos polares, a inclinação faz o Sol permanecer acima do horizonte por 24 h ou mais. Num polo são seis meses de dia e seis de noite, com o Sol descrevendo círculos paralelos ao horizonte.'},
      {l:3,m:'10',q:'Enuncie corretamente a inclinação do eixo terrestre',a:'O eixo faz 23,5° com a perpendicular ao plano da órbita — ou, de forma equivalente, o plano do equador faz 23,5° com o plano da eclíptica. O ângulo entre o eixo e o próprio plano orbital é 66,5°.'},
      {l:3,m:'10',q:'A obliquidade é constante?',a:'Não. Oscila entre ~22,1° e ~24,5° num ciclo de cerca de 41 mil anos — um dos ciclos de Milankovitch, junto com a precessão e a excentricidade, associados às glaciações.'},
      {l:3,m:'11',q:'O que é a eclíptica, nas duas definições?',a:'Do ponto de vista do observador, é o caminho aparente do Sol entre as estrelas ao longo do ano. Geometricamente, é a projeção do plano orbital da Terra na esfera celeste. Cruza o equador celeste a 23,5°, nos equinócios.'},
      {l:3,m:'11',q:'Por que o nome "eclíptica"?',a:'Porque é sobre essa linha que os eclipses acontecem. A órbita da Lua é inclinada ~5°, então só quando ela cruza a eclíptica — nos nodos — e está em fase nova ou cheia é que ocorre eclipse. Daí não haver eclipse todo mês.'},
      {l:3,m:'12',q:'Quantas constelações a eclíptica atravessa?',a:'Treze. A décima terceira é Ofiúco, entre Escorpião e Sagitário, por onde o Sol passa cerca de 18 dias por ano. A divisão astrológica em doze é anterior às fronteiras oficiais da UAI, de 1928, e nunca foi revista.'},
      {l:3,m:'12',q:'Signos e constelações: por que não coincidem?',a:'Signos são setores iguais de 30° com datas fixadas há ~2.000 anos; constelações têm tamanhos muito diferentes. Como a precessão deslocou o ponto vernal quase um signo inteiro nesse período, o Sol costuma estar numa constelação diferente da indicada.'},
      {l:3,m:'13',q:'Equinócio e solstício: definições',a:'Equinócio é quando o Sol cruza o equador celeste, e dia e noite ficam quase iguais em todo o planeta. Solstício é o máximo afastamento do Sol em relação ao equador celeste, quando ele inverte o movimento norte-sul — do latim, o Sol se detém.'},
      {l:3,m:'13',q:'Junho e dezembro: o que acontece em cada um, no Brasil?',a:'Em junho o Sol atinge o máximo ao NORTE (+23,5°, sobre o Trópico de Câncer) e começa o INVERNO no hemisfério sul. Em dezembro, o máximo ao SUL (−23,5°, sobre Capricórnio) e começa o VERÃO aqui. Materiais do hemisfério norte invertem os nomes.'},
      {l:3,m:'14',q:'Os dois efeitos que causam as estações',a:'Concentração da luz: raios perpendiculares depositam a mesma energia numa área menor, então aquecem mais. E duração do dia: o hemisfério inclinado na direção do Sol tem mais horas de luz. Os dois somados fazem o verão.'},
      {l:3,m:'14',q:'Por que a distância ao Sol não explica as estações?',a:'Estamos mais perto do Sol em janeiro (~147 milhões de km) e mais longe em julho (~152 milhões) — ou seja, o periélio cai no verão do hemisfério sul. Se a distância fosse a causa, o planeta inteiro teria verão em janeiro. E a distância é a mesma para os dois hemisférios.'},
      {l:3,m:'15',q:'O Sol nasce sempre no leste?',a:'Só nos equinócios. No resto do ano ele nasce ao norte ou ao sul do leste exato. No Rio, o ponto do pôr do Sol varia cerca de 47° ao longo do ano — mais de um oitavo do horizonte, perfeitamente visível a olho nu.'},
      {l:3,m:'16',q:'O que é a precessão do eixo terrestre?',a:'O eixo descreve um cone lento, como um pião, em ~26 mil anos, por causa do torque que a Lua e o Sol exercem sobre a saliência equatorial da Terra. A inclinação de 23,5° não muda — muda a direção para onde o eixo aponta.'},
      {l:3,m:'16',q:'Quem descobriu a precessão, e como?',a:'Hiparco, no século II a.C., comparando suas medidas de posições estelares com registros babilônicos de séculos antes. Detectar 1° por século exige dados separados por gerações — só possível com registro escrito preservado por instituições.'},
      {l:2,m:'2',q:'O que é a escada de distâncias cósmicas?',a:'A sequência de métodos usados para medir distâncias, cada um calibrado pelo anterior: radar no Sistema Solar → paralaxe para estrelas próximas → cefeidas para galáxias próximas → supernovas Ia para galáxias distantes → desvio para o vermelho na escala cosmológica.'},
      {l:2,m:'2',q:'Por que a escada de distâncias é frágil?',a:'Porque cada degrau é calibrado pelo anterior. Um erro sistemático na paralaxe se propaga até a constante de Hubble. Foi por isso que a idade estimada do Universo mudou tanto no século XX — cada recalibração movia o resultado final.'},
      {l:2,m:'2',q:'Como se mede a distância de galáxias distantes?',a:'Por supernovas do tipo Ia, que explodem sempre com brilho quase idêntico. Comparando o brilho observado com o real, obtém-se a distância. São chamadas de "velas-padrão", e foram calibradas por cefeidas.'},
      {l:2,m:'4',q:'Quanto vale cada unidade do Ano Cósmico?',a:'1 segundo ≈ 440 anos; 1 minuto ≈ 26 mil anos; 1 hora ≈ 1,6 milhão de anos; 1 dia ≈ 38 milhões de anos; 1 mês ≈ 1,15 bilhão de anos.'},
      {l:2,m:'4',q:'Quando os dinossauros se extinguiram, no Ano Cósmico?',a:'Por volta de 30 de dezembro. Foram há 66 milhões de anos, e cada dia cósmico vale ~38 milhões — ou seja, menos de dois dias antes da meia-noite. Toda a era dos mamíferos cabe no último dia e meio.'},
      {l:2,m:'7',q:'O que é o ciclo de Saros?',a:'O período de 18 anos, 11 dias e 8 horas após o qual a configuração Sol-Terra-Lua se repete e um eclipse muito parecido volta a acontecer. Descoberto pelos babilônios com séculos de registros acumulados.'},
      {l:2,m:'7',q:'Por que o Saros funciona, e por que o eclipse seguinte aparece 120° a oeste?',a:'Porque 223 meses sinódicos quase coincidem com 242 meses draconíticos e 239 anomalísticos. As 8 horas extras fazem a Terra girar um terço de volta, deslocando a faixa de visibilidade em ~120° de longitude.'},
      {l:2,m:'7',q:'Qual a lição do Saros para o método científico?',a:'Que o que parece caótico com pouca observação vira regular com registro suficiente. É o embrião do método: encontrar padrão onde parecia haver capricho — e explica por que a astronomia dependia de instituições que atravessavam gerações.'},
      {l:2,m:'20',q:'Por que a pseudociência é atraente?',a:'Oferece três coisas que a ciência recusa: certeza, num mundo em que a resposta honesta é "provavelmente"; simplicidade, com explicação única para o complexo; e pertencimento, o grupo dos que enxergam o que os outros não veem. Não tem relação com inteligência.'},
      {l:2,m:'20',q:'O experimento de Michelson-Morley e o éter',a:'Em 1887 tentou detectar o movimento da Terra através do éter luminífero, e não encontrou nada. A comunidade projetou o teste que podia matar a própria hipótese, aceitou o resultado negativo e mudou de posição — abrindo caminho para a relatividade. É o oposto da pseudociência.'},
      {l:2,m:'20',q:'Como aplicar os critérios ao terraplanismo?',a:'Aparecem apelo à conspiração em escala global, hipóteses ad hoc para cada evidência contrária e rejeição seletiva de dados. Aceitá-lo exigiria descartar navegação, aviação, geodésia, satélites e a própria medida de Eratóstenes, de 240 a.C.'},
      {l:2,m:'E',q:'As quatro regras das potências de dez',a:'Multiplicar: somam-se os expoentes (10¹¹ × 10¹¹ = 10²²). Dividir: subtraem-se (10²² ÷ 10¹⁸ = 10⁴). Elevar a potência: multiplicam-se ((10³)² = 10⁶). Somar: só com o mesmo expoente (3×10⁵ + 2×10⁵ = 5×10⁵).'},
      {l:2,m:'E',q:'O que é ordem de grandeza?',a:'A potência de dez mais próxima de um valor. A de 384.400 é 10⁵; a de 700.000 já é 10⁶, por estar mais perto de um milhão. Comparar ordens de grandeza é comparar expoentes.'},
      {l:2,m:'E',q:'Os prefixos do SI que aparecem em astronomia',a:'quilo 10³ (kpc), mega 10⁶ (megaparsec), giga 10⁹ (Ga, bilhão de anos em geologia), tera 10¹². Do outro lado: mili 10⁻³, micro 10⁻⁶, nano 10⁻⁹ — a luz visível tem centenas de nanômetros.'},
      {l:2,m:'R',q:'O que é um gnômon, e o que ele mede?',a:'Uma vara vertical. A direção da sombra dá a hora; o comprimento ao meio-dia dá a época do ano. Foi com um gnômon que Eratóstenes mediu a Terra.'},
      {l:2,m:'R',q:'A sequência histórica dos instrumentos de medir tempo',a:'Gnômon e relógio de sol; clepsidra (água); ampulheta; relógio mecânico no séc. XIV; pêndulo de Huygens em 1656; cronômetro marítimo de Harrison no séc. XVIII, que resolveu a longitude; e relógio atômico a partir de 1955.'},
      {l:2,m:'R',q:'Por que o segundo deixou de ser definido pela rotação da Terra?',a:'Porque a rotação não é constante: desacelera por efeito de maré e tem variações irregulares. Quando os relógios atômicos ficaram mais estáveis que o planeta, o segundo passou a ser definido pela transição do átomo de césio — e a rotação da Terra é que é medida contra ele.'},
      {l:2,m:'R',q:'O que são segundos bissextos?',a:'Segundos acrescentados de tempos em tempos ao relógio civil para reconciliá-lo com a posição real do Sol. É a mesma lógica do ano bissexto, na escala do segundo — o problema de conciliar convenção e movimento celeste nunca acabou.'},
      {l:2,m:'9',q:'Por que o calendário romano tinha "uso político"?',a:'Cabia aos pontífices decidir quando inserir o mês extra de correção. Como mandatos, contratos e tributos eram contados em meses, esticar ou encurtar o ano virou instrumento de poder. Quando César assumiu a reforma, o calendário estava ~3 meses fora das estações.'},
      {l:2,m:'10',q:'O que foi o "ano da confusão"?',a:'O ano de 46 a.C., que precisou ter 445 dias para colocar o novo calendário juliano em fase com as estações. É o preço de qualquer reforma de calendário: um ajuste bruto de uma vez só.'},
      {l:2,m:'11',q:'Por que a Igreja se importava com a defasagem do calendário?',a:'Porque a data da Páscoa é definida em relação ao equinócio de março. Com o acúmulo de dez dias, o equinócio astronômico caía em 11 de março, e não no 21 fixado no Concílio de Niceia — a festa mais importante estava saindo do lugar.'},
      {l:2,m:'11',q:'Por que países diferentes adotaram o gregoriano em datas diferentes?',a:'Foi uma reforma papal, adotada de imediato pelos países católicos em 1582. A Inglaterra e colônias só em 1752, quando já eram 11 dias; a Rússia só em 1918, com 13. É por isso que a Revolução de Outubro russa caiu, no nosso calendário, em novembro.'},
      {l:2,m:'12',q:'O que é o ciclo metônico?',a:'A constatação de que 19 anos solares equivalem quase exatamente a 235 meses lunares. É a base da intercalação do calendário judaico, que insere um 13º mês em sete de cada dezenove anos.'},
      {l:2,m:'16',q:'Por que o método de Aristarco era correto mas o resultado não?',a:'Porque a configuração era mal condicionada: perto de 90°, a razão entre as distâncias explode. Com 87° em vez de 89°51′, menos de 3 graus de erro viraram um fator 20 no resultado. Método certo, geometria sensível demais.'},
      {l:2,m:'18',q:'As seis etapas do método, aplicadas a Aristarco',a:'Observação (cronometrar o eclipse); pergunta (qual o tamanho da Lua?); hipótese ou modelo (sombra cônica, raios paralelos); previsão (se o Sol está 19× mais longe, é 19× maior); teste (Hiparco refaz por outro caminho); revisão (o ângulo é corrigido quando surgem instrumentos melhores).'},
      {l:2,m:'19',q:'O que a ciência não responde?',a:'Perguntas que não geram previsões testáveis: se a vida tem propósito, o que é justo, se uma obra é bela. Não são inferiores — são de outra natureza. Reconhecer esse limite é o oposto do cientificismo.'},
      {l:2,m:'1',q:'Por que escalas astronômicas são difíceis de compreender?',a:'O problema é cognitivo, não matemático. O cérebro foi calibrado para metros e décadas; fora disso, deixa de distinguir grandezas. Um milhão de segundos são 11 dias; um bilhão, 32 anos — mesma palavra na fala corriqueira, três ordens de grandeza de distância.'},
      {l:2,m:'1',q:'Quais as duas estratégias da astronomia para lidar com escalas?',a:'Notação de potências de dez, que troca comparação de dígitos por comparação de expoentes; e o uso de razões em vez de valores absolutos, ancorando cada escala na anterior.'},
      {l:2,m:'2',q:'A escalada de escalas da Aula 02, em ordem',a:'Terra → Sistema Solar (dezenas de UA) → vizinhança interestelar (dezenas de anos-luz) → Via Láctea (~50.000 al de raio) → Grupo Local (milhões de al) → Superaglomerado de Virgem → Universo observável.'},
      {l:2,m:'2',q:'13,8 bilhões de anos ou 46,5 bilhões de anos-luz: qual é qual?',a:'13,8 bilhões de anos é a idade do Universo, ou seja, o tempo de viagem da luz. 46,5 bilhões de anos-luz é o raio atual do Universo observável — maior porque o espaço esticou enquanto a luz viajava.'},
      {l:2,m:'3',q:'Como se estima o número de estrelas no Universo observável?',a:'Estimativa de ordem de grandeza: ~10¹¹ galáxias × ~10¹¹ estrelas por galáxia = 10²² estrelas. Ao multiplicar potências de dez, os expoentes se somam. É mais que todos os grãos de areia da Terra, estimados em 10¹⁸.'},
      {l:2,m:'3',q:'O número de galáxias é 100 bilhões ou 2 trilhões?',a:'Está em disputa. A estimativa clássica, do Hubble Deep Field, é ~10¹¹. Conselice (2016) propôs pelo menos 2 trilhões contando galáxias fracas; medidas da New Horizons em 2021 puxaram de volta para centenas de bilhões. O expoente fica entre 11 e 12.'},
      {l:2,m:'4',q:'O Ano Cósmico: as cinco datas-chave',a:'Big Bang em 1º de janeiro; origem da Terra em 31 de agosto; Cambriano em 16 de dezembro; hominídeos em 31/12 às 23h21; civilização às 23h59m23s; era espacial às 23h59m59,8s. Cada segundo vale ~440 anos.'},
      {l:2,m:'5',q:'De onde vêm as palavras dia, mês e ano?',a:'DIES, de uma raiz indo-europeia para brilho, Sol e divindade — mesma raiz de Deus e Zeus. MENSIS, da raiz de Lua. ANNUS, de uma raiz que significa anel, o ciclo que se fecha. As três unidades foram observadas no céu, não inventadas.'},
      {l:2,m:'5',q:'O que o tupi ARA tem a ver com o latim DIES?',a:'Nenhum parentesco linguístico — e exatamente por isso o caso é forte. ARA reúne brilho, dia, verão, Sol e Universo; DIES reúne brilho, dia, Sol e divindade. Povos sem contato chegaram à mesma associação porque olhavam o mesmo céu.'},
      {l:2,m:'6',q:'Por que os primeiros astrônomos eram sacerdotes?',a:'Porque prever cheias, chuvas e época de plantio era questão de sobrevivência coletiva, e quem detinha essa informação detinha poder. Além disso, medir o ano exige registro sistemático por gerações — o que só uma instituição sustenta.'},
      {l:2,m:'6',q:'Por que contar dias é fácil e medir o ano é difícil?',a:'O dia tem marca óbvia: o Sol nasce. O ano não tem nenhuma. É preciso acompanhar o ponto do horizonte onde o Sol nasce, a sombra ao meio-dia ou quais estrelas surgem antes do amanhecer — tudo isso exige anos de registro.'},
      {l:2,m:'7',q:'Por que eclipses e cometas assustavam tanto?',a:'Porque o céu era a coisa mais previsível que se conhecia, e servia de calendário e relógio. Um evento sem período óbvio quebrava essa regularidade e parecia exigir interpretação — origem histórica da leitura de presságios.'},
      {l:2,m:'7',q:'Qual a importância da supernova de 1572?',a:'Observada por Tycho Brahe, não mostrava paralaxe e portanto estava além da Lua. Isso demolia a doutrina aristotélica de que os céus eram imutáveis — um dado observacional derrubando dois mil anos de metafísica.'},
      {l:2,m:'8',q:'O que Stonehenge demonstra sobre astronomia antiga?',a:'Erguido a partir de ~3000 a.C. por uma sociedade sem escrita, tem eixo alinhado ao nascer do Sol no solstício de verão e ao pôr do Sol no de inverno. Construir isso exige anos de observação acumulada — a astronomia antecede a escrita.'},
      {l:2,m:'9',q:'Por que setembro, outubro, novembro e dezembro têm nomes "errados"?',a:'Porque o ano romano começava em março. Nessa contagem eles eram o sétimo, oitavo, nono e décimo meses — septem, octo, novem, decem. O início do ano mudou, os nomes ficaram.'},
      {l:2,m:'9',q:'De onde vem a palavra calendário?',a:'De calendae, o primeiro dia do mês romano, quando se anunciavam publicamente as dívidas. A raiz é calare, proclamar, porque um sacerdote anunciava em voz alta o início do mês ao avistar a Lua nova.'},
      {l:2,m:'10',q:'O que foi a reforma juliana de 46 a.C.?',a:'Júlio César encarregou o astrônomo Sosígenes de Alexandria de criar um calendário ancorado no ano solar. Resultado: 365 dias com um bissexto a cada quatro anos, ano médio de 365,25 dias. O ano de 46 a.C. teve 445 dias para entrar em fase.'},
      {l:2,m:'10',q:'Por que fevereiro tem 28 dias e julho e agosto têm 31 seguidos?',a:'Quintilis virou julho em homenagem a César e Sextilis virou agosto em homenagem a Augusto. Para que agosto não tivesse menos dias que julho, ganhou um dia tirado de fevereiro, e a alternância seguinte foi reorganizada.'},
      {l:2,m:'11',q:'A regra completa do ano bissexto',a:'É bissexto todo ano divisível por 4, exceto os divisíveis por 100, salvo os divisíveis por 400. Por isso 1600 e 2000 foram bissextos, mas 1700, 1800 e 1900 não. Isso ajusta o ano médio para 365,2425 dias.'},
      {l:2,m:'11',q:'Por que a reforma gregoriana precisou apagar dez dias?',a:'O juliano sobrestimava o ano em 11 minutos, o que acumulou cerca de dez dias desde o Concílio de Niceia. O equinócio estava caindo em 11 de março, e a data da Páscoa depende dele. Em 1582, o dia 4 de outubro foi seguido pelo dia 15.'},
      {l:2,m:'12',q:'As três famílias de calendário',a:'Lunar puro, que segue as fases e desliza 11 dias por ano pelas estações (islâmico). Solar puro, fixo nas estações mas sem relação com a Lua (gregoriano, maia). Luni-solar, que insere meses extras para conciliar os dois (judaico, chinês).'},
      {l:2,m:'12',q:'O que era o calendário maia, e o que houve em 2012?',a:'Solar, operando com dois ciclos simultâneos — Haab de 365 dias e Tzolkin de 260 — que se combinavam a cada 52 anos, mais a Conta Longa para datas longas. 2012 foi apenas o fim de um grande ciclo de contagem, sem qualquer previsão associada.'},
      {l:2,m:'13',q:'Como Aristarco mediu o tamanho da Lua?',a:'Cronometrando um eclipse lunar: comparou o tempo que a Lua leva para entrar na sombra da Terra com o tempo de travessia completa. Como a velocidade orbital é aproximadamente constante, tempo vira comprimento. Chegou a 1/3 do raio terrestre; o valor real é 0,27.'},
      {l:2,m:'14',q:'O que é diâmetro angular, e quanto vale o da Lua?',a:'É o ângulo que um objeto ocupa no céu. O da Lua é ~0,52°, meio grau — a unha do dedo mínimo com o braço estendido a cobre inteira. Conhecendo tamanho real e ângulo, obtém-se a distância.'},
      {l:2,m:'14',q:'Por que eclipses solares totais são possíveis?',a:'Coincidência da nossa época: o Sol é ~400 vezes maior que a Lua e está ~400 vezes mais distante, então ambos têm diâmetro angular de cerca de meio grau. Como a Lua se afasta alguns centímetros por ano, essa coincidência tem prazo de validade.'},
      {l:2,m:'15',q:'Como Hiparco mediu a distância até a Lua?',a:'Por paralaxe: o eclipse solar de 29/11/129 a.C. foi total no Helesponto e parcial em Alexandria. A diferença entre as duas visões depende da distância da Lua. Ele obteve 62 a 73 raios terrestres; o valor real é ~60.'},
      {l:2,m:'15',q:'Por que Hiparco dar um intervalo é metodologicamente notável?',a:'Porque significa reconhecer a incerteza da própria medida. Medida sem margem de erro é medida incompleta — princípio que só seria formalizado milênios depois, e que você vai estudar em propagação de incertezas.'},
      {l:2,m:'16',q:'O método de Aristarco para a distância até o Sol',a:'No quarto crescente, o ângulo Terra–Lua–Sol vale exatamente 90°, formando um triângulo retângulo. Medindo da Terra o ângulo entre Lua e Sol, a razão entre as distâncias fica determinada. Geometria pura.'},
      {l:2,m:'16',q:'Por que Aristarco errou por um fator de 20?',a:'Ele mediu 87° quando o valor real é 89°51′ — menos de 3 graus de erro. Mas perto de 90° o resultado é extremamente sensível: 3 graus viram fator 20. É o exemplo clássico de propagação de erro em geometria mal condicionada.'},
      {l:2,m:'17',q:'Como Aristarco chegou ao heliocentrismo?',a:'Se o Sol está muito mais distante e tem o mesmo tamanho angular, então é muito maior que a Terra. E não faria sentido o corpo maior orbitar o menor. A conclusão estava certa mesmo com a medida vinte vezes subestimada.'},
      {l:2,m:'17',q:'Por que o heliocentrismo grego foi esquecido por 18 séculos?',a:'Havia uma objeção observacional legítima: se a Terra se move, as estrelas deveriam mostrar paralaxe, e ninguém a observava. A resposta correta — estão longe demais — só foi confirmada em 1838, por Bessel. Somaram-se a física aristotélica e o sucesso preditivo de Ptolomeu.'},
      {l:2,m:'18',q:'O que os gregos acrescentaram à astronomia babilônica?',a:'Os babilônios registravam e previam com competência, mas não perguntavam o que os astros são. Os gregos passaram a tratar observações como evidência sobre a natureza física do mundo — a virada que origina o método científico.'},
      {l:2,m:'18',q:'Astronomia é ciência mesmo sem experimentos de laboratório?',a:'Sim. É ciência observacional: não se manipula o objeto, mas se fazem previsões verificáveis por novas observações. O mesmo vale para geologia e cosmologia. O que define ciência é o compromisso com testabilidade e revisão, não a bancada.'},
      {l:2,m:'19',q:'O que Feynman quis dizer sobre o conhecimento científico?',a:'Que ele é um conjunto de asserções com graus variáveis de incerteza, nenhuma absolutamente certa. Não é derrotismo: há graus, e a incerteza é declarada. É justamente isso que permite à ciência se corrigir.'},
      {l:2,m:'20',q:'Sete sinais de alerta de pseudociência',a:'Infalseabilidade; imunidade à evidência contrária via hipóteses ad hoc; ausência de revisão por pares; apelo à conspiração; estagnação sem resultados novos; anedota no lugar de estatística; e promessa de certeza absoluta.'},
      {l:2,m:'20',q:'Estar errado faz de alguém pseudocientista?',a:'Não. A física do século XIX errou sobre o éter, e era ciência de primeira linha: a hipótese era testável, foi testada em Michelson-Morley e foi abandonada. Pseudociência não é o erro — é a recusa em se expor ao teste.'},
      {l:1,m:'C',q:'O que é a esfera celeste?',a:'Uma esfera imaginária de raio arbitrário centrada no observador, onde se projetam todos os astros. Não é real, mas permite indicar posições sem precisar conhecer distâncias.'},
      {l:1,m:'C',q:'Zênite, nadir, equador celeste e eclíptica',a:'Zênite é o ponto diretamente acima do observador; nadir, o oposto. Equador celeste é o prolongamento do equador terrestre. Eclíptica é o caminho aparente do Sol ao longo do ano, inclinado 23,4° em relação ao equador celeste.'},
      {l:1,m:'C',q:'Coordenadas horizontais ou equatoriais: quando usar cada uma?',a:'Horizontais (azimute e altura) são intuitivas para apontar um instrumento, mas mudam com a hora e o lugar. Equatoriais (ascensão reta e declinação) são fixas para cada estrela — por isso os catálogos usam essas.'},
      {l:1,m:'C',q:'Por que as constelações visíveis mudam ao longo do ano?',a:'Porque à noite olhamos para o lado oposto ao Sol, e a Terra vai mudando de posição na órbita. Por isso Órion é constelação de verão e Escorpião de inverno, no hemisfério sul.'},
      {l:1,m:'C',q:'Quantas constelações existem, e o que elas são de fato?',a:'88, com fronteiras precisas fixadas pela UAI em 1928. São regiões do céu, não objetos: as estrelas de uma mesma constelação em geral não têm relação física e só aparecem juntas por projeção.'},
      {l:1,m:'C',q:'Como funciona a escala de magnitudes?',a:'Quanto menor o número, mais brilhante. É logarítmica: 5 magnitudes de diferença equivalem a um fator 100 no brilho. Sirius tem −1,5; a Lua cheia, −12,7; o Sol, −26,7. A olho nu em céu escuro chega-se à magnitude 6.'},
      {l:1,m:'λ',q:'Ordene o espectro eletromagnético da onda mais longa à mais curta',a:'Rádio, micro-ondas, infravermelho, visível, ultravioleta, raios X e raios gama. Todas são a mesma coisa física — muda o comprimento de onda e, portanto, a energia.'},
      {l:1,m:'λ',q:'O que a cor de uma estrela informa?',a:'A temperatura da superfície. Pela lei de Wien, quanto mais quente, mais a emissão se desloca para o azul: avermelhadas ~3.000 K, amareladas como o Sol ~5.800 K, azuladas acima de 20.000 K.'},
      {l:1,m:'λ',q:'As três leis de Kirchhoff dos espectros',a:'Sólido ou gás denso e quente produz espectro contínuo. Gás rarefeito e quente produz linhas de emissão. Gás mais frio na frente de uma fonte contínua produz linhas de absorção — o caso das estrelas.'},
      {l:1,m:'λ',q:'Para que serve o efeito Doppler na astronomia?',a:'Para medir velocidade radial pela variação do comprimento de onda das linhas. Afastando, desvio para o vermelho; aproximando, para o azul. Com ele se detectam exoplanetas, se mede rotação de galáxias e se descobriu a expansão do Universo.'},
      {l:1,m:'★',q:'O que sustenta uma estrela contra o próprio colapso?',a:'O equilíbrio hidrostático: a gravidade puxa para dentro e a pressão gerada no interior, alimentada pela fusão nuclear, empurra para fora. Quando o combustível acaba e a pressão cede, a estrela morre.'},
      {l:1,m:'★',q:'A sequência espectral, da mais quente à mais fria',a:'O, B, A, F, G, K, M. Cada classe se subdivide de 0 a 9. O Sol é G2. A sequência ordena por temperatura, que se manifesta como cor.'},
      {l:1,m:'★',q:'O que é o diagrama HR e o que é a sequência principal?',a:'Gráfico de luminosidade contra temperatura. Cerca de 90% das estrelas caem numa faixa diagonal, a sequência principal, onde queimam hidrogênio no núcleo. Fora dela ficam gigantes, supergigantes e anãs brancas.'},
      {l:1,m:'★',q:'O destino de uma estrela conforme sua massa',a:'Até ~8 massas solares: gigante vermelha, nebulosa planetária e anã branca. De ~8 a ~25: supernova e estrela de nêutrons. Acima de ~25: buraco negro. A massa inicial decide tudo.'},
      {l:1,m:'★',q:'De onde vieram os átomos do seu corpo?',a:'O Big Bang produziu quase só hidrogênio e hélio. Carbono, oxigênio, cálcio e ferro foram fabricados dentro de estrelas por nucleossíntese e devolvidos ao meio interestelar quando elas morreram. Elementos mais pesados que o ferro exigem supernovas ou colisões de estrelas de nêutrons.'},
      {l:1,m:'1',q:'A virada moderna da astronomia em quatro nomes',a:'Copérnico (1543) tira a Terra do centro; Kepler (1609–1619) descobre que as órbitas são elipses e formula as três leis; Galileu (1610) aponta a luneta e acha as luas de Júpiter e as fases de Vênus; Newton (1687) unifica com a gravitação universal.'},
      {l:1,m:'1',q:'Astronomia, astrofísica e cosmologia: qual a diferença?',a:'Astronomia é o termo guarda-chuva — posições, movimentos, catalogação. Astrofísica aplica física aos corpos celestes: composição, energia, evolução. Cosmologia trata do Universo como um todo: origem, expansão e destino.'},
      {l:1,m:'1',q:'Por que astronomia não é astrologia?',a:'Astronomia é ciência: faz previsões testáveis, publica método e aceita refutação. Astrologia atribui influência dos astros sobre destino e personalidade, sem mecanismo físico e sem passar em testes cegos. Têm origem histórica comum na Babilônia, e se separaram quando a astronomia adotou o método científico.'},
      {l:1,m:'1',q:'O que a espectroscopia trouxe para a astronomia?',a:'A capacidade de saber composição química, temperatura e velocidade de um astro apenas analisando sua luz. Foi o nascimento da astrofísica no século XIX — e desmentiu Comte, que em 1835 declarara a composição das estrelas para sempre inacessível.'},
      {l:1,m:'2',q:'Por que existem anos bissextos, e por que a regra tem exceções?',a:'O ano dura 365,2422 dias. O calendário juliano corrigia com um dia extra a cada 4 anos, o que sobrestimava. A regra gregoriana de 1582 refinou: bissexto se divisível por 4, exceto divisíveis por 100, salvo divisíveis por 400. Por isso 1900 não foi e 2000 foi.'},
      {l:1,m:'2',q:'Por que a longitude foi um problema por séculos, e a latitude não?',a:'Latitude sai da altura do polo celeste acima do horizonte — medida direta. Longitude exige comparar a hora local com a de um meridiano de referência no mesmo instante, o que dependia de um relógio preciso a bordo. Só foi resolvido no século XVIII, com os cronômetros de Harrison.'},
      {l:1,m:'4',q:'De onde veio a Lua?',a:'Hipótese do impacto gigante: há ~4,5 bilhões de anos um corpo do tamanho de Marte colidiu de raspão com a Terra jovem. O material do manto ejetado se aglomerou em órbita. Explica a pobreza em ferro, a baixa densidade (3,34) e a composição isotópica quase idêntica à terrestre.'},
      {l:1,m:'4',q:'Por que a densidade média da Terra (5,51) é maior que a das rochas de superfície?',a:'Por causa da diferenciação: com a Terra jovem fundida, ferro e níquel afundaram e formaram o núcleo, enquanto silicatos leves subiram para manto e crosta. É também a origem do campo magnético, gerado no núcleo externo líquido.'},
      {l:1,m:'4',q:'O que causa as estações do ano?',a:'A inclinação de 23,4° do eixo terrestre, não a distância ao Sol — estamos até mais perto dele em janeiro, no verão do hemisfério sul. Inclinado na direção do Sol, o hemisfério recebe luz mais concentrada e dias mais longos.'},
      {l:1,m:'4',q:'Por que não há eclipse todo mês?',a:'Porque a órbita da Lua é inclinada cerca de 5° em relação à da Terra. O alinhamento exato só ocorre algumas vezes por ano. Eclipse solar acontece na Lua nova; lunar, na Lua cheia.'},
      {l:1,m:'5',q:'O que é o ciclo solar de 11 anos?',a:'A variação periódica do número de manchas solares e da atividade magnética do Sol. Nos máximos, aumentam explosões e ejeções de massa coronal, que geram auroras e podem afetar satélites e redes elétricas.'},
      {l:1,m:'5',q:'Como se formou o Sistema Solar?',a:'Hipótese nebular: há 4,6 bilhões de anos uma nuvem de gás e poeira colapsou, girou mais rápido por conservação de momento angular e se achatou num disco. No centro nasceu o Sol; no disco, os planetas. Explica o plano comum, o sentido único de órbita e a divisão rochosos/gigantes.'},
      {l:1,m:'5',q:'Partes de um cometa',a:'Núcleo de gelo e poeira com poucos km; coma, o envelope difuso formado quando o gelo sublima perto do Sol; e duas caudas — a de poeira, curva, e a de íons, reta e azulada. Ambas apontam para o lado oposto ao Sol, empurradas pelo vento solar.'},
      {l:1,m:'6',q:'Qual é o nosso endereço cósmico completo?',a:'Terra → Sistema Solar → Braço de Órion → Via Láctea → Grupo Local (com Andrômeda e mais de 70 galáxias) → Superaglomerado de Virgem → teia cósmica.'},
      {l:1,m:'6',q:'O que Hubble descobriu em 1929?',a:'Que quase todas as galáxias se afastam de nós, e quanto mais distantes, mais rápido. Não estamos no centro: o próprio espaço se expande. Extrapolando para trás chega-se ao Big Bang, há ~13,8 bilhões de anos.'},
      {l:1,m:'6',q:'Por que se postula matéria escura?',a:'As bordas das galáxias giram rápido demais para a massa visível — deveriam se desfazer. A matéria escura não emite luz mas exerce gravidade, e responde por ~5 vezes mais massa que a matéria comum. Somando a energia escura, a matéria comum é só ~5% do Universo.'},
      {l:1,m:'7',q:'Refrator ou refletor: qual a diferença e por que os grandes são refletores?',a:'Refrator usa lente e sofre aberração cromática; lentes grandes deformam sob o próprio peso porque só podem ser apoiadas pelas bordas. Refletor usa espelho, sem cromatismo e com apoio por trás em toda a superfície. Por isso todo telescópio grande moderno é refletor.'},
      {l:1,m:'7',q:'O que é seeing?',a:'O borrão da imagem causado pela turbulência atmosférica. Um bom sítio tem seeing abaixo de 1 segundo de arco. É o principal motivo de os observatórios ficarem em montanhas altas, secas e de ar estável.'},
      {l:1,m:'7',q:'O que faz a óptica adaptativa?',a:'Corrige a distorção atmosférica em tempo real: um sensor mede a deformação da frente de onda centenas de vezes por segundo e um espelho deformável a compensa, às vezes usando estrela-guia artificial a laser. Aproxima um telescópio de solo da nitidez de um espacial.'},
      {l:1,m:'7',q:'Fotometria ou espectroscopia: o que cada uma responde?',a:'Fotometria mede brilho com precisão e responde perguntas de variação no tempo, como o trânsito de um exoplaneta. Espectroscopia decompõe a luz e entrega composição, temperatura, velocidade radial e campo magnético — é a ferramenta central da astrofísica.'},
      {l:1,m:'D',q:'O que é um parsec e de onde vem esse nome?',a:'A distância em que 1 UA subtende 1 segundo de arco — de "paralaxe de um segundo". Vale ~3,26 anos-luz ou ~206.265 UA. A conta é direta: distância em parsecs = 1 / paralaxe em segundos de arco.'},
      {l:1,m:'9',q:'Como um calouro começa a entrar na área?',a:'Iniciação científica: procurar um professor da linha que interessa, ler os artigos dele e bater na porta. Somam monitoria, projetos de extensão e as reuniões anuais da SAB. Com ~600 astrônomos no país, dá para conhecer boa parte da comunidade antes de se formar.'},
      {l:1,q:'Por que a astronomia é chamada de ciência básica?',a:'Porque busca compreender os corpos celestes e o Universo sem um alvo prático imediato. A aplicação, quando vem, é consequência — não é o objetivo que orienta a pergunta.'},
      {l:1,q:'Que tecnologias do dia a dia nasceram da astronomia?',a:'Detectores CCD (base das câmeras digitais), óptica adaptativa, algoritmos de tratamento de imagem hoje usados em diagnóstico médico, e técnicas de processamento de sinal desenvolvidas na radioastronomia. Ciência básica devolve aplicação por caminhos imprevistos.'},
      {l:1,q:'O que é o meio interestelar?',a:'O gás e a poeira que preenchem o espaço entre as estrelas de uma galáxia. É a matéria-prima de onde novas estrelas se formam e para onde as estrelas devolvem material ao morrer.'},
      {l:1,q:'Por que "planeta" significa errante?',a:'Do grego planētēs. A olho nu, planetas parecem pontos luminosos que se deslocam entre as estrelas de uma noite para outra, enquanto as estrelas mantêm as posições relativas. Esse vaivém foi o primeiro enigma da astronomia.'},
      {l:1,q:'Qual musa personifica a astronomia, e o que isso indica?',a:'Urânia, uma das nove musas gregas. Indica que a astronomia era vista como saber inspirado, no mesmo patamar da literatura e das artes — sinal do seu peso cultural, não só técnico.'},
      {l:1,q:'Raio e massa da Terra',a:'Raio médio 6.371 km (equatorial 6.378, polar 6.357). Massa 5,97 × 10²⁴ kg — o slide traz 6,0 × 10²⁷ g, que é o mesmo número em gramas.'},
      {l:1,q:'Os cinco elementos mais abundantes da CROSTA terrestre',a:'Oxigênio ~46%, silício ~28%, alumínio ~8%, ferro ~5% e cálcio ~4%. Atenção: esses são os números da crosta. Na Terra inteira, o ferro lidera com ~32%, porque o núcleo é de ferro.'},
      {l:1,q:'Números da Lua: distância, tamanho e massa',a:'Semieixo maior 384.400 km, raio 1.737 km (~0,27 do terrestre, o "1/4" do slide) e massa 0,0123 da Terra (~1/81, o "1/80"). Atmosfera desprezível preserva as crateras.'},
      {l:1,q:'Por que a Lua mostra sempre a mesma face para a Terra?',a:'Rotação síncrona: ela gira em torno do próprio eixo no mesmo período em que orbita a Terra (~27,3 dias), travada pelo acoplamento de maré. A Lua gira, sim — só que no compasso da órbita.'},
      {l:1,q:'Quanto vale uma Unidade Astronômica (UA)?',a:'Desde a Resolução B2 da UAI de 2012 é um valor fixo: exatamente 149.597.870.700 m, ~150 milhões de km. Antes era definida pela órbita da Terra; hoje é uma constante convencionada.'},
      {l:1,q:'Onde ficam o cinturão de asteroides e o de Kuiper?',a:'Asteroides: entre Marte e Júpiter. Kuiper: além de Netuno, disco de corpos gelados de onde vêm os cometas de período curto (menos de 200 anos), que orbitam quase no plano dos planetas.'},
      {l:1,q:'Kuiper ou Oort: de onde vem cada tipo de cometa?',a:'Período curto (<200 anos) vêm do cinturão de Kuiper, no plano do Sistema Solar. Período longo vêm da nuvem de Oort, a ~100.000 UA, com órbitas em qualquer inclinação e períodos de até 30 milhões de anos.'},
      {l:1,q:'Como o Sol gera energia?',a:'Por fusão nuclear no núcleo, convertendo hidrogênio em hélio. A energia migra do centro até a superfície e escapa como radiação. Não é combustão: fusão libera milhões de vezes mais energia por partícula.'},
      {l:1,q:'O Sol comparado à Terra',a:'Diâmetro ~1,392 milhão de km, cerca de 109 diâmetros terrestres; massa ~333.000 vezes a da Terra. Os números do slide (100× e 300 mil×) são as ordens de grandeza arredondadas.'},
      {l:1,q:'Como se dividem os oito planetas?',a:'Internos ou terrestres: Mercúrio, Vênus, Terra e Marte (rochosos, pequenos, densos). Externos ou jovianos: Júpiter, Saturno, Urano e Netuno (gigantes gasosos e de gelo).'},
      {l:1,q:'O que é a Via Láctea?',a:'Nossa galáxia: estrutura achatada em espiral com centenas de bilhões de estrelas e gás. O Sol é uma delas e a orbita. Como estamos dentro do disco, vemos a faixa leitosa, não a espiral de cima.'},
      {l:1,q:'O que é a Estrutura em Grande Escala?',a:'O padrão que as galáxias formam no Universo. A distribuição não é aleatória: há galáxias isoladas, grupos e aglomerados, organizados em filamentos e vazios.'},
      {l:1,q:'O que é o Observatório Pico dos Dias (OPD)?',a:'Maior observatório óptico do Brasil, em Brazópolis (MG) a 1.864 m, operado pelo LNA. Criado em 1980 como OAB. Telescópios: 1,60 m Perkin-Elmer (desde 1981), dois de 60 cm e uma buscadora de cometas.'},
      {l:1,q:'Como se consegue tempo de telescópio no OPD?',a:'Qualquer pessoa pode submeter projeto de observação circunstanciado. As propostas são analisadas e ranqueadas pelo impacto esperado — tempo de telescópio é escasso e distribuído por mérito.'},
      {l:1,q:'O que são Gemini e SOAR, e qual a participação brasileira?',a:'Gemini: dois telescópios idênticos de 8,1 m (Havaí e Chile), parceria de EUA, Canadá, Chile, Brasil, Argentina e Coreia; o tempo é proporcional à cota financeira (~5% do Brasil). SOAR: 4,1 m em Cerro Pachón, do MCTI com NOIRLab/NSF, UNC-Chapel Hill e Michigan State.'},
      {l:1,q:'O que é o Rádio Observatório de Itapetinga?',a:'Radiotelescópio do INPE em Atibaia (SP), com antena de 13,7 m instalada em 1971 e operando desde 1972, protegida por um radome de ~25 m. Opera em micro-ondas (18–26 e 40–50 GHz). Hoje leva o nome de Pierre Kaufmann.'},
      {l:1,q:'Quando e como nasceu o curso de astronomia do OV/UFRJ?',a:'Em 1958, na Faculdade Nacional de Filosofia. Em 1957 Mário Ferreira Dias e Alércio Moreira Gomes se transferiram do Observatório Nacional para o Valongo; em 1958 chegou Luís Eduardo da Silva Machado — os três criaram o curso. O primeiro formando saiu em 1964.'},
      {l:1,q:'Origem do Observatório do Valongo',a:'Fundado em 5 de julho de 1881 por Manuel Pereira Reis como Observatório Astronômico da Escola Polythécnica, no Morro de Santo Antônio, para dar aulas práticas de astronomia e geodésia. Transferido para a Chácara do Valongo a partir de 1924.'},
      {l:1,q:'Quantos astrônomos profissionais o Brasil tem?',a:'Cerca de 600 pessoas com atuação direta em astronomia e/ou cosmologia, a maioria associada à Sociedade Astronômica Brasileira (SAB). É uma comunidade pequena e bem conectada.'},
      {q:'O que é um mineral, na definição geológica?',a:'Sólido natural, inorgânico, com composição química definida (ou com variação limitada) e estrutura cristalina ordenada. Rocha é um agregado de minerais.'},
      {q:'Quais são os tipos de limite de placas?',a:'Divergente (dorsais, criação de litosfera), convergente (subducção ou colisão) e transformante (deslizamento lateral, ex.: falha de Santo André).'},
      {q:'Princípio da superposição',a:'Em uma sequência sedimentar não deformada, as camadas mais antigas estão embaixo e as mais novas em cima. Base da datação relativa.'},
      {q:'Como funciona a datação radiométrica?',a:'Isótopos instáveis decaem a uma taxa constante (meia-vida). Medindo a razão entre isótopo pai e filho calcula-se há quanto tempo o sistema fechou.'},
      {q:'O que é o ciclo das rochas?',a:'Rochas ígneas, sedimentares e metamórficas se transformam umas nas outras por fusão, cristalização, intemperismo, deposição, soterramento e metamorfismo.'},
      {q:'Como sabemos que o núcleo externo é líquido?',a:'Ondas S não atravessam líquidos e desaparecem além de ~103° do epicentro, criando a zona de sombra. As ondas P atravessam, mas se refratam.'}
    ],
    quiz:[
      {l:3,m:'11',q:'O movimento retrógrado de Marte acontece porque:',o:['a Terra, mais rápida, ultrapassa Marte por dentro','Marte realmente inverte sua órbita','a gravidade do Sol o freia','a Lua o desvia'],c:0,e:'É efeito aparente, de perspectiva. No geocentrismo exigia epiciclos; no heliocentrismo sai de graça.'},
      {l:3,m:'14',q:'O mês mais quente no Rio não é dezembro, e sim janeiro ou fevereiro, por causa de:',o:['inércia térmica — o planeta continua acumulando calor depois do solstício','mudança na distância ao Sol','variação da inclinação do eixo','efeito da Lua'],c:0,e:'O solstício marca o pico da energia recebida, não da temperatura. Mesma razão pela qual o momento mais quente do dia é ~15h, e não meio-dia.'},
      {l:2,m:'2',q:'Na escada de distâncias cósmicas, as supernovas do tipo Ia servem como:',o:['velas-padrão, por explodirem sempre com brilho quase idêntico','fonte de paralaxe','marcadores de tempo','relógios atômicos'],c:0,e:'Comparando o brilho observado com o real, obtém-se a distância. Elas foram calibradas por cefeidas, que por sua vez foram calibradas por paralaxe.'},
      {l:2,m:'7',q:'O ciclo de Saros, de 18 anos e 11 dias, permite:',o:['prever a repetição aproximada de um eclipse','calcular a idade do Universo','medir a distância da Lua','definir o ano bissexto'],c:0,e:'Descoberto pelos babilônios com séculos de registro. Mostra que o que parece caótico com pouca observação vira regular com dados suficientes.'},
      {l:3,m:'3',q:'Muitas constelações indígenas brasileiras são formadas por:',o:['manchas escuras da Via Láctea, e não por estrelas brilhantes','apenas três estrelas','estrelas do hemisfério norte','planetas'],c:0,e:'A Ema tem a cabeça no Saco de Carvão. É um recorte oposto ao europeu: enxergar a figura no que não tem luz.'},
      {l:3,m:'A',q:'O analema tem forma de oito porque combina:',o:['a inclinação do eixo com a excentricidade da órbita','duas inclinações do eixo','a precessão com a rotação','a órbita da Lua com a da Terra'],c:0,e:'Sem a excentricidade, o desenho seria uma linha vertical. As duas causas são necessárias para produzir o oito.'},
      {l:3,m:'A',q:'A equação do tempo mede:',o:['a diferença entre o meio-dia solar e o meio-dia do relógio','o tempo de viagem da luz do Sol','a duração do ano','o atraso das estrelas por noite'],c:0,e:'Chega a cerca de 16 minutos, e é por isso que relógios de sol precisos trazem tabela de correção.'},
      {l:3,m:'6',q:'Num polo terrestre, os astros:',o:['giram paralelos ao horizonte, sem nascer nem se pôr','sobem perpendiculares ao horizonte','não são visíveis','nascem e se põem duas vezes por dia'],c:0,e:'Ali o eixo de rotação aponta para o zênite e o equador celeste coincide com o horizonte. Vê-se sempre a mesma metade da esfera celeste.'},
      {l:3,m:'8',q:'Em Belém ou Manaus, o Sol passa pelo zênite:',o:['duas vezes por ano','todos os dias ao meio-dia','uma vez por ano','nunca'],c:0,e:'Vale para qualquer lugar entre os trópicos. Nesses dias objetos verticais não projetam sombra ao meio-dia — o fenômeno que Eratóstenes usou em Siena.'},
      {l:3,m:'10',q:'Se o eixo da Terra não fosse inclinado:',o:['não haveria estações e o dia duraria 12 h em qualquer latitude','as estações seriam mais intensas','o ano seria mais curto','não haveria dia e noite'],c:0,e:'Trópicos e círculos polares também desapareceriam do mapa, porque o Sol só chegaria ao zênite no equador.'},
      {l:3,m:'13',q:'A palavra "solstício" significa:',o:['o Sol se detém','noite igual','meio do ano','Sol alto'],c:0,e:'Do latim sol + sistere: é quando o Sol para de subir ou descer em declinação e inverte o sentido do movimento norte-sul. "Noite igual" é a origem de equinócio.'},
      {l:3,m:'16',q:'A diferença entre precessão e variação da obliquidade é que:',o:['a precessão muda a direção do eixo; a obliquidade muda o ângulo de inclinação','são a mesma coisa','a precessão é anual','a obliquidade não varia'],c:0,e:'Precessão: ~26 mil anos, mantém os 23,5°. Obliquidade: ~41 mil anos, varia entre 22,1° e 24,5°. Ambos são ciclos de Milankovitch.'},
      {l:3,m:'1',q:'A esfera celeste é:',o:['um modelo sem realidade física, útil para descrever posições','uma esfera de gás que envolve a Terra','o limite do Universo observável','a órbita da Terra projetada no céu'],c:0,e:'Ela funciona porque descarta a profundidade, que não interessa para posições. Continua em uso profissional na astronomia de posição e no apontamento de telescópios.'},
      {l:3,m:'2',q:'A altura do polo celeste acima do horizonte é igual:',o:['à latitude do observador','à longitude do observador','a 90° menos a latitude','à declinação do Sol'],c:0,e:'Relação de uma linha que resolvia metade do problema da navegação. É por isso que a latitude sempre foi fácil de medir e a longitude não.'},
      {l:3,m:'3',q:'As estrelas de uma mesma constelação:',o:['em geral não têm relação física e estão a distâncias muito diferentes','estão sempre próximas entre si','formam um sistema gravitacional','nasceram da mesma nuvem'],c:0,e:'O Cruzeiro do Sul é o exemplo: suas estrelas vão de ~88 a mais de 350 anos-luz. A cruz é efeito de perspectiva.'},
      {l:3,m:'4',q:'Eratóstenes, em 240 a.C., mediu:',o:['a circunferência da Terra, usando a diferença de sombras entre duas cidades','a distância até o Sol','o tamanho da Lua','a inclinação do eixo terrestre'],c:0,e:'A sombra de 7,2° em Alexandria, quando não havia sombra em Siena, corresponde a 1/50 de volta. A esfericidade já era aceita — o feito foi medir o tamanho.'},
      {l:3,m:'5',q:'O dia sideral dura:',o:['23h56m04s','24 h exatas','23h50m','24h04m'],c:0,e:'É a rotação em relação às estrelas. As 24 h são o dia solar médio, maior porque a Terra avançou ~1° na órbita e precisa girar um pouco mais para reencontrar o Sol.'},
      {l:3,m:'7',q:'Uma estrela nasce, a cada noite, cerca de:',o:['3 min 56 s mais cedo','4 min mais tarde','1 h mais cedo','no mesmo horário'],c:0,e:'Consequência direta da diferença entre dia sideral e solar. Em um ano isso acumula 24 h, e o céu volta à mesma aparência.'},
      {l:3,m:'8',q:'Os círculos polares estão a 66,5° de latitude porque:',o:['66,5° = 90° − 23,5°, a obliquidade do eixo','é onde termina o gelo permanente','é o limite da navegação','foi uma convenção cartográfica'],c:0,e:'As cinco linhas — dois trópicos, dois círculos polares e o equador — saem todas da inclinação de 23,5°.'},
      {l:3,m:'10',q:'A formulação correta da inclinação do eixo terrestre é:',o:['23,5° em relação à perpendicular ao plano da órbita','23,5° em relação ao plano da órbita','66,5° em relação à perpendicular ao plano da órbita','23,5° em relação ao eixo da Lua'],c:0,e:'Equivalente: o plano do equador faz 23,5° com o plano da eclíptica. O ângulo entre o eixo e o próprio plano orbital é 66,5°.'},
      {l:3,m:'11',q:'A eclíptica é:',o:['a projeção do plano orbital da Terra na esfera celeste','a projeção do equador terrestre no céu','a órbita da Lua','o caminho dos cometas'],c:0,e:'Equivale ao caminho aparente do Sol ao longo do ano. O equador celeste é que é a projeção do equador terrestre — os dois se cruzam a 23,5°.'},
      {l:3,m:'11',q:'Não há eclipse todo mês porque:',o:['a órbita da Lua é inclinada ~5° e ela raramente está sobre um nodo na fase certa','a Lua às vezes está longe demais','a Terra gira','a sombra da Terra é pequena'],c:0,e:'É preciso coincidir duas condições: fase nova ou cheia E posição sobre um nodo, onde a órbita lunar cruza a eclíptica. Daí o nome eclíptica.'},
      {l:3,m:'12',q:'A eclíptica atravessa quantas constelações?',o:['13, incluindo Ofiúco','12','10','8'],c:0,e:'Com as fronteiras oficiais da UAI, de 1928, o Sol passa cerca de 18 dias por ano em Ofiúco. A divisão astrológica em doze é anterior e nunca foi revista.'},
      {l:3,m:'13',q:'No solstício de dezembro, o Sol está:',o:['sobre o Trópico de Capricórnio, e começa o verão no hemisfério sul','sobre o Trópico de Câncer, e começa o verão no hemisfério sul','sobre o equador celeste','no ponto vernal'],c:0,e:'Declinação de −23,5°. Atenção: materiais do hemisfério norte chamam essa data de "solstício de inverno" — no Brasil é verão.'},
      {l:3,m:'13',q:'Nos equinócios, o dia dura:',o:['cerca de 12h07, por causa da refração atmosférica','exatamente 12 h','12 h apenas no equador','depende só da latitude'],c:0,e:'A refração faz o Sol parecer acima do horizonte quando já se pôs, e conta-se o nascer pela borda do disco. O dia de exatas 12 h chama-se equilux.'},
      {l:3,m:'14',q:'As estações do ano são causadas por:',o:['a inclinação do eixo, que muda a concentração da luz e a duração do dia','a variação da distância entre a Terra e o Sol','a precessão do eixo','a velocidade orbital da Terra'],c:0,e:'Dois efeitos somados. E o contra-argumento decisivo: estamos mais perto do Sol em janeiro, durante o verão do hemisfério sul.'},
      {l:3,m:'15',q:'O Sol nasce exatamente no ponto leste:',o:['apenas nos equinócios','todos os dias','apenas nos solstícios','nunca'],c:0,e:'No resto do ano ele nasce ao norte ou ao sul do leste. No Rio, o ponto do pôr do Sol varia cerca de 47° ao longo do ano.'},
      {l:3,m:'16',q:'A precessão do eixo terrestre tem período de aproximadamente:',o:['26 mil anos','41 mil anos','2.150 anos','1 ano'],c:0,e:'41 mil anos é o ciclo da obliquidade; 2.150 anos é o tempo de atravessar uma constelação do zodíaco. A precessão completa leva ~26 mil anos e troca a estrela polar.'},
      {l:3,m:'16',q:'A precessão faz com que:',o:['a direção para onde o eixo aponta mude, trocando a estrela polar','a inclinação do eixo aumente','a Terra gire mais devagar','as estações desapareçam'],c:0,e:'A inclinação permanece em ~23,5°. Há 4.800 anos o polo apontava para Thuban; daqui a ~13 mil anos apontará perto de Vega.'},
      {l:2,m:'E',q:'O resultado de 10²² ÷ 10¹⁸ é:',o:['10⁴','10⁴⁰','10²','2 × 10⁴'],c:0,e:'Ao dividir potências de dez, subtraem-se os expoentes. É a conta que mostra haver ~10 mil vezes mais estrelas que grãos de areia na Terra.'},
      {l:2,m:'E',q:'A ordem de grandeza de 700.000 é:',o:['10⁶','10⁵','7 × 10⁵','10⁴'],c:0,e:'Ordem de grandeza é a potência de dez mais próxima. 700 mil está mais perto de um milhão do que de cem mil.'},
      {l:2,m:'R',q:'Hoje o segundo é definido por:',o:['uma transição do átomo de césio','uma fração do dia solar médio','o período do pêndulo','a rotação da Terra'],c:0,e:'A definição se inverteu quando os relógios atômicos ficaram mais estáveis que a própria rotação terrestre, que desacelera por efeito de maré.'},
      {l:2,m:'R',q:'Segundos bissextos existem para:',o:['reconciliar o relógio atômico com a rotação real da Terra','corrigir erros de fabricação dos relógios','ajustar fusos horários','compensar o ano bissexto'],c:0,e:'Mesma lógica do ano bissexto, na escala do segundo: conciliar convenção humana com movimento celeste.'},
      {l:2,m:'9',q:'O calendário romano pré-juliano era manipulado politicamente porque:',o:['os pontífices decidiam quando inserir o mês de correção, afetando mandatos e contratos','os imperadores mudavam os nomes dos meses','não havia escrita','os meses tinham tamanhos aleatórios'],c:0,e:'Quando César assumiu a reforma, o calendário estava cerca de três meses fora de fase com as estações.'},
      {l:2,m:'10',q:'O ano de 46 a.C. teve 445 dias porque:',o:['foi preciso um ajuste único para pôr o calendário juliano em fase com as estações','houve erro de cálculo de Sosígenes','era um ano bissexto especial','os romanos contavam diferente'],c:0,e:'Ficou conhecido como "ano da confusão". Toda reforma de calendário exige, em algum momento, engolir um ajuste bruto.'},
      {l:2,m:'11',q:'A reforma gregoriana foi motivada principalmente por:',o:['a data da Páscoa, que depende do equinócio de março','a navegação','a agricultura','a astronomia teórica'],c:0,e:'Com dez dias de defasagem, o equinócio astronômico caía em 11 de março, e não no 21 fixado em Niceia.'},
      {l:2,m:'12',q:'O ciclo metônico estabelece que 19 anos solares equivalem a:',o:['235 meses lunares','12 meses lunares','19 meses lunares','365 meses lunares'],c:0,e:'É a base da intercalação no calendário judaico: um 13º mês em sete de cada dezenove anos.'},
      {l:2,m:'18',q:'O que caracteriza a ciência não é o roteiro fixo de etapas, e sim:',o:['o compromisso com afirmações testáveis, método público e revisão diante de evidência','o uso de laboratório','a matemática avançada','a aprovação de especialistas'],c:0,e:'É por isso que astronomia, geologia e cosmologia são ciências plenas mesmo sem experimento controlado: fazem previsões verificáveis por observação.'},
      {l:2,m:'1',q:'Um bilhão de segundos correspondem aproximadamente a:',o:['32 anos','11 dias','1 ano','3 séculos'],c:0,e:'Um milhão de segundos são 11 dias e meio; um bilhão, quase 32 anos. É o exercício que mostra o abismo entre duas palavras que soam parecidas.'},
      {l:2,m:'2',q:'A idade do Universo é de 13,8 bilhões de anos, mas o raio do Universo observável é de ~46,5 bilhões de anos-luz porque:',o:['o espaço se expandiu enquanto a luz viajava','a luz viaja mais rápido em grandes distâncias','o Universo é mais velho do que se pensa','é um erro de arredondamento'],c:0,e:'13,8 Ga é tempo de viagem da luz; 46,5 Gal é a distância atual do objeto que emitiu essa luz. Duas perguntas diferentes.'},
      {l:2,m:'3',q:'10¹¹ galáxias × 10¹¹ estrelas por galáxia resulta em:',o:['10²² estrelas','10¹¹ estrelas','2 × 10¹¹ estrelas','10¹²¹ estrelas'],c:0,e:'Ao multiplicar potências de dez, os expoentes se somam. Somar as quantidades daria 2 × 10¹¹, onze ordens de grandeza menor.'},
      {l:2,m:'4',q:'No Ano Cósmico, a origem da Terra cai em:',o:['31 de agosto','1º de janeiro','16 de dezembro','31 de dezembro'],c:0,e:'Dois terços do ano já haviam passado quando a Terra se formou. O Cambriano é 16 de dezembro e toda a civilização cabe nos últimos 37 segundos.'},
      {l:2,m:'5',q:'A palavra ANNUS vem de uma raiz indo-europeia que significa:',o:['anel','Sol','colheita','estação'],c:0,e:'O ano como ciclo que se fecha e recomeça. DIES vem da raiz de brilho e divindade; MENSIS, da raiz de Lua.'},
      {l:2,m:'6',q:'Medir a duração do ano era mais difícil que contar dias porque:',o:['o ano não tem uma marca óbvia no céu e exige observação acumulada','os antigos não sabiam contar até 365','a Lua atrapalhava a contagem','o Sol muda de posição aleatoriamente'],c:0,e:'É preciso acompanhar o ponto do nascer do Sol, a sombra ao meio-dia ou o nascer helíaco de estrelas — tudo isso ao longo de muitos anos, o que exige instituições.'},
      {l:2,m:'8',q:'O eixo principal de Stonehenge está alinhado com:',o:['o nascer do Sol no solstício de verão','a estrela Polar','o nascer da Lua cheia','o zênite ao meio-dia'],c:0,e:'E, na direção oposta, com o pôr do Sol no solstício de inverno. Construir isso exige anos de observação do ponto do horizonte onde o Sol nasce.'},
      {l:2,m:'9',q:'Setembro, outubro, novembro e dezembro têm esses nomes porque:',o:['o ano romano começava em março, e eles eram o 7º, 8º, 9º e 10º meses','foram nomeados por imperadores','vêm de deuses romanos','são traduções do grego'],c:0,e:'Septem, octo, novem, decem. O início do ano mudou; os nomes ficaram como fóssil linguístico.'},
      {l:2,m:'10',q:'O calendário juliano, criado em 46 a.C., estabeleceu um ano médio de:',o:['365,25 dias','365 dias exatos','365,2425 dias','354 dias'],c:0,e:'Um dia extra a cada quatro anos. O problema é que o ano real tem 365,2422 dias — o juliano sobrestima em 11 minutos por ano.'},
      {l:2,m:'11',q:'Pela regra gregoriana, o ano 1900:',o:['não foi bissexto, por ser divisível por 100 e não por 400','foi bissexto, por ser divisível por 4','foi bissexto, por ser divisível por 100','não foi bissexto, por ser ímpar'],c:0,e:'Divisível por 4, exceto os divisíveis por 100, salvo os divisíveis por 400. Por isso 2000 foi bissexto e 1900 não.'},
      {l:2,m:'11',q:'Em outubro de 1582, ao adotar o calendário gregoriano:',o:['o dia 4 foi seguido pelo dia 15','o mês teve 41 dias','o ano recomeçou','os dias da semana foram reiniciados'],c:0,e:'Dez dias foram apagados da numeração para corrigir a defasagem acumulada, mas a sequência dos dias da semana foi preservada de propósito.'},
      {l:2,m:'12',q:'O calendário islâmico faz o Ramadã percorrer todas as estações porque é:',o:['lunar puro, com ano de ~354 dias','solar puro','luni-solar','baseado no ciclo metônico'],c:0,e:'Desliza cerca de 11 dias por ano em relação ao ano solar. O judaico e o chinês evitam isso inserindo meses extras.'},
      {l:2,m:'13',q:'Aristarco estimou o tamanho da Lua a partir de:',o:['o tempo que ela levava para atravessar a sombra da Terra num eclipse lunar','o brilho dela no céu','a altura das marés','o tamanho das crateras'],c:0,e:'Como a velocidade orbital é aproximadamente constante, medir tempo equivale a medir comprimento. Ele chegou a 1/3 do raio terrestre; o valor real é 0,27.'},
      {l:2,m:'14',q:'O diâmetro angular da Lua vale aproximadamente:',o:['meio grau','cinco graus','um minuto de arco','trinta graus'],c:0,e:'0,52°. O do Sol é quase igual, ~0,53° — e é essa coincidência que torna possíveis os eclipses solares totais.'},
      {l:2,m:'15',q:'Hiparco mediu a distância Terra–Lua usando:',o:['um eclipse solar visto como total no Helesponto e parcial em Alexandria','o tempo de um eclipse lunar','a altura da Lua ao meio-dia','a sombra de uma vara'],c:0,e:'É paralaxe, com a linha de base sendo a distância entre duas cidades. Obteve 62 a 73 raios terrestres; o valor correto é ~60.'},
      {l:2,m:'16',q:'Aristarco errou a distância até o Sol por um fator de 20 porque:',o:['perto de 90° o resultado é muito sensível a pequenos erros no ângulo','usou geometria errada','confundiu Lua com Sol','não sabia o tamanho da Terra'],c:0,e:'Ele mediu 87° quando o real é 89°51′ — menos de 3 graus de erro. É o exemplo clássico de propagação de erro em geometria mal condicionada.'},
      {l:2,m:'17',q:'A principal objeção observacional ao heliocentrismo de Aristarco era:',o:['a ausência de paralaxe estelar observável','a falta de matemática adequada','a proibição religiosa','o tamanho do Sol'],c:0,e:'Objeção legítima: as estrelas deveriam se deslocar ao longo do ano. Estão longe demais para isso ser visto a olho nu — só foi medido em 1838, por Bessel.'},
      {l:2,m:'18',q:'A grande contribuição grega em relação à astronomia babilônica foi:',o:['usar observações para extrair informação física sobre a natureza dos astros','inventar o calendário','construir telescópios','descobrir os planetas'],c:0,e:'Os babilônios registravam e previam muito bem, mas não perguntavam o que os astros são. A virada grega é a busca por explicação física.'},
      {l:2,m:'19',q:'Segundo Feynman, o conhecimento científico é:',o:['um conjunto de asserções com graus variáveis de incerteza, nenhuma absolutamente certa','um corpo de verdades definitivas','equivalente a opinião','irrefutável quando bem feito'],c:0,e:'Não é relativismo: há graus de certeza muito diferentes, e a incerteza é declarada. É isso que permite à ciência se corrigir.'},
      {l:2,m:'20',q:'Qual destes NÃO é um sinal de pseudociência?',o:['publicar o método para que outros possam refutá-lo','criar hipóteses ad hoc quando o teste falha','alegar perseguição acadêmica','usar depoimentos no lugar de estatística'],c:0,e:'Expor o método ao ataque de especialistas é exatamente o que a ciência faz. Pseudociência não é o erro — é a recusa em se submeter ao teste.'},
      {l:1,m:'C',q:'Em coordenadas equatoriais, o análogo celeste da latitude é:',o:['a declinação','a altura','o azimute','a ascensão reta'],c:0,e:'Declinação corresponde à latitude e ascensão reta à longitude. Altura e azimute pertencem ao sistema horizontal, que varia com hora e lugar.'},
      {l:1,m:'C',q:'Uma estrela de magnitude 1 comparada a uma de magnitude 6 é:',o:['100 vezes mais brilhante','5 vezes mais brilhante','6 vezes mais brilhante','100 vezes menos brilhante'],c:0,e:'A escala é logarítmica: 5 magnitudes equivalem a um fator 100. E lembre-se: número menor significa mais brilhante.'},
      {l:1,m:'C',q:'As 88 constelações com fronteiras oficiais foram estabelecidas por:',o:['União Astronômica Internacional, em 1928','Ptolomeu, na Antiguidade','NASA, no século XX','Hiparco, no século II a.C.'],c:0,e:'Antes disso cada cultura e cada atlas desenhava as suas. Hiparco contribuiu com o catálogo de estrelas e a escala de magnitudes, não com as fronteiras.'},
      {l:1,m:'λ',q:'A cor de uma estrela indica principalmente:',o:['sua temperatura superficial','sua distância','sua idade exata','seu tamanho'],c:0,e:'Pela lei de Wien: quanto mais quente, mais a emissão se desloca para o azul. Vermelhas são frias; azuis, quentes.'},
      {l:1,m:'λ',q:'Linhas escuras no espectro de uma estrela indicam:',o:['absorção por gás mais frio na atmosfera estelar','ausência total daquele elemento','poeira entre nós e a estrela','defeito do instrumento'],c:0,e:'Terceira lei de Kirchhoff. Cada elemento absorve em comprimentos de onda próprios — é a impressão digital que permite saber a composição.'},
      {l:1,m:'★',q:'Na sequência espectral O B A F G K M, o Sol é do tipo:',o:['G','O','M','A'],c:0,e:'G2, para ser exato. A sequência vai da mais quente e azulada (O) à mais fria e avermelhada (M).'},
      {l:1,m:'★',q:'O destino final do Sol será:',o:['gigante vermelha e depois anã branca','supernova e estrela de nêutrons','buraco negro','explosão sem deixar remanescente'],c:0,e:'Supernova exige mais de ~8 massas solares. Com a massa do Sol, o caminho é gigante vermelha, nebulosa planetária e anã branca esfriando lentamente.'},
      {l:1,m:'★',q:'Elementos como carbono, oxigênio e ferro foram produzidos:',o:['no interior de estrelas, por nucleossíntese','no Big Bang','na atmosfera da Terra','por raios cósmicos apenas'],c:0,e:'O Big Bang produziu essencialmente hidrogênio e hélio. O resto veio de estrelas e foi devolvido ao meio interestelar quando elas morreram.'},
      {l:1,m:'1',q:'Quem formulou as três leis do movimento planetário, mostrando que as órbitas são elipses?',o:['Kepler','Copérnico','Galileu','Ptolomeu'],c:0,e:'Kepler usou as observações de precisão de Tycho Brahe. Copérnico propôs o heliocentrismo; Galileu trouxe evidência com a luneta; Newton explicou tudo com a gravitação.'},
      {l:1,m:'1',q:'A diferença entre astronomia e astrologia está em que:',o:['a astronomia faz previsões testáveis e aceita refutação; a astrologia não','a astronomia usa telescópio e a astrologia não','a astrologia é mais antiga','não há diferença real, apenas de nome'],c:0,e:'As duas nasceram juntas na Babilônia. A separação veio com a adoção do método científico — critério de demarcação, tema que volta em CMT111.'},
      {l:1,m:'4',q:'A hipótese mais aceita para a origem da Lua é:',o:['impacto gigante de um corpo do tamanho de Marte com a Terra jovem','captura gravitacional de um asteroide','formação simultânea a partir do mesmo disco','fissão da Terra por rotação rápida'],c:0,e:'Explica de uma vez a pobreza em ferro, a densidade baixa e a composição isotópica quase idêntica à do manto terrestre.'},
      {l:1,m:'4',q:'As estações do ano são causadas por:',o:['a inclinação de 23,4° do eixo de rotação da Terra','a variação da distância Terra–Sol ao longo do ano','a precessão dos equinócios','a órbita da Lua'],c:0,e:'Pegadinha clássica: estamos mais perto do Sol em janeiro, durante o verão do hemisfério sul. O que importa é a concentração da luz e a duração do dia.'},
      {l:1,m:'5',q:'O Sistema Solar tem todos os planetas orbitando no mesmo plano e sentido porque:',o:['formou-se a partir de um disco de gás e poeira em rotação','o Sol organizou as órbitas depois','é coincidência estatística','a gravidade de Júpiter alinhou tudo'],c:0,e:'É a hipótese nebular. O colapso da nuvem, com conservação de momento angular, produz um disco — e os planetas herdam esse plano e esse sentido.'},
      {l:1,m:'6',q:'A observação de Hubble em 1929 indica que:',o:['o espaço está em expansão, e galáxias mais distantes se afastam mais rápido','a Terra está no centro do Universo','as galáxias estão paradas','a Via Láctea é a única galáxia'],c:0,e:'Como pontos num balão sendo inflado: cada um vê todos os outros se afastando. Extrapolando para trás, chega-se ao Big Bang, há ~13,8 bilhões de anos.'},
      {l:1,m:'7',q:'O termo seeing designa:',o:['o borrão da imagem causado pela turbulência atmosférica','a sensibilidade do detector','o limite de magnitude do telescópio','o tempo de exposição necessário'],c:0,e:'É o principal critério na escolha de um sítio astronômico, e o que a óptica adaptativa corrige em tempo real.'},
      {l:1,m:'D',q:'Um parsec equivale a:',o:['cerca de 3,26 anos-luz','cerca de 1 ano-luz','cerca de 150 milhões de km','cerca de 1.000 anos-luz'],c:0,e:'É a distância em que 1 UA subtende 1 segundo de arco — daí o nome, paralaxe de um segundo. Equivale a ~206.265 UA.'},
      {l:1,q:'A astronomia é classificada como ciência básica porque:',o:['busca compreender fenômenos sem alvo prático imediato','não usa matemática avançada','só é feita em universidades','não gera nenhuma aplicação'],c:0,e:'Ciência básica não é ciência sem utilidade: CCD, óptica adaptativa e processamento de imagem saíram dela.'},
      {l:1,q:'A medição do tempo e a navegação dependeram historicamente da astronomia porque:',o:['calendários e posições geográficas derivam de ciclos e referências celestes','os antigos não tinham relógios mecânicos','a Terra é esférica','o Sol emite luz'],c:0,e:'Dia, mês e ano são ciclos astronômicos; a posição no mar era obtida medindo ângulos de astros conhecidos.'},
      {l:1,q:'O meio interestelar é:',o:['o gás e a poeira entre as estrelas de uma galáxia','o espaço vazio entre galáxias','a atmosfera das estrelas','a região entre planetas'],c:0,e:'É a matéria-prima das novas estrelas — um dos degraus da escada de escalas apresentada na aula.'},
      {l:1,q:'Os planetas jovianos são:',o:['Júpiter, Saturno, Urano e Netuno','Mercúrio, Vênus, Terra e Marte','apenas Júpiter e Saturno','os planetas anões'],c:0,e:'Jovianos = externos = gigantes gasosos e de gelo. Os quatro primeiros são os terrestres ou internos, rochosos.'},
      {l:1,q:'Uma Unidade Astronômica (UA) corresponde a:',o:['a distância média entre a Terra e o Sol, ~150 milhões de km','a distância da Terra à Lua','o raio do Sistema Solar','a distância até a estrela mais próxima'],c:0,e:'Desde 2012 a UAI fixou o valor em exatamente 149.597.870.700 m. A distância Terra–Lua é ~384 mil km, cerca de 390 vezes menor.'},
      {l:1,q:'O cinturão de asteroides está localizado entre as órbitas de:',o:['Marte e Júpiter','Terra e Marte','Netuno e Plutão','Júpiter e Saturno'],c:0,e:'Além de Netuno fica o cinturão de Kuiper, origem dos cometas de período curto — não confunda os dois.'},
      {l:1,q:'Cometas de período longo, com órbitas muito inclinadas, vêm de:',o:['nuvem de Oort','cinturão de Kuiper','cinturão de asteroides','anéis de Saturno'],c:0,e:'A nuvem de Oort fica a ~100.000 UA e envolve o Sistema Solar em todas as direções; por isso essas órbitas não respeitam o plano dos planetas.'},
      {l:1,q:'A Lua manter sempre a mesma face voltada para a Terra significa que:',o:['seu período de rotação é igual ao de translação','ela não gira em torno do próprio eixo','sua órbita é perfeitamente circular','ela não tem atmosfera'],c:0,e:'É a rotação síncrona, resultado do acoplamento de maré: ~27,3 dias para girar e ~27,3 dias para orbitar.'},
      {l:1,q:'A energia do Sol é produzida por:',o:['fusão de hidrogênio em hélio no núcleo','combustão de gases na superfície','fissão de elementos pesados','atrito entre as camadas externas'],c:0,e:'Fusão, não combustão. A energia leva muito tempo para migrar do núcleo até a superfície antes de escapar como luz.'},
      {l:1,q:'O elemento mais abundante na CROSTA terrestre é o oxigênio. E na Terra como um todo?',o:['ferro','oxigênio','silício','alumínio'],c:0,e:'Pegadinha clássica: na crosta é o oxigênio (~46%), mas somando manto e núcleo o ferro lidera (~32%), porque o núcleo é essencialmente ferro.'},
      {l:1,q:'Os telescópios do consórcio Gemini têm diâmetro de:',o:['8,1 metros','4,1 metros','1,6 metro','39 metros'],c:0,e:'4,1 m é o SOAR; 1,60 m é o principal do Pico dos Dias; ~39 m será o ELT do ESO.'},
      {l:1,q:'O curso de graduação em astronomia do OV/UFRJ foi criado em:',o:['1958','1881','1924','2002'],c:0,e:'1881 é a fundação do Observatório da Escola Polythécnica; 1924, o início da transferência para o Valongo; 2002, quando o OV virou unidade da UFRJ.'},
      {l:1,q:'A Via Láctea é uma galáxia do tipo:',o:['espiral','elíptica','irregular','anã esferoidal'],c:0,e:'Espiral, achatada, com centenas de bilhões de estrelas. Como estamos dentro do disco, é difícil enxergar sua estrutura de fora.'},
      {q:'A idade aproximada da Terra é:',o:['4,54 bilhões de anos','13,8 bilhões de anos','540 milhões de anos','4,54 milhões de anos'],c:0,e:'13,8 Ga é a idade do Universo; 540 Ma marca o início do Fanerozoico.'},
      {q:'Rochas formadas pela solidificação do magma são:',o:['ígneas','sedimentares','metamórficas','detríticas'],c:0,e:'Se solidificam em profundidade são intrusivas; na superfície, extrusivas.'},
      {q:'A cadeia mesoceânica é um limite:',o:['divergente','convergente','transformante','passivo'],c:0,e:'Ali as placas se afastam e nova crosta oceânica é criada por vulcanismo basáltico.'}
    ]
  },

<div class="lsec">
  <h3><span class="lnum">0</span>Onde esta aula se encaixa</h3>
  <p class="lead">CMA110 apresenta o leque das Ciências da Terra percorrendo as unidades do CCMN — Matemática, Física, Geociências e o Observatório do Valongo. Esta primeira aula é a porta de entrada pelo lado do Valongo: o que é a astronomia, o que ela estuda, como ela é feita no Brasil e como se forma um astrônomo na UFRJ.</p>
